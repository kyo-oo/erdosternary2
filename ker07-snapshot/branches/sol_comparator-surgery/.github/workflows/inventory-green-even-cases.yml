name: Inventory kernel-green even cases

on:
  push:
    branches: [sol/comparator-surgery]
    paths: [.github/workflows/inventory-green-even-cases.yml]

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Print active-looking theorem headers
        shell: bash
        run: |
          set -euo pipefail
          sha256sum ErdosTernary2.lean
          grep -nE '^(theorem|lemma) (even_case|.*lift.*|.*mod9.*|.*mod27.*|.*mod81.*|.*universal.*|.*four_pow.*|.*navigation.*)' ErdosTernary2.lean | head -n 400 || true
