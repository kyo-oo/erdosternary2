name: Inspect historical spacetime candidate

on:
  push:
    branches: [sol/comparator-surgery]
    paths: [.github/workflows/inspect-spacetime-candidate.yml]

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize historical candidate and print transfer/echo layer
        shell: bash
        run: |
          set -euo pipefail
          HIST=4669bb5e87587f04a49aeabfbce1083eecd8f975
          git worktree add /tmp/hist "$HIST"
          cd /tmp/hist
          bash scripts/materialize-source.sh
          sha256sum ErdosTernary2.lean
          echo '=== HEADERS 7900-8305 ==='
          sed -n '7900,8305p' ErdosTernary2.lean | grep -nE '^(theorem|lemma|def|structure|inductive)|Paradox|Transfer|Echo|Occurrence|Mirror|Active' || true
          echo '=== FULL 8050-8305 ==='
          sed -n '8050,8305p' ErdosTernary2.lean
