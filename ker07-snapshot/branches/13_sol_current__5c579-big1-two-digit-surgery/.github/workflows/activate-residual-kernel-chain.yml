name: Activate residual kernel chain

on:
  push:
    branches: [sol/comparator-surgery]

permissions:
  contents: write

jobs:
  activate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/comparator-surgery
          fetch-depth: 0

      - name: Apply source-only activation
        run: python3 scripts/activate-residual-kernel-chain.py

      - name: Commit source-only activation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ErdosTernary2.lean
          git commit -m "Activate certified residual omega termination chain"
          git push origin HEAD:sol/comparator-surgery
