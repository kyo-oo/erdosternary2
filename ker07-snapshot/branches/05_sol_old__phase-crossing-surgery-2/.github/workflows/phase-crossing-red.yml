name: Phase Crossing RED

on:
  push:
    branches: [sol/phase-crossing-surgery-2]

jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned Mathlib and cache
        run: |
          elan toolchain install "$(cat lean-toolchain)"
          elan default "$(cat lean-toolchain)"
          lake update
          lake exe cache get
      - name: RED — compile canonical phase crossing
        run: lake env lean CanonicalPhaseCrossingRed.lean
