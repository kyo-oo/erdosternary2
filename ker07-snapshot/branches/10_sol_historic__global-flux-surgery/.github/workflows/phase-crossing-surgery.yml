name: Canonical Phase Crossing Surgery

on:
  push:
    branches: [sol/global-flux-surgery]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-crossing:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned Mathlib and cache
        run: |
          elan toolchain install "$(cat lean-toolchain)"
          elan default "$(cat lean-toolchain)"
          lake update
          lake exe cache get
      - name: Compile canonical phase crossing surgery scratch
        run: lake env lean CanonicalPhaseCrossingSurgeryScratch.lean
      - name: Compile pathwise BIG1 projector chord scratch
        run: lake env lean HandwrittenBig1PathProjectorScratch.lean
      - name: Compile exact physical x2 flux bridge
        run: lake env lean GlobalPrefixOneFluxSurgeryScratch.lean
      - name: Compile canonical binary phase matrix reduction
        run: lake env lean GlobalPrefixOnePhaseMatrixScratch.lean
      - name: Compile exact three-to-one renormalization
        run: lake env lean GlobalPrefixOneRenormalizationSurgeryScratch.lean
      - name: Compile historical one-error seam reduction
        run: lake env lean GlobalPrefixOneHistoricalSeamScratch.lean
