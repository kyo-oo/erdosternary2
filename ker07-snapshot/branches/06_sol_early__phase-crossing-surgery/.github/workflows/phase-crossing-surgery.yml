name: Phase crossing surgery

on:
  push:
    branches: [sol/phase-crossing-surgery]
  workflow_dispatch:

jobs:
  red-green:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned Mathlib and cache
        run: |
          elan toolchain install "$(cat lean-toolchain)"
          elan default "$(cat lean-toolchain)"
          lake update
          lake exe cache get
      - name: Compile exact phase carrier lemmas
        run: lake env lean GSTPhaseCrossingCarrierScratch.lean
      - name: Compile exact vertical phase handoff
        run: lake env lean GSTPhaseCrossingTransferScratch.lean
      - name: Compile canonical two-boundary trap reduction
        run: lake env lean GSTPhaseCrossingTrapScratch.lean
      - name: Compile isolated canonical crossing RED test
        run: lake env lean PhaseCrossingSurgeryRED.lean
