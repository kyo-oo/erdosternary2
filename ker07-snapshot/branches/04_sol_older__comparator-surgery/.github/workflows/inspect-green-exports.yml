name: Inspect kernel-green theorem exports

on:
  push:
    branches: [sol/comparator-surgery]
    paths: [.github/workflows/inspect-green-exports.yml]

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Print Erdos theorem declarations and nearby source
        shell: bash
        run: |
          set -euo pipefail
          echo '=== exact source hash ==='
          sha256sum ErdosTernary2.lean
          echo '=== erdos_ternary_2 declarations ==='
          grep -nE '^(theorem|def) erdos_ternary_2' ErdosTernary2.lean || true
          echo '=== universal declarations ==='
          grep -nE '^(theorem|def) .*universal' ErdosTernary2.lean || true
          echo '=== noTernaryTwo conclusions ==='
          grep -nE 'noTernaryTwo \(2\^n\) = false|hasTernaryTwo \(2\^n\) = true' ErdosTernary2.lean || true
          echo '=== declarations around each erdos theorem ==='
          while IFS=: read -r n rest; do
            start=$(( n > 3 ? n-3 : 1 )); end=$((n+28));
            sed -n "${start},${end}p" ErdosTernary2.lean
            echo '---'
          done < <(grep -nE '^(theorem|def) erdos_ternary_2' ErdosTernary2.lean || true)
