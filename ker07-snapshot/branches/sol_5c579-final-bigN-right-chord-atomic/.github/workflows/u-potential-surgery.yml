name: U Potential Surgery

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-u-potential:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned Mathlib and cache
        run: |
          elan toolchain install "$(cat lean-toolchain)"
          elan default "$(cat lean-toolchain)"
          lake update
          lake exe cache get
      - name: Compile U-potential detector
        run: lake env lean HandwrittenUniversalParadoxPotentialScratch.lean
      - name: Compile x-6 U-potential chord
        run: lake env lean HandwrittenX6UPotentialChordScratch.lean
      - name: Compile Omega to U-potential bridge
        run: lake env lean OmegaUPotentialBridgeScratch.lean
      - name: Compile locked residual support bridge
        run: lake env lean CanonicalResidualInfiniteSupportBridgeScratch.lean
      - name: Compile locked NULL branch reduction
        run: lake env lean ResidualNullBranchReductionScratch.lean
      - name: Compile NULL terminal base
        run: lake env lean ResidualNullTerminalScratch.lean
      - name: Compile retained-offset U-state
        run: lake env lean RetainedOffsetUStateScratch.lean
      - name: Compile NULL prefix-four cut
        run: lake env lean ResidualNullPrefixFourCutScratch.lean
      - name: Compile canonical origin-cut intersection
        run: lake env lean CanonicalOriginCutIntersectionScratch.lean
      - name: Compile physical six-state gate dictionary
        run: lake env lean PhysicalSixBridgeGateScratch.lean
