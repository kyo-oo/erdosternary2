name: GPT56 Problem406 Public API

on:
  push:
    branches:
      - sol/gpt56-canonical-tail-escape-20260827
      - sol/problem406-professionalization-*
      - codex/new-problem-406-v5-pipeline-*
  workflow_dispatch:

jobs:
  public-api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install exact Lean RC2
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build Lean dependency graph
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
          lake build \
            GSTTactic \
            ErdosTernary2 \
            GSTCanonicalTailStateIso \
            GSTCanonicalCarryDynamics \
            GSTFourPowerDirectExistence \
            GSTFourPowerExponentTritObstruction \
            GSTFourPowerOntologicalAdapter
          echo 'PROBLEM406_TRANSITIVE_IMPORTS_GREEN=1'
      - name: Verify public API wrappers
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          for lean_module in \
            GST.Problem406.PublicAPI \
            GST.Problem406.TheoremMap \
            GST.Arithmetic.TernaryDigits \
            GST.Arithmetic.Carries \
            GST.FourPower.CommonTwo \
            GST.FourPower.PrefixLaw \
            GST.FourPower.Certificate \
            GST.Problem406 \
            GST.PublicAPI \
            GST.Audit.PublicSurfaceCheck \
            GST.Audit.Problem406AxiomReport
          do
            echo "-- lake build ${lean_module}"
            lake build "${lean_module}"
          done
          echo 'PROBLEM406_PUBLIC_API_GREEN=1'
          echo 'GST_PUBLIC_API_GREEN=1'
          echo 'GST_PUBLIC_AUDIT_GREEN=1'
      - name: Generate GST declaration manifest
        shell: bash
        run: |
          set -euo pipefail
          python tests/test_gst_decl_manifest.py
          python scripts/gst_decl_manifest.py
          test -s docs/gst/generated/theorem-manifest.md
          test -s docs/gst/generated/declaration-counts.md
          grep -q 'Total declarations:' docs/gst/generated/theorem-manifest.md
          grep -q 'Four-power direct arithmetic' docs/gst/generated/declaration-counts.md
          echo 'GST_DECLARATION_MANIFEST_GREEN=1'
