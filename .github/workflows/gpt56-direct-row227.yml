name: GPT56 Direct Row227 Verify

on:
  push:
    branches:
      - sol/gpt56-four-power-relocation-prod-20260903
    paths:
      - GSTFourPowerDirectTwoHundredTwentySeventhRow.lean
      - .github/workflows/gpt56-direct-row227.yml
  workflow_dispatch:

jobs:
  direct-row227-kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
      - name: Compile exact fresh-production dependency closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean
          modules=(
            GSTCanonicalTailStateIso
            GSTFourPowerDirectResidue
            GSTFourPowerDirectResidue27
            GSTFourPowerDirectResidue81
            GSTFourPowerExponentTritObstruction
            GSTFourPowerExactExponentPeriod
            GSTFourPowerDirectExistence
            GSTFourPowerDirectAdditionCarry
            GSTFourPowerDirectHappyBridge
            GSTFourPowerAffineOrbit
            GSTFourPowerAffinePrefixIsometry
          )
          for module in "${modules[@]}"; do
            lake env lean -o ".lake/build/lib/lean/${module}.olean" "${module}.lean" 2>&1 | tee "${module}.log"
            ! grep -E 'declaration uses .sorry.|sorryAx|unknown identifier|unknown module prefix|unsolved goals|error:' "${module}.log"
          done
      - name: Compile direct row227 physical constructor
        shell: bash
        run: |
          set -euo pipefail
          ulimit -s 65536
          lake env lean -o .lake/build/lib/lean/GSTFourPowerDirectTwoHundredTwentySeventhRow.olean GSTFourPowerDirectTwoHundredTwentySeventhRow.lean 2>&1 | tee direct-row227.log
          ! grep -E 'declaration uses .sorry.|sorryAx|unknown identifier|unknown module prefix|unsolved goals|error:' direct-row227.log
      - name: Reject forbidden proof escapes
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE '\b(sorry|admit|axiom)\b|sorryAx|False\.elim' GSTFourPowerDirectTwoHundredTwentySeventhRow.lean
      - name: Axiom audit direct row227 theorem
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/Audit.lean <<'EOF'
          import GSTFourPowerDirectTwoHundredTwentySeventhRow
          #print axioms GSTFourPowerDirectTwoHundredTwentySeventhRow.commonTwo_of_mod2025465365549235636389379590279612045176776005882811610332067323733925450296747107485272801773488928849912987_228
          #print axioms GSTFourPowerDirectTwoHundredTwentySeventhRow.physical_happy_of_mod2025465365549235636389379590279612045176776005882811610332067323733925450296747107485272801773488928849912987_228
          #print axioms GSTFourPowerDirectTwoHundredTwentySeventhRow.four_power_happy_propagates_of_next_mod2025465365549235636389379590279612045176776005882811610332067323733925450296747107485272801773488928849912987_228
          EOF
          lake env lean /tmp/Audit.lean 2>&1 | tee audit.log
          ! grep -E 'sorryAx' audit.log
      - name: Direct physical-row marker
        run: echo DIRECT_ROW227_RELOCATED_HAPPY_KERNEL_GREEN
