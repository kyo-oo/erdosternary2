name: GPT56 Problem406 Public API

on:
  push:
    branches:
      - sol/gpt56-canonical-tail-escape-20260827
  workflow_dispatch:

jobs:
  public-api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install exact Lean RC2
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build public Problem 406 and GST APIs
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
          lake env lean GST/Problem406/PublicAPI.lean
          lake env lean GST/Problem406/TheoremMap.lean
          lake env lean GST/Arithmetic/TernaryDigits.lean
          lake env lean GST/Arithmetic/Carries.lean
          lake env lean GST/FourPower/CommonTwo.lean
          lake env lean GST/FourPower/PrefixLaw.lean
          lake env lean GST/FourPower/Certificate.lean
          lake env lean GST/PublicAPI.lean
          echo 'PROBLEM406_PUBLIC_API_GREEN=1'
          echo 'GST_PUBLIC_API_GREEN=1'
      - name: Generate GST declaration manifest
        shell: bash
        run: |
          set -euo pipefail
          python tests/test_gst_decl_manifest.py
          python scripts/gst_decl_manifest.py
          test -s docs/gst/generated/theorem-manifest.md
          test -s docs/gst/generated/declaration-counts.md
          grep -q 'Total declarations:' docs/gst/generated/theorem-manifest.md
          grep -q 'Four-power direct arithmetic' docs/gst/generated/declaration-counts.md
          echo 'GST_DECLARATION_MANIFEST_GREEN=1'
