name: GPT56 Full Monolith Axiom and Official Comparator

on:
  push:
    branches:
      - sol/gpt56-canonical-tail-escape-20260827
    paths:
      - ErdosTernary2.lean
      - GSTPrefixOneOntologicalEscape.lean
      - GSTFourPowerHappyProvider.lean
      - GSTFourPowerDirectExistenceProviderPipeline.lean
      - questions/deepmind_problem_406/Challenge.lean
      - questions/deepmind_problem_406/Solution.lean
      - lakefile.toml
      - .github/workflows/gpt56-full-monolith-axiom-and-official-comparator.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  problem406-submitted-monolith-axiom-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sol/gpt56-canonical-tail-escape-20260827
          fetch-depth: 1

      - name: Install exact Lean RC2 and pinned Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get

      - name: Build protected green monolith
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build ErdosTernary2
          echo PROBLEM406_MONOLITH_BUILD_GREEN=1

      - name: Kernel axiom audit of submitted Problem 406 theorem
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat > MonolithProblem406AxiomAudit.lean <<'EOF'
          import ErdosTernary2
          set_option maxHeartbeats 0
          set_option maxRecDepth 1000000
          #print axioms erdos_ternary_2_universal
          EOF
          lake env lean MonolithProblem406AxiomAudit.lean 2>&1 | tee monolith-problem406-axioms.log
          if grep -Fq 'sorryAx' monolith-problem406-axioms.log; then
            echo PROBLEM406_MONOLITH_FORBIDDEN_SORRYAX=1
            exit 1
          fi
          if grep -Fq 'gst_four_power_direct_existence_inline' monolith-problem406-axioms.log; then
            echo PROBLEM406_MONOLITH_FORBIDDEN_INLINE_AXIOM_REACHED_SUBMITTED_THEOREM=1
            exit 1
          fi
          echo PROBLEM406_MONOLITH_SUBMITTED_THEOREM_NO_FORBIDDEN_AXIOMS=1

      - name: Upload Problem 406 monolith diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: problem406-monolith-axiom-diagnostics
          path: |
            MonolithProblem406AxiomAudit.lean
            monolith-problem406-axioms.log
          if-no-files-found: ignore

  official-leanprover-comparator-problem406:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sol/gpt56-canonical-tail-escape-20260827
          fetch-depth: 1

      - name: Install exact Lean RC2 and pinned Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get

      - name: Build official leanprover/comparator at matching Lean revision
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          git clone https://github.com/leanprover/comparator.git /tmp/leanprover-comparator
          git -C /tmp/leanprover-comparator checkout 75c730e9b6ef5c2c3b334fad7c3d51fe20624c88
          cd /tmp/leanprover-comparator
          lake update
          lake build comparator lean4export

      - name: Install landrun sandbox
        shell: bash
        run: |
          set -euo pipefail
          if command -v go >/dev/null 2>&1; then
            go install github.com/zouuup/landrun/cmd/landrun@latest
            echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
            echo OFFICIAL_COMPARATOR_LANDRUN_INSTALLED=1
          else
            echo OFFICIAL_COMPARATOR_LANDRUN_INSTALL_FAILED_NO_GO=1
            exit 1
          fi

      - name: Materialize DeepMind 406 challenge and monolith solution modules
        shell: bash
        run: |
          set -euo pipefail
          cp questions/deepmind_problem_406/Challenge.lean OfficialComparatorChallenge.lean
          cp questions/deepmind_problem_406/Solution.lean OfficialComparatorSolution.lean

          python3 <<'PY'
          from pathlib import Path
          import re

          challenge = Path('OfficialComparatorChallenge.lean').read_text(encoding='utf-8')
          solution = Path('OfficialComparatorSolution.lean').read_text(encoding='utf-8')

          if 'theorem erdos_ternary_2' not in challenge:
              raise SystemExit('challenge is not the DeepMind/Erdos 406 theorem surface')
          if 'sorry' not in challenge:
              raise SystemExit('challenge must keep the intentional question-side sorry')
          if 'import ErdosTernary2' not in solution:
              raise SystemExit('solution does not import the green monolith')
          forbidden_solution = []
          for i, line in enumerate(solution.splitlines(), 1):
              if line.lstrip().startswith('--'):
                  continue
              if re.search(r'\bsorry\b|\badmit\b|\baxiom\b|\bnative_decide\b', line):
                  forbidden_solution.append(f'{i}:{line}')
          if forbidden_solution:
              print('\n'.join(forbidden_solution))
              raise SystemExit('solution contains forbidden proof escape')

          Path('official-comparator-config.json').write_text('''{
            "challenge_module": "OfficialComparatorChallenge",
            "solution_module": "OfficialComparatorSolution",
            "theorem_names": ["erdos_ternary_2"],
            "permitted_axioms": ["propext", "Quot.sound", "Classical.choice"],
            "enable_nanoda": false
          }
          ''', encoding='utf-8')
          PY

          cat >> lakefile.toml <<'EOF'

          [[lean_lib]]
          name = "OfficialComparatorChallenge"

          [[lean_lib]]
          name = "OfficialComparatorSolution"
          EOF
          echo OFFICIAL_COMPARATOR_PROBLEM406_MODULES_MATERIALIZED=1

      - name: Build DeepMind 406 judge modules
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build ErdosTernary2 OfficialComparatorChallenge OfficialComparatorSolution
          echo OFFICIAL_COMPARATOR_PROBLEM406_LEAN_MODULES_BUILD_GREEN=1

      - name: Kernel axiom audit of solution theorem
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat > OfficialComparatorProblem406AxiomAudit.lean <<'EOF'
          import OfficialComparatorSolution
          set_option maxHeartbeats 0
          set_option maxRecDepth 1000000
          #print axioms erdos_ternary_2
          EOF
          lake env lean OfficialComparatorProblem406AxiomAudit.lean 2>&1 | tee official-comparator-problem406-axioms.log
          if grep -Fq 'sorryAx' official-comparator-problem406-axioms.log; then
            echo OFFICIAL_COMPARATOR_PROBLEM406_FORBIDDEN_SORRYAX=1
            exit 1
          fi
          if grep -Fq 'gst_four_power_direct_existence_inline' official-comparator-problem406-axioms.log; then
            echo OFFICIAL_COMPARATOR_PROBLEM406_FORBIDDEN_INLINE_AXIOM_REACHED_SOLUTION=1
            exit 1
          fi
          echo OFFICIAL_COMPARATOR_PROBLEM406_SOLUTION_NO_FORBIDDEN_AXIOMS=1

      - name: Run official comparator and require Your solution is okay
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$(go env GOPATH)/bin:$PATH"
          COMPARATOR_BIN=/tmp/leanprover-comparator/.lake/build/bin/comparator
          LEAN4EXPORT_BIN=/tmp/leanprover-comparator/.lake/packages/lean4export/.lake/build/bin/lean4export
          LANDRUN_BIN=$(command -v landrun)
          test -x "$COMPARATOR_BIN"
          test -x "$LEAN4EXPORT_BIN"
          test -x "$LANDRUN_BIN"
          COMPARATOR_LANDRUN="$LANDRUN_BIN" \
          COMPARATOR_LEAN4EXPORT="$LEAN4EXPORT_BIN" \
            lake env "$COMPARATOR_BIN" official-comparator-config.json 2>&1 | tee official-comparator.log
          grep -F 'Lean default kernel accepts the solution' official-comparator.log
          grep -F 'Your solution is okay!' official-comparator.log
          echo OFFICIAL_LEANPROVER_COMPARATOR_PROBLEM406_YOUR_SOLUTION_IS_OKAY=1

      - name: Upload official comparator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-leanprover-comparator-problem406-diagnostics
          path: |
            OfficialComparatorChallenge.lean
            OfficialComparatorSolution.lean
            OfficialComparatorProblem406AxiomAudit.lean
            official-comparator-config.json
            official-comparator-problem406-axioms.log
            official-comparator.log
          if-no-files-found: ignore
