name: GPT56 Full Monolith Axiom and Official Comparator

on:
  push:
    branches:
      - sol/gpt56-canonical-tail-escape-20260827
      - sol/kyo-de11-axiom-to-theorem
    paths:
      - ErdosTernary2.lean
      - questions/deepmind_problem_406/Challenge.lean
      - questions/deepmind_problem_406/Solution.lean
      - scripts/comparator.sh
      - scripts/sorry_check.sh
      - .surgery/clean_sorry_check_hits.py
      - .github/workflows/gpt56-full-monolith-axiom-and-official-comparator.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  problem406-repository-v5-comparator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Verify committed tree hygiene
        shell: bash
        run: |
          set -euo pipefail
          python3 .surgery/clean_sorry_check_hits.py
          git diff -- . ':!/.lake'
          git diff --check
          if ! git diff --quiet -- . ':!/.lake'; then
            echo 'PROBLEM406_FULL_WORKFLOW_DIRTY_TREE=1'
            exit 1
          fi
          echo 'PROBLEM406_FULL_WORKFLOW_COMMITTED_TREE_CLEAN=1'

      - name: Install exact Lean RC2 and pinned Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get

      - name: Run repository V5 comparator on Problem 406 production proof
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          bash scripts/comparator.sh | tee problem406-v5-comparator.log
          grep -Fq 'Your solution is okay!' problem406-v5-comparator.log
          grep -Fq '=== COMPARATOR RESULT: PASS ===' problem406-v5-comparator.log
          echo PROBLEM406_V5_LITERAL_PASS_CONFIRMED=1

      - name: Upload V5 comparator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: problem406-v5-comparator-diagnostics
          path: problem406-v5-comparator.log
          if-no-files-found: ignore

  problem406-challenge-solution-harness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Install exact Lean RC2 and pinned Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get

      - name: Validate DeepMind Problem 406 challenge and solution files
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          challenge = Path('questions/deepmind_problem_406/Challenge.lean').read_text(encoding='utf-8')
          solution = Path('questions/deepmind_problem_406/Solution.lean').read_text(encoding='utf-8')

          if 'theorem erdos_ternary_2' not in challenge:
              raise SystemExit('challenge is not the DeepMind/Erdos 406 theorem surface')
          if re.search(r'^\s*sorry\s*$', challenge, re.M) is None:
              raise SystemExit('challenge must keep exactly the intentional question-side sorry')
          if 'import ErdosTernary2' not in solution:
              raise SystemExit('solution does not import the green monolith')
          forbidden_solution = []
          for i, line in enumerate(solution.splitlines(), 1):
              if line.lstrip().startswith('--'):
                  continue
              if re.search(r'\bsorry\b|\badmit\b|\baxiom\b|\bnative_decide\b', line):
                  forbidden_solution.append(f'{i}:{line}')
          if forbidden_solution:
              print('\n'.join(forbidden_solution))
              raise SystemExit('solution contains forbidden proof escape')
          print('PROBLEM406_CHALLENGE_AND_SOLUTION_SURFACE_VALID=1')
          PY

      - name: Build monolith and Problem 406 solution file
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build ErdosTernary2
          lake env lean questions/deepmind_problem_406/Solution.lean
          echo PROBLEM406_CHALLENGE_SOLUTION_BUILD_GREEN=1

      - name: Kernel axiom report for submitted Problem 406 theorem
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat > Problem406SolutionAxiomReport.lean <<'EOF'
          import ErdosTernary2
          set_option maxHeartbeats 0
          set_option maxRecDepth 1000000
          #print axioms erdos_ternary_2_universal_of_tailF
          EOF
          lake env lean Problem406SolutionAxiomReport.lean 2>&1 | tee problem406-solution-axioms.log
          if grep -Fq 'sorryAx' problem406-solution-axioms.log; then
            echo PROBLEM406_FORBIDDEN_SORRYAX=1
            exit 1
          fi
          if grep -Fq 'gst_four_power_direct_existence_inline' problem406-solution-axioms.log; then
            echo PROBLEM406_LEGACY_INLINE_AXIOM_BOUNDARY_REPORTED=1
          else
            echo PROBLEM406_NO_LEGACY_INLINE_AXIOM_BOUNDARY_REPORTED=1
          fi
          echo PROBLEM406_AXIOM_REPORT_COMPLETED=1

      - name: Upload challenge solution diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: problem406-challenge-solution-diagnostics
          path: |
            Problem406SolutionAxiomReport.lean
            problem406-solution-axioms.log
          if-no-files-found: ignore
