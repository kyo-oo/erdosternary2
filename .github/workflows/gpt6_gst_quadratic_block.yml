name: GPT6 GST Worldtrace Quadratic Two-Band Exact Kernel
on:
  push:
    branches: [gpt6/problem406-fourth-trit-discovery-20261029]
    paths: [GSTWorldtraceQuadraticBlockLift.lean, .github/workflows/gpt6_gst_quadratic_block.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Lean and compile the source GST block dependency
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
          lake build GSTWorldtraceBlockLift
          lake env lean -o .lake/build/lib/lean/GSTWorldtraceCoeffStability.olean GSTWorldtraceCoeffStability.lean
      - name: Check complete quadratic GST derivation and printed axioms
        shell: bash
        run: |
          set -euo pipefail
          lake env lean GSTWorldtraceQuadraticBlockLift.lean 2>&1 | tee gst-quadratic-exact.log
          ! grep -E 'error:|sorryAx|unknown identifier|unsolved goals|declaration uses .sorry.|gst_four_power_direct_existence_inline' gst-quadratic-exact.log
          echo GST_WORLDTRACE_QUADRATIC_TWO_BAND_KERNEL_PASS=1
