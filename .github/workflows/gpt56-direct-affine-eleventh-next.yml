            GSTFourPowerAffineSixthTrit556_559
            GSTFourPowerAffineSixthTrit562_565
            GSTFourPowerAffineSixthTrit571_573
            GSTFourPowerAffineSixthTrit575_578
            GSTFourPowerAffineSixthTrit581_587
            GSTFourPowerAffineSixthTrit589_592
            GSTFourPowerAffineSixthTrit599_603
            GSTFourPowerAffineSixthTrit606_613
            GSTFourPowerAffineSixthTrit617_619
            GSTFourPowerAffineSixthTrit620_627
            GSTFourPowerAffineSixthTrit631_636
            GSTFourPowerAffineSixthTrit639_646
            GSTFourPowerAffineSixthTrit648_656
            GSTFourPowerAffineSixthTrit660_663
            GSTFourPowerAffineSixthTrit665_668
            GSTFourPowerAffineSixthTrit671_673
            GSTFourPowerAffineSixthTrit674_681
