name: GPT56 Direct Affine Eleventh Next Verify

on:
  push:
    branches:
      - sol/gpt56-four-power-relocation-prod-20260903
    paths:
      - 'GSTFourPowerAffineTenthTritNext.lean'
      - 'GSTFourPowerAffineEleventhTritNext.lean'
      - '.github/workflows/gpt56-direct-affine-eleventh-next.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  affine-eleventh-next-kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
      - name: Prepare output directory
        run: mkdir -p .lake/build/lib/lean
      - name: Compile fresh production dependency chain
        shell: bash
        run: |
          set -euo pipefail
          modules=(
            GSTCanonicalTailStateIso
