            GSTFourPowerAffineEighthTritNext
            GSTFourPowerAffineEighthTritContinuation
            GSTFourPowerAffineNinthTritNext
            GSTFourPowerAffineTenthTritNext
          )
          for module in "${modules[@]}"; do
            lake env lean -o ".lake/build/lib/lean/${module}.olean" "${module}.lean" 2>&1 | tee "${module}.log"
            ! grep -E 'declaration uses .sorry.|sorryAx|unknown identifier|unknown module prefix|unsolved goals|error:' "${module}.log"
          done
      - name: Compile new eleventh-trit physical constructors
        shell: bash
        run: |
          set -euo pipefail
          lake env lean -o .lake/build/lib/lean/GSTFourPowerAffineEleventhTritNext.olean GSTFourPowerAffineEleventhTritNext.lean 2>&1 | tee affine-eleventh-next.log
          ! grep -E 'declaration uses .sorry.|sorryAx|unknown identifier|unknown module prefix|unsolved goals|error:' affine-eleventh-next.log
      - name: Reject forbidden proof escapes in fresh module
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE '\b(sorry|admit|axiom|sorryAx)\b|False\.elim' GSTFourPowerAffineEleventhTritNext.lean
      - name: Direct affine audit marker
        run: echo DIRECT_AFFINE_ELEVENTH_NEXT_PHYSICAL_HAPPY_GREEN_V1=1
