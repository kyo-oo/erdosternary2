name: GPT56 Direct Row221 Verify

on:
  push:
    branches:
      - sol/gpt56-four-power-relocation-prod-20260903
    paths:
      - GSTFourPowerDirectTwoHundredTwentyFirstRow.lean
      - .github/workflows/gpt56-direct-row221.yml
  workflow_dispatch:

jobs:
  direct-row221-kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
      - name: Compile exact fresh-production dependency closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean
          modules=(
            GSTCanonicalTailStateIso
            GSTFourPowerDirectResidue
            GSTFourPowerDirectResidue27
            GSTFourPowerDirectResidue81
            GSTFourPowerExponentTritObstruction
            GSTFourPowerExactExponentPeriod
            GSTFourPowerDirectExistence
            GSTFourPowerDirectAdditionCarry
            GSTFourPowerDirectHappyBridge
            GSTFourPowerAffineOrbit
            GSTFourPowerAffinePrefixIsometry
          )
          for module in "${modules[@]}"; do
            lake env lean -o ".lake/build/lib/lean/${module}.olean" "${module}.lean" 2>&1 | tee "${module}.log"
            ! grep -E 'declaration uses .sorry.|sorryAx|unknown identifier|unknown module prefix|unsolved goals|error:' "${module}.log"
          done
      - name: Compile direct row221 physical constructor
        shell: bash
        run: |
          set -euo pipefail
          ulimit -s 65536
          lake env lean -o .lake/build/lib/lean/GSTFourPowerDirectTwoHundredTwentyFirstRow.olean GSTFourPowerDirectTwoHundredTwentyFirstRow.lean 2>&1 | tee direct-row221.log
          ! grep -E 'declaration uses .sorry.|sorryAx|unknown identifier|unknown module prefix|unsolved goals|error:' direct-row221.log
      - name: Reject forbidden proof escapes
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE '\b(sorry|admit|axiom)\b|sorryAx|False\.elim' GSTFourPowerDirectTwoHundredTwentyFirstRow.lean
      - name: Axiom audit direct row221 theorem
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/Audit.lean <<'EOF'
          import GSTFourPowerDirectTwoHundredTwentyFirstRow
          #print axioms GSTFourPowerDirectTwoHundredTwentyFirstRow.commonTwo_of_mod2778416139299363012879807394073541900105316880497683964790215807591118587512684646756204117659106898285203_222
          #print axioms GSTFourPowerDirectTwoHundredTwentyFirstRow.physical_happy_of_mod2778416139299363012879807394073541900105316880497683964790215807591118587512684646756204117659106898285203_222
          #print axioms GSTFourPowerDirectTwoHundredTwentyFirstRow.four_power_happy_propagates_of_next_mod2778416139299363012879807394073541900105316880497683964790215807591118587512684646756204117659106898285203_222
          EOF
          lake env lean /tmp/Audit.lean 2>&1 | tee audit.log
          ! grep -E 'sorryAx' audit.log
      - name: Direct physical-row marker
        run: echo DIRECT_ROW221_RELOCATED_HAPPY_KERNEL_GREEN
