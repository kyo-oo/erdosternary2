name: GPT6 GST Periodic Certificate Kernel

on:
  push:
    branches:
      - gpt6/erdos-row7-residue-discovery-20261029
    paths:
      - GSTFourPowerThirdWave.lean
      - .github/workflows/gpt6_periodic_certificate_kernel.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Lean and cached Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Check exact GST periodic-certificate theorems
        shell: bash
        run: |
          set -euo pipefail
          lake build GSTFourPowerThirdWave
          lake env lean GSTFourPowerThirdWave.lean | tee periodic-certificate-kernel.log
          ! grep -E "sorryAx|unknown identifier|unsolved goals|error:" periodic-certificate-kernel.log
          echo GST_PERIODIC_CERTIFICATE_KERNEL_GREEN=1
