name: Prefix One Modular Blade Smoke V2

on:
  push:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euxo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.33.0-rc2
      - name: Resolve dependencies
        timeout-minutes: 20
        shell: bash
        run: |
          set -euxo pipefail
          lake update
          lake exe cache get
          lake build GSTTactic
      - name: Build corrected S language and pre-Omega core
        timeout-minutes: 30
        shell: bash
        run: |
          set -euxo pipefail
          SNAP="$PWD/ker07-snapshot/branches/15_sol_new__physical-phase-crossing-surgery"
          LEAN_PATH="$SNAP:${LEAN_PATH:-}" lake env lean -o "$SNAP/GSTGraphV2InfiniteControlScratch.olean" "$SNAP/GSTGraphV2InfiniteControlScratch.lean"
          LEAN_PATH="$SNAP:${LEAN_PATH:-}" lake env lean -o "$SNAP/GSTGraphV2InfiniteBigNDichotomyScratch.olean" "$SNAP/GSTGraphV2InfiniteBigNDichotomyScratch.lean"
          LEAN_PATH="$SNAP:${LEAN_PATH:-}" lake env lean -o "$SNAP/GSTGraphV2PhysicalSignedKernelTelescopeScratch.olean" "$SNAP/GSTGraphV2PhysicalSignedKernelTelescopeScratch.lean"
          LEAN_PATH="$SNAP:${LEAN_PATH:-}" lake env lean -o "$SNAP/GSTGraphV2InfiniteCardinalMasterScratch.olean" "$SNAP/GSTGraphV2InfiniteCardinalMasterScratch.lean"
          LEAN_PATH="$SNAP:${LEAN_PATH:-}" lake env lean -o "$SNAP/GSTGraphV2InfiniteElevenEquationMasterScratch.olean" "$SNAP/GSTGraphV2InfiniteElevenEquationMasterScratch.lean"
          LEAN_PATH="$SNAP:${LEAN_PATH:-}" lake env lean -o "$SNAP/GSTGraphV2SleepEquationLabScratch.olean" "$SNAP/GSTGraphV2SleepEquationLabScratch.lean"
          LEAN_PATH="$SNAP:${LEAN_PATH:-}" lake env lean -o "$SNAP/GSTGraphV2SleepBadLanguageDescentScratch.olean" "$SNAP/GSTGraphV2SleepBadLanguageDescentScratch.lean"
          LEGACY_LINE=$(grep -n 'Legacy residual overproof' ErdosTernary2.lean | head -1 | cut -d: -f1)
          CUT=$((LEGACY_LINE - 2))
          head -n "$CUT" ErdosTernary2.lean > ErdosPreOmega.lean
          lake env lean -o ErdosPreOmega.olean ErdosPreOmega.lean
          LEAN_PATH="$SNAP:$PWD:${LEAN_PATH:-}" lake env lean -o GSTHandwrittenPhysicalNoBig1.olean GSTHandwrittenPhysicalNoBig1.lean
          LEAN_PATH="$SNAP:$PWD:${LEAN_PATH:-}" lake env lean -o GSTHandwrittenChildFirstBig1.olean GSTHandwrittenChildFirstBig1.lean
          LEAN_PATH="$SNAP:$PWD:${LEAN_PATH:-}" lake env lean -o GSTHandwrittenHorizontalParentBridge.olean GSTHandwrittenHorizontalParentBridge.lean
          LEAN_PATH="$SNAP:$PWD:${LEAN_PATH:-}" lake env lean -o GSTHandwrittenPrefixOneLivePackage.olean GSTHandwrittenPrefixOneLivePackage.lean
          LEAN_PATH="$SNAP:$PWD:${LEAN_PATH:-}" lake env lean -o GSTHandwrittenBigNThreeWorldFactors.olean GSTHandwrittenBigNThreeWorldFactors.lean
          LEAN_PATH="$SNAP:$PWD:${LEAN_PATH:-}" lake env lean -o GSTHandwrittenBigNSignedKernel.olean GSTHandwrittenBigNSignedKernel.lean
      - name: Kernel-check corrected modular blade
        timeout-minutes: 30
        shell: bash
        run: |
          set -euxo pipefail
          SNAP="$PWD/ker07-snapshot/branches/15_sol_new__physical-phase-crossing-surgery"
          cat > PrefixOneModularBladeSmokeV2.lean <<'EOF'
          import ErdosPreOmega
          import GSTGraphV2SleepBadLanguageDescentScratch

          open GSTInfiniteV2

          theorem gpt56_seeded_affine_bad_to_sleep_v2
              (D X : Nat) (hbad : GSTSeededAffineBadTrace D X) :
              GSTSleepSeededBadTraceS D X := by
            intro j
            have hj := hbad j
            simpa [GSTSeededAffineBadTrace, GSTBadPair, GSTSleepSeededBadTraceS,
              GSTBadPairS, GSTHappyPairS, gstAffineMulCarry,
              gstAffineCarryS, gstDigit, gstDigitS] using hj

          theorem gpt56_prefix_one_seed_is_one_v2
              (s : Nat) (hs : 1 ≤ s) :
              (4 * (c s % 3)) / 3 = 1 := by
            rw [c_mod3 s hs]

          theorem gpt56_prefix_one_bad_noBig1_forces_nine_power_v2
              (s n : Nat) (hs : 1 ≤ s)
              (hbad : GSTOmegaInfiniteBadTrace s 1 n)
              (hno : GSTSleepNoBig1S
                (c s / 3 + 4^(3^s) * gstNavigationConstant (s+1) n)) :
              ∃ r,
                1 + 4 * (c s / 3 +
                  4^(3^s) * gstNavigationConstant (s+1) n) = 9^r := by
            let X := c s / 3 + 4^(3^s) * gstNavigationConstant (s+1) n
            have hseedOld : GSTSeededAffineBadTrace 1 X := by
              have hraw :=
                (gst_omega_infiniteBadTrace_iff_seededAffine s 1 n).1 hbad
              have hseed := gpt56_prefix_one_seed_is_one_v2 s hs
              simpa [X, hseed] using hraw
            have hseed : GSTSleepSeededBadTraceS 1 X :=
              gpt56_seeded_affine_bad_to_sleep_v2 1 X hseedOld
            obtain ⟨r, hr⟩ :=
              (gst_sleep_seed_one_three_noBig1_bad_formsS X).1 hseed hno
            refine ⟨r, ?_⟩
            have hp : 0 < 9^r := Nat.pow_pos (by decide)
            omega

          theorem gpt56_four_pow_parent_mod73_one_v2
              (s n : Nat) (hs : 2 ≤ s) :
              4^(3^s * (1 + 3*n)) % 73 = 1 := by
            have hsEq : s = 2 + (s-2) := by omega
            have h3 : 3^s = 9 * 3^(s-2) := by
              rw [hsEq, Nat.pow_add]
              norm_num
            rw [h3]
            have hexp :
                (9 * 3^(s-2)) * (1 + 3*n) =
                  9 * (3^(s-2) * (1 + 3*n)) := by ring
            rw [hexp, Nat.pow_mul, Nat.pow_mod]
            have h49 : 4^9 % 73 = 1 := by decide
            rw [h49]
            simp

          theorem gpt56_navigation_parent_div73_v2
              (s n : Nat) (hs : 2 ≤ s) :
              73 ∣ gstNavigationConstant s (1 + 3*n) := by
            have hpow := gpt56_four_pow_parent_mod73_one_v2 s n hs
            have hdec := gst_navigation_decomposition s (1 + 3*n) (by omega)
            have hmodEq := congrArg (fun z : Nat => z % 73) hdec
            rw [hpow] at hmodEq
            rw [Nat.add_mod] at hmodEq
            have hprodmod :
                (3^(s+1) * gstNavigationConstant s (1+3*n)) % 73 = 0 := by
              have hlt := Nat.mod_lt
                (3^(s+1) * gstNavigationConstant s (1+3*n))
                (by decide : 0 < 73)
              norm_num at hmodEq
              omega
            have hprod :
                73 ∣ 3^(s+1) * gstNavigationConstant s (1+3*n) :=
              Nat.dvd_of_mod_eq_zero hprodmod
            have hp : Nat.Prime 73 := by norm_num
            rcases hp.dvd_mul.mp hprod with hleft | hright
            · have hpowdvd : 73 ∣ 3 := hp.dvd_of_dvd_pow hleft
              norm_num at hpowdvd
            · exact hright

          theorem gpt56_prefix_one_X_mod73_v2
              (s n : Nat) (hs : 2 ≤ s) :
              let X := c s / 3 + 4^(3^s) * gstNavigationConstant (s+1) n
              X % 73 = 24 := by
            dsimp only
            let X := c s / 3 + 4^(3^s) * gstNavigationConstant (s+1) n
            have hdiv := gpt56_navigation_parent_div73_v2 s n hs
            have hsplit := gst_navigation_affine_split s 1 n (by omega)
            have hc3 := c_mod3 s (by omega)
            have hshape :
                gstNavigationConstant s (1 + 3*n) = 1 + 3*X := by
              dsimp [X]
              simpa [hc3] using hsplit
            have hmod : (1 + 3*X) % 73 = 0 := by
              rw [← hshape]
              exact Nat.mod_eq_zero_of_dvd hdiv
            have hxlt : X % 73 < 73 := Nat.mod_lt _ (by decide)
            rw [Nat.add_mod, Nat.mul_mod] at hmod
            norm_num at hmod
            omega

          theorem gpt56_nine_power_not_prefix_one_mod73_v2
              (X r : Nat) (hX : X % 73 = 24) :
              1 + 4*X ≠ 9^r := by
            intro heq
            have hmod := congrArg (fun z : Nat => z % 73) heq
            have hleft : (1 + 4*X) % 73 = 24 := by
              rw [Nat.add_mod, Nat.mul_mod, hX]
            rw [hleft] at hmod
            have hraise := congrArg (fun z : Nat => z^6 % 73) hmod
            have hL : 24^6 % 73 = 72 := by decide
            have hR : (9^r % 73)^6 % 73 = 1 := by
              rw [← Nat.pow_mod, ← Nat.pow_mul]
              have hcomm : r * 6 = 6 * r := by omega
              rw [hcomm, Nat.pow_mul, Nat.pow_mod]
              have h96 : 9^6 % 73 = 1 := by decide
              rw [h96]
              simp
            rw [hL, hR] at hraise
            omega

          /-- Modular subtraction blade with the positivity needed to keep
          natural subtraction honest.  This is the missing normalization in
          the former interval-case proof: equal residues may be scaled and
          then have thirteen removed because both scaled representatives are
          already at least thirteen. -/
          theorem gpt56_scaled_sub_mod271_v2
              (a k : Nat) (hk : a % 271 = k) (hkpos : 1 ≤ k) :
              (256*a - 13) % 271 = (256*k - 13) % 271 := by
            have hdecomp := Nat.mod_add_div a 271
            rw [hk] at hdecomp
            have hrearr :
                256*a - 13 =
                  (256*k - 13) + 271 * (256 * (a / 271)) := by
              omega
            rw [hrearr, Nat.add_mod, Nat.mul_mod]
            simp

          theorem gpt56_prefix_one_noBig1_impossible_ge2_v2
              (s n : Nat) (hs : 2 ≤ s)
              (hbad : GSTOmegaInfiniteBadTrace s 1 n)
              (hno : GSTSleepNoBig1S
                (c s / 3 + 4^(3^s) * gstNavigationConstant (s+1) n)) : False := by
            obtain ⟨r, hr⟩ :=
              gpt56_prefix_one_bad_noBig1_forces_nine_power_v2 s n (by omega) hbad hno
            let X := c s / 3 + 4^(3^s) * gstNavigationConstant (s+1) n
            have hx := gpt56_prefix_one_X_mod73_v2 s n hs
            exact gpt56_nine_power_not_prefix_one_mod73_v2 X r hx hr

          theorem gpt56_s1_nine_power_equation_271_v2
              (n r : Nat)
              (hEq : 1 + 4 * (c 1 / 3 +
                4^(3^1) * gstNavigationConstant 2 n) = 9^r) :
              27 * 9^r = 256 * 4^(9*n) - 13 := by
            have hc1 : c 1 / 3 = 2 := by decide
            have hchild := gst_navigation_decomposition 2 n (by decide)
            norm_num at hchild
            rw [hc1] at hEq
            norm_num at hEq
            omega

          theorem gpt56_s1_rhs15_not270_mod271_v2
              (n : Nat) (hn3 : n % 3 ≠ 0) :
              ((256 * 4^(9*n) - 13)^15) % 271 ≠ 270 := by
            let q := n % 15
            have hq15 : q < 15 := by
              dsimp [q]
              exact Nat.mod_lt _ (by decide)
            have hq3 : q % 3 ≠ 0 := by
              dsimp [q]
              have hdiv : 3 ∣ 15 := by decide
              rw [Nat.mod_mod_of_dvd n hdiv]
              exact hn3
            have hnshape : n = 15 * (n/15) + q := by
              dsimp [q]
              exact (Nat.div_add_mod n 15).symm
            have h4reduce : 4^(9*n) % 271 = 4^(9*q) % 271 := by
              rw [hnshape]
              have hexp :
                  9 * (15 * (n / 15) + q) = 135 * (n/15) + 9*q := by ring
              rw [hexp, Nat.pow_add, Nat.mul_mod]
              have hblock : 4^(135 * (n/15)) % 271 = 1 := by
                rw [Nat.pow_mul, Nat.pow_mod]
                have hcycle : 4^135 % 271 = 1 := by decide
                rw [hcycle]
                simp
              rw [hblock]
              simp
            intro hbad
            have hbase :
                (256 * 4^(9*n) - 13) % 271 =
                  (256 * (4^(9*q) % 271) - 13) % 271 := by
              apply gpt56_scaled_sub_mod271_v2
              · exact h4reduce
              · interval_cases q <;> norm_num at hq3
                all_goals norm_num [Nat.pow_mod]
            rw [Nat.pow_mod] at hbad
            rw [hbase] at hbad
            interval_cases q
            all_goals norm_num at hq3
            all_goals norm_num at hbad

          theorem gpt56_s1_noBig1_impossible_v2
              (n : Nat) (hn3 : n % 3 ≠ 0)
              (hbad : GSTOmegaInfiniteBadTrace 1 1 n)
              (hno : GSTSleepNoBig1S
                (c 1 / 3 + 4^(3^1) * gstNavigationConstant 2 n)) : False := by
            obtain ⟨r, hr⟩ :=
              gpt56_prefix_one_bad_noBig1_forces_nine_power_v2 1 n (by decide) hbad hno
            have heq := gpt56_s1_nine_power_equation_271_v2 n r hr
            have hmod := congrArg (fun z : Nat => z^15 % 271) heq
            have hL : (27 * 9^r)^15 % 271 = 270 := by
              have h27 : 27^15 % 271 = 270 := by decide
              have h9 : (9^r)^15 % 271 = 1 := by
                rw [← Nat.pow_mul]
                have hcomm : r*15 = 15*r := by omega
                rw [hcomm, Nat.pow_mul, Nat.pow_mod]
                have hcycle : 9^15 % 271 = 1 := by decide
                rw [hcycle]
                simp
              rw [Nat.mul_pow, Nat.mul_mod, h27, h9]
            have hR : ((256 * 4^(9*n) - 13)^15) % 271 ≠ 270 :=
              gpt56_s1_rhs15_not270_mod271_v2 n hn3
            rw [hL] at hmod
            exact hR hmod.symm

          theorem gpt56_prefix_one_bad_forces_BIG1_v2
              (s n : Nat) (hs : 1 ≤ s) (hn3 : n % 3 ≠ 0)
              (hbad : GSTOmegaInfiniteBadTrace s 1 n) :
              ∃ j, gstDigitS
                (c s / 3 + 4^(3^s) * gstNavigationConstant (s+1) n) j = 1 := by
            by_contra hnone
            have hno : GSTSleepNoBig1S
                (c s / 3 + 4^(3^s) * gstNavigationConstant (s+1) n) := by
              intro j hj
              exact hnone ⟨j, hj⟩
            by_cases hs1 : s = 1
            · subst s
              exact gpt56_s1_noBig1_impossible_v2 n hn3 hbad hno
            · have hs2 : 2 ≤ s := by omega
              exact gpt56_prefix_one_noBig1_impossible_ge2_v2 s n hs2 hbad hno

          #check gpt56_prefix_one_bad_forces_BIG1_v2
          #print axioms gpt56_prefix_one_bad_forces_BIG1_v2
          EOF
          LEAN_PATH="$SNAP:$PWD:${LEAN_PATH:-}" lake env lean -o GSTCanonicalFirstGateControl.olean GSTCanonicalFirstGateControl.lean | tee canonical-first-gate-control.log
          ! grep -E 'sorryAx|declaration uses .*[Ss]orry' canonical-first-gate-control.log
          LEAN_PATH="$SNAP:$PWD:${LEAN_PATH:-}" lake env lean GSTCanonicalEnergyControl.lean | tee canonical-energy-control.log
          ! grep -E 'sorryAx|declaration uses .*[Ss]orry' canonical-energy-control.log
          LEAN_PATH="$SNAP:$PWD:${LEAN_PATH:-}" lake env lean GSTPrefixOnePhaseIncidenceControl.lean | tee prefix-one-phase-incidence.log
          ! grep -E 'sorryAx|declaration uses .*[Ss]orry' prefix-one-phase-incidence.log
          LEAN_PATH="$SNAP:$PWD:${LEAN_PATH:-}" lake env lean PrefixOneModularBladeSmokeV2.lean | tee modular-blade-v2.log
          ! grep -E 'sorryAx|declaration uses .*[Ss]orry' modular-blade-v2.log
