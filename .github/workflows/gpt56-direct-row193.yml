name: GPT56 Direct Row193 Verify

on:
  push:
    branches:
      - sol/gpt56-four-power-relocation-prod-20260903
    paths:
      - GSTFourPowerDirectOneHundredNinetyThirdRow.lean
      - .github/workflows/gpt56-direct-row193.yml
  workflow_dispatch:

jobs:
  direct-row193-kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
      - name: Compile exact fresh-production dependency closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean
          modules=(
            GSTCanonicalTailStateIso
            GSTFourPowerDirectResidue
            GSTFourPowerDirectResidue27
            GSTFourPowerDirectResidue81
            GSTFourPowerExponentTritObstruction
            GSTFourPowerExactExponentPeriod
            GSTFourPowerDirectExistence
            GSTFourPowerDirectAdditionCarry
            GSTFourPowerDirectHappyBridge
            GSTFourPowerAffineOrbit
            GSTFourPowerAffinePrefixIsometry
          )
          for module in "${modules[@]}"; do
            lake env lean -o ".lake/build/lib/lean/${module}.olean" "${module}.lean" 2>&1 | tee "${module}.log"
            ! grep -E 'declaration uses .sorry.|sorryAx|unknown identifier|unknown module prefix|unsolved goals|error:' "${module}.log"
          done
      - name: Compile direct row193 physical constructor
        shell: bash
        run: |
          set -euo pipefail
          ulimit -s 65536
          lake env lean -o .lake/build/lib/lean/GSTFourPowerDirectOneHundredNinetyThirdRow.olean GSTFourPowerDirectOneHundredNinetyThirdRow.lean 2>&1 | tee direct-row193.log
          ! grep -E 'declaration uses .sorry.|sorryAx|unknown identifier|unknown module prefix|unsolved goals|error:' direct-row193.log
      - name: Reject forbidden proof escapes
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE '\b(sorry|admit|axiom)\b|sorryAx|False\.elim' GSTFourPowerDirectOneHundredNinetyThirdRow.lean
      - name: Axiom audit direct row193 theorem
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/Audit.lean <<'EOF'
          import GSTFourPowerDirectOneHundredNinetyThirdRow
          #print axioms GSTFourPowerDirectOneHundredNinetyThirdRow.commonTwo_of_mod121451298068529844233553416568714964256622520646270917226600348303197298080156462274524325123_194
          #print axioms GSTFourPowerDirectOneHundredNinetyThirdRow.physical_happy_of_mod121451298068529844233553416568714964256622520646270917226600348303197298080156462274524325123_194
          #print axioms GSTFourPowerDirectOneHundredNinetyThirdRow.four_power_happy_propagates_of_next_mod121451298068529844233553416568714964256622520646270917226600348303197298080156462274524325123_194
          EOF
          lake env lean /tmp/Audit.lean 2>&1 | tee audit.log
          ! grep -E 'sorryAx' audit.log
      - name: Direct physical-row marker
        run: echo DIRECT_ROW193_RELOCATED_HAPPY_KERNEL_GREEN
