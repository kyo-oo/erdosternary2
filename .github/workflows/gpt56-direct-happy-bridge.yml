name: GPT56 Direct Happy Bridge

on:
  push:
    branches:
      - sol/gpt56-canonical-tail-escape-20260827
    paths:
      - 'GSTFourPowerDirectHappyBridge.lean'
      - 'GSTFourPowerExactRowRelocation.lean'
      - 'GSTFourPowerPrefixLeTwoRelocation.lean'
      - 'GSTFourPowerAffineIteratedRelocation.lean'
      - 'GSTFourPowerAffineSuccessEquivalence.lean'
      - 'GSTFourPowerAffineTerminalCollision.lean'
      - 'GSTFourPowerDirectExistence.lean'
      - 'GSTFourPowerAffineTwoTritClassifier.lean'
      - '.github/workflows/gpt56-direct-happy-bridge.yml'
  workflow_dispatch:

jobs:
  certify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install exact Lean RC2 and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          rm -f lake-manifest.json
          lake update
          lake exe cache get
      - name: Compile fresh direct Happy bridge
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build GSTFourPowerDirectHappyBridge 2>&1 | tee direct-happy-bridge.log
          ! grep -E 'sorryAx|declaration uses .sorry.|unknown identifier|unknown module prefix|unsolved goals|error:' direct-happy-bridge.log
      - name: Compile exact-row relocation constructor
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p .lake/build/lib/lean
          lake env lean \
            -o .lake/build/lib/lean/GSTFourPowerExactRowRelocation.olean \
            GSTFourPowerExactRowRelocation.lean 2>&1 | tee exact-row-relocation.log
          ! grep -E 'sorryAx|declaration uses .sorry.|unknown identifier|unknown module prefix|unsolved goals|error:' exact-row-relocation.log
      - name: Compile bounded-prefix exact-row relocation constructor
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p .lake/build/lib/lean
          lake env lean \
            -o .lake/build/lib/lean/GSTFourPowerPrefixLeTwoRelocation.olean \
            GSTFourPowerPrefixLeTwoRelocation.lean 2>&1 | tee prefix-le-two-relocation.log
          ! grep -E 'sorryAx|declaration uses .sorry.|unknown identifier|unknown module prefix|unsolved goals|error:' prefix-le-two-relocation.log
      - name: Compile arbitrary-depth affine relocation constructor
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p .lake/build/lib/lean
          lake env lean \
            -o .lake/build/lib/lean/GSTFourPowerAffineIteratedRelocation.olean \
            GSTFourPowerAffineIteratedRelocation.lean 2>&1 | tee affine-iterated-relocation.log
          ! grep -E 'sorryAx|declaration uses .sorry.|unknown identifier|unknown module prefix|unsolved goals|error:' affine-iterated-relocation.log
      - name: Compile affine-success equivalence
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p .lake/build/lib/lean
          lake env lean \
            -o .lake/build/lib/lean/GSTFourPowerAffineSuccessEquivalence.olean \
            GSTFourPowerAffineSuccessEquivalence.lean 2>&1 | tee affine-success-equivalence.log
          ! grep -E 'sorryAx|declaration uses .sorry.|unknown identifier|unknown module prefix|unsolved goals|error:' affine-success-equivalence.log
      - name: Compile terminal-state exact relocation constructor
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p .lake/build/lib/lean
          lake env lean \
            -o .lake/build/lib/lean/GSTFourPowerAffineTerminalCollision.olean \
            GSTFourPowerAffineTerminalCollision.lean 2>&1 | tee affine-terminal-collision.log
          ! grep -E 'sorryAx|declaration uses .sorry.|unknown identifier|unknown module prefix|unsolved goals|error:' affine-terminal-collision.log
      - name: Reject forbidden proof routes
        shell: bash
        run: |
          set -euo pipefail
          ! grep -E '\bsorry\b|\badmit\b|\baxiom\b|sorryAx|False\.elim|GSTInfiniteFourPowerNavigation|gst_residual_omega_termination|gst_omega_termination_s1|gst_omega_termination_s3|gst_omega_termination_stable' GSTFourPowerDirectHappyBridge.lean GSTFourPowerExactRowRelocation.lean GSTFourPowerPrefixLeTwoRelocation.lean GSTFourPowerAffineIteratedRelocation.lean GSTFourPowerAffineSuccessEquivalence.lean GSTFourPowerAffineTerminalCollision.lean
      - name: Axiom audit direct relocation constructor
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat > GSTFourPowerDirectHappyBridgeAudit.lean <<'LEAN'
          import GSTFourPowerDirectHappyBridge
          import GSTFourPowerExactRowRelocation
          import GSTFourPowerPrefixLeTwoRelocation
          import GSTFourPowerAffineIteratedRelocation
          import GSTFourPowerAffineSuccessEquivalence
          import GSTFourPowerAffineTerminalCollision
          #print axioms GSTFourPowerDirectHappyBridge.affine_two_trit_sector_forces_relocated_physical_happy
          #print axioms GSTFourPowerDirectHappyBridge.four_power_happy_propagates
          #print axioms GSTFourPowerExactRowRelocation.prefix_killing_trit_constructs_exact_relocated_row
          #print axioms GSTFourPowerPrefixLeTwoRelocation.prefix_le_two_two_trit_constructs_exact_relocated_row
          #print axioms GSTFourPowerAffineIteratedRelocation.iterated_affine_low_success_constructs_commonTwo
          #print axioms GSTFourPowerAffineIteratedRelocation.directExistence_of_iterated_affine_low_success
          #print axioms GSTFourPowerAffineIteratedRelocation.iterated_affine_low_success_constructs_relocated_physical_happy
          #print axioms GSTFourPowerAffineSuccessEquivalence.exact_row_pair_forces_iterated_lowSuccess
          #print axioms GSTFourPowerAffineSuccessEquivalence.pairCommonTwo_iff_exists_iterated_lowSuccess
          #print axioms GSTFourPowerAffineSuccessEquivalence.commonTwo_iff_exists_iterated_affine_low_success
          #print axioms GSTFourPowerAffineSuccessEquivalence.directExistence_iff_iterated_affine_low_success
          #print axioms GSTFourPowerAffineSuccessEquivalence.commonTwo_constructs_channel_exact_relocated_row
          #print axioms GSTFourPowerAffineTerminalCollision.lowSuccess_of_state_zero_digit_two
          #print axioms GSTFourPowerAffineTerminalCollision.lowSuccess_of_state_three_digit_two
          #print axioms GSTFourPowerAffineTerminalCollision.terminal_collision_constructs_commonTwo
          #print axioms GSTFourPowerAffineTerminalCollision.terminal_collision_constructs_exact_relocated_row
          #print axioms GSTFourPowerAffineTerminalCollision.noCommonTwo_forces_terminal_collision_avoidance
          LEAN
          lake env lean GSTFourPowerDirectHappyBridgeAudit.lean 2>&1 | tee direct-happy-bridge-axioms.log
          ! grep -E 'sorryAx|declaration uses .sorry.|unknown constant|unknown module prefix|error:' direct-happy-bridge-axioms.log
