name: GPT56 Direct Happy Bridge

on:
  push:
    branches:
      - sol/gpt56-canonical-tail-escape-20260827
    paths:
      - 'GSTFourPowerDirectHappyBridge.lean'
      - 'GSTFourPowerDirectExistence.lean'
      - 'GSTFourPowerAffineTwoTritClassifier.lean'
      - '.github/workflows/gpt56-direct-happy-bridge.yml'
  workflow_dispatch:

jobs:
  certify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install exact Lean RC2 and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          rm -f lake-manifest.json
          lake update
          lake exe cache get
      - name: Compile fresh direct Happy bridge
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean GSTFourPowerDirectHappyBridge.lean 2>&1 | tee direct-happy-bridge.log
          ! grep -E 'sorryAx|declaration uses .sorry.|unknown identifier|unknown module prefix|unsolved goals|error:' direct-happy-bridge.log
      - name: Reject forbidden proof routes
        shell: bash
        run: |
          set -euo pipefail
          ! grep -E '\bsorry\b|\badmit\b|\baxiom\b|sorryAx|False\.elim|GSTInfiniteFourPowerNavigation|gst_residual_omega_termination|gst_omega_termination_s1|gst_omega_termination_s3|gst_omega_termination_stable' GSTFourPowerDirectHappyBridge.lean
      - name: Axiom audit direct relocation constructor
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat > GSTFourPowerDirectHappyBridgeAudit.lean <<'LEAN'
          import GSTFourPowerDirectHappyBridge
          #print axioms GSTFourPowerDirectHappyBridge.affine_two_trit_sector_forces_relocated_physical_happy
          #print axioms GSTFourPowerDirectHappyBridge.four_power_happy_propagates
          LEAN
          lake env lean GSTFourPowerDirectHappyBridgeAudit.lean 2>&1 | tee direct-happy-bridge-axioms.log
          ! grep -E 'sorryAx|declaration uses .sorry.|unknown constant|error:' direct-happy-bridge-axioms.log
