name: GPT6 Mathbox Exact Physical Binary Origin Lean Kernel
on:
  push:
    branches: [gpt6/problem406-mathbox-crossradix-origin-20261030]
    paths:
      - GSTProblem406MathboxExactOrigin.lean
      - lakefile.toml
      - .github/workflows/gpt6_mathbox_exact_origin.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install locked Lean4 and GST mathematical dependencies
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake update
          lake exe cache get
          lake build GSTProblem406PhysicalCutGateEquivalence GSTProblem406BinaryOriginSmallCases
      - name: Kernel check exact origin and all hypotheses
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean GSTProblem406MathboxExactOrigin.lean 2>&1 | tee mathbox-origin.log
          ! grep -E 'error:|sorryAx|unknown identifier|unsolved goals|declaration uses .sorry.' mathbox-origin.log
          grep -F 'exact_binary_origin_eq_four_pow' mathbox-origin.log
          grep -F 'commonTwo_iff_exact_binary_origin_hit' mathbox-origin.log
          echo MATHBOX_EXACT_ORIGIN_LEAN_KERNEL_PASS=1
