name: GPT56 Canonical Terminal Extinction Kernel

on:
  push:
    branches:
      - sol/gpt56-canonical-tail-escape-20260827
    paths:
      - '.github/workflows/gpt56-canonical-terminal-extinction-kernel.yml'
      - 'GSTGraphV2CanonicalTerminalExtinctionProbe.lean'
      - 'GSTU2DCanonicalShiftedTerminalProbe.lean'
      - 'GSTGraphV2CanonicalSignedPrefixBridge.lean'
      - 'GSTGraphV2HandwrittenAnchoredCocycle.lean'
      - 'GSTU2DPureDivergence83.lean'
  workflow_dispatch:

concurrency:
  group: gpt56-canonical-terminal-extinction-${{ github.ref }}
  cancel-in-progress: false

jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Pin source
        run: echo "SOURCE_HEAD=$(git rev-parse HEAD)"
      - name: Install exact Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh |
            sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          rm -f lake-manifest.json
          lake update
          lake exe cache get
      - name: Materialize clean local closure
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess

          roots = [
              Path("GSTGraphV2CanonicalTerminalExtinctionProbe.lean"),
              Path("GSTU2DCanonicalShiftedTerminalProbe.lean"),
              Path("GSTGraphV2CanonicalSignedPrefixBridge.lean"),
          ]
          build = Path(".lake/build/lib/lean")
          import_re = re.compile(r"^\s*import\s+(.+?)\s*$")

          def local_path(module):
              return Path(*module.split(".")).with_suffix(".lean")

          def imports_of(path):
              out = []
              for raw in path.read_text(encoding="utf-8").splitlines():
                  code = raw.split("--", 1)[0].rstrip()
                  m = import_re.match(code)
                  if m:
                      out.extend(m.group(1).split())
              return out

          order, done, stack = [], set(), []
          def visit(module):
              if module in done:
                  return
              path = local_path(module)
              if not path.exists():
                  return
              if module in stack:
                  raise SystemExit("LOCAL_IMPORT_CYCLE=" + " -> ".join(stack + [module]))
              stack.append(module)
              for dep in imports_of(path):
                  visit(dep)
              stack.pop()
              done.add(module)
              order.append((module, path))

          for root in roots:
              for dep in imports_of(root):
                  visit(dep)

          build.mkdir(parents=True, exist_ok=True)
          for module, path in order:
              output = build.joinpath(*module.split(".")).with_suffix(".olean")
              output.parent.mkdir(parents=True, exist_ok=True)
              if output.exists():
                  continue
              print("COMPILE", module, flush=True)
              subprocess.run(["lake", "env", "lean", "-o", str(output), str(path)], check=True)
          PY
      - name: Compile terminal extinction probes
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          {
            lake env lean GSTGraphV2CanonicalTerminalExtinctionProbe.lean
            lake env lean GSTU2DCanonicalShiftedTerminalProbe.lean
            lake env lean GSTGraphV2CanonicalSignedPrefixBridge.lean
          } 2>&1 | tee canonical-terminal-extinction-kernel.log
      - name: Trust audit
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '(^|[^A-Za-z0-9_])(sorry|admit|native_decide|unsafe)([^A-Za-z0-9_]|$)|^[[:space:]]*axiom[[:space:]]' \
            GSTGraphV2CanonicalTerminalExtinctionProbe.lean \
            GSTU2DCanonicalShiftedTerminalProbe.lean \
            GSTGraphV2CanonicalSignedPrefixBridge.lean; then
            echo FORBIDDEN_TRUST_EXPANSION=1
            exit 1
          fi
          if [[ -f canonical-terminal-extinction-kernel.log ]] && \
             grep -Fq 'sorryAx' canonical-terminal-extinction-kernel.log; then
            echo FORBIDDEN_SORRYAX=1
            exit 1
          fi
          echo TERMINAL_EXTINCTION_TRUST_AUDIT_GREEN=1
