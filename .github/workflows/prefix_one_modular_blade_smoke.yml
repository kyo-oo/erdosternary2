name: Prefix One Modular Blade Smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Execute final direct-induction comparator gate
        timeout-minutes: 120
        shell: bash
        run: bash scripts/final_direct_induction_comparator.sh
