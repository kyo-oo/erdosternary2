name: Prefix One Modular Blade Smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compile handwritten GST V2 production bridge
        timeout-minutes: 120
        shell: bash
        run: bash scripts/run_handwritten_production_probe.sh
