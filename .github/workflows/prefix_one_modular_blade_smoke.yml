name: Prefix One Modular Blade Smoke

# execution-trigger: pre-Omega U bridge import verification
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Execute authoritative full V2 production gate
        timeout-minutes: 240
        shell: bash
        run: bash scripts/run_v2_full_gate.sh
