name: Run264 Atomic Finish

on:
  push:
    branches:
      - sol/run264-atomic-final-fix-20261019
      - gpt6/erdos-omega-termination-audit-20261029
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install exact run264 Lean
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" default leanprover/lean4:v4.33.0-rc2
      - name: Resolve exact workspace
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile GSTTactic
        run: lake build GSTTactic
      - name: Compile ErdosTernary2
        run: lake build ErdosTernary2
      - name: Run V5 comparator
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/comparator.sh | tee run264-comparator.log
          grep -q 'Your solution is okay!' run264-comparator.log
          grep -q 'COMPARATOR RESULT: PASS' run264-comparator.log
