name: GPT6 GST Canonical Perfect-Power Omega Terminal Boundary
on:
  push:
    branches:
      - gpt6/erdos-omega-terminal-normalform-20261029
    paths:
      - GSTOmegaCanonicalBoundaryIff.lean
      - .github/workflows/gpt6_omega_canonical_boundary_iff.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Lean and physical GST rectangle dependencies
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
          lake build ErdosTernary2 GSTFinalPrefixOneStep6Infinite GSTInfiniteGateTransport
          lake env lean -o .lake/build/lib/lean/GSTOmegaAbsorbingZero.olean GSTOmegaAbsorbingZero.lean 2>&1 | tee omegaabs.log
          lake env lean -o .lake/build/lib/lean/GSTOmegaTerminalNormalForm.olean GSTOmegaTerminalNormalForm.lean 2>&1 | tee omeganorm.log
          ! grep -E 'error:|sorryAx|unknown identifier|unsolved goals|declaration uses .sorry.' omegaabs.log omeganorm.log
      - name: Kernel check canonical perfect-power source Omega iff
        shell: bash
        run: |
          set -euo pipefail
          lake env lean GSTOmegaCanonicalBoundaryIff.lean 2>&1 | tee omega-canonical.log
          ! grep -E 'error:|sorryAx|unknown identifier|unsolved goals|declaration uses .sorry.' omega-canonical.log
          echo GST_CANONICAL_OMEGA_BOUNDARY_IFF_GREEN=1
