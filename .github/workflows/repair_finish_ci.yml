name: Finish One Error Direct Bypass

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euxo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.33.0-rc2
      - name: Resolve comparator dependencies
        timeout-minutes: 20
        shell: bash
        run: |
          set -euxo pipefail
          lake update
          lake exe cache get
          lake build GSTTactic
      - name: Build direct public theorem candidate
        timeout-minutes: 30
        shell: bash
        run: |
          set -euxo pipefail
          grep -q '^theorem h_creation_for_4pow' ErdosTernary2.lean
          grep -q '^theorem gst_duality ' ErdosTernary2.lean
          grep -q '^theorem gst_omega_termination_s1' ErdosTernary2.lean
          awk '/^theorem gst_omega_termination_s1/{exit} {print}' ErdosTernary2.lean > ErdosTernary2.direct
          cat >> ErdosTernary2.direct <<'EOF'

          /- Direct comparator replacement.  The universal step uses only the
             pre-Omega creation constructor and the exact GST duality theorem. -/
          theorem erdos_ternary_2_even_universal
              (a : Nat) (ha : 5 ≤ a) : hasTernaryTwo (4^a) = true := by
            induction a using Nat.strongRecOn with
            | ind a ih =>
                by_cases hbase : a ≤ 500
                · exact modular_check_base a ha hbase
                · have ha1 : 5 ≤ a - 1 := by omega
                  have hlt : a - 1 < a := by omega
                  have hprev : hasTernaryTwo (4^(a-1)) = true :=
                    ih (a-1) hlt ha1
                  have hRmod : (4^(a-1)) % 3 = 1 := by
                    rw [Nat.pow_mod, show (4:Nat) % 3 = 1 from by decide,
                      Nat.one_pow]
                  have hcreation := h_creation_for_4pow
                    (a-1) ha1 (by omega : a - 1 ≠ 7)
                  have hstep : hasTernaryTwo (4 * 4^(a-1)) = true :=
                    gst_duality (4^(a-1)) hRmod hprev hcreation
                  have hpow : 4 * 4^(a-1) = 4^a := by
                    have hae : a = (a-1)+1 := by omega
                    calc
                      4 * 4^(a-1) = 4^(a-1) * 4 := by ac_rfl
                      _ = 4^((a-1)+1) := (Nat.pow_succ 4 (a-1)).symm
                      _ = 4^a := by rw [← hae]
                  simpa [hpow] using hstep

          theorem erdos_ternary_2_universal (n : Nat) (hn : 9 ≤ n) :
              noTernaryTwo (2^n) = false := by
            by_cases hodd : n % 2 = 1
            · exact erdos_ternary_2_odd_universal n hn hodd
            · have heven : n % 2 = 0 := by omega
              have h4eq : 2^n = 4^(n/2) := by
                have hn_eq : n = 2 * (n/2) := by omega
                rw [show (4 : Nat) = 2^2 from by decide, ← Nat.pow_mul, ← hn_eq]
              rw [h4eq]
              have ha : 5 ≤ n/2 := by omega
              exact has_two_imp_not_no_two (4^(n/2))
                (erdos_ternary_2_even_universal (n/2) ha)

          #print axioms erdos_ternary_2_even_universal
          #print axioms erdos_ternary_2_universal
          EOF
          mv ErdosTernary2.direct ErdosTernary2.lean
          lake env lean ErdosTernary2.lean | tee direct-public.log
          ! grep -E 'sorryAx|declaration uses .*[Ss]orry' direct-public.log
      - name: Run real comparator
        timeout-minutes: 45
        shell: bash
        run: |
          set -euxo pipefail
          bash scripts/comparator.sh | tee comparator-direct.log
          grep -q 'Your solution is okay!' comparator-direct.log
          grep -q 'COMPARATOR RESULT: PASS' comparator-direct.log
      - name: Commit kernel-green replacement
        if: github.event_name == 'push' && github.ref == 'refs/heads/sol/gpt56-close-one-error'
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ErdosTernary2.lean
          git diff --cached --quiet && exit 0
          git commit -m 'Replace legacy Omega corridor with direct GST induction'
          git push origin HEAD:sol/gpt56-close-one-error
