name: Finish One Error (Manual Archive Check)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Explain archived workflow
        shell: bash
        run: |
          set -euxo pipefail
          echo 'Automatic legacy-Omega truncation is disabled.'
          echo 'The active comparator-facing two-wave theorem lives after the old residual Omega block.'
          echo 'Use Lean Comparator Surgery CI for the surgical no-legacy-Omega smoke test.'
