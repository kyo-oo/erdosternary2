name: GPT6 Problem406 Exact HGate Discharge Probe
on:
  push:
    branches: [gpt6/problem406-hgate-discharge-20261029]
    paths: [GSTProblem406HGateExactProbe.lean, .github/workflows/gpt6_problem406_hgate_discharge.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Lean
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
          lake build ErdosTernary2 GSTFourPowerDirectExistenceProviderPipeline
      - name: Exact type of conditional gate
        shell: bash
        run: |
          set -euo pipefail
          lake env lean GSTProblem406HGateExactProbe.lean 2>&1 | tee exact-hgate.log
          ! grep -E 'error:|sorryAx|unknown identifier|unsolved goals' exact-hgate.log
