name: GPT56 Direct Row123 Verify

on:
  push:
    branches:
      - sol/gpt56-four-power-relocation-prod-20260903
    paths:
      - GSTFourPowerDirectOneHundredTwentyThirdRow.lean
      - .github/workflows/gpt56-direct-row123.yml
  workflow_dispatch:

jobs:
  direct-row123-kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
      - name: Compile exact fresh-production dependency closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean
          modules=(
            GSTCanonicalTailStateIso
            GSTFourPowerDirectResidue
            GSTFourPowerDirectResidue27
            GSTFourPowerDirectResidue81
            GSTFourPowerExponentTritObstruction
            GSTFourPowerExactExponentPeriod
            GSTFourPowerDirectExistence
            GSTFourPowerDirectAdditionCarry
            GSTFourPowerDirectHappyBridge
            GSTFourPowerAffineOrbit
            GSTFourPowerAffinePrefixIsometry
          )
          for module in "${modules[@]}"; do
            lake env lean -o ".lake/build/lib/lean/${module}.olean" "${module}.lean" 2>&1 | tee "${module}.log"
            ! grep -E 'declaration uses .sorry.|sorryAx|unknown identifier|unknown module prefix|unsolved goals|error:' "${module}.log"
          done
      - name: Compile direct row123 physical constructor
        shell: bash
        run: |
          set -euo pipefail
          ulimit -s 65536
          lake env lean -o .lake/build/lib/lean/GSTFourPowerDirectOneHundredTwentyThirdRow.olean GSTFourPowerDirectOneHundredTwentyThirdRow.lean 2>&1 | tee direct-row123.log
          ! grep -E 'declaration uses .sorry.|sorryAx|unknown identifier|unknown module prefix|unsolved goals|error:' direct-row123.log
      - name: Reject forbidden proof escapes
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE '\b(sorry|admit|axiom)\b|sorryAx|False\.elim' GSTFourPowerDirectOneHundredTwentyThirdRow.lean
      - name: Axiom audit direct row123 theorem
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/Audit.lean <<'EOF'
          import GSTFourPowerDirectOneHundredTwentyThirdRow
          #print axioms GSTFourPowerDirectOneHundredTwentyThirdRow.commonTwo_of_mod48519278097689642681155855396759336072749841943521979872827_124
          #print axioms GSTFourPowerDirectOneHundredTwentyThirdRow.physical_happy_of_mod48519278097689642681155855396759336072749841943521979872827_124
          #print axioms GSTFourPowerDirectOneHundredTwentyThirdRow.four_power_happy_propagates_of_next_mod48519278097689642681155855396759336072749841943521979872827_124
          EOF
          lake env lean /tmp/Audit.lean 2>&1 | tee audit.log
          ! grep -E 'sorryAx' audit.log
      - name: Direct physical-row marker
        run: echo DIRECT_ROW123_RELOCATED_HAPPY_KERNEL_GREEN
