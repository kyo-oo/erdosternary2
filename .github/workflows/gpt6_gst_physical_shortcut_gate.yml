name: GPT6 GST Original Physical Gate Short-Cut Equivalence Kernel
on:
  push:
    branches: [gpt6/problem406-binary-origin-valuation-20261030]
    paths:
      - GSTProblem406PhysicalCutGateEquivalence.lean
      - .github/workflows/gpt6_gst_physical_shortcut_gate.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Lean RC2 and exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake update
          lake exe cache get
          lake build GSTProblem406BinaryOriginExponentScale GSTFourPowerDirectExistence
      - name: Exact finite original CommonTwo equivalence kernel audit
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean GSTProblem406PhysicalCutGateEquivalence.lean 2>&1 | tee physical-shortcut.log
          ! grep -E 'error:|sorryAx|unknown identifier|unsolved goals|declaration uses .sorry.' physical-shortcut.log
          grep -F 'commonTwo_iff_sharp_physical_cut' physical-shortcut.log
          echo GST_ORIGINAL_GATE_PHYSICAL_CUT_KERNEL_PASS=1
