name: Sol56 Omega Universal Audit

on:
  push:
    branches:
      - sol/gpt56-omega-universal-audit-20260826
  workflow_dispatch:

jobs:
  omega-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Materialize exact #501 transform and isolated omega prefix
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_u2d_atomic_replacement.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ErdosTernary2.lean')
          s = p.read_text(encoding='utf-8')
          exact_drop = {
              'GSTPrefixOnePhaseIncidenceControl',
              'GSTPrefixOneSpacetimeIncidenceControl',
              'GSTGraphV2InfiniteControllerBridge',
          }
          out = []
          for line in s.splitlines(keepends=True):
              stripped = line.strip()
              if stripped.startswith('import '):
                  mods = stripped[len('import '):].split()
                  if len(mods) == 1:
                      mod = mods[0]
                      if mod in exact_drop or mod.endswith('Scratch'):
                          nl = '\n' if line.endswith('\n') else ''
                          out.append(f'-- OMEGA AUDIT NEUTRALIZED DUPLICATE IMPORT: {mod}{nl}')
                          continue
              out.append(line)
          s = ''.join(out)
          start = '/- QUARANTINED LEGACY RESIDUAL OMEGA START'
          end = 'QUARANTINED LEGACY RESIDUAL OMEGA END -/'
          if start not in s or end not in s:
              raise SystemExit('omega quarantine markers not found')
          s = s.replace(start, '-- OMEGA AUDIT ACTIVE START', 1)
          s = s.replace(end, '-- OMEGA AUDIT ACTIVE END', 1)
          marker = '-- OMEGA AUDIT ACTIVE END'
          cut = s.index(marker) + len(marker)
          prefix = s[:cut] + '''\n\n#print axioms gst_omega_termination_s1\n#print axioms gst_omega_termination_s3\n#print axioms gst_omega_termination_stable\n#print axioms gst_residual_omega_termination\n#print axioms gst_residual_navigation_lift\n'''
          Path('OmegaAuditPrefix.lean').write_text(prefix, encoding='utf-8')
          print(f'OMEGA_AUDIT_PREFIX_LINES={len(prefix.splitlines())}')
          print('OMEGA_AUDIT_QUARANTINE_REMOVED=1')
          PY

      - name: Materialize exact Lean RC2 package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          Path('lean-toolchain').write_text('leanprover/lean4:v4.33.0-rc2\n', encoding='utf-8')
          Path('lakefile.toml').write_text('''name = "erdos-ternary2-omega-audit"\nversion = "0.1.0"\n\n[[require]]\nname = "mathlib"\nscope = "leanprover-community"\nrev = "v4.33.0-rc2"\n\n[[lean_lib]]\nname = "GSTTactic"\n''', encoding='utf-8')
          Path('lake-manifest.json').unlink(missing_ok=True)
          PY

      - name: Install exact Lean RC2 and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get

      - name: Materialize exact local import closure
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          ROOT = Path('OmegaAuditPrefix.lean')
          BUILD = Path('.lake/build/lib/lean')
          import_re = re.compile(r'^\s*import\s+(.+?)\s*$')
          def local_path(module): return Path(*module.split('.')).with_suffix('.lean')
          def imports_of(path):
              result=[]
              for raw in path.read_text(encoding='utf-8').splitlines():
                  code=raw.split('--',1)[0].rstrip()
                  m=import_re.match(code)
                  if m: result.extend(m.group(1).split())
              return result
          order=[]; permanent=set(); temporary=[]
          def visit(module):
              if module in permanent: return
              path=local_path(module)
              if not path.exists(): return
              if module in temporary: raise SystemExit('LOCAL_IMPORT_CYCLE='+' -> '.join(temporary+[module]))
              temporary.append(module)
              for dep in imports_of(path): visit(dep)
              temporary.pop(); permanent.add(module); order.append((module,path))
          for module in imports_of(ROOT): visit(module)
          print(f'LOCAL_IMPORT_CLOSURE_COUNT={len(order)}')
          BUILD.mkdir(parents=True, exist_ok=True)
          for module,path in order:
              out=BUILD.joinpath(*module.split('.')).with_suffix('.olean')
              out.parent.mkdir(parents=True, exist_ok=True)
              if out.exists(): continue
              print(f'=== compiling local import {module} ===', flush=True)
              subprocess.run(['lake','env','lean','-o',str(out),str(path)], check=True)
          PY

      - name: Compile isolated residual omega chain and audit axioms
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean OmegaAuditPrefix.lean 2>&1 | tee omega-audit.log
          if grep -Fq 'sorryAx' omega-audit.log; then
            echo 'OMEGA_AUDIT_SORRYAX=1'
            exit 1
          fi
          echo 'OMEGA_AUDIT_COMPILE_GREEN=1'
          echo 'OMEGA_AUDIT_AXIOMS_GREEN=1'
