name: Infinite V2 Last Gate Adapter Smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pinned Lean
        shell: bash
        run: |
          set -euxo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.33.0-rc2

      - name: Resolve dependencies
        timeout-minutes: 20
        shell: bash
        run: |
          set -euxo pipefail
          lake update
          lake exe cache get
          lake build GSTTactic

      - name: Compile pre-Omega and independent trap stack
        timeout-minutes: 30
        shell: bash
        run: |
          set -euxo pipefail
          SNAP="$PWD/ker07-snapshot/branches/15_sol_new__physical-phase-crossing-surgery"
          export LEAN_PATH="$SNAP:${LEAN_PATH:-}"
          lake env lean -o "$SNAP/InformationDescentScratch.olean" "$SNAP/InformationDescentScratch.lean"
          lake env lean -o "$SNAP/InformationBadTraceScratch.olean" "$SNAP/InformationBadTraceScratch.lean"
          lake env lean -o "$SNAP/InformationStateScratch.olean" "$SNAP/InformationStateScratch.lean"
          lake env lean -o "$SNAP/OriginTransducerScratch.olean" "$SNAP/OriginTransducerScratch.lean"
          lake env lean -o "$SNAP/InformationRegenerationScratch.olean" "$SNAP/InformationRegenerationScratch.lean"
          lake env lean -o "$SNAP/InformationForcingScratch.olean" "$SNAP/InformationForcingScratch.lean"
          lake env lean -o "$SNAP/InformationIterationScratch.olean" "$SNAP/InformationIterationScratch.lean"
          lake env lean -o "$SNAP/FiniteSupportScratch.olean" "$SNAP/FiniteSupportScratch.lean"
          lake env lean -o "$SNAP/LastGateTrapScratch.olean" "$SNAP/LastGateTrapScratch.lean"
          lake env lean -o "$SNAP/CanonicalTrapScratch.olean" "$SNAP/CanonicalTrapScratch.lean"
          LEGACY_LINE=$(grep -n 'Legacy residual overproof' ErdosTernary2.lean | head -1 | cut -d: -f1)
          CUT=$((LEGACY_LINE - 2))
          head -n "$CUT" ErdosTernary2.lean > ErdosPreOmega.lean
          lake env lean -o ErdosPreOmega.olean ErdosPreOmega.lean

      - name: Kernel-check monolith-to-last-gate adapter
        timeout-minutes: 20
        shell: bash
        run: |
          set -euxo pipefail
          SNAP="$PWD/ker07-snapshot/branches/15_sol_new__physical-phase-crossing-surgery"
          cat > InfiniteV2LastGateAdapterSmoke.lean <<'EOF'
          import ErdosPreOmega
          import CanonicalTrapScratch

          theorem gpt56_seeded_affine_bad_to_seededS
              (D X : Nat) (hbad : GSTSeededAffineBadTrace D X) :
              GSTSeededBadTraceS D X := by
            intro j
            have hj := hbad j
            simpa [GSTSeededAffineBadTrace, GSTBadPair, GSTSeededBadTraceS,
              GSTBadPairS, gstAffineMulCarry, gstAffineMulCarryS,
              gstDigit, gstDigitS] using hj

          theorem gpt56_navigation_witness_to_seed_zero_happyS
              (T : Nat) (hnav : GSTNavigationWitness T) :
              ∃ j, GSTSeededHappyS 0 T j := by
            obtain ⟨j, hd, hspace⟩ := hnav
            have hcarry : gstCarry T j = 0 ∨ gstCarry T j = 3 := by
              by_cases hj0 : j = 0
              · subst j
                left
                simp [gstCarry]
              · have hj1 : 1 ≤ j := by omega
                have hmod : gstCarry T j % 3 = 0 :=
                  gstGoodSpace_carry_mod3_zero T j hspace
                have hlt : gstCarry T j < 4 := gstCarry_lt_four T j hj1
                omega
            refine ⟨j, ?_⟩
            constructor
            · simpa [gstDigitS, gstDigit] using hd
            · rcases hcarry with h0 | h3
              · left
                simpa [gstAffineMulCarryS, gstCarry] using h0
              · right
                simpa [gstAffineMulCarryS, gstCarry] using h3

          theorem gpt56_prefix_one_last_gate_trapS
              (s n : Nat) (hs : 1 ≤ s) (hn : 1 ≤ n)
              (hchild : GSTNavigationWitness (gstNavigationConstant (s+1) n))
              (hbad : GSTOmegaInfiniteBadTrace s 1 n) :
              let A := 4^(3^s)
              let z := c s / 3
              let T := gstNavigationConstant (s+1) n
              ∃ q,
                let D := gstAffineMulCarryS 4 1 (z + A*T) (q+1)
                let Z := gstAffineMulCarryS A z T (q+1)
                let W := gstAffineMulCarryS A (1 + 4*z) (4*T) (q+1)
                let C := gstAffineMulCarryS 4 0 T (q+1)
                let Y := T / 3^(q+1)
                GSTSeededBadTraceS D (Z + A*Y) ∧
                  GSTSeededBadTraceS C Y ∧
                  (C = 2 ∨ C = 3) ∧
                  D + 4*Z = W + A*C ∧
                  W < A := by
            dsimp only
            let A := 4^(3^s)
            let z := c s / 3
            let T := gstNavigationConstant (s+1) n
            let X := z + A*T
            have hseed : (4 * (c s % 3)) / 3 = 1 := by
              rw [c_mod3 s hs]
            have hraw := (gst_omega_infiniteBadTrace_iff_seededAffine s 1 n).1 hbad
            have hparentOld : GSTSeededAffineBadTrace 1 X := by
              simpa [X, T, A, z, hseed] using hraw
            have hparent : GSTSeededBadTraceS 1 X :=
              gpt56_seeded_affine_bad_to_seededS 1 X hparentOld
            have hchildS : ∃ j, GSTSeededHappyS 0 T j :=
              gpt56_navigation_witness_to_seed_zero_happyS T hchild
            have hApos : 0 < A := by
              dsimp [A]
              positivity
            have hcpos : 1 ≤ c s := by
              have hc3 := c_mod3 s hs
              omega
            have hD9 : 9 ≤ 3^(s+1) := by
              rw [show (9:Nat) = 3^2 by decide]
              exact Nat.pow_le_pow_of_le (by decide : 1 < 3) (by omega)
            have hoff := gst_gst_offsets_lt_multiplierS (3^(s+1)) (c s) hD9 hcpos
            have hAeq := lte_identity s hs
            have hz1 : 1 + 4*z < A := by
              dsimp [z, A]
              rw [hAeq]
              exact hoff.2
            have htrap := gst_canonical_two_boundary_trapS
              A z T hApos hz1 hparent hchildS
            simpa [X] using htrap

          #check gpt56_prefix_one_last_gate_trapS
          #print axioms gpt56_prefix_one_last_gate_trapS
          EOF
          LEAN_PATH="$SNAP:$PWD:${LEAN_PATH:-}" lake env lean InfiniteV2LastGateAdapterSmoke.lean | tee adapter.log
          ! grep -E 'sorryAx|declaration uses .*[Ss]orry' adapter.log
