name: SOL56 Persist Final Monolith Transplant

on:
  push:
    branches:
      - sol/sol56-final-residual-production-green-20260824
  workflow_dispatch:

concurrency:
  group: sol56-persist-final-monolith-transplant
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  persist-transplant:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sol/sol56-final-residual-production-green-20260824
          fetch-depth: 1

      - name: Apply transplant to live monolith
        shell: bash
        run: |
          python3 scripts/run_final_infinite_monolith_transplant.py
          grep -n 'BEGIN SOL56 FINAL INFINITE MONOLITH TRANSPLANT' ErdosTernary2.lean
          if grep -nE '^[[:space:]]*gst_end[[:space:]]*$' ErdosTernary2.lean; then
            echo 'gst_end survived transplant'
            exit 1
          fi

      - name: Persist edited ErdosTernary2.lean
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ErdosTernary2.lean
          if ! git diff --cached --quiet; then
            git commit -m "Persist full Graph V2 transplant into monolith [skip ci]"
            git push origin HEAD:sol/sol56-final-residual-production-green-20260824
          fi
