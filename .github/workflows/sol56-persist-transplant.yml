name: SOL56 Persist Final Monolith Transplant

on:
  push:
    branches:
      - sol/sol56-final-residual-production-green-20260824
  workflow_dispatch:

permissions:
  contents: write

jobs:
  persist-transplant:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sol/sol56-final-residual-production-green-20260824
          fetch-depth: 1

      - name: Apply transplant to live monolith
        shell: bash
        run: |
          python3 scripts/run_final_infinite_monolith_transplant.py
          grep -n 'BEGIN SOL56 FINAL INFINITE MONOLITH TRANSPLANT' ErdosTernary2.lean
          if grep -nE '^[[:space:]]*gst_end[[:space:]]*$' ErdosTernary2.lean; then
            echo 'gst_end survived transplant'
            exit 1
          fi

      - name: Persist edited ErdosTernary2.lean
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ErdosTernary2.lean
          if ! git diff --cached --quiet; then
            git commit -m "Persist full Graph V2 transplant into monolith [skip ci]"
            git push origin HEAD:sol/sol56-final-residual-production-green-20260824
          fi

      - name: Install pinned Lean
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve Mathlib
        shell: bash
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          rm -f lake-manifest.json
          lake update
          lake exe cache get

      - name: Compile persisted transplant
        shell: bash
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build GSTTactic ErdosTernary2
