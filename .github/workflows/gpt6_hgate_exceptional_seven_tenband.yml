name: GPT6 Exceptional Seven TenBand Exact Kernel
on:
  push:
    branches: [gpt6/problem406-seventh-trit-worldtrace-20261029]
    paths:
      - GSTProblem406ExceptionalSevenTenBand.lean
      - .github/workflows/gpt6_hgate_exceptional_seven_tenband.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Prepare exact GST Lean dependencies
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
          lake build GSTFourPowerThirdWave GSTWorldtraceBlockLift GSTWorldtraceCoeffStability
      - name: Check ten-band physical gate and axiom dependencies
        shell: bash
        run: |
          set -euo pipefail
          lake env lean GSTProblem406ExceptionalSevenTower.lean 2>&1 | tee exceptional-seven-base.log
          lake env lean GSTProblem406ExceptionalSevenTenBand.lean 2>&1 | tee exceptional-seven-tenband.log
          ! grep -E 'error:|sorryAx|unknown identifier|unsolved goals|declaration uses .sorry.' exceptional-seven-tenband.log
          grep -F 'original_thirdWave_of_mod_tenBandHit' exceptional-seven-tenband.log
          grep -F 'noCommonTwo_implies_tenBandSurvivor' exceptional-seven-tenband.log
