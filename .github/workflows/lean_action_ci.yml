name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Materialize latest Sol scratch layer for isolated surgery probe
        shell: bash
        run: |
          set -euo pipefail
          SRC="ker07-snapshot/branches/16_sol_latest__5c579-final-bigN-right-chord-atomic"
          find "$SRC" -maxdepth 1 -type f -name '*.lean' ! -name 'ErdosTernary2.lean' -exec cp '{}' . \;
      - name: Normalize malformed chronology banner in workspace
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ErdosTernary2.lean')
          lines=p.read_text(encoding='utf-8').splitlines(True)
          assert len(lines) >= 25
          for i in range(25):
              if lines[i].startswith('/-'):
                  lines[i] = '--' + lines[i][2:]
          p.write_text(''.join(lines), encoding='utf-8')
          print('normalized chronology banner lines 1..25 only')
          PY
      - uses: leanprover/lean-action@v1
