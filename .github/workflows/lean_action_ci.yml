name: Lean Action CI
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install exact Lean RC2
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          rm -f lake-manifest.json
          lake update
          lake exe cache get
      - name: Fresh Task 3.3 row237 dependency closure and compile
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build GSTFourPowerDirectTwoHundredThirtySeventhRow 2>&1 | tee task33-build.log
          ! grep -E 'sorryAx|declaration uses .sorry.|unknown identifier|unknown module prefix|unsolved goals|error:' task33-build.log
      - name: Fresh Task 3.3 forbidden-route scan
        run: |
          set -euo pipefail
          ! grep -E '\bsorry\b|\badmit\b|\baxiom\b|sorryAx|False\.elim|GSTInfiniteFourPowerNavigation|GSTStep6Close|gst_prefix_one_navigation|ontological_escape' GSTFourPowerDirectTwoHundredThirtySeventhRow.lean
      - name: Fresh Task 3.3 kernel axiom audit
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat > Task33AxiomAudit.lean <<'LEAN'
          import GSTFourPowerDirectTwoHundredThirtySeventhRow
          open GSTFourPowerDirectTwoHundredThirtySeventhRow
          #print axioms commonTwo_of_mod119601704370316815093156475426420811655643446371374142778498243399164563914572619949897873671922747759658511969363_238
          #print axioms physical_happy_of_mod119601704370316815093156475426420811655643446371374142778498243399164563914572619949897873671922747759658511969363_238
          #print axioms four_power_happy_propagates_of_next_mod119601704370316815093156475426420811655643446371374142778498243399164563914572619949897873671922747759658511969363_238
          LEAN
          lake env lean Task33AxiomAudit.lean 2>&1 | tee task33-axiom-audit.log
          rm -f Task33AxiomAudit.lean
          ! grep -E 'sorryAx|declaration uses .sorry.|unknown identifier|unknown constant|error:' task33-axiom-audit.log
