name: Lean Action CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install exact Lean RC2
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          rm -f lake-manifest.json
          lake update
          lake exe cache get

      - name: Kernel-check direct affine classifier
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p .lake/build/lib/lean
          lake build GSTFourPowerDirectExistence GSTCanonicalTailStateIso
          for module in \
            GSTFourPowerAffineOrbit \
            GSTFourPowerAffineExponentPeel \
            GSTFourPowerAffineBadState \
            GSTFourPowerAffineChannelAutomaton \
            GSTFourPowerAffineClassifierBridge \
            GSTFourPowerAffinePeelClassifier
          do
            lake env lean -o ".lake/build/lib/lean/${module}.olean" "${module}.lean" 2>&1 | tee "${module}.log"
            ! grep -E 'declaration uses .sorry.|sorryAx|unknown identifier|unknown module prefix|unsolved goals|error:' "${module}.log"
          done
          echo DIRECT_AFFINE_CLASSIFIER_KERNEL_GREEN=1

      - name: Legacy production surgery disabled
        run: |
          set -euo pipefail
          echo 'LEAN_ACTION_CI_SURGERY_DISABLED=1'
          echo 'This workflow is verification-only and must never mutate lakefile.toml or ErdosTernary2.lean.'

      - name: Hard build
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build 2>&1 | tee hard-build.log
          ! grep -E 'sorryAx|declaration uses .sorry.|unknown identifier|unknown module prefix|unsolved goals|error:' hard-build.log

      - name: Fourth-dimension tailF module
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build GSTTailFFourthDimension 2>&1 | tee tailf-build.log
          ! grep -E 'sorryAx|declaration uses .sorry.|unknown identifier|unknown module prefix|unsolved goals|error:' tailf-build.log

      - name: Worldtrace hTailF replacement module
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build GSTTailFWorldtraceReplacement 2>&1 | tee tailf-worldtrace-build.log
          ! grep -E 'sorryAx|declaration uses .sorry.|unknown identifier|unknown module prefix|unsolved goals|error:' tailf-worldtrace-build.log

      - name: Problem 406 zero-input solution
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build GSTResidualOmegaRevival GSTTailFWorldtraceReplacement
          lake env lean questions/deepmind_problem_406/Solution.lean 2>&1 | tee problem406-solution.log
          ! grep -E 'sorryAx|declaration uses .sorry.|unknown identifier|unknown constant|unknown module prefix|unsolved goals|error:' problem406-solution.log
          ! grep -E 'hTail4|four_power_happy_climb|MahlerSharp|ResidualGhostCompression|WorldtraceMahlerTheory' \
            GSTTailFWorldtraceReplacement.lean Main.lean questions/deepmind_problem_406/Solution.lean
          echo PROBLEM406_ZERO_INPUT_SOLUTION_GREEN=1

      - name: One-lane separate proof module
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build GSTTailFOneLane 2>&1 | tee onelane-build.log
          ! grep -E 'sorryAx|declaration uses .sorry.|unknown identifier|unknown module prefix|unsolved goals|error:' onelane-build.log

      - name: Infinite-read separate proof module
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build GSTTailFInfiniteRead 2>&1 | tee infiniteread-build.log
          ! grep -E 'sorryAx|declaration uses .sorry.|unknown identifier|unknown module prefix|unsolved goals|error:' infiniteread-build.log

      - name: Climb-truth-value separate proof module
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build GSTClimbTruthValue 2>&1 | tee climbtruth-build.log
          ! grep -E 'sorryAx|declaration uses .sorry.|unknown identifier|unknown module prefix|unsolved goals|error:' climbtruth-build.log

      - name: The-act base module
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build GSTTheAct 2>&1 | tee theact-build.log
          ! grep -E 'sorryAx|declaration uses .sorry.|unknown identifier|unknown module prefix|unsolved goals|error:' theact-build.log

      - name: Climb-infinite-family separate proof module
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build GSTClimbInfiniteFamily 2>&1 | tee climbfamily-build.log
          ! grep -E 'sorryAx|declaration uses .sorry.|unknown identifier|unknown module prefix|unsolved goals|error:' climbfamily-build.log

      - name: Diagonal-read separate proof module
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build GSTDiagonalRead 2>&1 | tee diagonalread-build.log
          ! grep -E 'sorryAx|declaration uses .sorry.|unknown identifier|unknown module prefix|unsolved goals|error:' diagonalread-build.log

      - name: The-act construction separate proof module
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build GSTTheActConstruction 2>&1 | tee theactconstruction-build.log
          ! grep -E 'sorryAx|declaration uses .sorry.|unknown identifier|unknown module prefix|unsolved goals|error:' theactconstruction-build.log

      - name: Tower-fire separate proof module
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build GSTTowerFire 2>&1 | tee towerfire-build.log
          ! grep -E 'sorryAx|declaration uses .sorry.|unknown identifier|unknown module prefix|unsolved goals|error:' towerfire-build.log

      - name: Exact V5 comparator
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          bash scripts/comparator.sh 2>&1 | tee comparator.log
          grep -Fq 'Your solution is okay!' comparator.log
          grep -Fq '=== COMPARATOR RESULT: PASS ===' comparator.log

      - name: Kernel axiom audit
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat > MultiNukeAxiomAudit.lean <<'LEAN'
          import Main
          import GSTResidualOmegaRevival
          import GSTTailFWorldtraceReplacement
          #print axioms GSTResidualOmegaRevival.omega_termination
          #print axioms GSTResidualOmegaRevival.residual_navigation_lift
          #print axioms GSTResidualOmegaRevival.even_universal
          #print axioms GSTResidualOmegaRevival.the_act
          #print axioms GSTResidualOmegaRevival.full_erdos
          #print axioms GSTTailFWorldtraceReplacement.hTailF
          #print axioms GSTTailFWorldtraceReplacement.crown
          #print axioms the_monolith_wire
          #print axioms the_worldtrace_mahler_wire
          LEAN
          lake env lean MultiNukeAxiomAudit.lean 2>&1 | tee axiom-audit.log
          rm -f MultiNukeAxiomAudit.lean
          ! grep -E 'sorryAx|declaration uses .sorry.|unknown identifier|unknown constant|error:' axiom-audit.log

      - name: Assert CI is non-mutating
        run: |
          set -euo pipefail
          if ! git diff --quiet -- ErdosTernary2.lean lakefile.toml; then
            echo 'ERROR: CI attempted to mutate production files.'
            git diff -- ErdosTernary2.lean lakefile.toml
            exit 1
          fi
          echo CI_NON_MUTATING_CONFIRMED=1
