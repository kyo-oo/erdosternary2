name: Lean Action CI
on:
  push:
    branches: ['**']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply surgery
        run: python3 .surgery/apply.py
      - name: Setup Lean
        uses: leanprover/lean-action@v1
        continue-on-error: true
        with:
          build: false
      - name: Build
        run: |
          set +e
          lake update 2>&1 | tail -5
          lake exe cache get 2>&1 | tail -5
          lake build ErdosTernary2 2>&1 | tee lean-build.log
          lean_exit=${PIPESTATUS[0]}
          echo "LEAN_EXIT: ${lean_exit}"
          exit "${lean_exit}"
      - name: Comparator
        run: |
          set -o pipefail
          bash scripts/comparator.sh 2>&1 | tail -160
