name: Lean Comparator Surgery CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          set -euxo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.33.0-rc2
      - name: Resolve exact comparator dependencies
        timeout-minutes: 20
        shell: bash
        run: |
          set -euxo pipefail
          lake update
      - name: Fetch Mathlib compiled cache
        timeout-minutes: 20
        shell: bash
        run: |
          set -euxo pipefail
          lake exe cache get
      - name: Build GSTTactic import artifact
        timeout-minutes: 10
        shell: bash
        run: |
          set -euxo pipefail
          lake build GSTTactic
      - name: Prove direct finite-base plus mul4 induction bypass
        timeout-minutes: 30
        shell: bash
        run: |
          set -euxo pipefail
          awk '/^theorem gst_omega_termination_s1/{exit} {print}' ErdosTernary2.lean > DirectInductionSmoke.lean
          cat >> DirectInductionSmoke.lean <<'EOF'

          theorem gpt56_direct_even_universal :
              ∀ a : Nat, 5 ≤ a → hasTernaryTwo (4^a) = true
            | 0, ha => by omega
            | a+1, ha => by
                by_cases hbase : a + 1 ≤ 500
                · exact modular_check_base (a+1) ha hbase
                · have haPrev : 5 ≤ a := by omega
                  have hprev : hasTernaryTwo (4^a) = true :=
                    gpt56_direct_even_universal a haPrev
                  have hlift := mul4_lift_gst_duality (a+1) (by omega) hprev
                  simpa using hlift

          theorem gpt56_direct_universal (n : Nat) (hn : 9 ≤ n) :
              noTernaryTwo (2^n) = false := by
            by_cases hodd : n % 2 = 1
            · exact erdos_ternary_2_odd_universal n hn hodd
            · have heven : n % 2 = 0 := by omega
              have h4eq : 2^n = 4^(n/2) := by
                have hn_eq : n = 2 * (n/2) := by omega
                rw [show (4 : Nat) = 2^2 from by decide, ← Nat.pow_mul, ← hn_eq]
              rw [h4eq]
              have ha : 5 ≤ n/2 := by omega
              exact has_two_imp_not_no_two (4^(n/2))
                (gpt56_direct_even_universal (n/2) ha)

          #check gpt56_direct_even_universal
          #check gpt56_direct_universal
          #print axioms gpt56_direct_even_universal
          #print axioms gpt56_direct_universal
          EOF
          lake env lean DirectInductionSmoke.lean | tee direct-induction.log
          ! grep -E 'sorryAx|declaration uses .*[Ss]orry' direct-induction.log
      - name: Build infinite GST V2 control artifact
        timeout-minutes: 20
        shell: bash
        run: |
          set -euxo pipefail
          SNAP="$PWD/ker07-snapshot/branches/15_sol_new__physical-phase-crossing-surgery"
          LEAN_PATH="$SNAP:${LEAN_PATH:-}" lake env lean -o "$SNAP/GSTGraphV2InfiniteControlScratch.olean" "$SNAP/GSTGraphV2InfiniteControlScratch.lean"
      - name: Typecheck infinite natural-support contradiction blade
        timeout-minutes: 20
        shell: bash
        run: |
          set -euxo pipefail
          SNAP="$PWD/ker07-snapshot/branches/15_sol_new__physical-phase-crossing-surgery"
          LEAN_PATH="$SNAP:${LEAN_PATH:-}" lake env lean "$SNAP/GSTGraphV2InfiniteNaturalContradictionScratch.lean"
      - name: Typecheck exact BIG-N Navigation horizon
        timeout-minutes: 20
        shell: bash
        run: |
          set -euxo pipefail
          SNAP="$PWD/ker07-snapshot/branches/15_sol_new__physical-phase-crossing-surgery"
          LEAN_PATH="$SNAP:${LEAN_PATH:-}" lake env lean "$SNAP/GSTGraphV2InfiniteNavigationHorizonScratch.lean"
      - name: Typecheck nested infinite world tower
        timeout-minutes: 20
        shell: bash
        run: |
          set -euxo pipefail
          SNAP="$PWD/ker07-snapshot/branches/15_sol_new__physical-phase-crossing-surgery"
          LEAN_PATH="$SNAP:${LEAN_PATH:-}" lake env lean "$SNAP/GSTGraphV2InfiniteWorldTowerScratch.lean"
      - name: Compile final theorem without redundant legacy Omega block
        timeout-minutes: 30
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('ErdosTernary2.lean')
          lines = src.read_text(encoding='utf-8').splitlines(keepends=True)
          start = next(i for i, line in enumerate(lines) if '/-- First-level residual Ω∞ termination.' in line)
          numeric = next(i for i, line in enumerate(lines) if '/-- Numerical ceiling used to bound every power-of-four graph witness.' in line)
          resume = numeric
          while resume > 0 and lines[resume - 1].strip() == '': resume -= 1
          assert resume > 0 and lines[resume - 1].strip() == '/-'
          resume -= 1
          Path('ErdosTernary2_NoLegacyOmegaSmoke.lean').write_text(''.join(lines[:start] + lines[resume:]), encoding='utf-8')
          PY
          lake env lean ErdosTernary2_NoLegacyOmegaSmoke.lean 2>&1 | tee no-legacy-omega-smoke.log
      - name: Typecheck proof monolith without serialization
        timeout-minutes: 30
        shell: bash
        run: |
          set -euxo pipefail
          lake env lean ErdosTernary2.lean
