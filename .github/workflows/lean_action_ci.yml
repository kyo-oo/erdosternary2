name: Lean Comparator Surgery CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          set -euxo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.33.0-rc2
      - name: Resolve exact comparator dependencies
        timeout-minutes: 20
        run: lake update
      - name: Fetch Mathlib compiled cache
        timeout-minutes: 20
        run: lake exe cache get
      - name: Build GSTTactic import artifact
        timeout-minutes: 10
        run: lake build GSTTactic

      - name: Typecheck active proof monolith
        timeout-minutes: 45
        run: |
          set -o pipefail
          lake env lean ErdosTernary2.lean 2>&1 | tee surgery-lean.log
          ! grep -E 'error:|declaration uses .*[Ss]orry|sorryAx' surgery-lean.log

      - name: Zero-sorry verification gate
        timeout-minutes: 5
        run: bash scripts/sorry_check.sh

      - name: Run real V5 comparator
        timeout-minutes: 45
        run: |
          set -o pipefail
          bash scripts/comparator.sh | tee comparator.log
          grep -q 'Your solution is okay!' comparator.log
          grep -q 'COMPARATOR RESULT: PASS' comparator.log
