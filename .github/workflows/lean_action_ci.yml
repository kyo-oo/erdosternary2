name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Materialize canonical sources in diagnostic checkout
        shell: python
        run: |
          from pathlib import Path

          main = Path('ErdosTernary2.lean')
          text = main.read_text(encoding='utf-8')
          marker = 'import GSTTactic'
          k = text.index(marker)
          main.write_text(text[k:], encoding='utf-8')

          archived = Path('modules/0030_GSTTactic.lean').read_text(encoding='utf-8')
          marker2 = 'import Lean.Elab.Tactic'
          j = archived.index(marker2)
          Path('GSTTactic.lean').write_text(archived[j:], encoding='utf-8')

          print('DIAGNOSTIC_MAIN_HEADER_STRIPPED')
          print('DIAGNOSTIC_GSTTACTIC_MATERIALIZED')
      - uses: leanprover/lean-action@v1
