name: Lean Action CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply exact source surgery
        shell: bash
        run: python3 .surgery/apply.py

      - name: Setup Lean
        uses: leanprover/lean-action@v1
        continue-on-error: true
        with:
          build: false

      - name: Resolve dependencies and compile
        if: always()
        shell: bash
        run: |
          mkdir -p .surgery
          set +e
          lake update > .surgery/update.txt 2>&1
          update_code=$?
          if [ "$update_code" -eq 0 ]; then
            lake exe cache get >> .surgery/update.txt 2>&1
            lake build ErdosTernary2 > .surgery/build.txt 2>&1
            code=$?
          else
            cp .surgery/update.txt .surgery/build.txt
            code=$update_code
          fi
          echo "$code" > .surgery/build.exit
          cat .surgery/build.txt
          exit 0

      - name: Run sorry check
        if: always()
        shell: bash
        run: |
          bash scripts/sorry_check.sh || true

      - name: Run comparator
        if: always()
        shell: bash
        run: |
          bash scripts/comparator.sh || true
