name: Lean Comparator Surgery CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          set -euxo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.33.0-rc2
      - name: Resolve exact comparator dependencies
        timeout-minutes: 20
        shell: bash
        run: |
          set -euxo pipefail
          lake update
      - name: Fetch Mathlib compiled cache
        timeout-minutes: 20
        shell: bash
        run: |
          set -euxo pipefail
          lake exe cache get
      - name: Build GSTTactic import artifact
        timeout-minutes: 10
        shell: bash
        run: |
          set -euxo pipefail
          lake build GSTTactic
      - name: Build infinite GST V2 control artifact
        timeout-minutes: 20
        shell: bash
        run: |
          set -euxo pipefail
          SNAP="$PWD/ker07-snapshot/branches/15_sol_new__physical-phase-crossing-surgery"
          LEAN_PATH="$SNAP:${LEAN_PATH:-}" lake env lean \
            -o "$SNAP/GSTGraphV2InfiniteControlScratch.olean" \
            "$SNAP/GSTGraphV2InfiniteControlScratch.lean"
      - name: Typecheck infinite natural-support contradiction blade
        timeout-minutes: 20
        shell: bash
        run: |
          set -euxo pipefail
          SNAP="$PWD/ker07-snapshot/branches/15_sol_new__physical-phase-crossing-surgery"
          LEAN_PATH="$SNAP:${LEAN_PATH:-}" lake env lean "$SNAP/GSTGraphV2InfiniteNaturalContradictionScratch.lean"
      - name: Typecheck exact BIG-N Navigation horizon
        timeout-minutes: 20
        shell: bash
        run: |
          set -euxo pipefail
          SNAP="$PWD/ker07-snapshot/branches/15_sol_new__physical-phase-crossing-surgery"
          LEAN_PATH="$SNAP:${LEAN_PATH:-}" lake env lean "$SNAP/GSTGraphV2InfiniteNavigationHorizonScratch.lean"
      - name: Typecheck nested infinite world tower
        timeout-minutes: 20
        shell: bash
        run: |
          set -euxo pipefail
          SNAP="$PWD/ker07-snapshot/branches/15_sol_new__physical-phase-crossing-surgery"
          LEAN_PATH="$SNAP:${LEAN_PATH:-}" lake env lean "$SNAP/GSTGraphV2InfiniteWorldTowerScratch.lean"
      - name: Prove universal theorem exists before legacy Omega overproof
        timeout-minutes: 30
        shell: bash
        run: |
          set -euxo pipefail
          marker_line="$(grep -n -m1 'Legacy residual overproof' ErdosTernary2.lean | cut -d: -f1)"
          test -n "$marker_line"
          cut_line=$((marker_line - 2))
          test "$cut_line" -gt 0
          head -n "$cut_line" ErdosTernary2.lean > ErdosTernary2_PreOmegaSmoke.lean
          cat >> ErdosTernary2_PreOmegaSmoke.lean <<'EOF'
          #check erdos_ternary_2_even_universal
          #check erdos_ternary_2_universal
          #print axioms erdos_ternary_2_even_universal
          #print axioms erdos_ternary_2_universal
          EOF
          lake env lean ErdosTernary2_PreOmegaSmoke.lean 2>&1 | tee preomega-smoke.log
          grep -F 'erdos_ternary_2_even_universal' preomega-smoke.log
          grep -F 'erdos_ternary_2_universal' preomega-smoke.log
      - name: Typecheck exact all-cardinality world projection
        timeout-minutes: 20
        shell: bash
        run: |
          set -euxo pipefail
          SNAP="$PWD/ker07-snapshot/branches/15_sol_new__physical-phase-crossing-surgery"
          LEAN_PATH="$SNAP:${LEAN_PATH:-}" lake env lean "$SNAP/GSTGraphV2InfiniteExactWorldProjectionScratch.lean"
      - name: Typecheck direct infinite six-world collision
        timeout-minutes: 20
        shell: bash
        run: |
          set -euxo pipefail
          SNAP="$PWD/ker07-snapshot/branches/15_sol_new__physical-phase-crossing-surgery"
          LEAN_PATH="$SNAP:${LEAN_PATH:-}" lake env lean "$SNAP/GSTGraphV2InfiniteSixWorldCollisionScratch.lean"
      - name: Typecheck infinite cardinal-world master
        timeout-minutes: 20
        shell: bash
        run: |
          set -euxo pipefail
          SNAP="$PWD/ker07-snapshot/branches/15_sol_new__physical-phase-crossing-surgery"
          LEAN_PATH="$SNAP:${LEAN_PATH:-}" lake env lean "$SNAP/GSTGraphV2InfiniteCardinalMasterScratch.lean"
      - name: Typecheck infinite handwritten operator budget blade
        timeout-minutes: 20
        shell: bash
        run: |
          set -euxo pipefail
          SNAP="$PWD/ker07-snapshot/branches/15_sol_new__physical-phase-crossing-surgery"
          LEAN_PATH="$SNAP:${LEAN_PATH:-}" lake env lean "$SNAP/GSTGraphV2InfiniteHandwrittenOperatorScratch.lean"
      - name: Typecheck proof monolith without serialization
        timeout-minutes: 30
        shell: bash
        run: |
          set -euxo pipefail
          lake env lean ErdosTernary2.lean
