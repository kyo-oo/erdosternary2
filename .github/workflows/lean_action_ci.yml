name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Materialize canonical sources in diagnostic checkout
        shell: python
        run: |
          from pathlib import Path

          main = Path('ErdosTernary2.lean')
          text = main.read_text(encoding='utf-8')
          k = text.index('import GSTTactic')
          active = text[k:].replace('import GSTTactic\n', '', 1)

          archived = Path('modules/0030_GSTTactic.lean').read_text(encoding='utf-8')
          j = archived.index('import Lean.Elab.Tactic')
          tactic = archived[j:]

          main.write_text(tactic + '\n\n' + active, encoding='utf-8')
          print('DIAGNOSTIC_MAIN_HEADER_STRIPPED')
          print('DIAGNOSTIC_GSTTACTIC_INLINED')
      - uses: leanprover/lean-action@v1
