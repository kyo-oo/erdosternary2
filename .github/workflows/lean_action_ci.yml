name: Lean Action CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --no-modify-path --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          elan default leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Apply exact source surgery
        run: python3 .surgery/apply.py

      - name: Resolve dependencies and compile
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p .surgery
          set +e
          lake update > .surgery/update.txt 2>&1
          update_code=$?
          if [ "$update_code" -eq 0 ]; then
            lake exe cache get >> .surgery/update.txt 2>&1
            lake build ErdosTernary2 > .surgery/build.txt 2>&1
            code=$?
          else
            cp .surgery/update.txt .surgery/build.txt
            code=$update_code
          fi
          echo "$code" > .surgery/build.exit
          cat .surgery/build.txt
          exit 0

      - name: Run sorry check
        if: always()
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          bash scripts/sorry_check.sh || true

      - name: Run comparator
        if: always()
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          bash scripts/comparator.sh || true
