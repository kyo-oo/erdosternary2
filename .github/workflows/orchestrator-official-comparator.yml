name: Orchestrator Official Comparator

on:
  push:
    branches:
      - orchestrator-final-bridge
    paths:
      - ErdosTernary2.lean
      - GSTTactic.lean
      - lakefile.toml
      - questions/deepmind_problem_406/Challenge.lean
      - questions/deepmind_problem_406/Solution.lean
      - modules/0009_comparator_config.json
      - .github/workflows/orchestrator-official-comparator.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orchestrator-official-comparator-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  official-comparator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Verify checked-in green theorem route
        shell: bash
        run: |
          set -euo pipefail
          echo "ORCHESTRATOR_SOURCE_HEAD=$(git rev-parse HEAD)"
          python3 - <<'PY'
          from pathlib import Path
          s = Path('ErdosTernary2.lean').read_text(encoding='utf-8')
          required = [
              'theorem gst_navigation_witness_of_standalone_navigation',
              'theorem gst_four_power_creation_master_inline',
              'theorem gst_prefix_one_navigation_lift',
              'theorem gst_power_two_wave_large',
              'theorem erdos_ternary_2_universal',
          ]
          for marker in required:
              if marker not in s:
                  raise SystemExit(f'missing checked-in theorem marker: {marker}')
          if 'trace_state\n  contradiction' in s:
              raise SystemExit('old red residual seam is present in checked-in source')
          if '-- SOL56 LIVE GENERAL H_CREATION REACTIVATED' in s:
              raise SystemExit('forbidden quarantined h_creation reactivation is present')
          print(f'CHECKED_IN_MONOLITH_LINES={len(s.splitlines())}')
          print('CHECKED_IN_GREEN_ROUTE_VERIFIED=1')
          PY

      - name: Materialize clean judge modules and exact package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in ['Challenge.lean', 'Solution.lean']:
              src = Path('questions/deepmind_problem_406') / name
              text = src.read_text(encoding='utf-8')
              i = text.find('import ')
              if i < 0:
                  raise SystemExit(f'no import marker in {src}')
              Path(name).write_text(text[i:], encoding='utf-8')
          raw = Path('modules/0009_comparator_config.json').read_text(encoding='utf-8')
          j = raw.find('{')
          if j < 0:
              raise SystemExit('comparator config payload not found')
          Path('comparator_config.json').write_text(raw[j:], encoding='utf-8')
          Path('lean-toolchain').write_text('leanprover/lean4:v4.33.0-rc2\n', encoding='utf-8')
          Path('lakefile.toml').write_text('''name = "erdos-ternary2-proof"\nversion = "0.1.0"\ndefaultTargets = ["GSTTactic", "ErdosTernary2", "Challenge", "Solution"]\n\n[[require]]\nname = "mathlib"\nscope = "leanprover-community"\nrev = "v4.33.0-rc2"\n\n[[lean_lib]]\nname = "GSTTactic"\n\n[[lean_lib]]\nname = "ErdosTernary2"\n\n[[lean_lib]]\nname = "Challenge"\n\n[[lean_lib]]\nname = "Solution"\n''', encoding='utf-8')
          Path('lake-manifest.json').unlink(missing_ok=True)
          print('JUDGE_MODULES_AND_EXACT_PACKAGE_MATERIALIZED=1')
          PY

      - name: Install exact Lean RC2 and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get

      - name: Materialize exact checked-in local import closure
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          ROOT = Path('ErdosTernary2.lean')
          BUILD = Path('.lake/build/lib/lean')
          import_re = re.compile(r'^\s*import\s+(.+?)\s*$')

          def local_path(module: str) -> Path:
              return Path(*module.split('.')).with_suffix('.lean')

          def imports_of(path: Path):
              result = []
              for raw in path.read_text(encoding='utf-8').splitlines():
                  code = raw.split('--', 1)[0].rstrip()
                  m = import_re.match(code)
                  if m:
                      result.extend(m.group(1).split())
              return result

          order = []
          permanent = set()
          temporary = []

          def visit(module: str):
              if module == 'ErdosTernary2' or module in permanent:
                  return
              path = local_path(module)
              if not path.exists():
                  return
              if module in temporary:
                  raise SystemExit('LOCAL_IMPORT_CYCLE=' + ' -> '.join(temporary + [module]))
              temporary.append(module)
              for dep in imports_of(path):
                  visit(dep)
              temporary.pop()
              permanent.add(module)
              order.append((module, path))

          for module in imports_of(ROOT):
              visit(module)

          print(f'LOCAL_IMPORT_CLOSURE_COUNT={len(order)}')
          BUILD.mkdir(parents=True, exist_ok=True)
          for module, path in order:
              out = BUILD.joinpath(*module.split('.')).with_suffix('.olean')
              out.parent.mkdir(parents=True, exist_ok=True)
              if out.exists():
                  continue
              print(f'=== compiling local import {module} ===', flush=True)
              subprocess.run(['lake', 'env', 'lean', '-o', str(out), str(path)], check=True)
          print('LOCAL_IMPORT_CLOSURE_MATERIALIZED=1')
          PY

      - name: Compile checked-in monolith and judge modules
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build GSTTactic ErdosTernary2 Challenge Solution
          echo 'ORCHESTRATOR_MONOLITH_BUILD_GREEN=1'

      - name: Kernel axiom audit of submitted theorem chain
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat > FinalComparatorAudit.lean <<'EOF'
          import ErdosTernary2
          #print axioms gst_four_power_creation_master_inline
          #print axioms gst_prefix_one_navigation_lift
          #print axioms gst_power_two_wave_large
          #print axioms erdos_ternary_2_universal
          EOF
          lake env lean FinalComparatorAudit.lean | tee final-comparator-axioms.log
          if grep -Eq 'sorryAx|gst_four_power_direct_existence_inline|senge_straus_base3_power4' final-comparator-axioms.log; then
            echo 'forbidden proof escape/custom axiom reached submitted theorem chain'
            exit 1
          fi
          echo 'ORCHESTRATOR_AXIOM_AUDIT_GREEN=1'

      - name: Audit executable solution sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def strip_lean_comments(text: str) -> str:
              out = []
              i = 0
              depth = 0
              while i < len(text):
                  if depth:
                      if text.startswith('/-', i):
                          depth += 1
                          out.extend('  ')
                          i += 2
                      elif text.startswith('-/', i):
                          depth -= 1
                          out.extend('  ')
                          i += 2
                      else:
                          out.append('\n' if text[i] == '\n' else ' ')
                          i += 1
                  else:
                      if text.startswith('--', i):
                          while i < len(text) and text[i] != '\n':
                              out.append(' ')
                              i += 1
                      elif text.startswith('/-', i):
                          depth = 1
                          out.extend('  ')
                          i += 2
                      else:
                          out.append(text[i])
                          i += 1
              if depth:
                  raise SystemExit('unterminated Lean block comment')
              return ''.join(out)

          bad = []
          forbidden = re.compile(r'\b(sorry|admit|axiom|native_decide)\b')
          for name in ['GSTTactic.lean', 'ErdosTernary2.lean', 'Solution.lean']:
              text = Path(name).read_text(encoding='utf-8')
              code = strip_lean_comments(text)
              for m in forbidden.finditer(code):
                  line_no = code.count('\n', 0, m.start()) + 1
                  source_line = text.splitlines()[line_no - 1]
                  bad.append(f'{name}:{line_no}:{source_line}')
          if bad:
              print('\n'.join(bad))
              raise SystemExit('executable solution contains forbidden proof escape')
          print('executable solution audit: clean')
          PY

      - name: Build pinned lean4export
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p .tools
          git clone https://github.com/leanprover/lean4export.git .tools/lean4export
          cd .tools/lean4export
          git checkout 9fb131bb100eb32ccf6836f14e4f8328d13b6792
          cp ../../lean-toolchain lean-toolchain
          lake update
          lake build lean4export

      - name: Build pinned official comparator
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          git clone https://github.com/leanprover/comparator.git .tools/comparator
          cd .tools/comparator
          git checkout 75c730e9b6ef5c2c3b334fad7c3d51fe20624c88
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lakefile.toml')
          s = p.read_text(encoding='utf-8')
          s = s.replace('rev = "master"', 'rev = "9fb131bb100eb32ccf6836f14e4f8328d13b6792"')
          p.write_text(s, encoding='utf-8')
          PY
          cp ../../lean-toolchain lean-toolchain
          lake update
          lake build comparator

      - name: Run official comparator against checked-in monolith
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          ROOT="$PWD"
          CMP_ROOT="$ROOT/.tools/comparator"
          EXPORT_ROOT="$ROOT/.tools/lean4export"
          COMPARATOR_LANDRUN="$CMP_ROOT/scripts/fake-landrun.sh" \
          COMPARATOR_LEAN4EXPORT="$EXPORT_ROOT/.lake/build/bin/lean4export" \
          lake env "$CMP_ROOT/.lake/build/bin/comparator" comparator_config.json | tee orchestrator-official-comparator.log
          grep -F "Your solution is okay!" orchestrator-official-comparator.log
          echo 'ORCHESTRATOR_OFFICIAL_LITERAL_COMPARATOR_GREEN=1'
