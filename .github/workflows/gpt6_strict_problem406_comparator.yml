name: GPT6 STRICT Problem406 Unconditional Proof
on:
  push:
    branches:
      - gpt6/erdos-normalized-core-rigidity-20261029
    paths:
      - questions/deepmind_problem_406/Solution.lean
      - ErdosTernary2.lean
      - scripts/gpt6_strict_problem406_comparator.sh
      - .github/workflows/gpt6_strict_problem406_comparator.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-challenge-type-and-axioms:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Real unconditional theorem check and kernel axiom audit
        shell: bash
        run: bash scripts/gpt6_strict_problem406_comparator.sh
