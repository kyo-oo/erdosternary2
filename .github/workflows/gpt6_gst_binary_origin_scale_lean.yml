name: GPT6 GST Physical Binary Origin Scale Lean Kernel
on:
  push:
    branches: [gpt6/problem406-binary-origin-valuation-20261030]
    paths:
      - GSTProblem406BinaryOriginExponentScale.lean
      - .github/workflows/gpt6_gst_binary_origin_scale_lean.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install exact Lean RC2, Mathlib and physical digit dependency
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake update
          lake exe cache get
          lake build GSTFourPowerDirectResidue
      - name: Strict all-K binary origin scale theorem kernel audit
        shell: bash
        run: |
          set -euo pipefail
          lake env lean GSTProblem406BinaryOriginExponentScale.lean 2>&1 | tee binary-origin-scale.log
          ! grep -E 'error:|sorryAx|unknown identifier|unsolved goals|declaration uses .sorry.' binary-origin-scale.log
          grep -F 'physical_source_high_binary_order' binary-origin-scale.log
          grep -F 'physical_source_digit_zero_above_short_cut' binary-origin-scale.log
          echo GST_BINARY_ORIGIN_SCALE_KERNEL_PASS=1
