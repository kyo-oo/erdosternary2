name: GPT56 Canonical Tail Escape CI

on:
  push:
    branches:
      - sol/gpt56-canonical-tail-escape-20260827
  workflow_dispatch:

jobs:
  lean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install exact Lean toolchain
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned Mathlib
        shell: bash
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          rm -f lake-manifest.json
          lake update
          lake exe cache get
      - name: Reject sorry and admit in replacement modules
        shell: bash
        run: |
          files=(
            GSTCanonicalTailStateIso.lean
            GSTCanonicalCarryDynamics.lean
            GSTPerfectPowerTailNavigation.lean
            GSTFourPowerOntologicalAdapter.lean
            GSTPrefixOneOntologicalEscape.lean
            GSTSeedOneShift.lean
            GSTPrefixOneSeedCore.lean
            GSTPrefixOneLegacyCorollaries.lean
            GSTCanonicalTailEscapeAudit.lean
          )
          if grep -nE '(^|[^A-Za-z0-9_])(sorry|admit)([^A-Za-z0-9_]|$)' "${files[@]}"; then
            echo "Forbidden placeholder found in replacement theorem stack"
            exit 1
          fi
      - name: Build canonical tail theorem stack
        id: compile
        continue-on-error: true
        shell: bash
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          set -o pipefail
          lake build GSTCanonicalTailWorkspace 2>&1 | tee lean-diagnostic.log
      - name: Reject hidden sorryAx
        if: steps.compile.outcome == 'success'
        shell: bash
        run: |
          if grep -q 'sorryAx' lean-diagnostic.log; then
            echo "Hidden sorryAx detected"
            exit 1
          fi
      - name: Upload Lean diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-tail-lean-diagnostic
          path: lean-diagnostic.log
          if-no-files-found: error
      - name: Enforce compile result
        if: steps.compile.outcome != 'success'
        shell: bash
        run: exit 1
