name: GPT56 Canonical Tail Escape CI

on:
  push:
    branches:
      - sol/gpt56-canonical-tail-escape-20260827
  workflow_dispatch:

jobs:
  lean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install exact Lean toolchain
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned Mathlib
        shell: bash
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          rm -f lake-manifest.json
          lake update
          lake exe cache get
      - name: Compile independent four-power substrate
        id: compile
        continue-on-error: true
        shell: bash
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          set -o pipefail
          lake env lean GSTInfiniteFourPowerNavigation.lean 2>&1 | tee lean-diagnostic.log
      - name: Upload Lean diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-tail-lean-diagnostic
          path: lean-diagnostic.log
          if-no-files-found: error
      - name: Enforce compile result
        if: steps.compile.outcome != 'success'
        shell: bash
        run: exit 1
