name: SOL56 Direct Four-Power Arithmetic Verify

on:
  push:
    branches:
      - sol/gpt56-canonical-tail-escape-20260827
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-arithmetic-kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false

      - name: Prepare direct arithmetic output directory
        shell: bash
        run: mkdir -p .lake/build/lib/lean

      - name: Compile pure direct residue arithmetic
        shell: bash
        run: |
          set -euo pipefail
          lake env lean \
            -o .lake/build/lib/lean/GSTFourPowerDirectResidue.olean \
            GSTFourPowerDirectResidue.lean 2>&1 | tee direct-residue.log
          ! grep -E 'declaration uses .sorry.|sorryAx|unknown identifier|unknown module prefix|unsolved goals|error:' direct-residue.log

      - name: Compile exact mod-27 residue classifier
        shell: bash
        run: |
          set -euo pipefail
          lake env lean \
            -o .lake/build/lib/lean/GSTFourPowerDirectResidue27.olean \
            GSTFourPowerDirectResidue27.lean 2>&1 | tee direct-residue27.log
          ! grep -E 'declaration uses .sorry.|sorryAx|unknown identifier|unknown module prefix|unsolved goals|error:' direct-residue27.log

      - name: Compile direct binary carry automaton
        shell: bash
        run: |
          set -euo pipefail
          lake env lean \
            -o .lake/build/lib/lean/GSTFourPowerDirectAdditionCarry.olean \
            GSTFourPowerDirectAdditionCarry.lean 2>&1 | tee direct-addition-carry.log
          ! grep -E 'declaration uses .sorry.|sorryAx|unknown identifier|unknown module prefix|unsolved goals|error:' direct-addition-carry.log

      - name: Compile direct no-common 22 obstruction
        shell: bash
        run: |
          set -euo pipefail
          lake env lean \
            -o .lake/build/lib/lean/GSTFourPowerDirectNo22.olean \
            GSTFourPowerDirectNo22.lean 2>&1 | tee direct-no22.log
          ! grep -E 'declaration uses .sorry.|sorryAx|unknown identifier|unknown module prefix|unsolved goals|error:' direct-no22.log

      - name: Compile exponent-trit obstruction
        shell: bash
        run: |
          set -euo pipefail
          lake env lean \
            -o .lake/build/lib/lean/GSTFourPowerExponentTritObstruction.olean \
            GSTFourPowerExponentTritObstruction.lean 2>&1 | tee direct-trit.log
          ! grep -E 'declaration uses .sorry.|sorryAx|unknown identifier|unknown module prefix|unsolved goals|error:' direct-trit.log

      - name: Compile direct existence spine
        shell: bash
        run: |
          set -euo pipefail
          lake env lean \
            -o .lake/build/lib/lean/GSTFourPowerDirectExistence.olean \
            GSTFourPowerDirectExistence.lean 2>&1 | tee direct-existence.log
          ! grep -E 'declaration uses .sorry.|sorryAx|unknown identifier|unknown module prefix|unsolved goals|error:' direct-existence.log

      - name: Compile canonical tail state prerequisite
        shell: bash
        run: |
          set -euo pipefail
          lake env lean \
            -o .lake/build/lib/lean/GSTCanonicalTailStateIso.olean \
            GSTCanonicalTailStateIso.lean 2>&1 | tee canonical-tail-state.log
          ! grep -E 'declaration uses .sorry.|sorryAx|unknown identifier|unknown module prefix|unsolved goals|error:' canonical-tail-state.log

      - name: Compile direct physical Happy bridge
        shell: bash
        run: |
          set -euo pipefail
          lake env lean \
            -o .lake/build/lib/lean/GSTFourPowerDirectHappyBridge.olean \
            GSTFourPowerDirectHappyBridge.lean 2>&1 | tee direct-happy.log
          ! grep -E 'declaration uses .sorry.|sorryAx|unknown identifier|unknown module prefix|unsolved goals|error:' direct-happy.log
