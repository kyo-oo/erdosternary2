name: SOL56 Direct Four-Power Arithmetic Verify

on:
  push:
    branches:
      - sol/gpt56-canonical-tail-escape-20260827
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-arithmetic-kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false

      - name: Compile pure direct residue arithmetic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean
          lake env lean \
            -o .lake/build/lib/lean/GSTFourPowerDirectResidue.olean \
            GSTFourPowerDirectResidue.lean 2>&1 | tee direct-residue.log
          ! grep -E 'declaration uses .sorry.|sorryAx|unknown identifier|unknown module prefix|unsolved goals|error:' direct-residue.log

      - name: Compile direct existence spine
        shell: bash
        run: |
          set -euo pipefail
          lake env lean GSTFourPowerDirectExistence.lean 2>&1 | tee direct-existence.log
          ! grep -E 'declaration uses .sorry.|sorryAx|unknown identifier|unknown module prefix|unsolved goals|error:' direct-existence.log
