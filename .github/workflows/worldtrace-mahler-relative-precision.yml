name: Worldtrace Mahler Relative Precision

on:
  push:
    branches:
      - sol/worldtrace-mahler-compression-theory
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install exact Lean RC2
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore dependencies
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get

      - name: Compile relative-precision theory
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build GSTWorldtraceMahlerRelativePrecision 2>&1 | tee worldtrace-mahler.log
          ! grep -E 'sorryAx|declaration uses .sorry.|unknown identifier|unknown module prefix|unsolved goals|error:' worldtrace-mahler.log

      - name: Axiom audit
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat > WorldtraceMahlerAxiomAudit.lean <<'LEAN'
          import GSTWorldtraceMahlerRelativePrecision
          #print axioms GSTWorldtraceMahler.worldtraceWitness_factor
          #print axioms GSTWorldtraceMahler.ghost_implies_relative_lock
          #print axioms GSTWorldtraceMahler.mahler_excludes_relative_lock
          #print axioms GSTWorldtraceMahler.worldtrace_mahler_fracture_ge_two
          #print axioms GSTWorldtraceMahler.worldtrace_mahler_extinction
          #print axioms GSTWorldtraceMahler.worldtrace_mahler_relative_precision_crown
          LEAN
          lake env lean WorldtraceMahlerAxiomAudit.lean 2>&1 | tee axiom-audit.log
          ! grep -E 'sorryAx|declaration uses .sorry.|unknown identifier|unknown constant|error:' axiom-audit.log


      - name: Compile binder-free residual replacement
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build GSTResidualOmegaRevival 2>&1 | tee residual-omega-revival.log
          ! grep -E 'sorryAx|declaration uses .sorry.|unknown identifier|unknown constant|unsolved goals|error:' residual-omega-revival.log

      - name: Compile Problem 406 solution
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean questions/deepmind_problem_406/Solution.lean 2>&1 | tee problem406-solution.log
          ! grep -E 'sorryAx|declaration uses .sorry.|unknown identifier|unknown constant|unsolved goals|error:' problem406-solution.log
          ! grep -E 'hTail4|MahlerSharp|ResidualGhostCompression|WorldtraceMahlerTheory|four_power_happy_climb' questions/deepmind_problem_406/Solution.lean
