name: GST exact survivor cubic recurrence and exponential sandwich
on:
  push:
    branches: [gpt6/problem406-exponent-termination-20261029]
    paths:
      - GSTProblem406CarryEntropyCubic.lean
      - .github/workflows/gpt6_problem406_carry_cubic.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cubic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build original exact four-state carry recurrence
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
          mkdir -p .lake/build/lib/lean
          lake env lean -o .lake/build/lib/lean/GSTProblem406CarryEntropyBound.olean GSTProblem406CarryEntropyBound.lean
      - name: Strict Lean exact cubic and entropy lower bound audit
        shell: bash
        run: |
          set -euo pipefail
          lake env lean GSTProblem406CarryEntropyCubic.lean 2>&1 | tee gst406-cubic-counts.log
          ! grep -E 'error:|sorryAx|unknown identifier|unsolved goals|declaration uses .sorry.|gst_four_power_direct_existence_inline' gst406-cubic-counts.log
          echo GST406_EXACT_CUBIC_SURVIVOR_COUNTS_PASS=1
