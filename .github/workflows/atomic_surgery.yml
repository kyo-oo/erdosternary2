name: Atomic Surgery

on:
  push:
    branches:
      - diagnostics/atomic-two-errors-20260818
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atomic-surgery-diagnostics
  cancel-in-progress: true

jobs:
  surgery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: diagnostics/atomic-two-errors-20260818
          fetch-depth: 0

      - name: Apply exact source surgery
        shell: bash
        run: python3 .surgery/apply.py

      - name: Setup Lean only
        uses: leanprover/lean-action@v1
        continue-on-error: true
        with:
          build: false

      - name: Capture canonical library build
        if: always()
        shell: bash
        run: |
          mkdir -p .surgery
          set +e
          lake build ErdosTernary2 > .surgery/build.txt 2>&1
          code=$?
          echo "$code" > .surgery/build.exit
          exit 0

      - name: Commit source and diagnostics
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ErdosTernary2.lean .surgery/build.txt .surgery/build.exit
          if ! git diff --cached --quiet; then
            git commit -m 'Persist canonical library diagnostics'
            git push origin HEAD:diagnostics/atomic-two-errors-20260818
          fi
