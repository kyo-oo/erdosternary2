name: Atomic Surgery

on:
  push:
    branches:
      - diagnostics/atomic-two-errors-20260818
  workflow_dispatch:

permissions:
  contents: write

jobs:
  surgery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: diagnostics/atomic-two-errors-20260818
          fetch-depth: 0

      - name: Repair malformed chronological header only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ErdosTernary2.lean')
          lines = p.read_text(encoding='utf-8').splitlines(keepends=True)
          end = None
          for i, line in enumerate(lines[:80]):
              if line.strip() == '/- ====================================================================== -/':
                  end = i
                  break
          if end is None:
              raise SystemExit('chronological header terminator not found')
          changed = False
          for i in range(end + 1):
              if lines[i].startswith('/-'):
                  lines[i] = '--' + lines[i][2:]
                  changed = True
          if changed:
              p.write_text(''.join(lines), encoding='utf-8')
          PY

      - name: Commit parser repair if changed
        shell: bash
        run: |
          if ! git diff --quiet -- ErdosTernary2.lean; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add ErdosTernary2.lean
            git commit -m 'Repair malformed chronological header comments'
            git push origin HEAD:diagnostics/atomic-two-errors-20260818
          fi

      - uses: leanprover/lean-action@v1

      - name: Live comparator
        if: always()
        shell: bash
        run: bash scripts/comparator.sh
