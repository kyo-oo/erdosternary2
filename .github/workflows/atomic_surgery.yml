name: Atomic Surgery

on:
  push:
    branches:
      - diagnostics/atomic-two-errors-20260818
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atomic-surgery-diagnostics
  cancel-in-progress: true

jobs:
  surgery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: diagnostics/atomic-two-errors-20260818
          fetch-depth: 0

      - name: Apply exact source surgery
        shell: bash
        run: python3 .surgery/apply.py

      - name: Setup Lean only
        uses: leanprover/lean-action@v1
        continue-on-error: true
        with:
          build: false

      - name: Run and stream canonical Lean elaboration
        if: always()
        shell: bash
        run: |
          mkdir -p .surgery
          : > .surgery/build.log
          rm -f .surgery/build.exit
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          set +e
          lake env lean ErdosTernary2.lean > .surgery/build.log 2>&1 &
          pid=$!

          for round in $(seq 1 90); do
            sleep 10
            git add ErdosTernary2.lean .surgery/build.log
            if ! git diff --cached --quiet; then
              git commit -m "Stream atomic Lean diagnostics ${round}"
              git push origin HEAD:diagnostics/atomic-two-errors-20260818
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              break
            fi
          done

          wait "$pid"
          code=$?
          echo "$code" > .surgery/build.exit
          git add ErdosTernary2.lean .surgery/build.log .surgery/build.exit
          if ! git diff --cached --quiet; then
            git commit -m 'Finalize atomic Lean diagnostics'
            git push origin HEAD:diagnostics/atomic-two-errors-20260818
          fi
          exit 0
