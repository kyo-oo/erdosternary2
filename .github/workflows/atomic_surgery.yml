name: Atomic Surgery

on:
  push:
    branches:
      - diagnostics/atomic-two-errors-20260818
  workflow_dispatch:

permissions:
  contents: write

jobs:
  surgery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: diagnostics/atomic-two-errors-20260818
          fetch-depth: 0

      - name: Apply exact source surgery
        shell: bash
        run: python3 .surgery/apply.py

      - name: Install Lean and run baseline build
        uses: leanprover/lean-action@v1
        continue-on-error: true

      - name: Capture lake build
        if: always()
        shell: bash
        run: |
          mkdir -p .surgery
          set +e
          lake build > .surgery/build.log 2>&1
          code=$?
          echo "$code" > .surgery/build.exit
          exit 0

      - name: Capture live comparator
        if: always()
        shell: bash
        run: |
          set +e
          bash scripts/comparator.sh > .surgery/comparator.log 2>&1
          code=$?
          echo "$code" > .surgery/comparator.exit
          exit 0

      - name: Commit surgery result and diagnostics
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ErdosTernary2.lean .surgery/build.log .surgery/build.exit .surgery/comparator.log .surgery/comparator.exit
          if ! git diff --cached --quiet; then
            git commit -m 'Record atomic surgery diagnostics'
            git push origin HEAD:diagnostics/atomic-two-errors-20260818
          fi
