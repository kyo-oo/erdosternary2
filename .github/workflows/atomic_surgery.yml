name: Atomic Surgery

on:
  push:
    branches:
      - diagnostics/atomic-two-errors-20260818
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atomic-surgery-diagnostics
  cancel-in-progress: true

jobs:
  surgery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: diagnostics/atomic-two-errors-20260818
          fetch-depth: 0

      - name: Apply exact source surgery
        shell: bash
        run: python3 .surgery/apply.py

      - name: Index existing scratch proof material
        shell: bash
        run: |
          mkdir -p .surgery
          find . -type f -name '*.lean' \
            | grep -Ev '^./\.lake/' \
            | grep -Ei 'scratch|hand|origin|omega|residual|navigation|finite|carry|information|chord|graphv2' \
            | sort > .surgery/scratch-index.txt || true
          grep -RIl --include='*.lean' --exclude-dir=.lake \
            -E 'GSTCanonicalResidualInfiniteSupportBridgeS|finite_origin_contradictionS|InfiniteTernarySupportS|gst_origin|digit_3|GSTOmegaInfiniteBadTrace|gstNavigationConstant|CanonicalPhaseCrossingTarget|MacroRoutingTarget' . \
            | sort > .surgery/formula-index.txt || true

      - name: Setup Lean only
        uses: leanprover/lean-action@v1
        continue-on-error: true
        with:
          build: false

      - name: Resolve dependencies and capture canonical library build
        if: always()
        shell: bash
        run: |
          mkdir -p .surgery
          set +e
          lake update > .surgery/update.txt 2>&1
          update_code=$?
          if [ "$update_code" -eq 0 ]; then
            lake exe cache get >> .surgery/update.txt 2>&1
            lake build ErdosTernary2 > .surgery/build.txt 2>&1
            code=$?
            lake env lean GSTGraphV2CanonicalExperiment.lean > .surgery/v2-build.txt 2>&1
            v2code=$?
            lake env lean GSTGraphV2MacroExperiment.lean > .surgery/v2macro-build.txt 2>&1
            v2macrocode=$?
          else
            cp .surgery/update.txt .surgery/build.txt
            cp .surgery/update.txt .surgery/v2-build.txt
            cp .surgery/update.txt .surgery/v2macro-build.txt
            code=$update_code
            v2code=$update_code
            v2macrocode=$update_code
          fi
          echo "$code" > .surgery/build.exit
          echo "$v2code" > .surgery/v2-build.exit
          echo "$v2macrocode" > .surgery/v2macro-build.exit
          exit 0

      - name: Commit source and diagnostics
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ErdosTernary2.lean lake-manifest.json \
            .surgery/update.txt .surgery/build.txt .surgery/build.exit \
            .surgery/v2-build.txt .surgery/v2-build.exit \
            .surgery/v2macro-build.txt .surgery/v2macro-build.exit \
            .surgery/scratch-index.txt .surgery/formula-index.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Persist canonical library diagnostics'
            git push origin HEAD:diagnostics/atomic-two-errors-20260818
          fi
