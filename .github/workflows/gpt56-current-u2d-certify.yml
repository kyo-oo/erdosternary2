name: GPT56 Current U2D Atomic Certify

on:
  push:
    branches:
      - sol/gpt56-canonical-tail-escape-20260827
    paths:
      - '.github/workflows/gpt56-current-u2d-certify.yml'
      - 'ErdosTernary2.lean'
      - 'scripts/apply_u2d_atomic_replacement.py'
      - 'scripts/patch_live_hcreationcheck.py'
  workflow_dispatch:

concurrency:
  group: gpt56-current-u2d-certify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Verify exact source head
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_HEAD=$(git rev-parse HEAD)"
          echo "SOURCE_BRANCH=${GITHUB_REF_NAME}"

      - name: Apply current-head atomic U2D surgery transiently
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_u2d_atomic_replacement.py
          python3 scripts/patch_live_hcreationcheck.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ErdosTernary2.lean')
          s = p.read_text(encoding='utf-8')
          exact_drop = {
              'GSTPrefixOneU2DCollisionProof',
              'GSTPrefixOnePhaseIncidenceControl',
              'GSTPrefixOneSpacetimeIncidenceControl',
              'GSTGraphV2InfiniteControllerBridge',
          }
          out = []
          neutralized = []
          for line in s.splitlines(keepends=True):
              stripped = line.strip()
              if stripped.startswith('import '):
                  mods = stripped[len('import '):].split()
                  if len(mods) == 1:
                      mod = mods[0]
                      if mod in exact_drop or mod.endswith('Scratch'):
                          nl = '\n' if line.endswith('\n') else ''
                          out.append(f'-- GPT56 CURRENT CERTIFY NEUTRALIZED DUPLICATE IMPORT: {mod}{nl}')
                          neutralized.append(mod)
                          continue
              out.append(line)
          s = ''.join(out)
          p.write_text(s, encoding='utf-8')
          required = [
              'theorem h_creation_for_4pow',
              'theorem gst_h_creation_full_power_navigation_atomic',
              'theorem gst_full_power_navigation_descends_atomic',
              'theorem gst_prefix_one_u2d_atomic_collision_inline',
              'theorem gst_prefix_one_information_bad_descends_inline',
              'theorem gst_prefix_one_navigation_lift',
              'theorem erdos_ternary_2_universal',
          ]
          for marker in required:
              if marker not in s:
                  raise SystemExit(f'missing required theorem marker: {marker}')
          if 'trace_state\n  contradiction' in s:
              raise SystemExit('old red trace_state/contradiction seam survived')
          helper = s[s.index('theorem gst_h_creation_full_power_navigation_atomic'):s.index('theorem gst_full_power_navigation_descends_atomic')]
          if 'h_creation_for_4pow k hk5 hk7' not in helper:
              raise SystemExit('unbounded h_creation adapter call missing')
          if '-- SOL56 LIVE GENERAL H_CREATION REACTIVATED' not in s:
              raise SystemExit('general h_creation theorem was not reactivated')
          print(f'NEUTRALIZED_IMPORT_COUNT={len(neutralized)}')
          print('TRANSIENT_SURGERY_SHAPE_OK=1')
          PY

      - name: Install exact Lean RC2 and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          rm -f lake-manifest.json
          lake update
          lake exe cache get

      - name: Materialize transformed local import closure
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          ROOT = Path('ErdosTernary2.lean')
          BUILD = Path('.lake/build/lib/lean')
          import_re = re.compile(r'^\s*import\s+(.+?)\s*$')

          def local_path(module: str) -> Path:
              return Path(*module.split('.')).with_suffix('.lean')

          def imports_of(path: Path):
              result = []
              for raw in path.read_text(encoding='utf-8').splitlines():
                  code = raw.split('--', 1)[0].rstrip()
                  m = import_re.match(code)
                  if m:
                      result.extend(m.group(1).split())
              return result

          order = []
          permanent = set()
          temporary = []

          def visit(module: str):
              if module == 'ErdosTernary2' or module in permanent:
                  return
              path = local_path(module)
              if not path.exists():
                  return
              if module in temporary:
                  raise SystemExit('LOCAL_IMPORT_CYCLE=' + ' -> '.join(temporary + [module]))
              temporary.append(module)
              for dep in imports_of(path):
                  visit(dep)
              temporary.pop()
              permanent.add(module)
              order.append((module, path))

          for module in imports_of(ROOT):
              visit(module)

          print(f'LOCAL_IMPORT_CLOSURE_COUNT={len(order)}')
          BUILD.mkdir(parents=True, exist_ok=True)
          for module, path in order:
              out = BUILD.joinpath(*module.split('.')).with_suffix('.olean')
              out.parent.mkdir(parents=True, exist_ok=True)
              if out.exists():
                  continue
              print(f'=== compiling local import {module} ===', flush=True)
              subprocess.run(['lake', 'env', 'lean', '-o', str(out), str(path)], check=True)
          print('LOCAL_IMPORT_CLOSURE_MATERIALIZED=1')
          PY

      - name: Compile transformed monolith
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build ErdosTernary2
          echo 'TRANSFORMED_MONOLITH_GREEN=1'

      - name: Kernel axiom audit
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat > GPT56CurrentAtomicAudit.lean <<'EOF'
          import ErdosTernary2
          #print axioms h_creation_for_4pow
          #print axioms gst_h_creation_full_power_navigation_atomic
          #print axioms gst_full_power_navigation_descends_atomic
          #print axioms gst_prefix_one_u2d_atomic_collision_inline
          #print axioms gst_prefix_one_information_bad_descends_inline
          #print axioms gst_prefix_one_navigation_lift
          #print axioms erdos_ternary_2_universal
          EOF
          lake env lean GPT56CurrentAtomicAudit.lean 2>&1 | tee gpt56-current-axioms.log
          if grep -Fq 'sorryAx' gpt56-current-axioms.log; then
            echo 'FORBIDDEN_SORRYAX_IN_CHAIN=1'
            exit 1
          fi
          echo 'KERNEL_AXIOM_AUDIT_GREEN=1'

      - name: Run exact repository V5 comparator
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          bash scripts/comparator.sh | tee gpt56-current-v5.log
          grep -F '=== COMPARATOR RESULT: PASS ===' gpt56-current-v5.log
          grep -F 'Your solution is okay!' gpt56-current-v5.log
          echo 'CURRENT_TRANSIENT_V5_GREEN=1'

# GPT56 certification trigger 2026-08-30
# Atomic path excludes obsolete GSTPrefixOneU2DCollisionProof donor import
