name: GPT56 Direct Affine 599-603 Verify

on:
  push:
    branches:
      - sol/gpt56-four-power-relocation-prod-20260903
    paths:
      - 'GSTFourPowerAffineSixthTrit599_603.lean'
      - '.github/workflows/gpt56-direct-affine-599-603.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  affine-599-603-kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
      - name: Prepare output directory
        run: mkdir -p .lake/build/lib/lean
      - name: Compile fresh production dependency chain
        shell: bash
        run: |
          set -euo pipefail
          modules=(
            GSTCanonicalTailStateIso
            GSTFourPowerDirectResidue
            GSTFourPowerDirectResidue27
            GSTFourPowerDirectResidue81
            GSTFourPowerExponentTritObstruction
            GSTFourPowerDirectExistence
            GSTFourPowerDirectAdditionCarry
            GSTFourPowerExactExponentPeriod
            GSTFourPowerDirectHappyBridge
            GSTFourPowerAffineOrbit
            GSTFourPowerAffineExponentPeel
            GSTFourPowerAffineBadState
            GSTFourPowerAffineChannelAutomaton
            GSTFourPowerAffineClassifierBridge
            GSTFourPowerAffinePeelClassifier
            GSTFourPowerAffinePrefixIsometry
            GSTFourPowerAffineHappyConstruction
            GSTFourPowerAffineThirdTrit
            GSTFourPowerAffineFourthTrit
            GSTFourPowerAffineFifthTrit
            GSTFourPowerAffineSixthTrit
            GSTFourPowerAffineSixthTritSector
            GSTFourPowerAffineSixthTrit489
            GSTFourPowerAffineSixthTrit503
            GSTFourPowerAffineSixthTrit525
            GSTFourPowerAffineSixthTrit526_528
            GSTFourPowerAffineSixthTrit531_532
            GSTFourPowerAffineSixthTrit536_538
            GSTFourPowerAffineSixthTrit545_546
            GSTFourPowerAffineSixthTrit554_555
            GSTFourPowerAffineSixthTrit556_559
            GSTFourPowerAffineSixthTrit562_565
            GSTFourPowerAffineSixthTrit571_573
            GSTFourPowerAffineSixthTrit575_578
            GSTFourPowerAffineSixthTrit581_587
            GSTFourPowerAffineSixthTrit589_592
          )
          for module in "${modules[@]}"; do
            lake env lean -o ".lake/build/lib/lean/${module}.olean" "${module}.lean" 2>&1 | tee "${module}.log"
            ! grep -E 'declaration uses .sorry.|sorryAx|unknown identifier|unknown module prefix|unsolved goals|error:' "${module}.log"
          done
      - name: Compile residues 599-603 direct physical constructors
        shell: bash
        run: |
          set -euo pipefail
          lake env lean -o .lake/build/lib/lean/GSTFourPowerAffineSixthTrit599_603.olean GSTFourPowerAffineSixthTrit599_603.lean 2>&1 | tee affine-sixth-trit-599-603.log
          ! grep -E 'declaration uses .sorry.|sorryAx|unknown identifier|unknown module prefix|unsolved goals|error:' affine-sixth-trit-599-603.log
      - name: Reject forbidden proof escapes in fresh module
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE '\b(sorry|admit|axiom|sorryAx)\b|False\.elim' GSTFourPowerAffineSixthTrit599_603.lean
      - name: Direct affine audit marker
        run: echo DIRECT_AFFINE_599_603_PHYSICAL_HAPPY_GREEN=1
