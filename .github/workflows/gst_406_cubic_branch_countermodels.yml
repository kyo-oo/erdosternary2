name: GST 406 Cubic Branch Countermodels Strict
on:
  push:
    branches: [gpt6/problem406-rowtwo-first-hit-exact-20261030]
    paths:
      - GSTProblem406CubicBranchCountermodels.lean
      - lakefile.toml
      - .github/workflows/gst_406_cubic_branch_countermodels.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Pinned Lean mathlib
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Kernel-check all three no-go branches and audit axioms
        run: |
          set -euo pipefail
          lake build GST406CubicBranchCountermodels 2>&1 | tee branches-build.log
          lake env lean GSTProblem406CubicBranchCountermodels.lean 2>&1 | tee branches-axioms.log
          ! grep -E 'error:|sorryAx|unsolved goals|unknown identifier|declaration uses .sorry.' branches-build.log branches-axioms.log
          grep -F "'GSTProblem406CubicBranchCountermodels.no_generic_cubic_branch_bad_descent' depends on axioms:" branches-axioms.log
          echo GST406_GENERIC_CUBIC_NOGO_PASS=1
