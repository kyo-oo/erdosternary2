name: Infinite V2 Production Surgery Smoke

on:
  push:
    branches:
      - sol/gpt56-infinite-control-production
    paths-ignore:
      - 'V2_ONE_ERROR_RESULT.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  full-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pinned Lean
        shell: bash
        run: |
          set -euxo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.33.0-rc2

      - name: Resolve dependencies
        timeout-minutes: 20
        shell: bash
        run: |
          set -euxo pipefail
          lake update
          lake exe cache get
          lake build GSTTactic

      - name: Record exact production payload
        shell: bash
        run: |
          set -euxo pipefail
          echo "ROOT_MONOLITH_LINES=$(wc -l < ErdosTernary2.lean)" | tee payload.log
          echo 'ROOT_V2_FILES:' | tee -a payload.log
          find . -maxdepth 1 -type f -name 'GST*.lean' -printf '%f\n' | sort | tee -a payload.log
          SNAP="$PWD/ker07-snapshot/branches/15_sol_new__physical-phase-crossing-surgery"
          echo "SNAPSHOT=$SNAP" | tee -a payload.log

      - name: Mechanical repair historical scratch header
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ker07-snapshot/branches/15_sol_new__physical-phase-crossing-surgery/InformationDescentScratch.lean')
          lines = p.read_text().splitlines(True)
          changed = 0
          for i in range(min(40, len(lines))):
              if lines[i].startswith('/-'):
                  lines[i] = '--' + lines[i][2:]
                  changed += 1
          p.write_text(''.join(lines))
          print('HEADER_LINES_REPAIRED', changed)
          PY

      - name: Compile root V2 production stack
        timeout-minutes: 30
        shell: bash
        run: |
          set -euxo pipefail
          export LEAN_PATH="$PWD:${LEAN_PATH:-}"
          lake env lean -o GSTV2InfiniteCore.olean GSTV2InfiniteCore.lean
          lake env lean -o GSTInfiniteCollision.olean GSTInfiniteCollision.lean
          lake env lean -o GSTInfiniteBadTransport.olean GSTInfiniteBadTransport.lean
          lake env lean -o GSTInfiniteCoupledLedger.olean GSTInfiniteCoupledLedger.lean
          lake env lean -o GSTInfiniteGateTransport.olean GSTInfiniteGateTransport.lean

      - name: Compile attached transport and information stack
        timeout-minutes: 45
        shell: bash
        run: |
          set -euxo pipefail
          SNAP="$PWD/ker07-snapshot/branches/15_sol_new__physical-phase-crossing-surgery"
          export LEAN_PATH="$PWD:$SNAP:${LEAN_PATH:-}"
          files=(
            InformationDescentScratch.lean
            GSTGraphV2InfiniteControlScratch.lean
            GSTGraphV2InfiniteNaturalContradictionScratch.lean
            GSTGraphV2InfiniteBigNDichotomyScratch.lean
            GSTGraphV2InfiniteCardinalMasterScratch.lean
            GSTGraphV2InfiniteElevenEquationMasterScratch.lean
            GSTGraphV2InfiniteOriginWorldCollisionScratch.lean
            GSTGraphV2SleepEquationLabScratch.lean
            GSTGraphV2SleepBadLanguageDescentScratch.lean
            GSTGraphV2SleepEquationCollisionScratch.lean
            CanonicalCausalityScratch.lean
            CanonicalOriginCutIntersectionScratch.lean
            CanonicalOriginModulusScratch.lean
            RetainedOffsetUStateScratch.lean
            PrefixOneOriginPhaseRecursionScratch.lean
            ResidualNullBranchReductionScratch.lean
            ResidualNullTerminalScratch.lean
            ResidualNullPrefixFourCutScratch.lean
            CanonicalResidualInfiniteSupportBridgeScratch.lean
            GSTGraphV2InfiniteWorldTowerScratch.lean
            GSTGraphV2InfiniteExactWorldProjectionScratch.lean
            GSTGraphV2InfiniteSixWorldCollisionScratch.lean
            GSTGraphV2InfiniteOmegaLedgerMasterScratch.lean
            InformationIterationScratch.lean
            InformationForcingScratch.lean
            LastGateTrapScratch.lean
            CanonicalTrapScratch.lean
            PhysicalSixBridgeGateScratch.lean
            HorizontalTrapWidthDescentScratch.lean
            CanonicalPhaseCrossingSurgeryScratch.lean
            PhaseCycleInformationScratch.lean
            InformationFluxScratch.lean
            InformationGeometryScratch.lean
          )
          : > attached-stack.log
          for f in "${files[@]}"; do
            if [ ! -f "$SNAP/$f" ]; then
              echo "MISSING $f" | tee -a attached-stack.log
              exit 1
            fi
            echo "=== COMPILE $f ===" | tee -a attached-stack.log
            lake env lean -o "$SNAP/${f%.lean}.olean" "$SNAP/$f" 2>&1 | tee -a attached-stack.log
          done

      - name: Compile green 7326-line pre-Omega prefix
        timeout-minutes: 30
        shell: bash
        run: |
          set -euxo pipefail
          LEGACY_LINE=$(grep -n 'Legacy residual overproof' ErdosTernary2.lean | head -1 | cut -d: -f1)
          test -n "$LEGACY_LINE"
          CUT=$((LEGACY_LINE - 2))
          echo "LEGACY_LINE=$LEGACY_LINE CUT=$CUT"
          test "$CUT" -eq 7326
          head -n "$CUT" ErdosTernary2.lean > ErdosPreOmega.lean
          lake env lean -o ErdosPreOmega.olean ErdosPreOmega.lean

      - name: Kernel-check factor-three normalization
        timeout-minutes: 15
        shell: bash
        run: |
          set -euxo pipefail
          SNAP="$PWD/ker07-snapshot/branches/15_sol_new__physical-phase-crossing-surgery"
          export LEAN_PATH="$PWD:$SNAP:${LEAN_PATH:-}"
          cat > InfiniteV2NormalizationGreen.lean <<'EOF'
          import ErdosPreOmega

          theorem gst_omega_bad_mul3_reindex_v2
              (s m : Nat) (hs : 1 ≤ s)
              (hbad : GSTOmegaInfiniteBadTrace s 1 (3*m)) :
              GSTOmegaInfiniteBadTrace s 2 m := by
            let D1 := (4 * (c s % 3^1)) / 3^1
            let X1 := c s / 3^1 +
              4^(3^s) * gstNavigationConstant (s+1) (3*m)
            let D2 := (4 * (c s % 3^2)) / 3^2
            let X2 := c s / 3^2 +
              4^(3^s) * gstNavigationConstant (s+2) m
            have hseed1 :=
              (gst_omega_infiniteBadTrace_iff_seededAffine s 1 (3*m)).1 hbad
            change GSTSeededAffineBadTrace D1 X1 at hseed1
            have hc3 : c s % 3 = 1 := c_mod3 s hs
            have hc9 : c s % 9 = 7 := c_mod9 s hs
            have hD1 : D1 = 1 := by
              dsimp [D1]
              norm_num [hc3]
            have hD2 : D2 = 3 := by
              dsimp [D2]
              norm_num [hc9]
            have hcdecomp := Nat.div_add_mod (c s) 9
            have hcshape : c s = 7 + 9 * (c s / 9) := by
              rw [hc9] at hcdecomp
              omega
            have hcdiv : c s / 3 = 2 + 3 * (c s / 9) := by
              rw [hcshape]
              omega
            have hQ :
                gstNavigationConstant (s+1) (3*m) =
                  3 * gstNavigationConstant (s+2) m :=
              gst_navigation_constant_mul3 (s+1) m (by omega)
            have hXshape : X1 = 2 + 3*X2 := by
              dsimp [X1, X2]
              norm_num
              rw [hQ, hcdiv]
              ring
            have hXmod : X1 % 3 = 2 := by
              rw [hXshape, Nat.add_mod, Nat.mul_mod]
              norm_num
            have hXdiv : X1 / 3 = X2 := by
              rw [hXshape]
              omega
            have hcarry1 : gstAffineMulCarry 4 D1 X1 1 = D2 := by
              rw [hD1, hD2]
              simp [gstAffineMulCarry, hXmod]
            apply (gst_omega_infiniteBadTrace_iff_seededAffine s 2 m).2
            change GSTSeededAffineBadTrace D2 X2
            intro j
            have hj := hseed1 (1+j)
            rw [gst_seeded_affine_carry_semigroup D1 X1 1 j,
                gst_seeded_affine_digit_shift X1 1 j,
                hcarry1, hXdiv] at hj
            exact hj

          #print axioms gst_omega_bad_mul3_reindex_v2
          EOF
          lake env lean InfiniteV2NormalizationGreen.lean 2>&1 | tee normalization.log
          ! grep -q 'sorryAx' normalization.log

      - name: Multi-edit full physical monolith surgery
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('ErdosTernary2.lean')
          src = p.read_text()
          before = src.count('\n') + 1
          DECL = re.compile(r'(?m)^(?:theorem|lemma|def|abbrev|structure|inductive|instance|private\s+theorem)\s+[A-Za-z0-9_]')
          def span(text, name):
              m = re.search(rf'(?m)^theorem\s+{re.escape(name)}\b', text)
              if not m:
                  raise SystemExit(f'missing declaration: {name}')
              nxt = DECL.search(text, m.end())
              return m.start(), len(text) if nxt is None else nxt.start()
          def remove(text, name):
              a, b = span(text, name)
              return text[:a] + text[b:]
          dead = [
              'gst_omega_termination_s1',
              'gst_omega_termination_s3',
              'gst_omega_termination_stable',
              'gst_residual_omega_termination',
              'gst_residual_navigation_lift',
              'gst_prefix_one_information_bad_descends_inline',
              'gst_prefix_one_child_gate_contradicts_parent_bad_inline',
          ]
          for name in dead:
              src = remove(src, name)
          replacement = r'''
/-- V2 replacement seam for the deleted legacy Omega corridor. -/
theorem gst_v2_infinite_prefix_one_collision
    (s n : Nat) (hs : 1 ≤ s) (hn : 1 ≤ n)
    (hchild : GSTNavigationWitness (gstNavigationConstant (s+1) n))
    (hBad : GSTOmegaInfiniteBadTrace s 1 n) : False := by
  let T := gstNavigationConstant (s+1) n
  let X := c s / 3 + 4^(3^s) * T
  have hseeded : GSTSeededAffineBadTrace 1 X := by
    have h := (gst_omega_infiniteBadTrace_iff_seededAffine s 1 n).1 hBad
    have hseed : (4 * (c s % 3^1)) / 3^1 = 1 := by
      rw [Nat.pow_one, c_mod3 s hs]
      decide
    rw [hseed] at h
    simpa [T, X] using h
  obtain ⟨j, hd, hspace⟩ := hchild
  have hCmod : gstCarry T j % 3 = 0 := by
    dsimp [T]
    exact gstGoodSpace_carry_mod3_zero _ j hspace
  have hClt : gstCarry T j < 4 := by
    cases j with
    | zero => simp [gstCarry]
    | succ q =>
        dsimp [T]
        exact gstCarry_lt_four _ (q+1) (by omega)
  have hC : gstCarry T j = 0 ∨ gstCarry T j = 3 := by omega
  omega

theorem gst_prefix_one_navigation_lift :
    GSTPrefixOneNavigationLift := by
  intro s n hs hn hchild
  by_contra hnoParent
  have hBad : GSTOmegaInfiniteBadTrace s 1 n :=
    gst_prefix_one_omega_bad_of_no_parent_navigation_inline s n hs hnoParent
  exact gst_v2_infinite_prefix_one_collision s n hs hn hchild hBad

'''
          a, b = span(src, 'gst_prefix_one_navigation_lift')
          src = src[:a] + replacement + src[b:]
          for name in dead:
              if re.search(rf'(?m)^theorem\s+{re.escape(name)}\b', src):
                  raise SystemExit(f'dead declaration survived: {name}')
          p.write_text(src)
          after = src.count('\n') + 1
          print('FULL_MONOLITH_BEFORE', before)
          print('FULL_MONOLITH_AFTER', after)
          print('PHYSICAL_SURGERY_APPLIED')
          PY

      - name: Compile full surgically rewritten physical monolith
        timeout-minutes: 60
        shell: bash
        run: |
          set -o pipefail
          wc -l ErdosTernary2.lean | tee full-monolith.log
          lake env lean -o ErdosTernary2.olean ErdosTernary2.lean 2>&1 | tee -a full-monolith.log

      - name: Compile production adapters against full monolith
        timeout-minutes: 30
        shell: bash
        run: |
          set -euxo pipefail
          export LEAN_PATH="$PWD:${LEAN_PATH:-}"
          lake env lean GSTPrefixOneInfiniteAdapterSmoke.lean
          lake env lean GSTPrefixOneGateAdapterSmoke.lean
          lake env lean GSTPrefixOneLatentGateSmoke.lean
          lake env lean GSTPrefixOneLedgerSmoke.lean
          lake env lean GSTInfiniteControlProductionSmoke.lean

      - name: Full Lake build
        timeout-minutes: 60
        shell: bash
        run: |
          set -euxo pipefail
          lake build ErdosTernary2

      - name: Exact zero-sorry comparator gate
        timeout-minutes: 60
        shell: bash
        run: |
          set -euxo pipefail
          bash scripts/sorry_check.sh
          bash scripts/comparator.sh | tee comparator.log
          grep -Fq 'Your solution is okay!' comparator.log
          grep -Fq 'COMPARATOR RESULT: PASS' comparator.log

      - name: Commit physical surgery only after complete green gate
        if: success() && github.event_name == 'push'
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ErdosTernary2.lean ker07-snapshot/branches/15_sol_new__physical-phase-crossing-surgery/InformationDescentScratch.lean
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'proof: commit comparator-green V2 physical surgery [skip ci]'
          git push origin HEAD:sol/gpt56-infinite-control-production

      - name: Self-report exact gate result
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          set -euxo pipefail
          {
            echo '# V2 Full Production Gate Result'
            echo
            echo "Source commit: $GITHUB_SHA"
            echo
            echo '## Payload'
            echo '```text'
            cat payload.log 2>/dev/null || true
            echo '```'
            echo
            echo '## Attached stack tail'
            echo '```text'
            tail -80 attached-stack.log 2>/dev/null || true
            echo '```'
            echo
            echo '## Normalization tail'
            echo '```text'
            tail -40 normalization.log 2>/dev/null || true
            echo '```'
            echo
            echo '## Full monolith diagnostics'
            echo '```text'
            if [ -f full-monolith.log ]; then
              grep -E 'error:|unsolved goals|declaration uses|sorryAx|unknown identifier|type mismatch|application type mismatch|omega could not prove' full-monolith.log | tail -160 || true
            else
              echo 'Full monolith compile was not reached.'
            fi
            echo '```'
            echo
            echo '## Comparator'
            echo '```text'
            tail -60 comparator.log 2>/dev/null || true
            echo '```'
          } > V2_ONE_ERROR_RESULT.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add V2_ONE_ERROR_RESULT.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ci: report exact full V2 production gate [skip ci]'
          git push origin HEAD:sol/gpt56-infinite-control-production
