name: Infinite V2 Production Surgery Smoke

on:
  push:
    branches:
      - sol/gpt56-infinite-control-production
    paths-ignore:
      - 'V2_ONE_ERROR_RESULT.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  full-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pinned Lean
        shell: bash
        run: |
          set -euxo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.33.0-rc2

      - name: Resolve dependencies
        timeout-minutes: 20
        shell: bash
        run: |
          set -euxo pipefail
          lake update
          lake exe cache get
          lake build GSTTactic

      - name: Record exact payload
        shell: bash
        run: |
          set -euxo pipefail
          echo "ROOT_MONOLITH_LINES=$(wc -l < ErdosTernary2.lean)" | tee payload.log
          echo 'ROOT_V2_FILES:' | tee -a payload.log
          find . -maxdepth 1 -type f -name 'GST*.lean' -printf '%f\n' | sort | tee -a payload.log
          test "$(wc -l < ErdosTernary2.lean)" -eq 8750

      - name: Probe root V2 production stack
        timeout-minutes: 40
        shell: bash
        run: |
          set -uo pipefail
          export LEAN_PATH="$PWD:${LEAN_PATH:-}"
          status=0
          : > root-v2.log
          for f in \
            GSTV2InfiniteCore.lean \
            GSTInfiniteCollision.lean \
            GSTInfiniteBadTransport.lean \
            GSTInfiniteCoupledLedger.lean \
            GSTInfiniteGateTransport.lean
          do
            echo "=== $f ===" | tee -a root-v2.log
            lake env lean -o "${f%.lean}.olean" "$f" 2>&1 | tee -a root-v2.log || status=1
          done
          echo "$status" > .status-root-v2
          exit 0

      - name: Probe attached transport stack
        timeout-minutes: 60
        shell: bash
        run: |
          set -uo pipefail
          SNAP="$PWD/ker07-snapshot/branches/15_sol_new__physical-phase-crossing-surgery"
          export LEAN_PATH="$PWD:$SNAP:${LEAN_PATH:-}"
          status=0
          : > attached-stack.log
          files=(
            InformationDescentScratch.lean
            GSTGraphV2InfiniteControlScratch.lean
            GSTGraphV2InfiniteNaturalContradictionScratch.lean
            GSTGraphV2InfiniteBigNDichotomyScratch.lean
            GSTGraphV2InfiniteCardinalMasterScratch.lean
            GSTGraphV2InfiniteElevenEquationMasterScratch.lean
            GSTGraphV2InfiniteOriginWorldCollisionScratch.lean
            GSTGraphV2SleepEquationLabScratch.lean
            GSTGraphV2SleepBadLanguageDescentScratch.lean
            GSTGraphV2SleepEquationCollisionScratch.lean
            CanonicalCausalityScratch.lean
            CanonicalOriginCutIntersectionScratch.lean
            CanonicalOriginModulusScratch.lean
            RetainedOffsetUStateScratch.lean
            PrefixOneOriginPhaseRecursionScratch.lean
            ResidualNullBranchReductionScratch.lean
            ResidualNullTerminalScratch.lean
            ResidualNullPrefixFourCutScratch.lean
            CanonicalResidualInfiniteSupportBridgeScratch.lean
            GSTGraphV2InfiniteWorldTowerScratch.lean
            GSTGraphV2InfiniteExactWorldProjectionScratch.lean
            GSTGraphV2InfiniteSixWorldCollisionScratch.lean
            GSTGraphV2InfiniteOmegaLedgerMasterScratch.lean
            InformationIterationScratch.lean
            InformationForcingScratch.lean
            LastGateTrapScratch.lean
            CanonicalTrapScratch.lean
            PhysicalSixBridgeGateScratch.lean
            HorizontalTrapWidthDescentScratch.lean
            CanonicalPhaseCrossingSurgeryScratch.lean
            PhaseCycleInformationScratch.lean
            InformationFluxScratch.lean
            InformationGeometryScratch.lean
          )
          for f in "${files[@]}"; do
            echo "=== $f ===" | tee -a attached-stack.log
            if [ ! -f "$SNAP/$f" ]; then
              echo "MISSING $f" | tee -a attached-stack.log
              status=1
              continue
            fi
            lake env lean -o "$SNAP/${f%.lean}.olean" "$SNAP/$f" 2>&1 | tee -a attached-stack.log || status=1
          done
          echo "$status" > .status-attached
          exit 0

      - name: Probe exact 7326-line pre-Omega prefix
        timeout-minutes: 30
        shell: bash
        run: |
          set -uo pipefail
          status=0
          LEGACY_LINE=$(grep -n 'Legacy residual overproof' ErdosTernary2.lean | head -1 | cut -d: -f1)
          CUT=$((LEGACY_LINE - 2))
          echo "LEGACY_LINE=$LEGACY_LINE CUT=$CUT" | tee preomega.log
          if [ "$CUT" -ne 7326 ]; then status=1; fi
          head -n "$CUT" ErdosTernary2.lean > ErdosPreOmega.lean
          lake env lean -o ErdosPreOmega.olean ErdosPreOmega.lean 2>&1 | tee -a preomega.log || status=1
          echo "$status" > .status-preomega
          exit 0

      - name: Apply seven-declaration V2 surgery to full physical checkout
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('ErdosTernary2.lean')
          src = p.read_text()
          print('FULL_MONOLITH_BEFORE', src.count('\n') + 1)
          DECL = re.compile(r'(?m)^(?:theorem|lemma|def|abbrev|structure|inductive|instance|private\s+theorem)\s+[A-Za-z0-9_]')
          def span(text, name):
              m = re.search(rf'(?m)^theorem\s+{re.escape(name)}\b', text)
              if not m:
                  raise SystemExit(f'missing declaration: {name}')
              nxt = DECL.search(text, m.end())
              return m.start(), len(text) if nxt is None else nxt.start()
          def remove(text, name):
              a, b = span(text, name)
              return text[:a] + text[b:]
          dead = [
              'gst_omega_termination_s1',
              'gst_omega_termination_s3',
              'gst_omega_termination_stable',
              'gst_residual_omega_termination',
              'gst_residual_navigation_lift',
              'gst_prefix_one_information_bad_descends_inline',
              'gst_prefix_one_child_gate_contradicts_parent_bad_inline',
          ]
          for name in dead:
              src = remove(src, name)
          replacement = r'''
/-- V2 replacement seam for the deleted legacy Omega corridor. -/
theorem gst_v2_infinite_prefix_one_collision
    (s n : Nat) (hs : 1 ≤ s) (hn : 1 ≤ n)
    (hchild : GSTNavigationWitness (gstNavigationConstant (s+1) n))
    (hBad : GSTOmegaInfiniteBadTrace s 1 n) : False := by
  let T := gstNavigationConstant (s+1) n
  let X := c s / 3 + 4^(3^s) * T
  have hseeded : GSTSeededAffineBadTrace 1 X := by
    have h := (gst_omega_infiniteBadTrace_iff_seededAffine s 1 n).1 hBad
    have hseed : (4 * (c s % 3^1)) / 3^1 = 1 := by
      rw [Nat.pow_one, c_mod3 s hs]
      decide
    rw [hseed] at h
    simpa [T, X] using h
  obtain ⟨j, hd, hspace⟩ := hchild
  have hCmod : gstCarry T j % 3 = 0 := by
    dsimp [T]
    exact gstGoodSpace_carry_mod3_zero _ j hspace
  have hClt : gstCarry T j < 4 := by
    cases j with
    | zero => simp [gstCarry]
    | succ q =>
        dsimp [T]
        exact gstCarry_lt_four _ (q+1) (by omega)
  have hC : gstCarry T j = 0 ∨ gstCarry T j = 3 := by omega
  omega

theorem gst_prefix_one_navigation_lift :
    GSTPrefixOneNavigationLift := by
  intro s n hs hn hchild
  by_contra hnoParent
  have hBad : GSTOmegaInfiniteBadTrace s 1 n :=
    gst_prefix_one_omega_bad_of_no_parent_navigation_inline s n hs hnoParent
  exact gst_v2_infinite_prefix_one_collision s n hs hn hchild hBad

'''
          a, b = span(src, 'gst_prefix_one_navigation_lift')
          src = src[:a] + replacement + src[b:]
          for name in dead:
              if re.search(rf'(?m)^theorem\s+{re.escape(name)}\b', src):
                  raise SystemExit(f'dead declaration survived: {name}')
          p.write_text(src)
          print('FULL_MONOLITH_AFTER', src.count('\n') + 1)
          print('PHYSICAL_SURGERY_APPLIED')
          PY

      - name: Probe full surgically rewritten monolith
        timeout-minutes: 60
        shell: bash
        run: |
          set -uo pipefail
          status=0
          wc -l ErdosTernary2.lean | tee full-monolith.log
          lake env lean -o ErdosTernary2.olean ErdosTernary2.lean 2>&1 | tee -a full-monolith.log || status=1
          echo "$status" > .status-monolith
          exit 0

      - name: Probe production adapters against full monolith
        timeout-minutes: 40
        shell: bash
        run: |
          set -uo pipefail
          export LEAN_PATH="$PWD:${LEAN_PATH:-}"
          status=0
          : > adapters.log
          for f in \
            GSTPrefixOneInfiniteAdapterSmoke.lean \
            GSTPrefixOneGateAdapterSmoke.lean \
            GSTPrefixOneLatentGateSmoke.lean \
            GSTPrefixOneLedgerSmoke.lean \
            GSTInfiniteControlProductionSmoke.lean
          do
            echo "=== $f ===" | tee -a adapters.log
            lake env lean "$f" 2>&1 | tee -a adapters.log || status=1
          done
          echo "$status" > .status-adapters
          exit 0

      - name: Probe full Lake build
        timeout-minutes: 60
        shell: bash
        run: |
          set -uo pipefail
          status=0
          lake build ErdosTernary2 2>&1 | tee lake-build.log || status=1
          echo "$status" > .status-lake
          exit 0

      - name: Exact zero-sorry comparator gate
        timeout-minutes: 60
        shell: bash
        run: |
          set -euxo pipefail
          for f in .status-root-v2 .status-attached .status-preomega .status-monolith .status-adapters .status-lake; do
            echo "$f=$(cat "$f")"
            test "$(cat "$f")" -eq 0
          done
          bash scripts/sorry_check.sh
          bash scripts/comparator.sh | tee comparator.log
          grep -Fq 'Your solution is okay!' comparator.log
          grep -Fq 'COMPARATOR RESULT: PASS' comparator.log

      - name: Commit physical surgery only after complete green gate
        if: success() && github.event_name == 'push'
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ErdosTernary2.lean
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'proof: commit comparator-green V2 physical surgery [skip ci]'
          git push origin HEAD:sol/gpt56-infinite-control-production

      - name: Self-report complete error cluster
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          set -euxo pipefail
          {
            echo '# V2 Full Production Gate Result'
            echo
            echo "Source commit: $GITHUB_SHA"
            echo
            echo '## Payload'
            echo '```text'
            cat payload.log 2>/dev/null || true
            echo '```'
            for pair in \
              'Root V2|root-v2.log' \
              'Attached stack|attached-stack.log' \
              'Pre-Omega|preomega.log' \
              'Full monolith|full-monolith.log' \
              'Adapters|adapters.log' \
              'Lake build|lake-build.log' \
              'Comparator|comparator.log'
            do
              title=${pair%%|*}
              file=${pair#*|}
              echo
              echo "## $title"
              echo '```text'
              if [ -f "$file" ]; then
                grep -E 'error:|unsolved goals|declaration uses|sorryAx|unknown identifier|type mismatch|application type mismatch|omega could not prove|MISSING|Your solution is okay|COMPARATOR RESULT' "$file" | tail -220 || tail -80 "$file" || true
              else
                echo 'No log produced.'
              fi
              echo '```'
            done
            echo
            echo '## Status vector'
            echo '```text'
            for f in .status-*; do echo "$f=$(cat "$f" 2>/dev/null || echo missing)"; done
            echo '```'
          } > V2_ONE_ERROR_RESULT.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add V2_ONE_ERROR_RESULT.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ci: report full V2 error cluster [skip ci]'
          git push origin HEAD:sol/gpt56-infinite-control-production
