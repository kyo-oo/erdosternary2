name: Perfect Power Collision Judge

on:
  push:
    branches:
      - sol/gpt56-universal-four-power-execution-20260827
  workflow_dispatch:

jobs:
  judge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Setup Lean with cache
        uses: leanprover/lean-action@v1
        with:
          build: false

      - name: Compile exact local dependency closure
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee perfect-power-closure.log
          from pathlib import Path
          import re, subprocess, sys

          ROOT = Path('GSTGraphV2PerfectPowerBlockCollision.lean')
          BUILD = Path('.lake/build/lib/lean')
          import_re = re.compile(r'^\s*import\s+(.+?)\s*$')

          def local_path(module: str) -> Path:
              return Path(*module.split('.')).with_suffix('.lean')

          def imports_of(path: Path):
              result=[]
              for raw in path.read_text(encoding='utf-8').splitlines():
                  code=raw.split('--',1)[0].rstrip()
                  m=import_re.match(code)
                  if m:
                      result.extend(m.group(1).split())
              return result

          order=[]; permanent=set(); temporary=[]
          def visit(module: str):
              if module in permanent: return
              path=local_path(module)
              if not path.exists(): return
              if module in temporary:
                  raise SystemExit('LOCAL_IMPORT_CYCLE=' + ' -> '.join(temporary+[module]))
              temporary.append(module)
              for dep in imports_of(path): visit(dep)
              temporary.pop(); permanent.add(module); order.append((module,path))

          for module in imports_of(ROOT): visit(module)
          print('TARGET=GSTGraphV2PerfectPowerBlockCollision')
          print(f'LOCAL_IMPORT_CLOSURE_COUNT={len(order)}')
          BUILD.mkdir(parents=True, exist_ok=True)
          for module,path in order:
              out=BUILD.joinpath(*module.split('.')).with_suffix('.olean')
              out.parent.mkdir(parents=True, exist_ok=True)
              if out.exists():
                  print(f'CACHED {module}')
                  continue
              print(f'COMPILE {module}', flush=True)
              p=subprocess.run(['lake','env','lean','-o',str(out),str(path)], text=True)
              if p.returncode:
                  print(f'DEPENDENCY_FAILURE={module}')
                  sys.exit(p.returncode)
          print('LOCAL_IMPORT_CLOSURE_GREEN=1')
          PY

      - name: Compile collision theorem
        shell: bash
        run: |
          set -o pipefail
          lake env lean -o .lake/build/lib/lean/GSTGraphV2PerfectPowerBlockCollision.olean GSTGraphV2PerfectPowerBlockCollision.lean 2>&1 | tee perfect-power-collision.log
          code=${PIPESTATUS[0]}
          echo "LEAN_EXIT=${code}" | tee -a perfect-power-collision.log
          exit "$code"

      - name: Axiom audit collision theorem
        if: success()
        shell: bash
        run: |
          cat > PerfectPowerCollisionAudit.lean <<'EOF'
          import GSTGraphV2PerfectPowerBlockCollision
          #print axioms GSTGraphV2PerfectPowerBlockCollision.canonical_perfect_power_block_collision
          EOF
          lake env lean PerfectPowerCollisionAudit.lean 2>&1 | tee perfect-power-axioms.log
          if grep -Fq 'sorryAx' perfect-power-axioms.log; then
            echo 'COLLISION_SORRYAX=1' | tee -a perfect-power-axioms.log
            exit 1
          fi
          echo 'COLLISION_AXIOM_AUDIT_GREEN=1' | tee -a perfect-power-axioms.log

      - name: Upload judge logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perfect-power-collision-logs
          path: |
            perfect-power-closure.log
            perfect-power-collision.log
            perfect-power-axioms.log
          if-no-files-found: ignore
