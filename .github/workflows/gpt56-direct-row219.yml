name: GPT56 Direct Row219 Verify

on:
  push:
    branches:
      - sol/gpt56-four-power-relocation-prod-20260903
    paths:
      - GSTFourPowerDirectTwoHundredNineteenthRow.lean
      - .github/workflows/gpt56-direct-row219.yml
  workflow_dispatch:

jobs:
  direct-row219-kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
      - name: Compile exact fresh-production dependency closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean
          modules=(
            GSTCanonicalTailStateIso
            GSTFourPowerDirectResidue
            GSTFourPowerDirectResidue27
            GSTFourPowerDirectResidue81
            GSTFourPowerExponentTritObstruction
            GSTFourPowerExactExponentPeriod
            GSTFourPowerDirectExistence
            GSTFourPowerDirectAdditionCarry
            GSTFourPowerDirectHappyBridge
            GSTFourPowerAffineOrbit
            GSTFourPowerAffinePrefixIsometry
          )
          for module in "${modules[@]}"; do
            lake env lean -o ".lake/build/lib/lean/${module}.olean" "${module}.lean" 2>&1 | tee "${module}.log"
            ! grep -E 'declaration uses .sorry.|sorryAx|unknown identifier|unknown module prefix|unsolved goals|error:' "${module}.log"
          done
      - name: Compile direct row219 physical constructor
        shell: bash
        run: |
          set -euo pipefail
          ulimit -s 65536
          lake env lean -o .lake/build/lib/lean/GSTFourPowerDirectTwoHundredNineteenthRow.olean GSTFourPowerDirectTwoHundredNineteenthRow.lean 2>&1 | tee direct-row219.log
          ! grep -E 'declaration uses .sorry.|sorryAx|unknown identifier|unknown module prefix|unsolved goals|error:' direct-row219.log
      - name: Reject forbidden proof escapes
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE '\b(sorry|admit|axiom)\b|sorryAx|False\.elim' GSTFourPowerDirectTwoHundredNineteenthRow.lean
      - name: Axiom audit direct row219 theorem
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/Audit.lean <<'EOF'
          import GSTFourPowerDirectTwoHundredNineteenthRow
          #print axioms GSTFourPowerDirectTwoHundredNineteenthRow.commonTwo_of_mod308712904366595890319978599341504655567257431166409329421135089732346509723631627417356013073234099809467_220
          #print axioms GSTFourPowerDirectTwoHundredNineteenthRow.physical_happy_of_mod308712904366595890319978599341504655567257431166409329421135089732346509723631627417356013073234099809467_220
          #print axioms GSTFourPowerDirectTwoHundredNineteenthRow.four_power_happy_propagates_of_next_mod308712904366595890319978599341504655567257431166409329421135089732346509723631627417356013073234099809467_220
          EOF
          lake env lean /tmp/Audit.lean 2>&1 | tee audit.log
          ! grep -E 'sorryAx' audit.log
      - name: Direct physical-row marker
        run: echo DIRECT_ROW219_RELOCATED_HAPPY_KERNEL_GREEN
