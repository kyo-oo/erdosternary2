name: GPT6 GST Quadratic Nonlinear Ninth-Trit HGate
on:
  push:
    branches: [gpt6/problem406-fourth-trit-discovery-20261029]
    paths: [GSTWorldtraceQuadraticHGateDiscovery.lean, GSTWorldtraceQuadraticBlockLift.lean, .github/workflows/gpt6_gst_quadratic_hgate.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-physical:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Lean RC2 and verified GST direct HGate dependencies
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
          lake build GSTWorldtraceBlockLift GSTFourPowerDirectCreationMaster GSTFourPowerThirdWave
          lake env lean -o .lake/build/lib/lean/GSTWorldtraceCoeffStability.olean GSTWorldtraceCoeffStability.lean
          lake env lean -o .lake/build/lib/lean/GSTOmegaArbitraryDelay.olean GSTOmegaArbitraryDelay.lean
          lake env lean -o .lake/build/lib/lean/GSTOmegaExactDelayedEscape.olean GSTOmegaExactDelayedEscape.lean
          lake env lean -o .lake/build/lib/lean/GSTOmegaThreeTritMultiplierLaw.olean GSTOmegaThreeTritMultiplierLaw.lean
          lake env lean -o .lake/build/lib/lean/GSTOmegaResidueClassExit.olean GSTOmegaResidueClassExit.lean
          lake env lean -o .lake/build/lib/lean/GSTProblem406HGateCoreClass.olean GSTProblem406HGateCoreClass.lean
          lake env lean -o .lake/build/lib/lean/GSTProblem406HGateCoreIntegration.olean GSTProblem406HGateCoreIntegration.lean
          lake env lean -o .lake/build/lib/lean/GSTWorldtraceQuadraticBlockLift.olean GSTWorldtraceQuadraticBlockLift.lean
      - name: Strict kernel check original nonlinear physical HGate and creation certificate
        shell: bash
        run: |
          set -euo pipefail
          lake env lean GSTWorldtraceQuadraticHGateDiscovery.lean 2>&1 | tee ninth-trit-exact.log
          ! grep -E 'error:|sorryAx|unknown identifier|unsolved goals|declaration uses .sorry.|gst_four_power_direct_existence_inline' ninth-trit-exact.log
          echo GST_WORLDTRACE_QUADRATIC_NINTH_TRIT_HGATE_PASS=1
