name: GPT56 Atomic RED Report

on:
  push:
    paths:
      - '.github/workflows/gpt56_atomic_red_report.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sol/gpt56-close-one-error
          fetch-depth: 0
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euxo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.33.0-rc2
      - name: Resolve comparator environment
        shell: bash
        timeout-minutes: 20
        run: |
          set -euxo pipefail
          lake update
          lake exe cache get
          lake build GSTTactic
      - name: Reproduce live monolith failure and publish exact diagnostic
        shell: bash
        timeout-minutes: 40
        run: |
          set +e
          lake env lean ErdosTernary2.lean > gpt56-red.log 2>&1
          rc=$?
          {
            echo '# GPT-5.6 Sol Atomic RED Diagnostic'
            echo
            echo "Commit under test: $(git rev-parse HEAD)"
            echo "Lean exit code: $rc"
            echo
            echo '## Error summary'
            echo '```text'
            grep -n -E 'error:|declaration has metavariables|already declared|unknown identifier|type mismatch|unsolved goals' gpt56-red.log | tail -n 120 || true
            echo '```'
            echo
            echo '## Tail of Lean output'
            echo '```text'
            tail -n 220 gpt56-red.log
            echo '```'
          } > GPT56_ATOMIC_RED_DIAGNOSTIC.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add GPT56_ATOMIC_RED_DIAGNOSTIC.md
          git commit -m 'Record GPT56 atomic RED diagnostic' || true
          git push origin HEAD:sol/gpt56-close-one-error
          exit $rc
