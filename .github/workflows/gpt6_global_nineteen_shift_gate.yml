name: GPT6 Global 19-Shift Physical HGate Kernel
on:
  push:
    branches: [gpt6/problem406-seventh-trit-worldtrace-20261029]
    paths:
      - GSTProblem406SyndeticArchimedeanGate.lean
      - GSTProblem406ArchimedeanPhysicalEscape.lean
      - .github/workflows/gpt6_global_nineteen_shift_gate.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
          lake build GSTProblem406ArchimedeanPhysicalEscape
      - name: Exact 19-piece interval kernel and global CommonTwo audit
        shell: bash
        run: |
          set -euo pipefail
          lake env lean GSTProblem406SyndeticArchimedeanGate.lean 2>&1 | tee nineteen-shift.log
          ! grep -E 'error:|sorryAx|unknown identifier|unsolved goals|declaration uses .sorry.' nineteen-shift.log
          grep -F 'commonTwo_within_eighteen' nineteen-shift.log
          grep -F 'thirdWave_within_eighteen' nineteen-shift.log
          echo GLOBAL_NINETEEN_SHIFT_PHYSICAL_GATE_KERNEL_PASS=1
