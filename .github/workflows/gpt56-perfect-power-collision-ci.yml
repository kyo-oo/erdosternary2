name: GPT56 Perfect Power Collision

on:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install exact Lean toolchain
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned Mathlib
        shell: bash
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          rm -f lake-manifest.json
          lake update
          lake exe cache get
      - name: Compile perfect-power collision stack
        shell: bash
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p .lake/build/lib/lean
          for f in \
            GSTGraphV2CoupledUFlux \
            GSTGraphV2CoupledUPhysicalBridge \
            GST2DMixedEmergence \
            GSTU2DAtomicBridge \
            GSTU2DEventTransport \
            GSTU2DExactCrossingCharge \
            GSTU2DSharpCrossingBlock \
            GSTCanonicalSevenAxisBridge \
            GSTGraphV2InfiniteControl \
            GSTU2DPureDivergence83 \
            GSTU2DCanonicalPhaseDensity \
            GSTGraphV2UnifiedPowerRectangle \
            GSTGraphV2UnifiedVerticalTelescope \
            GSTGraphV2PerfectPowerAncestry \
            GSTGraphV2PerfectPowerBlockProbe; do
              lake env lean -o ".lake/build/lib/lean/$f.olean" "$f.lean"
          done
          lake env lean GSTGraphV2PerfectPowerBlockCollision.lean
