name: GST 406 Genuine Pure-Power Local Phase Audit
on:
  push:
    branches: [gpt6/problem406-terminal-u-boundary-investigation-20261030]
    paths:
      - GSTProblem406TruePowerPhaseMismatch.lean
      - lakefile.toml
      - .github/workflows/gst_406_pure_phase_countermodel.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Lean and mathlib
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake update
          lake exe cache get
      - name: Verify literal 4^8 phase mismatch, U-defect and axiom status
        run: |
          set -euo pipefail
          lake build GST406PurePhaseMismatch 2>&1 | tee purephase-build.log
          lake env lean GSTProblem406TruePowerPhaseMismatch.lean 2>&1 | tee purephase-axioms.log
          ! grep -E 'error:|sorryAx|unsolved goals|unknown identifier|declaration uses .sorry.' purephase-build.log purephase-axioms.log
          grep -F 'no_universal_local_pure_power_phase_monotonicity' purephase-axioms.log
          echo GST_406_PURE_PHASE_K8_COUNTERMODEL_PASS=1
