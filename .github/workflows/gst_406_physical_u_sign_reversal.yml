name: GST 406 Genuine Power U Sign Reversal
on:
  push:
    branches: [gpt6/problem406-u-flux-tail-closure-audit-20261030]
    paths:
      - GST406PhysicalULocalSign.lean
      - lakefile.toml
      - .github/workflows/gst_406_physical_u_sign_reversal.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict_sign:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake update
          lake exe cache get
      - name: Exact original K8 K11 sign reversal kernel check
        shell: bash
        run: |
          set -euo pipefail
          lake build GST406PhysicalULocalSignAudit 2>&1 | tee /tmp/local-gst.log
          lake env lean GST406PhysicalULocalSign.lean 2>&1 | tee /tmp/local-axioms.log
          ! grep -E 'error:|sorryAx|unsolved goals|unknown identifier|declaration uses .sorry.' /tmp/local-gst.log /tmp/local-axioms.log
          grep -F 'genuine_power_u_sign_reversal' /tmp/local-axioms.log
          echo GST_406_GENUINE_POWER_SIGN_PROBE_PASS=1
