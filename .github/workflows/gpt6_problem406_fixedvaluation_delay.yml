name: GST fixed valuation natural-power arbitrary gate delay
on:
  push:
    branches: [gpt6/problem406-sharp-peel-residual-20261029]
    paths: [GSTProblem406FixedValuationArbitraryDelay.lean, .github/workflows/gpt6_problem406_fixedvaluation_delay.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-delay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Compile exact physical affine prefix and exponent congruences
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
          lake build GSTFourPowerAffineOrbit
          lake env lean -o .lake/build/lib/lean/GSTFourPowerExactExponentPeriod.olean GSTFourPowerExactExponentPeriod.lean
          lake env lean -o .lake/build/lib/lean/GSTFourPowerAffinePrefixIsometry.olean GSTFourPowerAffinePrefixIsometry.lean
          lake env lean -o .lake/build/lib/lean/GSTFourPowerAffineOntologicalCompleteness.olean GSTFourPowerAffineOntologicalCompleteness.lean
      - name: Strict axiom audit for fixed-valuation delayed original source
        shell: bash
        run: |
          set -euo pipefail
          lake env lean GSTProblem406FixedValuationArbitraryDelay.lean 2>&1 | tee gst406-fixedvaluation-delay.log
          ! grep -E 'error:|sorryAx|unknown identifier|unsolved goals|declaration uses .sorry.|gst_four_power_direct_existence_inline' gst406-fixedvaluation-delay.log
          echo GST406_FIXED_V3_TWO_ARBITRARY_DELAY_PASS=1
