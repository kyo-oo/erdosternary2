name: GPT56 Monolith Surgery Trace 2
on:
  push:
    branches: [sol/gpt56-canonical-tail-escape-20260827]
  workflow_dispatch:

jobs:
  trace2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Classify direct local import edges
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('ErdosTernary2.lean')
          text=root.read_text(encoding='utf-8')
          decl_re=re.compile(r'^\s*(?:theorem|lemma|def|abbrev|inductive|structure|class)\s+([A-Za-z0-9_\.]+)',re.M)
          root_decls=set(decl_re.findall(text))
          imports=[]
          for raw in text.splitlines():
              code=raw.split('--',1)[0].strip()
              if code.startswith('import '): imports += code[7:].split()
          seen=[]
          for m in imports:
              if m not in seen: seen.append(m)
          print('DIRECT_LOCAL_IMPORTS=',len([m for m in seen if Path(m+'.lean').exists()]))
          print('=== CLASSIFICATION ===')
          for m in seen:
              p=Path(*m.split('.')).with_suffix('.lean')
              if not p.exists(): continue
              src=p.read_text(encoding='utf-8')
              decls=set(decl_re.findall(src))
              overlap=sorted(decls & root_decls)
              external=[]
              for n in sorted(decls-root_decls):
                  if re.search(r'(?<![A-Za-z0-9_])'+re.escape(n)+r'(?![A-Za-z0-9_])',text):
                      external.append(n)
              tag='PURE_INLINE_DUP' if overlap and not external else ('MIXED' if overlap else 'EXTERNAL')
              print(f'{tag}\t{m}\toverlap={len(overlap)}\texternal={len(external)}')
              if overlap: print('  overlap:', ','.join(overlap[:18]))
              if external: print('  external:', ','.join(external[:18]))
          PY
