name: GST 406 Pure-Power Nonlocal Transport Proof
on:
  push:
    branches: [gpt6/problem406-pure-power-nonlocal-contradiction-20261030]
    paths:
      - GSTProblem406PurePowerNonlocalTransport.lean
      - lakefile.toml
      - .github/workflows/gst406_pure_nonlocal_transport.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Lean and mathlib cache
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake update
          lake exe cache get
      - name: Exact nonlocal exponent-lift kernel and axiom audit
        run: |
          set -euo pipefail
          lake build GST406PureNonlocalTransport 2>&1 | tee build.log
          lake env lean GSTProblem406PurePowerNonlocalTransport.lean 2>&1 | tee axioms.log
          ! grep -E 'error:|sorryAx|unsolved goals|unknown identifier|declaration uses .sorry.' build.log axioms.log
          grep -F 'no_uniform_bounded_three_step_reappearance' axioms.log
          echo GST406_ALL_HORIZON_PURE_NONLOCAL_KERNEL_PASS=1
