name: GST exact non-Archimedean peel fixed point and physical delayed survivors
on:
  push:
    branches: [gpt6/problem406-exponent-termination-20261029]
    paths:
      - GSTProblem406GSTPeelFixedPoint.lean
      - .github/workflows/gpt6_problem406_peel_fixedpoint.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixedpoint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build exact GST 4-power affine orbit and nonlinear peel
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
          lake build GSTFourPowerAffineOrbit
          lake env lean -o .lake/build/lib/lean/GSTFourPowerAffineExponentPeel.olean GSTFourPowerAffineExponentPeel.lean
      - name: Kernel verify GST fixedpoint and exact physical source digits
        shell: bash
        run: |
          set -euo pipefail
          lake env lean GSTProblem406GSTPeelFixedPoint.lean 2>&1 | tee gst406-peel-fixedpoint.log
          ! grep -E 'error:|sorryAx|unknown identifier|unsolved goals|declaration uses .sorry.|gst_four_power_direct_existence_inline' gst406-peel-fixedpoint.log
          echo GST406_PHYSICAL_3ADIC_PEEL_FIXEDPOINT_PASS=1
