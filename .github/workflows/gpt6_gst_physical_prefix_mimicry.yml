name: GST original physical pair prefix mimicry
on:
  push:
    branches: [gpt6/problem406-cubic-universal-research-20261029]
    paths: [GSTFourPowerAffinePrefixIsometry.lean, GSTFourPowerAffinePrefixPhysicalMimicry.lean, GSTFourPowerAffineOntologicalCompleteness.lean, .github/workflows/gpt6_gst_physical_prefix_mimicry.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pair-prefix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build exact GST affine-prefix physical base
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
          lake build GSTFourPowerAffineOrbit
          lake env lean -o .lake/build/lib/lean/GSTFourPowerExactExponentPeriod.olean GSTFourPowerExactExponentPeriod.lean
          lake env lean -o .lake/build/lib/lean/GSTFourPowerAffinePrefixIsometry.olean GSTFourPowerAffinePrefixIsometry.lean
          lake env lean -o .lake/build/lib/lean/GSTFourPowerAffineOntologicalCompleteness.olean GSTFourPowerAffineOntologicalCompleteness.lean
      - name: Strict kernel certificate for both physical perfect-power prefixes
        shell: bash
        run: |
          set -euo pipefail
          lake env lean GSTFourPowerAffinePrefixPhysicalMimicry.lean 2>&1 | tee gst-original-physical-prefix.log
          ! grep -E 'error:|sorryAx|unknown identifier|unsolved goals|declaration uses .sorry.|gst_four_power_direct_existence_inline' gst-original-physical-prefix.log
          echo GST_PHYSICAL_BAD_PAIR_PREFIX_MIMICRY_PASS=1
