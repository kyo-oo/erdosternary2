name: GPT56 Step6 Boundary Cert

on:
  push:
    branches:
      - sol/gpt56-canonical-tail-escape-20260827
    paths:
      - 'GSTFinalPrefixOneStep6Boundary.lean'
      - '.github/workflows/gpt56-step6-boundary.yml'
  workflow_dispatch:

jobs:
  step6:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Install exact Lean RC2 and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          rm -f lake-manifest.json
          lake update
          lake exe cache get
      - name: Materialize import closure
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          ROOT=Path('GSTFinalPrefixOneStep6Boundary.lean')
          BUILD=Path('.lake/build/lib/lean')
          rx=re.compile(r'^\s*import\s+(.+?)\s*$')
          def path(m): return Path(*m.split('.')).with_suffix('.lean')
          def imports(p):
              out=[]
              for raw in p.read_text().splitlines():
                  m=rx.match(raw.split('--',1)[0].rstrip())
                  if m: out.extend(m.group(1).split())
              return out
          done=set(); stack=[]; order=[]
          def visit(m):
              if m in done: return
              p=path(m)
              if not p.exists(): return
              if m in stack: raise SystemExit('cycle')
              stack.append(m)
              for d in imports(p): visit(d)
              stack.pop(); done.add(m); order.append((m,p))
          for m in imports(ROOT): visit(m)
          BUILD.mkdir(parents=True,exist_ok=True)
          print('STEP6_IMPORT_COUNT='+str(len(order)))
          for m,p in order:
              o=BUILD.joinpath(*m.split('.')).with_suffix('.olean')
              o.parent.mkdir(parents=True,exist_ok=True)
              if o.exists(): continue
              subprocess.run(['lake','env','lean','-o',str(o),str(p)],check=True)
          print('STEP6_IMPORTS_GREEN=1')
          PY
      - name: Compile Step 6
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean GSTFinalPrefixOneStep6Boundary.lean 2>&1 | tee step6.log
          echo STEP6_PROOF_GREEN=1
      - name: Axiom audit
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat > Step6Audit.lean <<'EOF'
          import GSTFinalPrefixOneStep6Boundary
          #print axioms GSTFinalPrefixOneStep6Boundary.canonical_controller_boundary_identification
          #print axioms GSTFinalPrefixOneStep6Boundary.canonical_right_bad_forces_weighted_cross_nonpositive
          EOF
          lake env lean Step6Audit.lean 2>&1 | tee step6-axioms.log
          if grep -Fq sorryAx step6-axioms.log; then
            echo STEP6_FORBIDDEN_SORRYAX=1
            exit 1
          fi
          echo STEP6_AXIOM_AUDIT_GREEN=1
