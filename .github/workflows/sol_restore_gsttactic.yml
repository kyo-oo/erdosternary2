name: Sol Restore GSTTactic

on:
  push:
    branches:
      - sol/gpt56-close-one-error
    paths:
      - .github/workflows/sol_restore_gsttactic.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sol/gpt56-close-one-error
      - name: Restore exact GSTTactic source
        shell: bash
        run: |
          cp ker07-snapshot/GSTTactic.lean GSTTactic.lean
          python3 - <<'PY'
          from pathlib import Path
          p = Path('GSTTactic.lean')
          lines = p.read_text(encoding='utf-8').splitlines(keepends=True)
          stop = next(i for i, line in enumerate(lines) if line.startswith('import Lean.Elab.Tactic'))
          changed = 0
          for i in range(stop):
              if lines[i].startswith('/-'):
                  lines[i] = '--' + lines[i][2:]
                  changed += 1
          assert changed > 0
          p.write_text(''.join(lines), encoding='utf-8')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GSTTactic.lean
          git commit -m "build: restore GSTTactic module at original import path"
          git push origin HEAD:sol/gpt56-close-one-error
