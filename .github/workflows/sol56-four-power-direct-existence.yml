name: SOL56 Four-Power Direct Existence

on:
  push:
    branches:
      - sol/gpt56-canonical-tail-escape-20260827
    paths:
      - GSTFourPowerDirectExistence.lean
      - GSTGraphV2FourPowerResidueObstruction.lean
      - GSTGraphV2FourPowerRelocation.lean
      - .github/workflows/sol56-four-power-direct-existence.yml
  workflow_dispatch:

concurrency:
  group: sol56-four-power-direct-existence
  cancel-in-progress: true

jobs:
  direct-existence-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
      - name: Compile direct arithmetic dependency closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean
          lake env lean \
            -o .lake/build/lib/lean/GSTGraphV2FourPowerRelocation.olean \
            GSTGraphV2FourPowerRelocation.lean 2>&1 | tee direct-relocation-dep.log
          lake env lean \
            -o .lake/build/lib/lean/GSTGraphV2FourPowerResidueObstruction.olean \
            GSTGraphV2FourPowerResidueObstruction.lean 2>&1 | tee direct-residue-dep.log
          ! grep -E 'declaration uses .sorry.|sorryAx|unknown identifier|unknown module prefix|unsolved goals|error:' \
            direct-relocation-dep.log direct-residue-dep.log
      - name: Compile and axiom-audit direct existence module
        shell: bash
        run: |
          set -euo pipefail
          lake env lean GSTFourPowerDirectExistence.lean 2>&1 | tee direct-existence.log
          ! grep -E 'declaration uses .sorry.|sorryAx|unknown identifier|unknown module prefix|unsolved goals|error:' \
            direct-existence.log
