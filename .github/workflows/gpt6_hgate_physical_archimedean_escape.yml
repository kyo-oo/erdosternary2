name: GPT6 hGate Physical Archimedean Escape Kernel
on:
  push:
    branches: [gpt6/problem406-seventh-trit-worldtrace-20261029]
    paths:
      - GSTProblem406ArchimedeanPhysicalEscape.lean
      - .github/workflows/gpt6_hgate_physical_archimedean_escape.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physical-archimedean-kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Build exact source-local GST prerequisites
        shell: bash
        run: |
          set -euo pipefail
          lake build GSTFourPowerDirectNo22 GSTFourPowerNo22Magnitude GSTFourPowerThirdWave GSTFourPowerDirectCreationMaster
      - name: Lean kernel and axiom audit for global magnitude-to-hGate rule
        shell: bash
        run: |
          set -euo pipefail
          lake env lean GSTProblem406ArchimedeanPhysicalEscape.lean 2>&1 | tee physical-archimedean-kernel.log
          ! grep -E 'error:|sorryAx|unknown identifier|unsolved goals|declaration uses .sorry.' physical-archimedean-kernel.log
          grep -F "'GSTProblem406ArchimedeanPhysicalEscape.CommonTwo_of_archimedean_escape' depends on axioms:" physical-archimedean-kernel.log
          grep -F "'GSTProblem406ArchimedeanPhysicalEscape.original_thirdWave_of_archimedean_escape' depends on axioms:" physical-archimedean-kernel.log
          echo GST_406_PHYSICAL_ARCHIMEDEAN_HGATE_KERNEL_PASS=1
