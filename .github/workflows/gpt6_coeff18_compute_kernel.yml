name: GPT6 GST Exact Coefficient 17 Kernel
on:
  push:
    branches:
      - gpt6/erdos-coeff18-numeric-kernel-20261029
    paths:
      - GSTWorldtraceCoeff18Compute.lean
      - .github/workflows/gpt6_coeff18_compute_kernel.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Lean and LTE coefficient module
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
          lake build GSTCanonicalTailLTE
      - name: Kernel-verify small modular cubic recurrence, exact coefficient
        shell: bash
        run: |
          set -euo pipefail
          lake env lean GSTWorldtraceCoeff18Compute.lean 2>&1 | tee gst-coeff18-compute.log
          ! grep -E 'error:|unknown identifier|unsolved goals|sorryAx|declaration uses .sorry.' gst-coeff18-compute.log
          echo GST_COEFF17_MOD18_KERNEL_GREEN=1
