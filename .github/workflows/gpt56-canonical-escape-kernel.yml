name: GPT56 Canonical Escape Kernel

on:
  push:
    branches:
      - sol/gpt56-canonical-tail-escape-20260827
    paths:
      - '.github/workflows/gpt56-canonical-escape-kernel.yml'
      - 'GSTGraphV2CanonicalEscapeProbe.lean'
      - 'GSTGraphV2CanonicalTerminalExtinctionProbe.lean'
      - 'GSTGraphV2SeededPrefix.lean'
      - 'GSTGraphV2CanonicalRenormalization.lean'
      - 'GSTGraphV2CanonicalEscape.lean'
      - 'GSTGraphV2PerfectPowerBlockCollision.lean'
  workflow_dispatch:

concurrency:
  group: gpt56-canonical-escape-kernel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Pin source
        run: echo "SOURCE_HEAD=$(git rev-parse HEAD)"
      - name: Install exact Lean and restore project cache
        uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
      - name: Materialize local import closure
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess

          roots = [
              Path("GSTGraphV2CanonicalEscapeProbe.lean"),
              Path("GSTGraphV2CanonicalTerminalExtinctionProbe.lean"),
          ]
          build = Path(".lake/build/lib/lean")
          import_re = re.compile(r"^\s*import\s+(.+?)\s*$")

          def local_path(module):
              return Path(*module.split(".")).with_suffix(".lean")

          def imports_of(path):
              out = []
              for raw in path.read_text(encoding="utf-8").splitlines():
                  code = raw.split("--", 1)[0].rstrip()
                  match = import_re.match(code)
                  if match:
                      out.extend(match.group(1).split())
              return out

          order, done, stack = [], set(), []

          def visit(module):
              if module in done:
                  return
              path = local_path(module)
              if not path.exists():
                  return
              if module in stack:
                  raise SystemExit("LOCAL_IMPORT_CYCLE=" + " -> ".join(stack + [module]))
              stack.append(module)
              for dependency in imports_of(path):
                  visit(dependency)
              stack.pop()
              done.add(module)
              order.append((module, path))

          for root in roots:
              for dependency in imports_of(root):
                  visit(dependency)

          build.mkdir(parents=True, exist_ok=True)
          for module, path in order:
              output = build.joinpath(*module.split(".")).with_suffix(".olean")
              output.parent.mkdir(parents=True, exist_ok=True)
              if output.exists():
                  continue
              print("COMPILE", module, flush=True)
              subprocess.run(
                  ["lake", "env", "lean", "-o", str(output), str(path)],
                  check=True,
              )
          PY
      - name: Compile canonical escape probe
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean GSTGraphV2CanonicalEscapeProbe.lean 2>&1 |
            tee canonical-escape-kernel.log
      - name: Compile terminal extinction probe
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean GSTGraphV2CanonicalTerminalExtinctionProbe.lean 2>&1 |
            tee canonical-terminal-extinction-kernel.log
      - name: Reject trust-expanding shortcuts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          files=(
            GSTGraphV2SeededPrefix.lean
            GSTGraphV2CanonicalRenormalization.lean
            GSTGraphV2CanonicalEscape.lean
            GSTGraphV2CanonicalTerminalExtinctionProbe.lean
            GSTGraphV2PerfectPowerBlockCollision.lean
          )
          existing=()
          for file in "${files[@]}"; do
            if [[ -f "$file" ]]; then existing+=("$file"); fi
          done
          if (("${#existing[@]}")); then
            if grep -nE '(^|[^A-Za-z0-9_])(sorry|admit|native_decide|unsafe)([^A-Za-z0-9_]|$)|^[[:space:]]*axiom[[:space:]]' "${existing[@]}"; then
              echo FORBIDDEN_TRUST_EXPANSION=1
              exit 1
            fi
          fi
          if [[ -f canonical-escape-kernel.log ]] &&
             grep -Fq 'sorryAx' canonical-escape-kernel.log; then
            echo FORBIDDEN_SORRYAX=1
            exit 1
          fi
          if [[ -f canonical-terminal-extinction-kernel.log ]] &&
             grep -Fq 'sorryAx' canonical-terminal-extinction-kernel.log; then
            echo FORBIDDEN_TERMINAL_SORRYAX=1
            exit 1
          fi
          echo CANONICAL_ESCAPE_TRUST_AUDIT_GREEN=1
