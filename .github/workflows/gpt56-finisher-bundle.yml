name: GPT56 FINISHER Bundle

on:
  push:
    branches:
      - sol/problem406-professionalization-green-20260906
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-finisher:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'Create FINISHER proof bundle')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build and commit FINISHER bundle
        shell: bash
        run: |
          set -euo pipefail
          TARGET_REF="de11dc2c5ee340fee1929ba2adc6834a72ab9879"
          git cat-file -e "${TARGET_REF}^{commit}"

          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          import shutil
          import subprocess
          from collections import Counter
          from pathlib import Path

          ROOT = Path.cwd()
          FINISHER = ROOT / "FINISHER"
          TARGET = "de11dc2c5ee340fee1929ba2adc6834a72ab9879"
          MAIN = Path("ErdosTernary2.lean")
          EXTERNAL = ("Mathlib", "Std", "Lean", "Init")
          IMPORT_RE = re.compile(r"^\s*import\s+([A-Za-z0-9_'.]+)\s*$")
          DECL_RE = re.compile(
              r"^\s*(?:@[\w\[\]\s,._:=()'\"/-]+\s+)*"
              r"(?P<kind>theorem|lemma|def|abbrev|axiom|opaque|inductive|structure|class|instance)"
              r"\s+(?P<name>[^\s:{(]+)"
          )

          def git_bytes(ref: str, path: str) -> bytes:
              return subprocess.check_output(["git", "show", f"{ref}:{path}"])

          def git_text(ref: str, path: str) -> str:
              return git_bytes(ref, path).decode("utf-8")

          def exists_at(ref: str, path: str) -> bool:
              return subprocess.run(["git", "cat-file", "-e", f"{ref}:{path}"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode == 0

          def write_bytes(dest: Path, data: bytes) -> None:
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(data)

          def strip_comments(src: str) -> str:
              out = []
              i = 0
              depth = 0
              while i < len(src):
                  if depth == 0 and src.startswith("--", i):
                      j = src.find("\n", i)
                      if j == -1:
                          break
                      out.append("\n")
                      i = j + 1
                      continue
                  if src.startswith("/-", i):
                      depth += 1
                      i += 2
                      continue
                  if depth > 0 and src.startswith("-/", i):
                      depth -= 1
                      i += 2
                      continue
                  ch = src[i]
                  if depth == 0:
                      out.append(ch)
                  elif ch == "\n":
                      out.append("\n")
                  i += 1
              return "".join(out)

          def module_to_path(module: str) -> Path:
              return Path(*module.split(".")).with_suffix(".lean")

          def direct_imports_from_ref(ref: str, path: Path) -> list[str]:
              text = git_text(ref, str(path))
              return [m.group(1) for line in text.splitlines() if (m := IMPORT_RE.match(line))]

          def custom_import_closure(ref: str, start: Path) -> list[Path]:
              seen: set[Path] = set()
              stack = [start]
              while stack:
                  path = stack.pop()
                  if path in seen:
                      continue
                  if not exists_at(ref, str(path)):
                      continue
                  seen.add(path)
                  for module in direct_imports_from_ref(ref, path):
                      if module.startswith(EXTERNAL):
                          continue
                      candidate = module_to_path(module)
                      if exists_at(ref, str(candidate)) and candidate not in seen:
                          stack.append(candidate)
              return sorted(seen, key=str)

          def family(path: str, name: str) -> str:
              x = f"{path} {name}".lower()
              def has(*items: str) -> bool:
                  return any(item in x for item in items)
              if has("erdos", "problem406", "universal", "final"):
                  return "Final Problem406 / universal theorem layer"
              if has("tdt", "duality", "transcendence"):
                  return "True Duality Transcendence layer"
              if has("cascade", "tower", "stable", "bridge", "crossing"):
                  return "Bridge / cascade / crossing layer"
              if has("bounded", "modular_depth", "decide", "struct", "verification"):
                  return "Finite verification / structural decision layer"
              if has("four", "pow4", "power", "residue", "mod9", "mod27", "mod81"):
                  return "Four-power / residue arithmetic layer"
              if has("digit", "ternary", "noternarytwo", "hastwo", "base3"):
                  return "Ternary digit arithmetic layer"
              if has("carry", "affine", "information", "coordinate", "quotient"):
                  return "Carry / affine information layer"
              if has("canonical", "tail", "collision", "wave", "u2d", "phase", "escape"):
                  return "Canonical tail / collision / wave layer"
              if has("tactic", "macro", "elab", "syntax"):
                  return "Custom tactic / automation layer"
              if has("gst", "graph", "navigation", "world", "ontological", "space", "happy"):
                  return "General Space Theory proper"
              return "Other support theorem layer"

          def line_count_text(text: str) -> int:
              return 0 if text == "" else text.count("\n") + (0 if text.endswith("\n") else 1)

          def declarations_from_target(paths: list[Path]) -> list[dict[str, object]]:
              decls: list[dict[str, object]] = []
              for path in paths:
                  clean = strip_comments(git_text(TARGET, str(path)))
                  for line_no, line in enumerate(clean.splitlines(), 1):
                      m = DECL_RE.match(line)
                      if not m:
                          continue
                      name = m.group("name")
                      kind = m.group("kind")
                      decls.append({
                          "path": str(path),
                          "line": line_no,
                          "kind": kind,
                          "name": name,
                          "family": family(str(path), name),
                      })
              return decls

          def copy_current_tree(src: Path, dst: Path) -> list[str]:
              if not src.exists():
                  return []
              if dst.exists():
                  shutil.rmtree(dst)
              ignore = shutil.ignore_patterns(".git", ".lake", "__pycache__", "*.olean", "*.ilean", "*.trace")
              shutil.copytree(src, dst, ignore=ignore)
              return [str(p.relative_to(FINISHER)) for p in sorted(dst.rglob("*")) if p.is_file()]

          shutil.rmtree(FINISHER, ignore_errors=True)
          FINISHER.mkdir(parents=True)

          closure = custom_import_closure(TARGET, MAIN)
          direct_imports = direct_imports_from_ref(TARGET, MAIN)
          direct_custom = [m for m in direct_imports if not m.startswith(EXTERNAL)]
          direct_external = [m for m in direct_imports if m.startswith(EXTERNAL)]

          # 1. Comparator-final source corpus, copied byte-for-byte from de11.
          copied_source_files: list[str] = []
          for rel in closure:
              write_bytes(FINISHER / rel, git_bytes(TARGET, str(rel)))
              copied_source_files.append(str(rel))

          # 2. Reproducibility files.  Keep current lakefile as the default public/presentation build,
          #    and preserve the original de11 lakefile separately.
          for name in ["lean-toolchain", "lake-manifest.json", "README.md"]:
              if exists_at(TARGET, name):
                  write_bytes(FINISHER / name, git_bytes(TARGET, name))
          if (ROOT / "lakefile.toml").exists():
              shutil.copy2(ROOT / "lakefile.toml", FINISHER / "lakefile.toml")
          if exists_at(TARGET, "lakefile.toml"):
              write_bytes(FINISHER / "lakefile.de11.original.toml", git_bytes(TARGET, "lakefile.toml"))

          # 3. Public API/presentation layer from the current professionalization branch.
          public_api_files = copy_current_tree(ROOT / "GST", FINISHER / "GST")

          # 4. Curated documentation and scripts from the current professionalization branch.
          copied_doc_files: list[str] = []
          for doc_subdir in [Path("docs/gst"), Path("docs/problem406")]:
              copied_doc_files += copy_current_tree(ROOT / doc_subdir, FINISHER / doc_subdir)
          copied_script_files: list[str] = []
          if (ROOT / "scripts").exists():
              (FINISHER / "scripts").mkdir(exist_ok=True)
              for script_name in ["gst_decl_manifest.py", "problem406_repo_census.py"]:
                  src = ROOT / "scripts" / script_name
                  if src.exists():
                      shutil.copy2(src, FINISHER / "scripts" / script_name)
                      copied_script_files.append(f"scripts/{script_name}")

          # 5. CI references, copied as inert documentation under FINISHER/ci.
          copied_ci_files: list[str] = []
          ci_dir = FINISHER / "ci"
          ci_dir.mkdir(exist_ok=True)
          for wf in [
              ".github/workflows/final-comparator.yml",
              ".github/workflows/gpt56-problem406-public-api.yml",
              ".github/workflows/gpt56-finalized-de11-census.yml",
              ".github/workflows/gpt56-problem406-theorem-census.yml",
          ]:
              src = ROOT / wf
              if src.exists():
                  dst = ci_dir / Path(wf).name
                  shutil.copy2(src, dst)
                  copied_ci_files.append(str(dst.relative_to(FINISHER)))

          decls = declarations_from_target(closure)
          kinds = Counter(d["kind"] for d in decls)
          theorem_like = [d for d in decls if d["kind"] in {"theorem", "lemma"}]
          families = Counter(d["family"] for d in theorem_like)
          lines_by_file = {str(path): line_count_text(git_text(TARGET, str(path))) for path in closure}

          lock = {
              "bundle": "FINISHER",
              "role": "pinned comparator-final proof bundle plus professional presentation surface",
              "source_target_ref": TARGET,
              "source_target_meaning": "finalized comparator-accepted source, before public API/docs professionalization",
              "current_branch_head_when_generated": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "main_monolith": "ErdosTernary2.lean",
              "monolith_lines": lines_by_file["ErdosTernary2.lean"],
              "custom_import_closure_files": len(closure),
              "custom_import_closure_lines": sum(lines_by_file.values()),
              "custom_import_closure_declarations": len(decls),
              "custom_import_closure_declaration_kinds": dict(sorted(kinds.items())),
              "custom_import_closure_theorem_like": len(theorem_like),
              "theorem_like_families": dict(sorted(families.items())),
              "non_gst_theorem_like": len(theorem_like) - families.get("General Space Theory proper", 0),
              "direct_custom_imports": direct_custom,
              "direct_external_imports": direct_external,
              "copied_source_files": copied_source_files,
              "copied_public_api_files": public_api_files,
              "copied_doc_files": copied_doc_files,
              "copied_script_files": copied_script_files,
              "copied_ci_files": copied_ci_files,
          }
          (FINISHER / "FINISHER.lock.json").write_text(json.dumps(lock, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          fam_rows = "\n".join(f"| {name} | {count} |" for name, count in sorted(families.items(), key=lambda kv: (-kv[1], kv[0])))
          top_files = "\n".join(f"| `{path}` | {lines} |" for path, lines in sorted(lines_by_file.items(), key=lambda kv: (-kv[1], kv[0]))[:30])
          theorem_index = f"""# FINISHER theorem-family index

Pinned source commit: `{TARGET}`.

This index is generated from the comparator-final source corpus copied into `FINISHER/`.  It counts only the original finalized monolith plus its recursive custom import closure, excluding Mathlib and excluding later professionalization-only files.

## Executive counts

| Scope | Count |
| --- | ---: |
| Comparator-final source files | {len(closure)} |
| Comparator-final source lines | {sum(lines_by_file.values())} |
| Main monolith lines | {lines_by_file['ErdosTernary2.lean']} |
| Total declarations | {len(decls)} |
| Theorem declarations | {kinds.get('theorem', 0)} |
| Lemma declarations | {kinds.get('lemma', 0)} |
| Theorem-like declarations | {len(theorem_like)} |
| General Space Theory proper theorem-like declarations | {families.get('General Space Theory proper', 0)} |
| Non-GST theorem-like declarations | {len(theorem_like) - families.get('General Space Theory proper', 0)} |

## Theorem families

| Family | Theorem-like declarations |
| --- | ---: |
{fam_rows}

## Largest source files

| File | Lines |
| --- | ---: |
{top_files}

## Public API policy

Do not create one public alias for every theorem-like declaration.  That would hide the architecture under noise.

The professional surface should be three-layered:

1. **Frozen corpus:** every comparator-final source file is copied exactly into `FINISHER/`.
2. **Manifest/index:** every theorem family is counted and classified by `FINISHER/FINISHER.lock.json` and this file.
3. **Curated public API:** clean theorem names expose the proof spine and major bridges first; lower-level declarations remain indexed until promoted intentionally.
"""
          (FINISHER / "THEOREM_FAMILIES.md").write_text(theorem_index, encoding="utf-8")

          readme = f"""# FINISHER

`FINISHER/` is the clean final presentation bundle for the Erdős ternary-2 / Problem 406 Lean project.

It separates three things that must not be confused:

1. **Comparator-final proof source** pinned to `{TARGET}`.
2. **Professional public API surface** copied from the current presentation branch.
3. **Documentation and audit material** copied under `FINISHER/docs/` and indexed by `FINISHER/FINISHER.lock.json`.

## What is frozen here

The original finalized proof corpus is copied into this folder from commit `{TARGET}`.  The main monolith is:

```text
FINISHER/ErdosTernary2.lean
```

The recursive custom import closure is also copied into `FINISHER/` using the original module paths, so the source layout remains Lean-readable when this folder is treated as a project root.

## Verified counts for the pinned source corpus

| Item | Count |
| --- | ---: |
| Main monolith lines | {lines_by_file['ErdosTernary2.lean']} |
| Custom import-closure files | {len(closure)} |
| Custom import-closure lines | {sum(lines_by_file.values())} |
| Total declarations | {len(decls)} |
| Theorem-like declarations | {len(theorem_like)} |
| GST-proper theorem-like declarations | {families.get('General Space Theory proper', 0)} |
| Non-GST theorem-like declarations | {len(theorem_like) - families.get('General Space Theory proper', 0)} |

## Entry points

- `ErdosTernary2.lean` — original finalized monolith.
- `THEOREM_FAMILIES.md` — human-readable theorem-family map.
- `FINISHER.lock.json` — machine-readable source lock and census.
- `GST/PublicAPI.lean` — curated clean public API surface.
- `docs/problem406/` and `docs/gst/` — professional exposition and reviewer-facing documentation.

## API decision

The correct public API strategy is **curated spine first**, not mass wrapping.  The full theorem universe is indexed here, while only stable narrative-critical theorem names are promoted into the public API.

That keeps the project professional: reviewers see the final theorem, the major bridge layers, the GST mechanism, and the exact full corpus without drowning in 1,396 aliases.
"""
          (FINISHER / "README.md").write_text(readme, encoding="utf-8")

          print("FINISHER_BUNDLE_JSON_BEGIN")
          print(json.dumps(lock, indent=2, sort_keys=True))
          print("FINISHER_BUNDLE_JSON_END")
          print(f"FINISHER_SOURCE_REF={TARGET}")
          print(f"FINISHER_MONOLITH_LINES={lines_by_file['ErdosTernary2.lean']}")
          print(f"FINISHER_CLOSURE_FILES={len(closure)}")
          print(f"FINISHER_CLOSURE_LINES={sum(lines_by_file.values())}")
          print(f"FINISHER_THEOREM_LIKE={len(theorem_like)}")
          print(f"FINISHER_GST_PROPER_THEOREM_LIKE={families.get('General Space Theory proper', 0)}")
          print(f"FINISHER_NON_GST_THEOREM_LIKE={len(theorem_like) - families.get('General Space Theory proper', 0)}")
          PY

          git status --short -- FINISHER
          if [ -z "$(git status --porcelain -- FINISHER)" ]; then
            echo "FINISHER_NO_CHANGES=1"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add FINISHER
            git commit -m "Create FINISHER proof bundle"
            git push
          fi
