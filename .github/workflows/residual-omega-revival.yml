name: Residual Omega Revival Proof

on:
  push:
    branches:
      - sol/kyo-gate-universe-wire
    paths:
      - GSTResidualOmegaRevival.lean
      - GSTFinalPrefixOneDirectU2DCollision.lean
      - GSTFinalResidualConnector.lean
      - lakefile.toml
      - .github/workflows/residual-omega-revival.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Install Lean RC2 and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Compile revived proof and dependencies
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build GSTResidualOmegaRevival 2>&1 | tee residual-revival.log
          ! grep -E 'sorryAx|declaration uses .sorry.|unknown identifier|unknown constant|unsolved goals|error:' residual-revival.log
