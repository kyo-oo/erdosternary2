name: GPT56 Happy Ge Three Clean Probe

on:
  push:
    branches:
      - sol/gpt56-canonical-tail-escape-20260827
    paths:
      - 'GSTFourPowerHappyGeThreeClean.lean'
      - 'GSTInfiniteFourPowerNavigation.lean'
      - 'GSTFourPowerDirectExistenceNoAxiom.lean'
      - '.github/workflows/gpt56-happy-ge-three-clean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  happy-provider:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sol/gpt56-canonical-tail-escape-20260827
          fetch-depth: 1

      - name: Install exact Lean RC2 and pinned Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get

      - name: Compile clean Happy-row provider
        shell: bash
        run: |
          set -uo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p .lake/build/lib/lean
          touch happy-ge-three-clean.log
          {
            set -euo pipefail
            echo HAPPY_GE_THREE_CLEAN_BUILD_START=1
            lake build GSTGraphV2PerfectPowerBlockProbe GSTGraphV2UnifiedVerticalTelescope GSTGraphV2SixAdicSynchronizedShadows GSTFinalPurePowerResidueTransplant GSTFourPowerOntologicalAdapter GSTFourPowerDirectExistenceNoAxiom
            echo HAPPY_GE_THREE_INFINITE_PROVIDER_LEAN_START=1
            lake env lean -o .lake/build/lib/lean/GSTInfiniteFourPowerNavigation.olean GSTInfiniteFourPowerNavigation.lean
            echo HAPPY_GE_THREE_WRAPPER_LEAN_START=1
            lake env lean GSTFourPowerHappyGeThreeClean.lean
            echo HAPPY_GE_THREE_CLEAN_FILE_COMPILED=1
          } 2>&1 | tee happy-ge-three-clean.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Reject custom axiom leakage in clean provider
        shell: bash
        run: |
          set -euo pipefail
          if grep -E '(^|[^A-Za-z0-9_.])(sorryAx|gst_four_power_direct_existence_inline)([^A-Za-z0-9_]|$)' happy-ge-three-clean.log; then
            echo HAPPY_GE_THREE_FORBIDDEN_AXIOM_LEAK=1
            exit 1
          fi
          if grep -E '^axioms .*\baxiom\b' happy-ge-three-clean.log; then
            echo HAPPY_GE_THREE_CUSTOM_AXIOM_SUSPECT=1
            exit 1
          fi
          echo HAPPY_GE_THREE_NO_FORBIDDEN_AXIOM_MARKERS=1

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: happy-ge-three-clean-diagnostics
          path: happy-ge-three-clean.log
          if-no-files-found: warn
