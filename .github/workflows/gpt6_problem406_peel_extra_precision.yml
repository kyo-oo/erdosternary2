name: GST fixedpoint two-extra-trit original physical survivor
on:
  push:
    branches: [gpt6/problem406-exponent-termination-20261029]
    paths:
      - GSTProblem406GSTPeelExtraPrecision.lean
      - .github/workflows/gpt6_problem406_peel_extra_precision.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extra-precision:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build original nonlinear GST peel and physical fixedpoint
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
          lake build GSTFourPowerAffineOrbit
          lake env lean -o .lake/build/lib/lean/GSTFourPowerAffineExponentPeel.olean GSTFourPowerAffineExponentPeel.lean
          lake env lean -o .lake/build/lib/lean/GSTProblem406GSTPeelFixedPoint.olean GSTProblem406GSTPeelFixedPoint.lean
      - name: Strict check of two-extra-ternary-order delayed physical survivors
        shell: bash
        run: |
          set -euo pipefail
          lake env lean GSTProblem406GSTPeelExtraPrecision.lean 2>&1 | tee gst406-peel-extra.log
          ! grep -E 'error:|sorryAx|unknown identifier|unsolved goals|declaration uses .sorry.|gst_four_power_direct_existence_inline' gst406-peel-extra.log
          echo GST406_PEEL_TWO_EXTRA_TRITS_PASS=1
