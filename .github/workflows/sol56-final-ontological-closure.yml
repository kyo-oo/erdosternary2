name: SOL56 Final Ontological Closure

on:
  push:
    branches:
      - sol/sol56-final-residual-production-green-20260824
  pull_request:
    branches:
      - sol/sol56-base-perfect-power-78b-20260824
  workflow_dispatch:

concurrency:
  group: sol56-final-ontological-closure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  closure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sol/sol56-final-residual-production-green-20260824
          fetch-depth: 1

      - name: Prepare Lean RC2
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Compile exact compositor dependency closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean
          python3 - <<'PY'
          from pathlib import Path
          import re

          target = 'GSTFinalResidualOntologicalClosure'
          order = []
          done = set()
          active = []

          def source_for(mod):
              p = Path(*mod.split('.')).with_suffix('.lean')
              return p if p.is_file() else None

          def imports_of(mod):
              p = source_for(mod)
              if p is None:
                  return []
              return re.findall(r'(?m)^\s*import\s+([A-Za-z0-9_.]+)\s*$', p.read_text(encoding='utf-8'))

          def visit(mod):
              p = source_for(mod)
              if p is None or mod in done:
                  return
              if mod in active:
                  raise SystemExit('IMPORT_CYCLE=' + ' -> '.join(active + [mod]))
              active.append(mod)
              for dep in imports_of(mod):
                  visit(dep)
              active.pop()
              done.add(mod)
              order.append(mod)

          for dep in imports_of(target):
              visit(dep)
          Path('/tmp/closure-import-order.txt').write_text('\n'.join(order) + '\n', encoding='utf-8')
          print('CLOSURE_IMPORT_COUNT=' + str(len(order)))
          PY

          while IFS= read -r mod; do
            [ -z "$mod" ] && continue
            src="${mod//.//}.lean"
            out=".lake/build/lib/lean/${mod//.//}.olean"
            mkdir -p "$(dirname "$out")"
            echo "=== CLOSURE DEP: $mod ==="
            lake env lean -o "$out" "$src"
          done < /tmp/closure-import-order.txt

      - name: Compile final ontological closure
        shell: bash
        run: |
          set -o pipefail
          lake env lean GSTFinalResidualOntologicalClosure.lean 2>&1 | tee /tmp/ontological-closure.log
