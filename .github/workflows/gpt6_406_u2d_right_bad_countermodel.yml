name: GST 406 U2D Exact Countermodel Kernel
on:
  push:
    branches: [gpt6/problem406-exact-origin-gate-research-20261030]
    paths:
      - GSTProblem406U2DRightBadCountermodel.lean
      - .github/workflows/gpt6_406_u2d_right_bad_countermodel.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Lean and prerequisites
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake update
          lake exe cache get
          lake build GSTU2DSharpCrossingBlock GSTFourPowerDirectResidue
      - name: Strict kernel check all-row right BAD and positive U2D rectangle
        shell: bash
        run: |
          set -euo pipefail
          lake env lean GSTProblem406U2DRightBadCountermodel.lean 2>&1 | tee u2d-countermodel.log
          ! grep -E 'error:|sorryAx|unsolved goals|unknown identifier|declaration uses .sorry.' u2d-countermodel.log
          grep -F 'right_bad_does_not_force_nonpositive_rectangle' u2d-countermodel.log
          echo GST_U2D_EXACT_COUNTERMODEL_LEAN_PASS=1
