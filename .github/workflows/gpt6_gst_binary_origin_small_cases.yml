name: GPT6 GST Original Physical Gate Small-K Kernel
on:
  push:
    branches: [gpt6/problem406-binary-origin-valuation-20261030]
    paths:
      - GSTProblem406BinaryOriginSmallCases.lean
      - .github/workflows/gpt6_gst_binary_origin_small_cases.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Lean RC2 and physical existence dependency
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake update
          lake exe cache get
          lake build GSTFourPowerDirectExistence
      - name: Original exact small-K physical pair kernel check
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean GSTProblem406BinaryOriginSmallCases.lean 2>&1 | tee small-k.log
          ! grep -E 'error:|sorryAx|unknown identifier|unsolved goals|declaration uses .sorry.' small-k.log
          grep -F 'commonTwo_small_K_exact' small-k.log
          echo GST_SMALL_K_ORIGINAL_PHYSICAL_PAIR_KERNEL_PASS=1
