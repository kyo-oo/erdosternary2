name: Sol Aug20 Direct Induction Atomic Finish

on:
  push:
    paths:
      - 'DIRECT_INDUCTION_SMOKE_TRIGGER.md'
      - '.github/workflows/direct_induction_smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finish:
    if: github.ref == 'refs/heads/sol/gpt56-close-one-error'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sol/gpt56-close-one-error
          fetch-depth: 0

      - name: Install pinned Lean
        shell: bash
        run: |
          set -euxo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.33.0-rc2

      - name: Resolve dependencies
        timeout-minutes: 20
        shell: bash
        run: |
          set -euxo pipefail
          lake update
          lake exe cache get
          lake build GSTTactic

      - name: Kernel-check exact Aug20 direct theorem before surgery
        timeout-minutes: 30
        shell: bash
        run: |
          set -euxo pipefail
          LEGACY_LINE=$(grep -n 'Legacy residual overproof' ErdosTernary2.lean | head -1 | cut -d: -f1)
          test -n "$LEGACY_LINE"
          CUT=$((LEGACY_LINE - 2))
          head -n "$CUT" ErdosTernary2.lean > ErdosPreOmega.lean
          lake env lean -o ErdosPreOmega.olean ErdosPreOmega.lean
          cat > DirectInductionCandidate.lean <<'EOF'
          import ErdosPreOmega

          theorem gpt56_direct_even_universal (a : Nat) :
              5 ≤ a → hasTernaryTwo (4^a) = true := by
            induction a using Nat.strongRecOn with
            | ind a ih =>
                intro ha
                by_cases hbase : a ≤ 500
                · exact modular_check_base a ha hbase
                · have ha1 : 5 ≤ a - 1 := by omega
                  have hlt : a - 1 < a := by omega
                  have hprev : hasTernaryTwo (4^(a-1)) = true :=
                    ih (a-1) hlt ha1
                  have hRmod : (4^(a-1)) % 3 = 1 := by
                    rw [Nat.pow_mod, show (4:Nat) % 3 = 1 from by decide,
                      Nat.one_pow]
                  have hcreation := h_creation_for_4pow
                    (a-1) ha1 (by omega : a - 1 ≠ 7)
                  have hstep : hasTernaryTwo (4 * 4^(a-1)) = true :=
                    gst_duality (4^(a-1)) hRmod hprev hcreation
                  have hpow : 4 * 4^(a-1) = 4^a := by
                    have hae : a = (a-1)+1 := by omega
                    calc
                      4 * 4^(a-1) = 4^(a-1) * 4 := by ac_rfl
                      _ = 4^((a-1)+1) := (Nat.pow_succ 4 (a-1)).symm
                      _ = 4^a := by rw [← hae]
                  simpa [hpow] using hstep

          theorem gpt56_direct_universal (n : Nat) (hn : 9 ≤ n) :
              noTernaryTwo (2^n) = false := by
            by_cases hodd : n % 2 = 1
            · exact erdos_ternary_2_odd_universal n hn hodd
            · have heven : n % 2 = 0 := by omega
              have h4eq : 2^n = 4^(n/2) := by
                have hn_eq : n = 2 * (n/2) := by omega
                rw [show (4 : Nat) = 2^2 from by decide, ← Nat.pow_mul, ← hn_eq]
              rw [h4eq]
              have ha : 5 ≤ n/2 := by omega
              exact has_two_imp_not_no_two (4^(n/2))
                (gpt56_direct_even_universal (n/2) ha)

          #check gpt56_direct_even_universal
          #check gpt56_direct_universal
          #print axioms gpt56_direct_even_universal
          #print axioms gpt56_direct_universal
          EOF
          lake env lean DirectInductionCandidate.lean 2>&1 | tee direct-candidate.log
          ! grep -E 'sorryAx|declaration uses .*[Ss]orry' direct-candidate.log

      - name: Atomic monolith amputation and replacement
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ErdosTernary2.lean')
          src = p.read_text()
          marker = '/-\n  Legacy residual overproof.'
          if marker not in src:
              raise SystemExit('legacy marker not found; refusing surgery')
          prefix = src.split(marker, 1)[0].rstrip()
          replacement = r'''

          /- ============================================================================
             AUGUST 20 SOL DIRECT FINISH

             The legacy residual Omega corridor below this point was an overproof: the
             final digit theorem does not need residual Omega termination. The already
             kernelized creation theorem plus GST duality gives a direct well-founded
             exponent induction. This exact theorem was kernel-checked before surgery.
             ============================================================================ -/

          theorem gpt56_direct_even_universal (a : Nat) :
              5 ≤ a → hasTernaryTwo (4^a) = true := by
            induction a using Nat.strongRecOn with
            | ind a ih =>
                intro ha
                by_cases hbase : a ≤ 500
                · exact modular_check_base a ha hbase
                · have ha1 : 5 ≤ a - 1 := by omega
                  have hlt : a - 1 < a := by omega
                  have hprev : hasTernaryTwo (4^(a-1)) = true :=
                    ih (a-1) hlt ha1
                  have hRmod : (4^(a-1)) % 3 = 1 := by
                    rw [Nat.pow_mod, show (4:Nat) % 3 = 1 from by decide,
                      Nat.one_pow]
                  have hcreation := h_creation_for_4pow
                    (a-1) ha1 (by omega : a - 1 ≠ 7)
                  have hstep : hasTernaryTwo (4 * 4^(a-1)) = true :=
                    gst_duality (4^(a-1)) hRmod hprev hcreation
                  have hpow : 4 * 4^(a-1) = 4^a := by
                    have hae : a = (a-1)+1 := by omega
                    calc
                      4 * 4^(a-1) = 4^(a-1) * 4 := by ac_rfl
                      _ = 4^((a-1)+1) := (Nat.pow_succ 4 (a-1)).symm
                      _ = 4^a := by rw [← hae]
                  simpa [hpow] using hstep

          theorem erdos_ternary_2_even_universal (a : Nat) (ha : 5 ≤ a) :
              hasTernaryTwo (4^a) = true :=
            gpt56_direct_even_universal a ha

          theorem erdos_ternary_2_universal (n : Nat) (hn : 9 ≤ n) :
              noTernaryTwo (2^n) = false := by
            by_cases hodd : n % 2 = 1
            · exact erdos_ternary_2_odd_universal n hn hodd
            · have heven : n % 2 = 0 := by omega
              have h4eq : 2^n = 4^(n/2) := by
                have hn_eq : n = 2 * (n/2) := by omega
                rw [show (4 : Nat) = 2^2 from by decide, ← Nat.pow_mul, ← hn_eq]
              rw [h4eq]
              have ha : 5 ≤ n/2 := by omega
              exact has_two_imp_not_no_two (4^(n/2))
                (erdos_ternary_2_even_universal (n/2) ha)

          #print axioms gpt56_direct_even_universal
          #print axioms erdos_ternary_2_even_universal
          #print axioms erdos_ternary_2_universal
          '''
          p.write_text(prefix + replacement.lstrip('\n'))
          PY

      - name: Verify surgically rewritten monolith
        timeout-minutes: 40
        shell: bash
        run: |
          set -euxo pipefail
          lake env lean ErdosTernary2.lean 2>&1 | tee monolith.log
          ! grep -E 'sorryAx|declaration uses .*[Ss]orry' monolith.log
          lake build 2>&1 | tee build.log

      - name: Zero-sorry gate
        shell: bash
        run: |
          set -euxo pipefail
          bash scripts/sorry_check.sh 2>&1 | tee sorry.log

      - name: Real V5 comparator gate
        timeout-minutes: 45
        shell: bash
        run: |
          set -euxo pipefail
          bash scripts/comparator.sh 2>&1 | tee comparator.log
          grep -q 'Your solution is okay!' comparator.log
          grep -q 'COMPARATOR RESULT: PASS' comparator.log

      - name: Commit only verified green surgery
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          cat > SOL_DIRECT_FINISH_RESULT.md <<'EOF'
          # SOL AUG-20 DIRECT FINISH — GREEN

          Exact Aug-20 direct strong induction: kernel PASS.
          Legacy residual Omega overproof: removed from active monolith.
          Full monolith compile: PASS.
          lake build: PASS.
          sorry_check.sh: 0 sorries.
          V5 comparator: Your solution is okay! / PASS.
          EOF
          git config user.name 'gpt56-sol'
          git config user.email 'gpt56-sol@users.noreply.github.com'
          git add ErdosTernary2.lean SOL_DIRECT_FINISH_RESULT.md
          git commit -m 'prove: close final error by Aug20 direct induction' || true
          git push origin HEAD:sol/gpt56-close-one-error

      - name: Commit exact failure diagnostic
        if: failure()
        shell: bash
        run: |
          set +e
          {
            echo '# SOL AUG-20 DIRECT FINISH — RED'
            echo
            echo 'The atomic runner failed before the green commit. Exact available log tails follow.'
            for f in direct-candidate.log monolith.log build.log sorry.log comparator.log; do
              if [ -f "$f" ]; then
                echo
                echo "## $f"
                echo '```text'
                tail -120 "$f"
                echo '```'
              fi
            done
          } > SOL_DIRECT_FINISH_FAILURE.md
          git checkout -- ErdosTernary2.lean 2>/dev/null || true
          git config user.name 'gpt56-sol'
          git config user.email 'gpt56-sol@users.noreply.github.com'
          git add SOL_DIRECT_FINISH_FAILURE.md
          git commit -m 'diagnostic: capture remaining direct-finish obstruction' || true
          git push origin HEAD:sol/gpt56-close-one-error || true
