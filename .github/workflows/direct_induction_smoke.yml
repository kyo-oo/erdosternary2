name: Direct Induction Bypass Smoke

on:
  push:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euxo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.33.0-rc2
      - name: Resolve dependencies
        timeout-minutes: 20
        shell: bash
        run: |
          set -euxo pipefail
          lake update
          lake exe cache get
          lake build GSTTactic
      - name: Compile direct induction before broken Omega
        timeout-minutes: 30
        shell: bash
        run: |
          set -euxo pipefail
          awk '/^theorem gst_omega_termination_s1/{exit} {print}' ErdosTernary2.lean > DirectInductionSmoke.lean
          cat >> DirectInductionSmoke.lean <<'EOF'

          theorem gpt56_direct_even_universal (a : Nat) :
              5 ≤ a → hasTernaryTwo (4^a) = true := by
            induction a using Nat.strongRecOn with
            | h a ih =>
                intro ha
                by_cases hbase : a ≤ 500
                · exact modular_check_base a ha hbase
                · have ha1 : 5 ≤ a - 1 := by omega
                  have hlt : a - 1 < a := by omega
                  have hprev : hasTernaryTwo (4^(a-1)) = true :=
                    ih (a-1) hlt ha1
                  exact mul4_lift_gst_duality a (by omega) hprev

          theorem gpt56_direct_universal (n : Nat) (hn : 9 ≤ n) :
              noTernaryTwo (2^n) = false := by
            by_cases hodd : n % 2 = 1
            · exact erdos_ternary_2_odd_universal n hn hodd
            · have heven : n % 2 = 0 := by omega
              have h4eq : 2^n = 4^(n/2) := by
                have hn_eq : n = 2 * (n/2) := by omega
                rw [show (4 : Nat) = 2^2 from by decide, ← Nat.pow_mul, ← hn_eq]
              rw [h4eq]
              have ha : 5 ≤ n/2 := by omega
              exact has_two_imp_not_no_two (4^(n/2))
                (gpt56_direct_even_universal (n/2) ha)

          #check gpt56_direct_even_universal
          #check gpt56_direct_universal
          #print axioms gpt56_direct_even_universal
          #print axioms gpt56_direct_universal
          EOF
          lake env lean DirectInductionSmoke.lean | tee direct.log
          ! grep -E 'declaration uses .*(sorryAx|propext.*sorry|Classical.choice.*sorry)' direct.log
