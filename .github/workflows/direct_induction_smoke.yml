name: Direct Induction Bypass Smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Map exact pre-Omega ingredients
        shell: bash
        run: |
          set -euxo pipefail
          grep -n '^theorem h_creation_for_4pow' ErdosTernary2.lean
          grep -n '^theorem gst_duality ' ErdosTernary2.lean
          grep -n '^theorem gst_omega_termination_s1' ErdosTernary2.lean
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euxo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.33.0-rc2
      - name: Resolve dependencies
        timeout-minutes: 20
        shell: bash
        run: |
          set -euxo pipefail
          lake update
          lake exe cache get
          lake build GSTTactic
      - name: Compile c-stable inverse-system and 12102 upgrade
        timeout-minutes: 30
        shell: bash
        run: |
          set -euxo pipefail
          LEGACY_LINE=$(grep -n 'Legacy residual overproof' ErdosTernary2.lean | head -1 | cut -d: -f1)
          CUT=$((LEGACY_LINE - 2))
          head -n "$CUT" ErdosTernary2.lean > CTowerInfiniteUpgradeSmoke.lean
          cat >> CTowerInfiniteUpgradeSmoke.lean <<'EOF'

          /-- Old finite stable coefficients form one compatible all-scale ternary system. -/
          theorem gpt56_c_stable_projective (k : Nat) (hk : 1 ≤ k) :
              c_stable (k+1) % 3^k = c_stable k := by
            unfold c_stable
            have hdvd : 3^k ∣ 3^(k+1) := Nat.pow_dvd_pow 3 (by omega)
            rw [Nat.mod_mod_of_dvd _ hdvd]
            have hrec := c_recursion (k+1) (by omega : 1 ≤ k+1)
            rw [hrec]
            have hAdiv : 3^k ∣ 3^(k+2) * (c (k+1))^2 :=
              dvd_mul_of_dvd_left (Nat.pow_dvd_pow 3 (by omega : k ≤ k+2)) _
            have hBdiv : 3^k ∣ 3^(2*(k+1)+1) * (c (k+1))^3 :=
              dvd_mul_of_dvd_left
                (Nat.pow_dvd_pow 3 (by omega : k ≤ 2*(k+1)+1)) _
            exact add_mod_drop2 _ _ _ (3^k)
              (Nat.mod_eq_zero_of_dvd hAdiv)
              (Nat.mod_eq_zero_of_dvd hBdiv)

          /-- From level four onward the canonical coefficient has the stable
              five-trit low word 12102 (LSB first), i.e. residue 178 mod 243. -/
          theorem gpt56_c_mod243_stable (s : Nat) (hs : 4 ≤ s) :
              c s % 243 = 178 := by
            induction s using Nat.le_induction with
            | base => decide
            | succ s hs4 ih =>
                have hrec := c_recursion s (by omega : 1 ≤ s)
                rw [hrec]
                have hAdiv : 243 ∣ 3^(s+1) * (c s)^2 := by
                  have hp : 3^5 ∣ 3^(s+1) :=
                    Nat.pow_dvd_pow 3 (by omega : 5 ≤ s+1)
                  norm_num at hp ⊢
                  exact dvd_mul_of_dvd_left hp _
                have hBdiv : 243 ∣ 3^(2*s+1) * (c s)^3 := by
                  have hp : 3^5 ∣ 3^(2*s+1) :=
                    Nat.pow_dvd_pow 3 (by omega : 5 ≤ 2*s+1)
                  norm_num at hp ⊢
                  exact dvd_mul_of_dvd_left hp _
                rw [add_mod_drop2 _ _ _ 243
                  (Nat.mod_eq_zero_of_dvd hAdiv)
                  (Nat.mod_eq_zero_of_dvd hBdiv), ih]

          theorem gpt56_c_low_word_12102 (s : Nat) (hs : 4 ≤ s) :
              c s % 243 = 1 + 2*3 + 1*3^2 + 0*3^3 + 2*3^4 := by
            rw [gpt56_c_mod243_stable s hs]
            decide

          theorem gpt56_c_position4_null_gate (s : Nat) (hs : 4 ≤ s) :
              gstDigit (c s) 4 = 2 ∧ gstCarry (c s) 4 = 0 := by
            have h243 := gpt56_c_mod243_stable s hs
            have hd : gstDigit (c s) 4 = 2 := by
              unfold gstDigit
              rw [digit_identity]
              norm_num at h243 ⊢
              rw [h243]
              decide
            have h81 : c s % 81 = 16 := by
              calc
                c s % 81 = (c s % 243) % 81 := by
                  symm
                  exact Nat.mod_mod_of_dvd _ (by decide : 81 ∣ 243)
                _ = 16 := by rw [h243]; decide
            have hc : gstCarry (c s) 4 = 0 := by
              unfold gstCarry
              norm_num
              rw [h81]
              decide
            exact ⟨hd, hc⟩

          #check gpt56_c_stable_projective
          #check gpt56_c_mod243_stable
          #check gpt56_c_low_word_12102
          #check gpt56_c_position4_null_gate
          #print axioms gpt56_c_stable_projective
          #print axioms gpt56_c_position4_null_gate
          EOF
          lake env lean CTowerInfiniteUpgradeSmoke.lean | tee cstable.log
          ! grep -E 'sorryAx|declaration uses .*[Ss]orry' cstable.log
      - name: Compile pre-Omega direct induction
        timeout-minutes: 30
        shell: bash
        run: |
          set -euxo pipefail
          LEGACY_LINE=$(grep -n 'Legacy residual overproof' ErdosTernary2.lean | head -1 | cut -d: -f1)
          CUT=$((LEGACY_LINE - 2))
          head -n "$CUT" ErdosTernary2.lean > DirectInductionSmoke.lean
          cat >> DirectInductionSmoke.lean <<'EOF'

          theorem gpt56_direct_even_universal (a : Nat) :
              5 ≤ a → hasTernaryTwo (4^a) = true := by
            induction a using Nat.strongRecOn with
            | ind a ih =>
                intro ha
                by_cases hbase : a ≤ 500
                · exact modular_check_base a ha hbase
                · have ha1 : 5 ≤ a - 1 := by omega
                  have hlt : a - 1 < a := by omega
                  have hprev : hasTernaryTwo (4^(a-1)) = true :=
                    ih (a-1) hlt ha1
                  have hRmod : (4^(a-1)) % 3 = 1 := by
                    rw [Nat.pow_mod, show (4:Nat) % 3 = 1 from by decide,
                      Nat.one_pow]
                  have hcreation := h_creation_for_4pow
                    (a-1) ha1 (by omega : a - 1 ≠ 7)
                  have hstep : hasTernaryTwo (4 * 4^(a-1)) = true :=
                    gst_duality (4^(a-1)) hRmod hprev hcreation
                  have hpow : 4 * 4^(a-1) = 4^a := by
                    have hae : a = (a-1)+1 := by omega
                    calc
                      4 * 4^(a-1) = 4^(a-1) * 4 := by ac_rfl
                      _ = 4^((a-1)+1) := (Nat.pow_succ 4 (a-1)).symm
                      _ = 4^a := by rw [← hae]
                  simpa [hpow] using hstep

          theorem gpt56_direct_universal (n : Nat) (hn : 9 ≤ n) :
              noTernaryTwo (2^n) = false := by
            by_cases hodd : n % 2 = 1
            · exact erdos_ternary_2_odd_universal n hn hodd
            · have heven : n % 2 = 0 := by omega
              have h4eq : 2^n = 4^(n/2) := by
                have hn_eq : n = 2 * (n/2) := by omega
                rw [show (4 : Nat) = 2^2 from by decide, ← Nat.pow_mul, ← hn_eq]
              rw [h4eq]
              have ha : 5 ≤ n/2 := by omega
              exact has_two_imp_not_no_two (4^(n/2))
                (gpt56_direct_even_universal (n/2) ha)

          #check gpt56_direct_even_universal
          #check gpt56_direct_universal
          #print axioms gpt56_direct_even_universal
          #print axioms gpt56_direct_universal
          EOF
          lake env lean DirectInductionSmoke.lean | tee direct.log
          ! grep -E 'sorryAx|declaration uses .*[Ss]orry' direct.log
