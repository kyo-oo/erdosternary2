name: SOL V2 One-Error Replacement Surgery

on:
  push:
    paths:
      - 'ONE_ERROR_V2_TRIGGER.md'
      - '.github/workflows/direct_induction_smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finish:
    if: github.ref == 'refs/heads/sol/gpt56-infinite-control-production' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sol/gpt56-infinite-control-production
          fetch-depth: 0

      - name: Install pinned Lean
        shell: bash
        run: |
          set -euxo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.33.0-rc2

      - name: Resolve dependencies
        timeout-minutes: 20
        shell: bash
        run: |
          set -euxo pipefail
          lake update
          lake exe cache get
          lake build GSTTactic

      - name: Physically replace legacy Omega corridor with one V2 seam
        shell: bash
        run: |
          set -euxo pipefail
          cp ErdosTernary2.lean ErdosTernary2.before-v2-surgery.lean
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('ErdosTernary2.lean')
          src = p.read_text()

          def remove_decl(text: str, name: str) -> str:
              pat = re.compile(rf'(?m)^theorem\s+{re.escape(name)}\b')
              m = pat.search(text)
              if not m:
                  raise SystemExit(f'missing declaration: {name}')
              start = m.start()
              nxt = re.compile(r'(?m)^(?:theorem|lemma|def|abbrev|structure|inductive|instance|private\s+theorem)\s+[A-Za-z0-9_]').search(text, m.end())
              if not nxt:
                  raise SystemExit(f'cannot find end of declaration: {name}')
              return text[:start] + text[nxt.start():]

          # Delete the three fake termination obligations and every direct adapter
          # that depends on them.  They are not allowed to survive in the candidate.
          for name in [
              'gst_omega_termination_s1',
              'gst_omega_termination_s3',
              'gst_omega_termination_stable',
              'gst_residual_omega_termination',
              'gst_residual_navigation_lift',
              'gst_prefix_one_information_bad_descends_inline',
              'gst_prefix_one_child_gate_contradicts_parent_bad_inline',
          ]:
              src = remove_decl(src, name)

          # One and only one replacement target.  This is deliberately a RED proof:
          # all exact hypotheses are constructed, then Lean is left with the genuine
          # canonical collision goal rather than three obsolete Omega cases.
          marker = 'theorem gst_prefix_one_navigation_lift :\n    GSTPrefixOneNavigationLift := by'
          if marker not in src:
              raise SystemExit('public prefix-one marker not found')

          seam = r'''
/-- ONE-ERROR V2 SEAM: child Navigation plus an all-depth canonical parent-bad
    orbit cannot coexist.  This theorem replaces all three legacy Omega
    termination implementations. -/
theorem gst_v2_infinite_prefix_one_collision
    (s n : Nat) (hs : 1 ≤ s) (hn : 1 ≤ n)
    (hchild : GSTNavigationWitness (gstNavigationConstant (s+1) n))
    (hBad : GSTOmegaInfiniteBadTrace s 1 n) : False := by
  let T := gstNavigationConstant (s+1) n
  let X := c s / 3 + 4^(3^s) * T
  have hseeded : GSTSeededAffineBadTrace 1 X := by
    have h := (gst_omega_infiniteBadTrace_iff_seededAffine s 1 n).1 hBad
    have hseed : (4 * (c s % 3^1)) / 3^1 = 1 := by
      rw [Nat.pow_one, c_mod3 s hs]
      decide
    rw [hseed] at h
    simpa [T, X] using h
  obtain ⟨j, hd, hspace⟩ := hchild
  have hCmod : gstCarry T j % 3 = 0 := by
    dsimp [T]
    exact gstGoodSpace_carry_mod3_zero _ j hspace
  have hClt : gstCarry T j < 4 := by
    cases j with
    | zero => simp [gstCarry]
    | succ q =>
        dsimp [T]
        exact gstCarry_lt_four _ (q+1) (by omega)
  have hC : gstCarry T j = 0 ∨ gstCarry T j = 3 := by omega
  -- RED: everything above is kernel-derived.  The sole remaining theorem is
  -- the canonical V2 information collision itself.
  omega

'''
          src = src.replace(marker, seam + marker, 1)

          old_body = r'''theorem gst_prefix_one_navigation_lift :
    GSTPrefixOneNavigationLift := by
  intro s n hs hn hchild
  by_contra hnoParent
  have hBad : GSTOmegaInfiniteBadTrace s 1 n :=
    gst_prefix_one_omega_bad_of_no_parent_navigation_inline
      s n hs hnoParent
  let data := gst_prefix_one_omegaData s n hs hchild
  exact gst_prefix_one_child_gate_contradicts_parent_bad_inline
    s n hs hn data hBad'''
          new_body = r'''theorem gst_prefix_one_navigation_lift :
    GSTPrefixOneNavigationLift := by
  intro s n hs hn hchild
  by_contra hnoParent
  have hBad : GSTOmegaInfiniteBadTrace s 1 n :=
    gst_prefix_one_omega_bad_of_no_parent_navigation_inline
      s n hs hnoParent
  exact gst_v2_infinite_prefix_one_collision s n hs hn hchild hBad'''
          if old_body not in src:
              raise SystemExit('old public prefix-one body not found')
          src = src.replace(old_body, new_body, 1)

          for dead in [
              'theorem gst_omega_termination_s1',
              'theorem gst_omega_termination_s3',
              'theorem gst_omega_termination_stable',
              'theorem gst_residual_omega_termination',
              'theorem gst_residual_navigation_lift :',
              'theorem gst_prefix_one_information_bad_descends_inline',
              'theorem gst_prefix_one_child_gate_contradicts_parent_bad_inline',
          ]:
              if dead in src:
                  raise SystemExit(f'dead declaration survived surgery: {dead}')
          p.write_text(src)
          print('ONE_ERROR_V2_SURGERY_APPLIED')
          print('lines', src.count('\n') + 1)
          PY

      - name: Compile full one-error V2 monolith
        timeout-minutes: 45
        shell: bash
        run: |
          set -o pipefail
          lake env lean ErdosTernary2.lean 2>&1 | tee v2-one-error.log

      - name: Run real comparator if kernel green
        timeout-minutes: 45
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          bash scripts/sorry_check.sh 2>&1 | tee sorry.log
          bash scripts/comparator.sh 2>&1 | tee comparator.log
          grep -q 'Your solution is okay!' comparator.log
          grep -q 'COMPARATOR RESULT: PASS' comparator.log

      - name: Commit comparator-green monolith
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          rm -f SOL_V2_ONE_ERROR_FAILURE.md
          cat > SOL_V2_ONE_ERROR_RESULT.md <<'EOF'
          # SOL V2 ONE-ERROR SURGERY — GREEN

          Three legacy Omega termination bodies: removed.
          Circular prefix-one helper: removed.
          V2 canonical collision seam: kernel closed.
          Full monolith: PASS.
          sorry_check: PASS.
          Comparator: Your solution is okay! / PASS.
          EOF
          git config user.name 'gpt56-sol'
          git config user.email 'gpt56-sol@users.noreply.github.com'
          git add ErdosTernary2.lean SOL_V2_ONE_ERROR_RESULT.md SOL_V2_ONE_ERROR_FAILURE.md || true
          git commit -m 'prove: replace three legacy Omega errors with V2 collision' || true
          git push origin HEAD:sol/gpt56-infinite-control-production

      - name: Commit exact one-error diagnostic
        if: failure()
        shell: bash
        run: |
          set +e
          {
            echo '# SOL V2 ONE-ERROR SURGERY — RED'
            echo
            echo 'The three legacy Omega theorem bodies were physically absent from the compiled candidate.'
            echo 'The remaining compiler output is the replacement seam only.'
            echo
            echo '```text'
            tail -220 v2-one-error.log 2>/dev/null || true
            echo '```'
          } > SOL_V2_ONE_ERROR_FAILURE.md
          git checkout -- ErdosTernary2.lean 2>/dev/null || true
          git config user.name 'gpt56-sol'
          git config user.email 'gpt56-sol@users.noreply.github.com'
          git add SOL_V2_ONE_ERROR_FAILURE.md
          git commit -m 'diagnostic: isolate single V2 collision obstruction' || true
          git push origin HEAD:sol/gpt56-infinite-control-production || true
