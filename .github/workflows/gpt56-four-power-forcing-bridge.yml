name: GPT56 Four Power Forcing Bridge

on:
  push:
    branches:
      - sol/gpt56-canonical-tail-escape-20260827
    paths:
      - GSTGraphV2FourPowerForcingBridge.lean
      - GSTFourPowerOntologicalAdapter.lean
      - GSTGraphV2InfiniteControl.lean
      - lakefile.toml
      - lake-manifest.json
      - .github/workflows/gpt56-four-power-forcing-bridge.yml
  workflow_dispatch:

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
      - name: Compile exact Graph-V2 forcing bridge
        shell: bash
        run: |
          set -euo pipefail
          lake build GSTGraphV2FourPowerForcingBridge
          lake env lean GSTGraphV2FourPowerForcingBridge.lean 2>&1 | tee four-power-forcing-bridge.log
          ! grep -E 'declaration uses .sorry.|unknown identifier|unknown module prefix|unsolved goals' four-power-forcing-bridge.log
