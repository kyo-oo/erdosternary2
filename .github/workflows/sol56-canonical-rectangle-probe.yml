name: SOL56 Canonical Rectangle Probe

on:
  push:
    branches:
      - sol/gpt56-final-u2d-transplant-20260825
  workflow_dispatch:

concurrency:
  group: sol56-canonical-rectangle-${{ github.sha }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install exact Lean RC2 and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          rm -f lake-manifest.json
          lake update
          lake exe cache get

      - name: Materialize standalone probe import closure
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          ROOT = Path('GSTPrefixOneCanonicalRectangleProbe.lean')
          BUILD = Path('.lake/build/lib/lean')
          import_re = re.compile(r'^\s*import\s+(.+?)\s*$')

          def local_path(module: str) -> Path:
              return Path(*module.split('.')).with_suffix('.lean')

          def imports_of(path: Path):
              result = []
              for raw in path.read_text(encoding='utf-8').splitlines():
                  code = raw.split('--', 1)[0].rstrip()
                  m = import_re.match(code)
                  if m:
                      result.extend(m.group(1).split())
              return result

          order = []
          permanent = set()
          temporary = []

          def visit(module: str):
              if module in permanent:
                  return
              path = local_path(module)
              if not path.exists():
                  return
              if path == ROOT:
                  return
              if module in temporary:
                  raise SystemExit('LOCAL_IMPORT_CYCLE=' + ' -> '.join(temporary + [module]))
              temporary.append(module)
              for dep in imports_of(path):
                  visit(dep)
              temporary.pop()
              permanent.add(module)
              order.append((module, path))

          for module in imports_of(ROOT):
              visit(module)

          print(f'PROBE_LOCAL_IMPORT_CLOSURE_COUNT={len(order)}')
          BUILD.mkdir(parents=True, exist_ok=True)
          for module, path in order:
              out = BUILD.joinpath(*module.split('.')).with_suffix('.olean')
              out.parent.mkdir(parents=True, exist_ok=True)
              if out.exists():
                  continue
              print(f'=== compiling {module} ===', flush=True)
              subprocess.run(['lake', 'env', 'lean', '-o', str(out), str(path)], check=True)
          print('PROBE_LOCAL_IMPORT_CLOSURE_GREEN=1')
          PY

      - name: Compile shifted canonical rectangle probe
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean GSTPrefixOneCanonicalRectangleProbe.lean | tee canonical-rectangle-probe.log
          echo 'CANONICAL_RECTANGLE_PROBE_GREEN=1'

      - name: Kernel axiom audit
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat > SOL56CanonicalRectangleAudit.lean <<'EOF'
          import GSTPrefixOneCanonicalRectangleProbe
          #print axioms GSTPrefixOneCanonicalRectangleProbe.physical_signed_rectangle_incidence_shifted_exact
          #print axioms GSTPrefixOneCanonicalRectangleProbe.canonical_prefix_one_shifted_signed_rectangle
          EOF
          lake env lean SOL56CanonicalRectangleAudit.lean | tee canonical-rectangle-axioms.log
          if grep -Fq 'sorryAx' canonical-rectangle-axioms.log; then
            echo 'forbidden sorryAx in canonical rectangle probe'
            exit 1
          fi
          echo 'CANONICAL_RECTANGLE_AXIOM_AUDIT_GREEN=1'
