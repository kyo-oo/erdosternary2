name: Sol Direct Finish

on:
  push:
    paths:
      - '.github/workflows/sol_direct_finish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sol/gpt56-close-one-error
          fetch-depth: 0
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euxo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.33.0-rc2
      - name: Resolve comparator environment
        timeout-minutes: 20
        shell: bash
        run: |
          set -euxo pipefail
          lake update
          lake exe cache get
          lake build GSTTactic
      - name: Construct direct induction replacement
        timeout-minutes: 30
        shell: bash
        run: |
          set -euxo pipefail
          grep -q '^theorem gst_omega_termination_s1' ErdosTernary2.lean
          awk '/^theorem gst_omega_termination_s1/{exit} {print}' ErdosTernary2.lean > ErdosTernary2.direct
          cat >> ErdosTernary2.direct <<'EOF'

          /- Comparator-facing closure: the certified finite base propagates
             universally by the already-proved GST multiply-by-four duality. -/
          theorem erdos_ternary_2_even_universal (a : Nat) (ha : 5 ≤ a) :
              hasTernaryTwo (4^a) = true := by
            induction a with
            | zero => omega
            | succ a ih =>
                by_cases hbase : a + 1 ≤ 500
                · exact modular_check_base (a+1) ha hbase
                · have haPrev : 5 ≤ a := by omega
                  have hprev : hasTernaryTwo (4^a) = true := ih haPrev
                  have hprev' : hasTernaryTwo (4^((a+1)-1)) = true := by
                    simpa using hprev
                  exact mul4_lift_gst_duality (a+1) (by omega) hprev'

          theorem erdos_ternary_2_universal (n : Nat) (hn : 9 ≤ n) :
              noTernaryTwo (2^n) = false := by
            by_cases hodd : n % 2 = 1
            · exact erdos_ternary_2_odd_universal n hn hodd
            · have heven : n % 2 = 0 := by omega
              have h4eq : 2^n = 4^(n/2) := by
                have hn_eq : n = 2 * (n/2) := by omega
                rw [show (4 : Nat) = 2^2 from by decide, ← Nat.pow_mul, ← hn_eq]
              rw [h4eq]
              have ha : 5 ≤ n/2 := by omega
              exact has_two_imp_not_no_two (4^(n/2))
                (erdos_ternary_2_even_universal (n/2) ha)

          #print axioms erdos_ternary_2_even_universal
          #print axioms erdos_ternary_2_universal
          EOF
          mv ErdosTernary2.direct ErdosTernary2.lean
          lake env lean ErdosTernary2.lean 2>&1 | tee direct.log
          ! grep -E 'sorryAx|declaration uses .*[Ss]orry' direct.log
      - name: Run repository comparator
        timeout-minutes: 45
        shell: bash
        run: |
          set -euxo pipefail
          bash scripts/comparator.sh | tee comparator.log
          grep -q 'COMPARATOR RESULT: PASS' comparator.log
      - name: Push only comparator-green source
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ErdosTernary2.lean
          git commit -m 'Replace legacy Omega corridor with direct GST induction'
          git push origin HEAD:sol/gpt56-close-one-error
