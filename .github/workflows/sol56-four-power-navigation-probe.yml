name: SOL56 Universal Four Power Navigation Probe

on:
  push:
    branches:
      - sol/gpt56-four-power-navigation-exact501-20260826
  workflow_dispatch:

jobs:
  lean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install exact Lean RC2 and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Compile standalone universal four-power navigation
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean GSTInfiniteFourPowerNavigation.lean
          echo 'FOUR_POWER_STANDALONE_GREEN=1'
