name: GPT56 Residual Bridge Probe

on:
  push:
    branches:
      - sol/gpt56-final-perfect-power-block-20260823
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sol/gpt56-final-perfect-power-block-20260823
          fetch-depth: 1
      - name: Assert exact production branch
        shell: bash
        run: |
          test "$(git branch --show-current)" = "sol/gpt56-final-perfect-power-block-20260823"
          echo "HEAD=$(git rev-parse HEAD)"
      - name: Install exact Lean toolchain
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned Mathlib
        shell: bash
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          rm -f lake-manifest.json
          lake update
          lake exe cache get
      - name: Install whole-theorem BIG-N surgery
        shell: bash
        run: |
          python3 scripts/apply_residual_bridge_probe.py
          if grep -nE '^[[:space:]]*gst_end[[:space:]]*$' ErdosTernary2.lean; then
            echo 'literal gst_end survived whole-theorem transformation'
            exit 1
          fi
          grep -n 'theorem gst_prefix_one_information_bad_descends_inline' ErdosTernary2.lean
          grep -n 'GSTCanonicalRightChordTrapS A z T' ErdosTernary2.lean
          grep -n 'gst_shared_x4_binary_factor_last_gate_high_bitS' ErdosTernary2.lean
      - name: Compile transformed production monolith
        shell: bash
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build GSTTactic ErdosTernary2
      - name: Audit transformed production source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('ErdosTernary2.lean')
          bad = []
          for i, line in enumerate(p.read_text(encoding='utf-8').splitlines(), 1):
              if line.lstrip().startswith('--'):
                  continue
              if re.search(r'\bsorry\b|\badmit\b|\baxiom\b|\bnative_decide\b', line):
                  bad.append(f'{p}:{i}:{line}')
          if bad:
              print('\n'.join(bad))
              raise SystemExit('transformed production source audit failed')
          print('transformed production source audit: clean')
          PY
      - name: Run official comparator
        shell: bash
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          bash scripts/comparator.sh | tee comparator-whole-theorem.log
          grep -q 'Your solution is okay!' comparator-whole-theorem.log
