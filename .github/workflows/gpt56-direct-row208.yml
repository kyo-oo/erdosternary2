name: GPT56 Direct Row208 Verify

on:
  push:
    branches:
      - sol/gpt56-four-power-relocation-prod-20260903
    paths:
      - GSTFourPowerDirectTwoHundredEighthRow.lean
      - .github/workflows/gpt56-direct-row208.yml
  workflow_dispatch:

jobs:
  direct-row208-kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
      - name: Compile exact fresh-production dependency closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean
          modules=(
            GSTCanonicalTailStateIso
            GSTFourPowerDirectResidue
            GSTFourPowerDirectResidue27
            GSTFourPowerDirectResidue81
            GSTFourPowerExponentTritObstruction
            GSTFourPowerExactExponentPeriod
            GSTFourPowerDirectExistence
            GSTFourPowerDirectAdditionCarry
            GSTFourPowerDirectHappyBridge
            GSTFourPowerAffineOrbit
            GSTFourPowerAffinePrefixIsometry
          )
          for module in "${modules[@]}"; do
            lake env lean -o ".lake/build/lib/lean/${module}.olean" "${module}.lean" 2>&1 | tee "${module}.log"
            ! grep -E 'declaration uses .sorry.|sorryAx|unknown identifier|unknown module prefix|unsolved goals|error:' "${module}.log"
          done
      - name: Compile direct row208 physical constructor
        shell: bash
        run: |
          set -euo pipefail
          ulimit -s 65536
          lake env lean -o .lake/build/lib/lean/GSTFourPowerDirectTwoHundredEighthRow.olean GSTFourPowerDirectTwoHundredEighthRow.lean 2>&1 | tee direct-row208.log
          ! grep -E 'declaration uses .sorry.|sorryAx|unknown identifier|unknown module prefix|unsolved goals|error:' direct-row208.log
      - name: Reject forbidden proof escapes
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE '\b(sorry|admit|axiom)\b|sorryAx|False\.elim' GSTFourPowerDirectTwoHundredEighthRow.lean
      - name: Axiom audit direct row208 theorem
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/Audit.lean <<'EOF'
          import GSTFourPowerDirectTwoHundredEighthRow
          #print axioms GSTFourPowerDirectTwoHundredEighthRow.commonTwo_of_mod1742693381014614361631744253876750131626600682858921288089186323970185832803443622626158010427690561_209
          #print axioms GSTFourPowerDirectTwoHundredEighthRow.physical_happy_of_mod1742693381014614361631744253876750131626600682858921288089186323970185832803443622626158010427690561_209
          #print axioms GSTFourPowerDirectTwoHundredEighthRow.four_power_happy_propagates_of_next_mod1742693381014614361631744253876750131626600682858921288089186323970185832803443622626158010427690561_209
          EOF
          lake env lean /tmp/Audit.lean 2>&1 | tee audit.log
          ! grep -E 'sorryAx' audit.log
      - name: Direct physical-row marker
        run: echo DIRECT_ROW208_RELOCATED_HAPPY_KERNEL_GREEN
