name: GST cubic physical row13 source-neighbor and original HGate
on:
  push:
    branches: [gpt6/problem406-cubic-universal-research-20261029]
    paths: [GSTWorldtraceCubicPhysicalEscape13.lean, GSTWorldtraceCubicBlockLift.lean, .github/workflows/gpt6_gst_cubic_physical_escape.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cubic-physical-escape:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build exact GST source, neighbor and original gate dependencies
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
          lake build GSTWorldtraceBlockLift GSTFourPowerThirdWave GSTFourPowerDirectCreationMaster
          lake env lean -o .lake/build/lib/lean/GSTWorldtraceQuadraticBlockLift.olean GSTWorldtraceQuadraticBlockLift.lean
          lake env lean -o .lake/build/lib/lean/GSTWorldtraceCubicBlockLift.olean GSTWorldtraceCubicBlockLift.lean
      - name: Strict kernel check source-original HGate and creation certificate
        shell: bash
        run: |
          set -euo pipefail
          lake env lean GSTWorldtraceCubicPhysicalEscape13.lean 2>&1 | tee cubic-physical-exit.log
          ! grep -E 'error:|sorryAx|unknown identifier|unsolved goals|declaration uses .sorry.|gst_four_power_direct_existence_inline' cubic-physical-exit.log
          echo GST_CUBIC_PHYSICAL_UNBOUNDED_ROW13_FAMILY_PASS=1
