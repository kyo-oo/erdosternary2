name: GPT6 Problem406 Seven-Step Sharpness Kernel
on:
  push:
    branches: [gpt6/problem406-seven-step-sharpness-20261030]
    paths:
      - GSTProblem406SevenStepSharpness.lean
      - .github/workflows/gpt6_problem406_seven_step_sharpness.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Lean and build exact physical digit dependency
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
          lake build GSTFourPowerDirectResidue
      - name: Verify new GST sharpness discovery without custom axioms
        shell: bash
        run: |
          set -euo pipefail
          lake env lean GSTProblem406SevenStepSharpness.lean 2>&1 | tee seven-step-sharpness.log
          ! grep -E 'error:|sorryAx|unknown identifier|unsolved goals|declaration uses .sorry.' seven-step-sharpness.log
          grep -F 'source_3829_no_pair_before_shift_seven' seven-step-sharpness.log
          grep -F 'generic_seven_step_bound_is_sharp' seven-step-sharpness.log
          echo GST_406_SEVEN_STEP_SHARPNESS_KERNEL_PASS=1
