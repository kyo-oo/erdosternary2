name: H Creation Fast Compile

on:
  push:
    branches:
      - sol/gpt56-universal-four-power-execution-20260827
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Setup Lean with cache
        uses: leanprover/lean-action@v1
        with:
          build: false

      - name: Inspect exact mul4 lift contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s = Path('ErdosTernary2.lean').read_text(encoding='utf-8')
          needle = 'theorem mul4_lift_gst_duality'
          i = s.find(needle)
          print(f'MUL4_LIFT_OFFSET={i}')
          if i < 0:
              print('MUL4_LIFT_NOT_PRESENT=1')
          else:
              line = s.count('\n', 0, i) + 1
              print(f'MUL4_LIFT_LINE={line}')
              print('=== MUL4_LIFT_CONTEXT_BEGIN ===')
              print('\n'.join(s[i:i+10000].splitlines()[:180]))
              print('=== MUL4_LIFT_CONTEXT_END ===')
          PY

      # Judge the committed transformed monolith; normalization below is runner-only.
      - name: Neutralize only inlined duplicate import edges
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ErdosTernary2.lean')
          s = p.read_text(encoding='utf-8')
          exact_drop = {
              'GSTPrefixOnePhaseIncidenceControl',
              'GSTPrefixOneSpacetimeIncidenceControl',
          }
          out=[]
          neutralized=[]
          for line in s.splitlines(keepends=True):
              stripped=line.strip()
              if stripped.startswith('import '):
                  mods=stripped[len('import '):].split()
                  if len(mods)==1:
                      mod=mods[0]
                      if mod in exact_drop or mod.endswith('Scratch'):
                          nl='\n' if line.endswith('\n') else ''
                          out.append(f'-- HCREATION JUDGE NEUTRALIZED DUPLICATE IMPORT: {mod}{nl}')
                          neutralized.append(mod)
                          continue
              out.append(line)
          p.write_text(''.join(out), encoding='utf-8')
          print(f'HCREATION_NEUTRALIZED_IMPORT_COUNT={len(neutralized)}')
          print('HCREATION_RUNNER_ONLY_IMPORT_NORMALIZATION=1')
          PY

      - name: Materialize exact local import closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess

          ROOT = Path('ErdosTernary2.lean')
          BUILD = Path('.lake/build/lib/lean')
          import_re = re.compile(r'^\s*import\s+(.+?)\s*$')

          def local_path(module: str) -> Path:
              return Path(*module.split('.')).with_suffix('.lean')

          def imports_of(path: Path):
              result=[]
              for raw in path.read_text(encoding='utf-8').splitlines():
                  code=raw.split('--',1)[0].rstrip()
                  m=import_re.match(code)
                  if m:
                      result.extend(m.group(1).split())
              return result

          order=[]; permanent=set(); temporary=[]
          def visit(module: str):
              if module == 'ErdosTernary2' or module in permanent:
                  return
              path=local_path(module)
              if not path.exists():
                  return
              if module in temporary:
                  raise SystemExit('LOCAL_IMPORT_CYCLE=' + ' -> '.join(temporary+[module]))
              temporary.append(module)
              for dep in imports_of(path): visit(dep)
              temporary.pop(); permanent.add(module); order.append((module,path))

          for module in imports_of(ROOT): visit(module)
          print(f'LOCAL_IMPORT_CLOSURE_COUNT={len(order)}')
          BUILD.mkdir(parents=True, exist_ok=True)
          for module,path in order:
              out=BUILD.joinpath(*module.split('.')).with_suffix('.olean')
              out.parent.mkdir(parents=True, exist_ok=True)
              if out.exists():
                  print(f'CACHED {module}')
                  continue
              print(f'COMPILE {module}', flush=True)
              subprocess.run(['lake','env','lean','-o',str(out),str(path)], check=True)
          print('LOCAL_IMPORT_CLOSURE_GREEN=1')
          PY

      - name: Compile live h_creation monolith
        shell: bash
        run: |
          set -o pipefail
          lake env lean -o .lake/build/lib/lean/ErdosTernary2.olean ErdosTernary2.lean 2>&1 | tee hcreation-fast-lean.log
          code=${PIPESTATUS[0]}
          echo "LEAN_EXIT=${code}"
          exit "$code"

      - name: Axiom audit
        if: success()
        shell: bash
        run: |
          cat > HCreationAudit.lean <<'EOF'
          import ErdosTernary2
          #print axioms h_creation_for_4pow
          EOF
          lake env lean HCreationAudit.lean | tee hcreation-fast-axioms.log
          if grep -Fq 'sorryAx' hcreation-fast-axioms.log; then
            echo 'H_CREATION_SORRYAX=1'
            exit 1
          fi
          echo 'H_CREATION_AXIOM_AUDIT_GREEN=1'
