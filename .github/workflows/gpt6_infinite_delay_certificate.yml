name: GPT6 GST Delayed-Gate Kernel Certificate
on:
  push:
    branches:
      - gpt6/erdos-infinite-support-bridge-audit-20261029
    paths:
      - GSTInfiniteDelayAudit.lean
      - .github/workflows/gpt6_infinite_delay_certificate.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Lean pinned 4.33 rc2 and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Kernel check GST nonlocal gate delay K8 K11
        shell: bash
        run: |
          set -euo pipefail
          lake build GSTInfiniteDelayAudit 2>&1 | tee infinity-delay.log
          ! grep -E 'error:|sorryAx|unsolved goals|unknown identifier|declaration uses .sorry.' infinity-delay.log
          echo GST_GATE_DELAY_KERNEL_PASS=1
