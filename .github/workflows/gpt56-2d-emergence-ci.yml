name: GPT56 2D Mixed Emergence

on:
  push:
    branches:
      - sol/gpt56-2d-emergence-surgery-20260822
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install exact Lean toolchain
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned Mathlib
        shell: bash
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          rm -f lake-manifest.json
          lake update
          lake exe cache get
      - name: Compile mixed 2D emergence
        shell: bash
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean GST2DMixedEmergence.lean
      - name: Extract direct universal prefix
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          src = Path('ErdosTernary2.lean').read_text(encoding='utf-8').splitlines()
          starts = [i for i,l in enumerate(src) if l.startswith('theorem erdos_ternary_2_universal')]
          if not starts:
              raise SystemExit('missing erdos_ternary_2_universal')
          start = starts[0]
          decl = re.compile(r'^(?:theorem|def|structure|inductive|class|instance|abbrev)\s+')
          end = next((i for i in range(start+1, len(src)) if decl.match(src[i])), len(src))
          out = src[:end]
          out += [
            '',
            '#print axioms h_creation_for_4pow',
            '#print axioms mul4_lift_gst_duality',
            '#print axioms erdos_ternary_2_even_universal',
            '#print axioms erdos_ternary_2_universal',
          ]
          Path('DirectUniversalPrefix.lean').write_text('\n'.join(out) + '\n', encoding='utf-8')
          print(f'universal starts line {start+1}; prefix ends line {end}')
          PY
      - name: Compile and axiom-audit direct prefix
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean DirectUniversalPrefix.lean 2>&1 | tee direct-prefix.log
          if grep -E 'sorryAx|unknown tactic|declaration uses.*sorry' direct-prefix.log; then
            echo 'FORBIDDEN AXIOM IN DIRECT PREFIX'
            exit 1
          fi
