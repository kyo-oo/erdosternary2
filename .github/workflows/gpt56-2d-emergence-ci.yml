name: GPT56 2D Mixed Emergence

on:
  push:
    branches:
      - sol/gpt56-2d-emergence-surgery-20260822
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install exact Lean toolchain
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned Mathlib
        shell: bash
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          rm -f lake-manifest.json
          lake update
          lake exe cache get
      - name: Compile mixed 2D emergence
        shell: bash
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean GST2DMixedEmergence.lean
