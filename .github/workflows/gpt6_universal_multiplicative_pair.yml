name: GPT6 Universal Positive-Integer Multiplicative Pair Kernel
on:
  push:
    branches: [gpt6/problem406-seventh-trit-worldtrace-20261029]
    paths:
      - GSTProblem406UniversalMultiplicativePair.lean
      - GSTProblem406SyndeticArchimedeanGate.lean
      - .github/workflows/gpt6_universal_multiplicative_pair.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
          lake build GSTProblem406SyndeticArchimedeanGate GSTFourPowerDirectNo22 GSTFourPowerNo22Magnitude
      - name: Check universal all-integer pair and axiom dependencies
        shell: bash
        run: |
          set -euo pipefail
          lake env lean GSTProblem406UniversalMultiplicativePair.lean 2>&1 | tee universal-orbit-pair.log
          ! grep -E 'error:|sorryAx|unknown identifier|unsolved goals|declaration uses .sorry.' universal-orbit-pair.log
          grep -F 'any_positive_source_pair_within_eighteen' universal-orbit-pair.log
          echo UNIVERSAL_INTEGER_MULTIPLICATIVE_PAIR_KERNEL_PASS=1
