name: Sol56 Residual Collision Audit

on:
  push:
    branches:
      - sol/gpt56-residual-collision-audit-20260826
  workflow_dispatch:

jobs:
  residual-collision-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Materialize exact Lean RC2 package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          Path('lean-toolchain').write_text('leanprover/lean4:v4.33.0-rc2\n', encoding='utf-8')
          Path('lakefile.toml').write_text('''name = "erdos-ternary2-residual-collision-audit"\nversion = "0.1.0"\n\n[[require]]\nname = "mathlib"\nscope = "leanprover-community"\nrev = "v4.33.0-rc2"\n\n[[lean_lib]]\nname = "GSTTactic"\n''', encoding='utf-8')
          Path('lake-manifest.json').unlink(missing_ok=True)
          PY

      - name: Install exact Lean RC2 and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get

      - name: Compile exact local dependency closure
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          ROOT = Path('GSTFinalResidualCollision.lean')
          BUILD = Path('.lake/build/lib/lean')
          import_re = re.compile(r'^\s*import\s+(.+?)\s*$')
          def local_path(module): return Path(*module.split('.')).with_suffix('.lean')
          def imports_of(path):
              result=[]
              for raw in path.read_text(encoding='utf-8').splitlines():
                  code=raw.split('--',1)[0].rstrip()
                  m=import_re.match(code)
                  if m: result.extend(m.group(1).split())
              return result
          order=[]; permanent=set(); temporary=[]
          def visit(module):
              if module in permanent: return
              path=local_path(module)
              if not path.exists(): return
              if module in temporary:
                  raise SystemExit('LOCAL_IMPORT_CYCLE='+' -> '.join(temporary+[module]))
              temporary.append(module)
              for dep in imports_of(path): visit(dep)
              temporary.pop(); permanent.add(module); order.append((module,path))
          for module in imports_of(ROOT): visit(module)
          print(f'RESIDUAL_COLLISION_IMPORT_CLOSURE_COUNT={len(order)}')
          BUILD.mkdir(parents=True, exist_ok=True)
          for module,path in order:
              out=BUILD.joinpath(*module.split('.')).with_suffix('.olean')
              out.parent.mkdir(parents=True, exist_ok=True)
              print(f'=== compiling local import {module} ===', flush=True)
              subprocess.run(['lake','env','lean','-o',str(out),str(path)], check=True)
          PY

      - name: Compile collision theorem and audit axioms
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat > ResidualCollisionAxiomAudit.lean <<'EOF'
          import GSTFinalResidualCollision
          #check GSTFinalResidualCollision.residual_level_one_origin_one_collision
          #print axioms GSTFinalResidualCollision.residual_level_one_origin_one_collision
          EOF
          lake env lean -o .lake/build/lib/lean/GSTFinalResidualCollision.olean GSTFinalResidualCollision.lean 2>&1 | tee residual-collision-compile.log
          lake env lean ResidualCollisionAxiomAudit.lean 2>&1 | tee residual-collision-axioms.log
          if grep -Fq 'sorryAx' residual-collision-compile.log residual-collision-axioms.log; then
            echo 'RESIDUAL_COLLISION_SORRYAX=1'
            exit 1
          fi
          echo 'RESIDUAL_COLLISION_COMPILE_GREEN=1'
          echo 'RESIDUAL_COLLISION_AXIOMS_GREEN=1'
