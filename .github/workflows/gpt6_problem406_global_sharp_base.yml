name: GST global sharp physical residual base K mod9=4
on:
  push:
    branches: [gpt6/problem406-sharp-peel-residual-20261029]
    paths: [GSTProblem406GlobalSharpBase.lean, .github/workflows/gpt6_problem406_global_sharp_base.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  global-sharp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Compile exact physical affine-prefix isometry
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
          lake build GSTFourPowerAffineOrbit
          lake env lean -o .lake/build/lib/lean/GSTFourPowerExactExponentPeriod.olean GSTFourPowerExactExponentPeriod.lean
          lake env lean -o .lake/build/lib/lean/GSTFourPowerAffinePrefixIsometry.olean GSTFourPowerAffinePrefixIsometry.lean
      - name: Strict Lean verification of all K mod9=4 physical residual
        shell: bash
        run: |
          set -euo pipefail
          lake env lean GSTProblem406GlobalSharpBase.lean 2>&1 | tee gst406-global-sharp.log
          ! grep -E 'error:|sorryAx|unknown identifier|unsolved goals|declaration uses .sorry.|gst_four_power_direct_existence_inline' gst406-global-sharp.log
          echo GST406_GLOBAL_SHARP_PHYSICAL_BASE_PASS=1
