name: GPT6 GST All-Depth Coupled Controller Countermodel
on:
  push:
    branches:
      - gpt6/erdos-infinite-support-bridge-audit-20261029
    paths:
      - GSTCoupledControllerCountermodel.lean
      - .github/workflows/gpt6_coupled_countermodel.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Lean pinned and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Kernel-check all-depth power-64 controller countermodel
        shell: bash
        run: |
          set -euo pipefail
          lake build GSTCoupledControllerCountermodel 2>&1 | tee coupled-countermodel.log
          ! grep -E 'error:|sorryAx|unsolved goals|unknown identifier|declaration uses .sorry.' coupled-countermodel.log
          echo GST_COUPLED_POWER64_COUNTERMODEL_KERNEL_PASS=1
