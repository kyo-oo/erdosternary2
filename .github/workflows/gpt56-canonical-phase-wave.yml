name: GPT56 Canonical Phase Wave CI

on:
  push:
    branches:
      - sol/gpt56-canonical-tail-escape-20260827
    paths:
      - 'GSTGraphV2CanonicalPhaseWaveProbe.lean'
      - 'GSTGraphV2CanonicalPhaseSteering.lean'
      - 'GSTGraphV2CanonicalRenormalization.lean'
      - '.github/workflows/gpt56-canonical-phase-wave.yml'
  workflow_dispatch:

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
      - name: Compile exact canonical phase-wave probe
        shell: bash
        run: |
          set -euo pipefail
          lake build GSTGraphV2CanonicalPhaseWaveProbe
          lake env lean GSTGraphV2CanonicalPhaseWaveProbe.lean 2>&1 | tee canonical-phase-wave.log
          ! grep -E 'declaration uses .sorry.|unknown identifier|unknown module prefix|unsolved goals' canonical-phase-wave.log
