name: GPT56 GST Six-Adic Ontological Geometry

on:
  push:
    branches:
      - sol/gpt56-affine-sixadic-20260903
    paths:
      - GSTGraphV2NonEuclidean.lean
      - GSTGraphV2NonEuclideanLaws.lean
      - GSTGraphV2SixAdicOntologicalGeometry.lean
      - GSTGraphV2SixAdicOntologicalGeometryLaws.lean
      - GSTGraphV2SixAdicSynchronizedShadows.lean
      - GSTGraphV2SixAdicOntologicalGeometryTest.lean
      - .github/workflows/gpt56-six-adic-ontological-geometry.yml
  workflow_dispatch:

jobs:
  six-adic-geometry:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install exact Lean RC2
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned Mathlib
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Build GST dependency closure
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build GSTLocalClosure
      - name: Compile and audit six-adic ontological geometry
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p .lake/build/lib/lean
          lake env lean -o .lake/build/lib/lean/GSTGraphV2NonEuclidean.olean GSTGraphV2NonEuclidean.lean 2>&1 | tee non-euclidean-core.log
          lake env lean -o .lake/build/lib/lean/GSTGraphV2NonEuclideanLaws.olean GSTGraphV2NonEuclideanLaws.lean 2>&1 | tee non-euclidean-laws.log
          lake env lean -o .lake/build/lib/lean/GSTGraphV2SixAdicOntologicalGeometry.olean GSTGraphV2SixAdicOntologicalGeometry.lean 2>&1 | tee six-adic-core.log
          lake env lean -o .lake/build/lib/lean/GSTGraphV2SixAdicOntologicalGeometryLaws.olean GSTGraphV2SixAdicOntologicalGeometryLaws.lean 2>&1 | tee six-adic-laws.log
          lake env lean -o .lake/build/lib/lean/GSTGraphV2SixAdicSynchronizedShadows.olean GSTGraphV2SixAdicSynchronizedShadows.lean 2>&1 | tee six-adic-shadows.log
          lake env lean GSTGraphV2SixAdicOntologicalGeometryTest.lean 2>&1 | tee six-adic-test.log
          cat non-euclidean-core.log non-euclidean-laws.log six-adic-core.log six-adic-laws.log six-adic-shadows.log six-adic-test.log > six-adic-all.log
          ! grep -Fq 'sorryAx' six-adic-all.log
          ! grep -Eq '(^|[^A-Za-z0-9_])(sorry|admit)([^A-Za-z0-9_]|$)' GSTGraphV2SixAdicOntologicalGeometry.lean GSTGraphV2SixAdicOntologicalGeometryLaws.lean GSTGraphV2SixAdicSynchronizedShadows.lean GSTGraphV2SixAdicOntologicalGeometryTest.lean
          echo GST_GRAPH_V2_SIX_ADIC_ONTOLOGICAL_GEOMETRY_GREEN=1
