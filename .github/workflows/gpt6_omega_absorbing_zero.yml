name: GPT6 GST Omega Absorbing-Zero Infinity Kernel
on:
  push:
    branches:
      - gpt6/erdos-infinite-support-bridge-audit-20261029
    paths:
      - GSTOmegaAbsorbingZero.lean
      - .github/workflows/gpt6_omega_absorbing_zero.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Verify all-depth affine Omega zero absorption
        shell: bash
        run: |
          set -euo pipefail
          lake build GSTOmegaAbsorbingZero 2>&1 | tee omega-absorption.log
          ! grep -E 'error:|sorryAx|unsolved goals|unknown identifier|declaration uses .sorry.' omega-absorption.log
          echo GST_OMEGA_ABSORBING_ZERO_KERNEL_PASS=1
