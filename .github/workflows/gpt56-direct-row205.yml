name: GPT56 Direct Row205 Verify

on:
  push:
    branches:
      - sol/gpt56-four-power-relocation-prod-20260903
    paths:
      - GSTFourPowerDirectTwoHundredFifthRow.lean
      - .github/workflows/gpt56-direct-row205.yml
  workflow_dispatch:

jobs:
  direct-row205-kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
      - name: Compile exact fresh-production dependency closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean
          modules=(
            GSTCanonicalTailStateIso
            GSTFourPowerDirectResidue
            GSTFourPowerDirectResidue27
            GSTFourPowerDirectResidue81
            GSTFourPowerExponentTritObstruction
            GSTFourPowerExactExponentPeriod
            GSTFourPowerDirectExistence
            GSTFourPowerDirectAdditionCarry
            GSTFourPowerDirectHappyBridge
            GSTFourPowerAffineOrbit
            GSTFourPowerAffinePrefixIsometry
          )
          for module in "${modules[@]}"; do
            lake env lean -o ".lake/build/lib/lean/${module}.olean" "${module}.lean" 2>&1 | tee "${module}.log"
            ! grep -E 'declaration uses .sorry.|sorryAx|unknown identifier|unknown module prefix|unsolved goals|error:' "${module}.log"
          done
      - name: Compile direct row205 physical constructor
        shell: bash
        run: |
          set -euo pipefail
          ulimit -s 65536
          lake env lean -o .lake/build/lib/lean/GSTFourPowerDirectTwoHundredFifthRow.olean GSTFourPowerDirectTwoHundredFifthRow.lean 2>&1 | tee direct-row205.log
          ! grep -E 'declaration uses .sorry.|sorryAx|unknown identifier|unknown module prefix|unsolved goals|error:' direct-row205.log
      - name: Reject forbidden proof escapes
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE '\b(sorry|admit|axiom)\b|sorryAx|False\.elim' GSTFourPowerDirectTwoHundredFifthRow.lean
      - name: Axiom audit direct row205 theorem
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/Audit.lean <<'EOF'
          import GSTFourPowerDirectTwoHundredFifthRow
          #print axioms GSTFourPowerDirectTwoHundredFifthRow.commonTwo_of_mod64544199296837568949323861254694449319503728994774862521821715702599475289016430467635481867692243_206
          #print axioms GSTFourPowerDirectTwoHundredFifthRow.physical_happy_of_mod64544199296837568949323861254694449319503728994774862521821715702599475289016430467635481867692243_206
          #print axioms GSTFourPowerDirectTwoHundredFifthRow.four_power_happy_propagates_of_next_mod64544199296837568949323861254694449319503728994774862521821715702599475289016430467635481867692243_206
          EOF
          lake env lean /tmp/Audit.lean 2>&1 | tee audit.log
          ! grep -E 'sorryAx' audit.log
      - name: Direct physical-row marker
        run: echo DIRECT_ROW205_RELOCATED_HAPPY_KERNEL_GREEN
