name: GST 406 Physical U Tail Kernel Audit
on:
  push:
    branches: [gpt6/problem406-u-flux-tail-closure-audit-20261030]
    paths:
      - GST406PhysicalUTerminal.lean
      - lakefile.toml
      - .github/workflows/gst_406_physical_u_tail.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict_u:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Strict kernel and axiom audit
        shell: bash
        run: |
          set -euo pipefail
          lake build GST406PhysicalUTerminalAudit 2>&1 | tee /tmp/stable-tail-build.log
          lake env lean GST406PhysicalUTerminal.lean 2>&1 | tee /tmp/stable-tail-axioms.log
          ! grep -E 'error:|sorryAx|unsolved goals|unknown identifier|declaration uses .sorry.' /tmp/stable-tail-build.log /tmp/stable-tail-axioms.log
          grep -F 'physical_terminal_equationIII_negative' /tmp/stable-tail-axioms.log
          echo GST_406_PHYSICAL_U_TAIL_PASS=1
