name: GPT56 Prefix One U2D Proof

on:
  push:
    branches:
      - sol/gpt56-canonical-tail-escape-20260827
    paths:
      - '.github/workflows/gpt56-prefix-one-u2d-proof.yml'
      - 'GSTPrefixOneU2DCollisionProof.lean'
  workflow_dispatch:

concurrency:
  group: gpt56-prefix-one-u2d-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Pin source
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_HEAD=$(git rev-parse HEAD)"
      - name: Install exact Lean RC2 and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          rm -f lake-manifest.json
          lake update
          lake exe cache get
      - name: Materialize proof import closure
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          ROOT = Path('GSTPrefixOneU2DCollisionProof.lean')
          BUILD = Path('.lake/build/lib/lean')
          import_re = re.compile(r'^\s*import\s+(.+?)\s*$')
          def local_path(module): return Path(*module.split('.')).with_suffix('.lean')
          def imports_of(path):
              out=[]
              for raw in path.read_text(encoding='utf-8').splitlines():
                  code=raw.split('--',1)[0].rstrip()
                  m=import_re.match(code)
                  if m: out.extend(m.group(1).split())
              return out
          order=[]; done=set(); temp=[]
          def visit(module):
              if module in done: return
              path=local_path(module)
              if not path.exists(): return
              if module in temp: raise SystemExit('LOCAL_IMPORT_CYCLE='+' -> '.join(temp+[module]))
              temp.append(module)
              for dep in imports_of(path): visit(dep)
              temp.pop(); done.add(module); order.append((module,path))
          for module in imports_of(ROOT): visit(module)
          print(f'PROOF_IMPORT_CLOSURE_COUNT={len(order)}')
          BUILD.mkdir(parents=True, exist_ok=True)
          for module,path in order:
              out=BUILD.joinpath(*module.split('.')).with_suffix('.olean')
              out.parent.mkdir(parents=True, exist_ok=True)
              if out.exists(): continue
              print(f'=== compiling {module} ===', flush=True)
              subprocess.run(['lake','env','lean','-o',str(out),str(path)],check=True)
          print('PROOF_IMPORT_CLOSURE_GREEN=1')
          PY
      - name: Compile prefix-one U2D proof
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean -o .lake/build/lib/lean/GSTPrefixOneU2DCollisionProof.olean GSTPrefixOneU2DCollisionProof.lean 2>&1 | tee prefix-one-u2d.log
          echo 'PREFIX_ONE_U2D_PROOF_GREEN=1'
      - name: Axiom audit
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat > GPT56PrefixOneU2DAudit.lean <<'EOF'
          import GSTPrefixOneU2DCollisionProof
          #print axioms GSTPrefixOneU2DCollisionProof.child_energy_decomposition
          #print axioms GSTPrefixOneU2DCollisionProof.child_tail_happy_to_graph
          #print axioms GSTPrefixOneU2DCollisionProof.child_base_carry_zero
          #print axioms GSTPrefixOneU2DCollisionProof.seeded_one_bad_to_graph_right_bad
          #print axioms GSTPrefixOneU2DCollisionProof.canonical_right_bad_to_graph_right_bad
          #print axioms GSTPrefixOneU2DCollisionProof.canonical_prefix_one_u2d_collision
          EOF
          lake env lean GPT56PrefixOneU2DAudit.lean 2>&1 | tee prefix-one-u2d-axioms.log
          if grep -Fq 'sorryAx' prefix-one-u2d-axioms.log; then
            echo 'FORBIDDEN_SORRYAX_IN_PREFIX_ONE_U2D=1'
            exit 1
          fi
          if grep -En '(^|[^[:alpha:]_])(sorry|admit)([^[:alpha:]_]|$)' GSTPrefixOneU2DCollisionProof.lean; then
            echo 'FORBIDDEN_PLACEHOLDER_IN_PREFIX_ONE_U2D=1'
            exit 1
          fi
          echo 'PREFIX_ONE_U2D_AXIOM_AUDIT_GREEN=1'
