name: GPT56 Aug22 Atomic Inventory

on:
  push:
    branches:
      - sol/gpt56-gstv2-universal-charge-20260822
  pull_request:
    branches:
      - sol/gpt56-atomic-gstv2-final-20260822
  workflow_dispatch:

jobs:
  inventory-and-clean-spine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Exact Lean line inventory
        shell: bash
        run: |
          set -euxo pipefail
          echo '=== TOP LEAN FILES BY LINE COUNT ==='
          find . -type f -name '*.lean' -not -path './.lake/*' -print0 \
            | xargs -0 wc -l \
            | sort -nr > /tmp/all-lean-lines.txt
          sed -n '1,100p' /tmp/all-lean-lines.txt
          echo '=== LEAN FILES >= 16000 LINES ==='
          found=0
          while IFS= read -r -d '' f; do
            n=$(wc -l < "$f")
            if [ "$n" -ge 16000 ]; then
              printf '%8d %s\n' "$n" "$f"
              found=1
            fi
          done < <(find . -type f -name '*.lean' -not -path './.lake/*' -print0)
          echo "GE16000_FOUND=$found"
          echo '=== ROOT MONOLITH ==='
          wc -l ErdosTernary2.lean
          grep -n -E '\bsorry\b|\badmit\b|sorryAx' ErdosTernary2.lean || true
          echo '=== PROVENANCE CHECK ==='
          if [ -f GSTResidueSpacetimeScratch.lean ]; then echo ROOT_RESIDUE_SCRATCH_PRESENT; else echo ROOT_RESIDUE_SCRATCH_ABSENT; fi

      - name: Exhaustive permitted Sol-head line sweep
        shell: bash
        run: |
          set -euxo pipefail
          branches=(
            sol/atomic-gst-v2-final-surgery
            sol/atomic-gst-v2-surgery-2026-08-18
            sol/atomic-surgery-2026-08-18
            sol/canonical-main-clean-20260818
            sol/gst-v2-atomic-surgery-20260818
            sol/gpt56-close-one-error
            sol/gpt56-infinite-control-production
            sol/gpt56-k1-origin-descent-proof-20260821
            sol/gpt56-production-repair-20260821
            sol/gpt56-final-comparator-20260821
            sol/gpt56-final-comparator-run-20260821
            sol/gpt56-final-comparator-run2-20260821
            sol/gpt56-exec-gate-20260821
            sol/gpt56-atomic-gstv2-final-20260822
          )
          : > /tmp/sol-large-files.txt
          for b in "${branches[@]}"; do
            git fetch --depth=1 origin "+refs/heads/$b:refs/remotes/origin/$b"
            echo "=== BRANCH $b ==="
            maxn=0
            maxf=''
            while IFS= read -r f; do
              n=$(git show "origin/$b:$f" | wc -l)
              if [ "$n" -gt "$maxn" ]; then maxn=$n; maxf=$f; fi
              if [ "$n" -ge 16000 ]; then
                printf '%s\t%d\t%s\n' "$b" "$n" "$f" | tee -a /tmp/sol-large-files.txt
              fi
            done < <(git ls-tree -r --name-only "origin/$b" | grep -E '\.lean$' || true)
            echo "BRANCH_MAX=$maxn $maxf"
          done
          echo '=== ALL >=16000 MATCHES ==='
          cat /tmp/sol-large-files.txt

      - name: Install pinned Lean
        shell: bash
        run: |
          set -euxo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.33.0-rc2

      - name: Resolve dependencies
        timeout-minutes: 20
        shell: bash
        run: |
          set -euxo pipefail
          lake update
          lake exe cache get
          lake build GSTTactic

      - name: Compile clean Aug22 phase spine
        timeout-minutes: 45
        shell: bash
        run: |
          set -euxo pipefail
          export LEAN_PATH="$PWD:${LEAN_PATH:-}"
          lake env lean -o GSTPrefixOnePhaseIncidenceControl.olean GSTPrefixOnePhaseIncidenceControl.lean 2>&1 | tee /tmp/phase.log
          ! grep -q 'sorryAx' /tmp/phase.log

      - name: Compile new stride-two layer
        timeout-minutes: 45
        shell: bash
        run: |
          set -euxo pipefail
          export LEAN_PATH="$PWD:${LEAN_PATH:-}"
          lake env lean GSTPrefixOneStrideTwoControl.lean 2>&1 | tee /tmp/stride.log
          ! grep -q 'sorryAx' /tmp/stride.log
