name: GPT56 Direct Existence Inline

on:
  push:
    branches:
      - sol/gpt56-canonical-tail-escape-20260827
    paths:
      - 'GSTFourPowerDirectExistenceInline.lean'
      - '.github/workflows/gpt56-direct-existence-inline.yml'
  workflow_dispatch:

concurrency:
  group: gpt56-direct-existence-inline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Install exact Lean RC2 and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          rm -f lake-manifest.json
          lake update
          lake exe cache get
      - name: Materialize direct import closure
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          ROOT = Path('GSTFourPowerDirectExistenceInline.lean')
          BUILD = Path('.lake/build/lib/lean')
          imp = re.compile(r'^\s*import\s+(.+?)\s*$')
          def lp(m): return Path(*m.split('.')).with_suffix('.lean')
          def imports(path):
              out=[]
              for raw in path.read_text(encoding='utf-8').splitlines():
                  code=raw.split('--',1)[0].rstrip()
                  m=imp.match(code)
                  if m: out.extend(m.group(1).split())
              return out
          done=set(); active=[]; order=[]
          def visit(m):
              if m in done: return
              p=lp(m)
              if not p.exists(): return
              if m in active: raise SystemExit('LOCAL_IMPORT_CYCLE='+' -> '.join(active+[m]))
              active.append(m)
              for d in imports(p): visit(d)
              active.pop(); done.add(m); order.append((m,p))
          for m in imports(ROOT): visit(m)
          BUILD.mkdir(parents=True,exist_ok=True)
          for m,p in order:
              out=BUILD.joinpath(*m.split('.')).with_suffix('.olean')
              out.parent.mkdir(parents=True,exist_ok=True)
              if out.exists(): continue
              print('=== compiling',m,'===',flush=True)
              subprocess.run(['lake','env','lean','-o',str(out),str(p)],check=True)
          PY
      - name: Compile replacement theorem
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean GSTFourPowerDirectExistenceInline.lean 2>&1 | tee direct-inline.log
      - name: Axiom audit
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          if grep -Fq 'sorryAx' direct-inline.log; then
            echo 'FORBIDDEN_SORRYAX=1'
            exit 1
          fi
