name: GPT56 Direct Row183 Verify

on:
  push:
    branches:
      - sol/gpt56-four-power-relocation-prod-20260903
    paths:
      - GSTFourPowerDirectOneHundredEightyThirdRow.lean
      - .github/workflows/gpt56-direct-row183.yml
  workflow_dispatch:

jobs:
  direct-row183-kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
      - name: Compile exact fresh-production dependency closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean
          modules=(
            GSTCanonicalTailStateIso
            GSTFourPowerDirectResidue
            GSTFourPowerDirectResidue27
            GSTFourPowerDirectResidue81
            GSTFourPowerExponentTritObstruction
            GSTFourPowerExactExponentPeriod
            GSTFourPowerDirectExistence
            GSTFourPowerDirectAdditionCarry
            GSTFourPowerDirectHappyBridge
            GSTFourPowerAffineOrbit
            GSTFourPowerAffinePrefixIsometry
          )
          for module in "${modules[@]}"; do
            lake env lean -o ".lake/build/lib/lean/${module}.olean" "${module}.lean" 2>&1 | tee "${module}.log"
            ! grep -E 'declaration uses .sorry.|sorryAx|unknown identifier|unknown module prefix|unsolved goals|error:' "${module}.log"
          done
      - name: Compile direct row183 physical constructor
        shell: bash
        run: |
          set -euo pipefail
          ulimit -s 65536
          lake env lean -o .lake/build/lib/lean/GSTFourPowerDirectOneHundredEightyThirdRow.olean GSTFourPowerDirectOneHundredEightyThirdRow.lean 2>&1 | tee direct-row183.log
          ! grep -E 'declaration uses .sorry.|sorryAx|unknown identifier|unknown module prefix|unsolved goals|error:' direct-row183.log
      - name: Reject forbidden proof escapes
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE '\b(sorry|admit|axiom)\b|sorryAx|False\.elim' GSTFourPowerDirectOneHundredEightyThirdRow.lean
      - name: Axiom audit direct row183 theorem
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/Audit.lean <<'EOF'
          import GSTFourPowerDirectOneHundredEightyThirdRow
          #print axioms GSTFourPowerDirectOneHundredEightyThirdRow.commonTwo_of_mod2056788397238392593160822648456620167261469637864670311548042275113842708261892026529227_184
          #print axioms GSTFourPowerDirectOneHundredEightyThirdRow.physical_happy_of_mod2056788397238392593160822648456620167261469637864670311548042275113842708261892026529227_184
          #print axioms GSTFourPowerDirectOneHundredEightyThirdRow.four_power_happy_propagates_of_next_mod2056788397238392593160822648456620167261469637864670311548042275113842708261892026529227_184
          EOF
          lake env lean /tmp/Audit.lean 2>&1 | tee audit.log
          ! grep -E 'sorryAx' audit.log
      - name: Direct physical-row marker
        run: echo DIRECT_ROW183_RELOCATED_HAPPY_KERNEL_GREEN
