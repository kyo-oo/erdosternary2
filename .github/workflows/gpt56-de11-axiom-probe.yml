name: GPT56 de11 Third Wave Audit

on:
  push:
    branches:
      - sol/gpt56-de11-axiom-replacement
    paths:
      - GSTGraphV2FourPowerThirdWave.lean
      - GSTFinalResidualCollision.lean
      - .github/workflows/gpt56-de11-axiom-probe.yml
  workflow_dispatch:

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false

      - name: Build de11 V2 dependency universe
        shell: bash
        run: |
          set -euo pipefail
          lake build GSTLocalClosure

      - name: Kernel-check existing residual collision
        shell: bash
        run: |
          set -euo pipefail
          lake env lean GSTFinalResidualCollision.lean 2>&1 | tee residual-collision.log
          if grep -E 'declaration uses .sorry.|sorryAx|unknown identifier|unknown module prefix|unsolved goals|error:' residual-collision.log; then
            exit 1
          fi

      - name: Audit residual collision axioms
        shell: bash
        run: |
          set -euo pipefail
          cat > GPT56ResidualCollisionAudit.lean <<'EOF'
          import GSTFinalResidualCollision
          #print axioms GSTFinalResidualCollision.residual_level_one_origin_one_collision
          EOF
          lake env lean GPT56ResidualCollisionAudit.lean 2>&1 | tee residual-collision-axioms.log
          if grep -E 'declaration uses .sorry.|sorryAx|unknown identifier|unknown module prefix|unsolved goals|error:' residual-collision-axioms.log; then
            exit 1
          fi

      - name: Kernel-check third wave
        if: hashFiles('GSTGraphV2FourPowerThirdWave.lean') != ''
        shell: bash
        run: |
          set -euo pipefail
          lake env lean GSTGraphV2FourPowerThirdWave.lean 2>&1 | tee third-wave.log
          if grep -E 'declaration uses .sorry.|sorryAx|unknown identifier|unknown module prefix|unsolved goals|error:' third-wave.log; then
            exit 1
          fi
