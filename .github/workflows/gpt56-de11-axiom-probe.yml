name: GPT56 de11 Third Wave Audit

on:
  push:
    branches:
      - sol/gpt56-de11-axiom-replacement
    paths:
      - GSTGraphV2FourPowerThirdWave.lean
      - GSTFourPowerThreeStepBadnessDescent.lean
      - GSTFourPowerThreeStepQuotientChannel.lean
      - GSTFinalResidualCollision.lean
      - GSTPrefixOneOntologicalEscape.lean
      - .github/workflows/gpt56-de11-axiom-probe.yml
      - lakefile.toml
  workflow_dispatch:

jobs:
  certify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false

      - name: Build focused dependency universe
        shell: bash
        run: |
          set -euo pipefail
          lake build GSTLocalClosure

      - name: Compile three-step badness descent
        shell: bash
        run: |
          set -euo pipefail
          lake env lean GSTFourPowerThreeStepBadnessDescent.lean 2>&1 | tee descent.log
          ! grep -E 'declaration uses .sorry.|sorryAx|unknown identifier|unknown module prefix|unsolved goals|error:' descent.log

      - name: Compile three-step quotient channel
        shell: bash
        run: |
          set -euo pipefail
          lake env lean GSTFourPowerThreeStepQuotientChannel.lean 2>&1 | tee quotient.log
          ! grep -E 'declaration uses .sorry.|sorryAx|unknown identifier|unknown module prefix|unsolved goals|error:' quotient.log

      - name: Compile third-wave replacement
        shell: bash
        run: |
          set -euo pipefail
          lake env lean GSTGraphV2FourPowerThirdWave.lean 2>&1 | tee third-wave.log
          ! grep -E 'declaration uses .sorry.|sorryAx|unknown identifier|unknown module prefix|unsolved goals|error:' third-wave.log

      - name: Compile production axiom site
        shell: bash
        run: |
          set -euo pipefail
          lake env lean GSTPrefixOneOntologicalEscape.lean 2>&1 | tee production.log
          ! grep -E 'declaration uses .sorry.|sorryAx|unknown identifier|unknown module prefix|unsolved goals|error:' production.log

      - name: Final axiom audit
        shell: bash
        run: |
          set -euo pipefail
          cat > AuditReplacement.lean <<'EOF'
          import GSTPrefixOneOntologicalEscape
          #print axioms gst_four_power_direct_existence_inline
          #print axioms gst_four_power_creation_certificate_inline
          EOF
          lake env lean AuditReplacement.lean 2>&1 | tee replacement-axioms.log
          ! grep -E 'sorryAx|gst_four_power_direct_existence_inline\]' replacement-axioms.log
