name: GPT56 Prefix One Bad Reflection

on:
  push:
    branches:
      - sol/gpt56-canonical-tail-escape-20260827
    paths:
      - 'GSTPrefixOneBadReflectionNew.lean'
      - 'GSTPrefixOneRetainedDescentNew.lean'
      - '.github/workflows/gpt56-prefix-one-bad-reflection.yml'
  workflow_dispatch:

jobs:
  certify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Install exact Lean RC2 and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          rm -f lake-manifest.json
          lake update
          lake exe cache get
      - name: Build pre-master monolith kernel
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 - <<'PY'
          from pathlib import Path
          src = Path("ErdosTernary2.lean").read_text(encoding="utf-8")
          marker = "-- SOL56 CANONICAL TAIL POE COMPATIBILITY BRIDGE"
          if marker not in src:
              raise SystemExit("PRE_MASTER_MARKER_NOT_FOUND")
          Path("ErdosTernary2PrefixKernel.lean").write_text(
              src.split(marker, 1)[0], encoding="utf-8")
          PY
          lake build GSTTactic GSTPrefixOneU2DCollisionProof \
            GSTPrefixOneOntologicalEscape GSTGraphV2ProductionLaws \
            GSTGraphV2InfiniteControllerBridge GSTGraphV2PerfectPowerBlockProbe \
            GSTU2DSharpCrossingBlock GSTFinalPurePowerResidueTransplant
          lake env lean -o .lake/build/lib/lean/ErdosTernary2PrefixKernel.olean ErdosTernary2PrefixKernel.lean
      - name: Compile residual descent packet
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          sed 's/^import ErdosTernary2$/import ErdosTernary2PrefixKernel/' \
            GSTPrefixOneRetainedDescentNew.lean > GSTPrefixOneRetainedDescentCompile.lean
          lake env lean -o .lake/build/lib/lean/GSTPrefixOneRetainedDescentCompile.olean \
            GSTPrefixOneRetainedDescentCompile.lean 2>&1 | tee retained-descent.log
          ! grep -E 'sorryAx|declaration uses .sorry.|unknown identifier|unknown module prefix|unsolved goals|error:' retained-descent.log

      - name: Compile fresh bad-reflection theorem
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          sed 's/^import ErdosTernary2$/import ErdosTernary2PrefixKernel/' \
            GSTPrefixOneBadReflectionNew.lean > GSTPrefixOneBadReflectionCompile.lean
          lake env lean -o .lake/build/lib/lean/GSTPrefixOneBadReflectionCompile.olean \
            GSTPrefixOneBadReflectionCompile.lean 2>&1 | tee prefix-one-bad-reflection.log
          ! grep -E 'sorryAx|declaration uses .sorry.|unknown identifier|unknown module prefix|unsolved goals|error:' prefix-one-bad-reflection.log
      - name: Axiom audit
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat > GSTPrefixOneBadReflectionAudit.lean <<'LEAN'
          import GSTPrefixOneBadReflectionCompile
          #print axioms gst_prefix_one_bad_reflection_new
          LEAN
          lake env lean GSTPrefixOneBadReflectionAudit.lean 2>&1 | tee prefix-one-bad-reflection-axioms.log
          ! grep -E 'sorryAx|declaration uses .sorry.|unknown constant|error:' prefix-one-bad-reflection-axioms.log
