name: GPT56 Prefix One Bad Reflection

on:
  push:
    branches:
      - sol/gpt56-canonical-tail-escape-20260827
    paths:
      - 'GSTPrefixOneBadReflectionNew.lean'
      - '.github/workflows/gpt56-prefix-one-bad-reflection.yml'
  workflow_dispatch:

jobs:
  certify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Install exact Lean RC2 and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          rm -f lake-manifest.json
          lake update
          lake exe cache get
      - name: Build monolith dependency
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build ErdosTernary2
      - name: Compile fresh bad-reflection theorem
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean GSTPrefixOneBadReflectionNew.lean 2>&1 | tee prefix-one-bad-reflection.log
          ! grep -E 'sorryAx|declaration uses .sorry.|unknown identifier|unknown module prefix|unsolved goals|error:' prefix-one-bad-reflection.log
      - name: Axiom audit
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat > GSTPrefixOneBadReflectionAudit.lean <<'LEAN'
          import GSTPrefixOneBadReflectionNew
          #print axioms gst_prefix_one_bad_reflection_new
          LEAN
          lake env lean GSTPrefixOneBadReflectionAudit.lean 2>&1 | tee prefix-one-bad-reflection-axioms.log
          ! grep -E 'sorryAx|declaration uses .sorry.|unknown constant|error:' prefix-one-bad-reflection-axioms.log
