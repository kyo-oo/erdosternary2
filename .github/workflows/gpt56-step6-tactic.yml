name: GPT56 Step6 Tactic

on:
  push:
    branches:
      - sol/gpt56-canonical-tail-escape-20260827
    paths:
      - '.github/workflows/gpt56-step6-tactic.yml'
      - 'GSTStep6Close.lean'
      - 'GSTStep6CloseTest.lean'
  workflow_dispatch:

concurrency:
  group: gpt56-step6-tactic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Pin source
        run: echo "SOURCE_HEAD=$(git rev-parse HEAD)"
      - name: Install exact Lean RC2 and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          rm -f lake-manifest.json
          lake update
          lake exe cache get
      - name: Compile local import closure
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          ROOTS=[Path('GSTStep6Close.lean'),Path('GSTStep6CloseTest.lean')]
          BUILD=Path('.lake/build/lib/lean')
          rx=re.compile(r'^\s*import\s+(.+?)\s*$')
          def path_of(m): return Path(*m.split('.')).with_suffix('.lean')
          def imports(p):
              out=[]
              for raw in p.read_text(encoding='utf-8').splitlines():
                  code=raw.split('--',1)[0].rstrip()
                  m=rx.match(code)
                  if m: out.extend(m.group(1).split())
              return out
          order=[]; done=set(); active=[]
          def visit(m):
              if m in done: return
              p=path_of(m)
              if not p.exists(): return
              if m in active: raise SystemExit('LOCAL_IMPORT_CYCLE='+' -> '.join(active+[m]))
              active.append(m)
              for d in imports(p): visit(d)
              active.pop(); done.add(m); order.append((m,p))
          for root in ROOTS:
              for m in imports(root): visit(m)
          BUILD.mkdir(parents=True,exist_ok=True)
          print('STEP6_IMPORT_CLOSURE_COUNT='+str(len(order)))
          for m,p in order:
              out=BUILD.joinpath(*m.split('.')).with_suffix('.olean')
              out.parent.mkdir(parents=True,exist_ok=True)
              if out.exists(): continue
              print('=== compiling '+m+' ===',flush=True)
              subprocess.run(['lake','env','lean','-o',str(out),str(p)],check=True)
          print('STEP6_IMPORT_CLOSURE_GREEN=1')
          PY
      - name: Compile tactic
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean -o .lake/build/lib/lean/GSTStep6Close.olean GSTStep6Close.lean 2>&1 | tee step6-tactic.log
          echo 'STEP6_TACTIC_GREEN=1'
      - name: Compile regression
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean GSTStep6CloseTest.lean 2>&1 | tee step6-regression.log
          echo 'STEP6_REGRESSION_GREEN=1'
      - name: Axiom and placeholder audit
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          if grep -En '(^|[^[:alpha:]_])(sorry|admit)([^[:alpha:]_]|$)' GSTStep6Close.lean GSTStep6CloseTest.lean; then
            echo 'FORBIDDEN_PLACEHOLDER_IN_STEP6_TACTIC=1'
            exit 1
          fi
          lake env lean GSTStep6CloseTest.lean 2>&1 | tee step6-axioms.log
          if grep -Fq 'sorryAx' step6-axioms.log; then
            echo 'FORBIDDEN_SORRYAX_IN_STEP6_TACTIC=1'
            exit 1
          fi
          echo 'STEP6_TACTIC_AXIOM_AUDIT_GREEN=1'
