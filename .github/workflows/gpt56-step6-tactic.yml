name: GPT56 Step6 Tactic

on:
  push:
    branches:
      - sol/gpt56-canonical-tail-escape-20260827
    paths:
      - '.github/workflows/gpt56-step6-tactic.yml'
      - 'GSTStep6Close.lean'
      - 'GSTStep6CloseShellTest.lean'
  workflow_dispatch:

concurrency:
  group: gpt56-step6-tactic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Pin source
        run: echo "SOURCE_HEAD=$(git rev-parse HEAD)"
      - name: Install exact Lean RC2 and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          rm -f lake-manifest.json
          lake update
          lake exe cache get
      - name: Compile tactic
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p .lake/build/lib/lean
          lake env lean -o .lake/build/lib/lean/GSTStep6Close.olean GSTStep6Close.lean 2>&1 | tee step6-tactic.log
          echo 'STEP6_TACTIC_GREEN=1'
      - name: Compile dependency-free shell regression
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean GSTStep6CloseShellTest.lean 2>&1 | tee step6-shell.log
          echo 'STEP6_SHELL_GREEN=1'
      - name: Axiom and placeholder audit
        shell: bash
        run: |
          set -euo pipefail
          if grep -En '(^|[^[:alpha:]_])(sorry|admit)([^[:alpha:]_]|$)' GSTStep6Close.lean GSTStep6CloseShellTest.lean; then
            echo 'FORBIDDEN_PLACEHOLDER_IN_STEP6_TACTIC=1'
            exit 1
          fi
          if grep -Fq 'sorryAx' step6-tactic.log step6-shell.log; then
            echo 'FORBIDDEN_SORRYAX_IN_STEP6_TACTIC=1'
            exit 1
          fi
          echo 'STEP6_TACTIC_AXIOM_AUDIT_GREEN=1'
