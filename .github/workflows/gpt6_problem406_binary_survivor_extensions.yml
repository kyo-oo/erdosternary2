name: GST exact physical bad-prefix binary branching
on:
  push:
    branches: [gpt6/problem406-exponent-termination-20261029]
    paths:
      - GSTProblem406BinarySurvivorExtensions.lean
      - .github/workflows/gpt6_problem406_binary_survivor_extensions.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bad-prefix-binary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Prepare Lean 4 mathlib and original physical exponent digit laws
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
          lake build GSTFourPowerExponentTritObstruction
      - name: Strict Lean kernel and axiom audit
        shell: bash
        run: |
          set -euo pipefail
          lake env lean GSTProblem406BinarySurvivorExtensions.lean 2>&1 | tee gst406-binary-survivors.log
          ! grep -E 'error:|sorryAx|unknown identifier|unsolved goals|declaration uses .sorry.|gst_four_power_direct_existence_inline' gst406-binary-survivors.log
          echo GST406_BINARY_ORIGINAL_PHYSICAL_PREFIX_SURVIVOR_PASS=1
