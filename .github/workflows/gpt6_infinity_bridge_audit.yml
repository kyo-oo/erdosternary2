name: GPT6 GST Infinity Support Bridge Exact Audit
on:
  push:
    branches:
      - gpt6/erdos-infinite-support-bridge-audit-20261029
    paths:
      - GSTInfinityBridgeAudit.lean
      - lakefile.toml
      - .github/workflows/gpt6_infinity_bridge_audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Kernel-check exact infinity-support bridge strength
        shell: bash
        run: |
          set -euo pipefail
          lake build GSTInfinityBridgeAudit 2>&1 | tee infinity-bridge.log
          ! grep -E 'error:|sorryAx|unsolved goals|unknown identifier|declaration uses .sorry.' infinity-bridge.log
          echo GST_INFINITY_BRIDGE_EQUIVALENCE_KERNEL_PASS=1
