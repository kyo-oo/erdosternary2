name: GPT56 Step6 Sign Closure

on:
  push:
    branches:
      - sol/gpt56-canonical-tail-escape-20260827
    paths:
      - 'GPT56Step6SignClosure.lean'
      - '.github/workflows/gpt56-step6-sign-closure.yml'
  workflow_dispatch:

concurrency:
  group: gpt56-step6-sign-closure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install exact Lean RC2 and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          rm -f lake-manifest.json
          lake update
          lake exe cache get

      - name: Materialize Step6 dependency closure
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          ROOT=Path('GPT56Step6SignClosure.lean')
          BUILD=Path('.lake/build/lib/lean')
          rx=re.compile(r'^\s*import\s+(.+?)\s*$')
          def path(m): return Path(*m.split('.')).with_suffix('.lean')
          def imports(p):
              out=[]
              for raw in p.read_text().splitlines():
                  m=rx.match(raw.split('--',1)[0].rstrip())
                  if m: out.extend(m.group(1).split())
              return out
          done=set(); stack=[]; order=[]
          def visit(m):
              if m in done: return
              p=path(m)
              if not p.exists(): return
              if m in stack: raise SystemExit('cycle: '+' -> '.join(stack+[m]))
              stack.append(m)
              for d in imports(p): visit(d)
              stack.pop(); done.add(m); order.append((m,p))
          for m in imports(ROOT): visit(m)
          BUILD.mkdir(parents=True,exist_ok=True)
          print('STEP6_SIGN_IMPORT_COUNT='+str(len(order)))
          for m,p in order:
              o=BUILD.joinpath(*m.split('.')).with_suffix('.olean')
              o.parent.mkdir(parents=True,exist_ok=True)
              if o.exists(): continue
              subprocess.run(['lake','env','lean','-o',str(o),str(p)],check=True)
          print('STEP6_SIGN_IMPORTS_GREEN=1')
          PY

      - name: Compile isolated sign closure
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p .lake/build/lib/lean
          lake env lean -o .lake/build/lib/lean/GPT56Step6SignClosure.olean GPT56Step6SignClosure.lean 2>&1 | tee step6-sign.log
          echo 'STEP6_SIGN_CLOSURE_GREEN=1'

      - name: Axiom audit
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          if grep -Fq 'sorryAx' step6-sign.log; then
            echo 'FORBIDDEN_SORRYAX_IN_STEP6_SIGN=1'
            exit 1
          fi
          echo 'STEP6_SIGN_AXIOM_AUDIT_GREEN=1'
