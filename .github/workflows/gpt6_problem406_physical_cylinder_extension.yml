name: GST unconditional dense physical CommonTwo cylinders
on:
  push:
    branches: [gpt6/problem406-physical-cylinder-extension-20261029]
    paths: [GSTProblem406PhysicalCylinderExtension.lean, .github/workflows/gpt6_problem406_physical_cylinder_extension.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-cylinder:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Compile exact original physical base and finite prefix isometry
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
          lake build GSTFourPowerAffineOrbit
          lake env lean -o .lake/build/lib/lean/GSTFourPowerExactExponentPeriod.olean GSTFourPowerExactExponentPeriod.lean
          lake env lean -o .lake/build/lib/lean/GSTFourPowerAffinePrefixIsometry.olean GSTFourPowerAffinePrefixIsometry.lean
          lake env lean -o .lake/build/lib/lean/GSTFourPowerAffineOntologicalCompleteness.olean GSTFourPowerAffineOntologicalCompleteness.lean
      - name: Strict kernel proof two-trit carry forcing and every physical cylinder
        shell: bash
        run: |
          set -euo pipefail
          lake env lean GSTProblem406PhysicalCylinderExtension.lean 2>&1 | tee gst-physical-cylinder.log
          ! grep -E 'error:|sorryAx|unknown identifier|unsolved goals|declaration uses .sorry.|gst_four_power_direct_existence_inline' gst-physical-cylinder.log
          echo GST_PHYSICAL_CYLINDER_DENSE_COMMON_TWO_PASS=1
