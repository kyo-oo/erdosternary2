name: SOL56 Four-Power Relocation

on:
  push:
    branches:
      - sol/gpt56-canonical-tail-escape-20260827
    paths:
      - GSTGraphV2FourPowerRelocation.lean
      - GSTGraphV2NonlocalCascade.lean
      - GSTGraphV2CanonicalEscape.lean
      - GSTGraphV2CanonicalInfiniteCycle.lean
      - GSTGraphV2CanonicalNWave.lean
      - GSTGraphV2CanonicalTerminalExtinctionProbe.lean
      - GSTFinalPurePowerResidueTransplant.lean
      - GSTGraphV2HandwrittenExponentialLTE.lean
      - GSTGraphV2FourPowerForcingBridge.lean
      - .github/workflows/sol56-four-power-relocation.yml
  workflow_dispatch:

jobs:
  relocation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
      - name: Compile relocation baseline and residue obstruction probe
        shell: bash
        run: |
          set -euo pipefail
          lake build \
            GSTGraphV2CanonicalEscape \
            GSTGraphV2CanonicalInfiniteCycle \
            GSTGraphV2CanonicalNWave \
            GSTGraphV2CanonicalTerminalExtinctionProbe \
            GSTFinalPurePowerResidueTransplant \
            2>&1 | tee relocation-deps.log
          mkdir -p .lake/build/lib/lean
          lake env lean \
            -o .lake/build/lib/lean/GSTGraphV2FourPowerForcingBridge.olean \
            GSTGraphV2FourPowerForcingBridge.lean 2>&1 | tee forcing-bridge.log
          lake env lean \
            -o .lake/build/lib/lean/GSTGraphV2NonlocalCascade.olean \
            GSTGraphV2NonlocalCascade.lean 2>&1 | tee nonlocal-cascade.log
          lake env lean \
            -o .lake/build/lib/lean/GSTGraphV2FourPowerRelocation.olean \
            GSTGraphV2FourPowerRelocation.lean 2>&1 | tee relocation.log

          cat > Task33ResidueObstruction.lean <<'LEAN'
          import GSTGraphV2FourPowerRelocation

          set_option maxRecDepth 1000000
          set_option maxHeartbeats 20000000

          namespace GSTGraphV2Task33ResidueObstruction

          open GSTCanonicalSevenAxisBridge
          open GSTU2DEventTransport
          open GSTGraphV2InfiniteControl
          open GSTGraphV2HandwrittenExponentialLTE

          /-- A ternary digit depends only on the residue through its next cut. -/
          theorem digit3_eq_of_mod_next
              (R S p : Nat)
              (hmod : R % 3^(p+1) = S % 3^(p+1)) :
              digit3 R p = digit3 S p := by
            unfold digit3
            have hpow : 3^(p+1) = 3^p * 3 := by
              rw [Nat.pow_succ]
            have hfull : R % (3^p * 3) = S % (3^p * 3) := by
              simpa [hpow] using hmod
            have hR : R % (3^p * 3) =
                R % 3^p + 3^p * (R / 3^p % 3) := by
              rw [Nat.mod_mul]
            have hS : S % (3^p * 3) =
                S % 3^p + 3^p * (S / 3^p % 3) := by
              rw [Nat.mod_mul]
            have hdvd : 3^p ∣ 3^(p+1) := Nat.pow_dvd_pow 3 (by omega)
            have hRlow := Nat.mod_mod_of_dvd R hdvd
            have hSlow := Nat.mod_mod_of_dvd S hdvd
            have hlow : R % 3^p = S % 3^p := by
              calc
                R % 3^p = (R % 3^(p+1)) % 3^p := hRlow.symm
                _ = (S % 3^(p+1)) % 3^p := by rw [hmod]
                _ = S % 3^p := hSlow
            rw [hR, hS, hlow] at hfull
            have hmul : 3^p * (R / 3^p % 3) =
                3^p * (S / 3^p % 3) := by omega
            exact Nat.eq_of_mul_eq_mul_left (by positivity : 0 < 3^p) hmul

          /-- Exact exponent periodicity at a fixed ternary digit. -/
          theorem pow4_digit_period
              (p K u : Nat) :
              digit3 (4^(K + 3^p*u)) p = digit3 (4^K) p := by
            apply digit3_eq_of_mod_next
            rw [Nat.pow_add, Nat.mul_mod]
            rw [pow4_scaled_mod_next p u]
            simp

          theorem row_two_overlap_of_mod9_five_or_six
              (L : Nat) (hres : L % 9 = 5 ∨ L % 9 = 6) :
              digit3 (4^L) 2 = 2 ∧ digit3 (4^(L+1)) 2 = 2 := by
            rcases hres with h5 | h6
            · have hs := Nat.mod_add_div L 9
              rw [h5] at hs
              have hshape : L = 5 + 9 * (L / 9) := by
                simpa [Nat.add_comm, Nat.mul_comm] using hs.symm
              have hshape1 : L+1 = 6 + 9 * (L / 9) := by omega
              constructor
              · rw [hshape]
                simpa using (pow4_digit_period 2 5 (L/9))
              · rw [hshape1]
                simpa using (pow4_digit_period 2 6 (L/9))
            · have hs := Nat.mod_add_div L 9
              rw [h6] at hs
              have hshape : L = 6 + 9 * (L / 9) := by
                simpa [Nat.add_comm, Nat.mul_comm] using hs.symm
              have hshape1 : L+1 = 7 + 9 * (L / 9) := by omega
              constructor
              · rw [hshape]
                simpa using (pow4_digit_period 2 6 (L/9))
              · rw [hshape1]
                simpa using (pow4_digit_period 2 7 (L/9))

          theorem no_relocated_happy_forbids_mod9_five_six
              (K : Nat)
              (hNo : ¬ ∃ q : Nat, 1 ≤ q ∧
                HappyCell (graph 1 (K+1) q).seven.carry
                  (graph 1 (K+1) q).seven.digit) :
              (K+1) % 9 ≠ 5 ∧ (K+1) % 9 ≠ 6 := by
            constructor
            · intro h5
              apply hNo
              refine ⟨2, by norm_num, ?_⟩
              have hov := row_two_overlap_of_mod9_five_or_six (K+1) (Or.inl h5)
              exact (GSTGraphV2FourPowerRelocation.graph_happy_iff_consecutive_digit_two
                1 (K+1) 2).2 (by
                  simpa [graph, cell, GSTCanonicalSevenAxisBridge.vertex] using hov)
            · intro h6
              apply hNo
              refine ⟨2, by norm_num, ?_⟩
              have hov := row_two_overlap_of_mod9_five_or_six (K+1) (Or.inr h6)
              exact (GSTGraphV2FourPowerRelocation.graph_happy_iff_consecutive_digit_two
                1 (K+1) 2).2 (by
                  simpa [graph, cell, GSTCanonicalSevenAxisBridge.vertex] using hov)

          #check digit3_eq_of_mod_next
          #check pow4_digit_period
          #check row_two_overlap_of_mod9_five_or_six
          #check no_relocated_happy_forbids_mod9_five_six
          #print axioms digit3_eq_of_mod_next
          #print axioms pow4_digit_period
          #print axioms row_two_overlap_of_mod9_five_or_six
          #print axioms no_relocated_happy_forbids_mod9_five_six

          end GSTGraphV2Task33ResidueObstruction
          LEAN

          lake env lean Task33ResidueObstruction.lean 2>&1 | tee task33-residue.log

          ! grep -E 'declaration uses .sorry.|sorryAx|unknown identifier|unknown module prefix|unsolved goals|error:' \
            relocation-deps.log forcing-bridge.log nonlocal-cascade.log relocation.log task33-residue.log
