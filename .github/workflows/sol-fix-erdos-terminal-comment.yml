name: SOL Fix Erdos Terminal Comment

on:
  push:
    branches:
      - sol/gpt56-canonical-tail-escape-20260827
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: sol/gpt56-canonical-tail-escape-20260827
          fetch-depth: 1

      - name: Patch unterminated terminal comment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ErdosTernary2.lean')
          s = p.read_text(encoding='utf-8')
          bad = '''/-- The independently kernel-checked w/-
The former terminal closure beginning here was removed from the production
monolith. It depended on the quarantined legacy declaration
`h_creation_for_4pow`, while the attempted replacement module is explicitly
kept outside the production import closure. All preceding kernel-checked
infrastructure remains available for a future proved closure.
-/'''
          good = '''-- The independently kernel-checked terminal closure beginning here was removed from the production
-- monolith. It depended on the quarantined legacy declaration
-- `h_creation_for_4pow`, while the attempted replacement module is explicitly
-- kept outside the production import closure. All preceding kernel-checked
-- infrastructure remains available for a future proved closure.'''
          if bad not in s:
              raise SystemExit('target malformed terminal comment not found')
          s = s.replace(bad, good, 1)
          if '/-- The independently kernel-checked w/-' in s:
              raise SystemExit('malformed terminal comment survived')
          p.write_text(s, encoding='utf-8')
          print('ERDOS_TERMINAL_COMMENT_PATCHED=1')
          PY
          git diff -- ErdosTernary2.lean
          git diff --check

      - name: Commit syntax fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- ErdosTernary2.lean; then
            echo "NO_ERDOS_CHANGE=1"
          else
            git add ErdosTernary2.lean
            git commit -m "Fix ErdosTernary2 terminal comment syntax"
            git push origin HEAD:sol/gpt56-canonical-tail-escape-20260827
          fi

      - name: Install exact Lean RC2
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve pinned Mathlib
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get

      - name: Run V5 comparator after syntax fix
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          bash scripts/comparator.sh | tee v5-after-terminal-comment-fix.log
          grep -Fq 'Your solution is okay!' v5-after-terminal-comment-fix.log
          grep -Fq '=== COMPARATOR RESULT: PASS ===' v5-after-terminal-comment-fix.log
          echo V5_AFTER_TERMINAL_COMMENT_FIX_CONFIRMED=1
