name: GPT56 Direct Row190 Verify

on:
  push:
    branches:
      - sol/gpt56-four-power-relocation-prod-20260903
    paths:
      - GSTFourPowerDirectOneHundredNinetiethRow.lean
      - .github/workflows/gpt56-direct-row190.yml
  workflow_dispatch:

jobs:
  direct-row190-kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
      - name: Compile exact fresh-production dependency closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean
          modules=(
            GSTCanonicalTailStateIso
            GSTFourPowerDirectResidue
            GSTFourPowerDirectResidue27
            GSTFourPowerDirectResidue81
            GSTFourPowerExponentTritObstruction
            GSTFourPowerExactExponentPeriod
            GSTFourPowerDirectExistence
            GSTFourPowerDirectAdditionCarry
            GSTFourPowerDirectHappyBridge
            GSTFourPowerAffineOrbit
            GSTFourPowerAffinePrefixIsometry
          )
          for module in "${modules[@]}"; do
            lake env lean -o ".lake/build/lib/lean/${module}.olean" "${module}.lean" 2>&1 | tee "${module}.log"
            ! grep -E 'declaration uses .sorry.|sorryAx|unknown identifier|unknown module prefix|unsolved goals|error:' "${module}.log"
          done
      - name: Compile direct row190 physical constructor
        shell: bash
        run: |
          set -euo pipefail
          ulimit -s 65536
          lake env lean -o .lake/build/lib/lean/GSTFourPowerDirectOneHundredNinetiethRow.olean GSTFourPowerDirectOneHundredNinetiethRow.lean 2>&1 | tee direct-row190.log
          ! grep -E 'declaration uses .sorry.|sorryAx|unknown identifier|unknown module prefix|unsolved goals|error:' direct-row190.log
      - name: Reject forbidden proof escapes
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE '\b(sorry|admit|axiom)\b|sorryAx|False\.elim' GSTFourPowerDirectOneHundredNinetiethRow.lean
      - name: Axiom audit direct row190 theorem
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/Audit.lean <<'EOF'
          import GSTFourPowerDirectOneHundredNinetiethRow
          #print axioms GSTFourPowerDirectOneHundredNinetiethRow.commonTwo_of_mod4498196224760364601242719132174628305800834098010033971355568455673974002968757862019419449_191
          #print axioms GSTFourPowerDirectOneHundredNinetiethRow.physical_happy_of_mod4498196224760364601242719132174628305800834098010033971355568455673974002968757862019419449_191
          #print axioms GSTFourPowerDirectOneHundredNinetiethRow.four_power_happy_propagates_of_next_mod4498196224760364601242719132174628305800834098010033971355568455673974002968757862019419449_191
          EOF
          lake env lean /tmp/Audit.lean 2>&1 | tee audit.log
          ! grep -E 'sorryAx' audit.log
      - name: Direct physical-row marker
        run: echo DIRECT_ROW190_RELOCATED_HAPPY_KERNEL_GREEN
