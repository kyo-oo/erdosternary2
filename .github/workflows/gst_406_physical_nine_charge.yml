name: GST 406 All-K Nine-Class Physical Origin Budget
on:
  push:
    branches: [gpt6/problem406-u-flux-tail-closure-audit-20261030]
    paths:
      - GST406PhysicalNineCharges.lean
      - lakefile.toml
      - .github/workflows/gst_406_physical_nine_charge.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict_nine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake update
          lake exe cache get
      - name: Kernel and axiom audit of exact nine-class all-K physical budget
        shell: bash
        run: |
          set -euo pipefail
          lake build GST406PhysicalNineChargeAudit 2>&1 | tee /tmp/nine-build.log
          lake env lean GST406PhysicalNineCharges.lean 2>&1 | tee /tmp/nine-axioms.log
          ! grep -E 'error:|sorryAx|unsolved goals|unknown identifier|declaration uses .sorry.' /tmp/nine-build.log /tmp/nine-axioms.log
          grep -F 'all_k_full_word_budget_nine_class' /tmp/nine-axioms.log
          echo GST406_ALL_K_NINE_CHARGE_KERNEL_PASS=1
