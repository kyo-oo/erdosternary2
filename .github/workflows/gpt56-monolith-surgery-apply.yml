name: GPT56 Monolith Surgery Apply
on:
  push:
    branches: [sol/gpt56-canonical-tail-escape-20260827]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Normalize inlined imports and splice POE bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ErdosTernary2.lean')
          s=p.read_text(encoding='utf-8')

          # Historical monolith physically inlines all *Scratch declarations.
          scratch_marker='-- SOL56 CANONICAL TAIL SURGERY: direct *Scratch imports neutralized because their declarations are inlined'
          if scratch_marker not in s:
              out=[]; removed=[]
              for line in s.splitlines(keepends=True):
                  stripped=line.strip()
                  if stripped.startswith('import '):
                      mods=stripped[len('import '):].split()
                      if len(mods)==1 and mods[0].endswith('Scratch'):
                          removed.append(mods[0]); continue
                  out.append(line)
              s=''.join(out)
              first='-- SOL56 CANONICAL TAIL SURGERY: stale prefix-one incidence imports removed\n'
              if first in s:
                  s=s.replace(first,first+scratch_marker+'\n',1)
              print('REMOVED_SCRATCH_IMPORT_COUNT=',len(removed))

          imp='import GSTPrefixOneOntologicalEscape\n'
          if imp not in s:
              anchor='import Mathlib.Tactic.Ring\n'
              if s.count(anchor) != 1:
                  raise SystemExit(f'import anchor multiplicity={s.count(anchor)}')
              s=s.replace(anchor,anchor+imp,1)

          marker='-- SOL56 CANONICAL TAIL POE COMPATIBILITY BRIDGE'
          if marker not in s:
              anchor='-- Public prefix-one theorem: parent failure supplies the exact bad trace, and\n'
              if s.count(anchor) != 1:
                  raise SystemExit(f'bridge anchor multiplicity={s.count(anchor)}')
              block=r'''-- SOL56 CANONICAL TAIL POE COMPATIBILITY BRIDGE
/-- Convert the standalone exact Happy-gate language into the monolith wrapper. -/
theorem gst_navigation_witness_of_standalone_navigation
    (R : Nat) (h : GSTCanonicalTailStateIso.Navigation R) :
    GSTNavigationWitness R := by
  obtain ⟨j, hHappy⟩ := h
  refine ⟨j, ?_, ?_⟩
  · simpa [GSTCanonicalTailStateIso.HappyCell,
      GSTCanonicalTailStateIso.digit3, gstDigit] using hHappy.1
  · rcases hHappy.2 with h0 | h3
    · exact Or.inr (gstSpaceAt_of_carry_zero R j (by
        simpa [GSTCanonicalTailStateIso.carry4, gstCarry] using h0))
    · exact Or.inl (gstSpaceAt_of_carry_three R j (by
        simpa [GSTCanonicalTailStateIso.carry4, gstCarry] using h3))

/-- Monolith-facing POE.  No child premise occurs; the one upstream input is
exactly the independent four-power creation master isolated by the new DAG. -/
theorem gst_prefix_one_ontological_escape_of_master_inline
    (hMaster : GSTFourPowerOntologicalAdapter.FourPowerCreationMaster)
    (s n : Nat) (hs : 1 ≤ s) (hn : 1 ≤ n) :
    GSTNavigationWitness (gstNavigationConstant s (1 + 3*n)) := by
  have h := GSTPrefixOneOntologicalEscape.gst_prefix_one_ontological_escape_of_master
    hMaster s n hs hn
  apply gst_navigation_witness_of_standalone_navigation
  simpa [GSTPerfectPowerTailNavigation.canonicalTail, gstNavigationConstant] using h

/-- Compatibility version of the old lift.  The child witness is deliberately
unused because POE proves the parent unconditionally from the master. -/
theorem gst_prefix_one_navigation_lift_of_master_inline
    (hMaster : GSTFourPowerOntologicalAdapter.FourPowerCreationMaster) :
    GSTPrefixOneNavigationLift := by
  intro s n hs hn _hchild
  exact gst_prefix_one_ontological_escape_of_master_inline hMaster s n hs hn

'''
              s=s.replace(anchor,block+anchor,1)

          p.write_text(s,encoding='utf-8')
          print('SCRATCH_NORMALIZED=',scratch_marker in s)
          print('POE_IMPORT_PRESENT=',imp in s)
          print('POE_BRIDGE_PRESENT=',marker in s)
          PY
      - name: Commit surgical monolith update
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- ErdosTernary2.lean; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ErdosTernary2.lean
          git commit -m 'splice compiled canonical-tail POE bridge into monolith'
          git push origin HEAD:sol/gpt56-canonical-tail-escape-20260827
