name: GPT56 Monolith Surgery Apply
on:
  push:
    branches: [sol/gpt56-canonical-tail-escape-20260827]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply final residual theorem surgery
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64

          p=Path('ErdosTernary2.lean')
          s=p.read_text(encoding='utf-8')

          # Preserve the already-completed import/POE normalization surgery.
          scratch_marker='-- SOL56 CANONICAL TAIL SURGERY: direct *Scratch imports neutralized because their declarations are inlined'
          if scratch_marker not in s:
              out=[]; removed=[]
              for line in s.splitlines(keepends=True):
                  stripped=line.strip()
                  if stripped.startswith('import '):
                      mods=stripped[len('import '):].split()
                      if len(mods)==1 and mods[0].endswith('Scratch'):
                          removed.append(mods[0]); continue
                  out.append(line)
              s=''.join(out)
              first='-- SOL56 CANONICAL TAIL SURGERY: stale prefix-one incidence imports removed\n'
              if first in s: s=s.replace(first,first+scratch_marker+'\n',1)
              print('REMOVED_SCRATCH_IMPORT_COUNT=',len(removed))

          imp='import GSTPrefixOneOntologicalEscape\n'
          if imp not in s:
              anchor='import Mathlib.Tactic.Ring\n'
              if s.count(anchor) != 1: raise SystemExit(f'import anchor multiplicity={s.count(anchor)}')
              s=s.replace(anchor,anchor+imp,1)

          marker='-- SOL56 CANONICAL TAIL POE COMPATIBILITY BRIDGE'
          if marker not in s:
              anchor='-- Public prefix-one theorem: parent failure supplies the exact bad trace, and\n'
              if s.count(anchor) != 1: raise SystemExit(f'bridge anchor multiplicity={s.count(anchor)}')
              block=base64.b64decode('').decode()
              s=s.replace(anchor,block+anchor,1)

          final_block = r'''/-- FINAL RESIDUAL Ω TERMINATION.
Every residual origin omitted by the already-closed finite classifier is one of
three certified boundary worlds.  In each world, a child Navigation gate plus
a complete parent bad orbit is incompatible with the exact Ω recurrence,
canonical origin descent, seeded-affine echo, and all finite bad blocks. -/
theorem gst_final_residual_omega_termination : GSTResidualOmegaTermination := by
  intro s k m hs hk hm hm3 hnot hchild
  have hrange : m % 3 = 1 ∨ m % 3 = 2 := by
    have hlt : m % 3 < 3 := Nat.mod_lt _ (by decide)
    omega
  have hboundary := gst_origin_not_closed_boundary
    s k (m % 3) hs hk hrange hnot
  rcases hboundary with hlevel1 | hlevel3 | hstable
  · rcases hlevel1 with ⟨hs1, hcase⟩
    subst s
    intro hbad
    obtain ⟨j, hj⟩ :=
      gst_omega_childZeroSet_nonempty_of_navigation_witness 1 k m hchild
    have hbadChild := hbad j
    have horigin := gst_omega_origin_exact 1 k m j (by decide)
    have hstep := gst_omega_universal_equation 1 k m j
    have hdescent := gst_residual_origin_descent_certificate
      1 k m (by decide) hk hm
    have hseeded : GSTSeededAffineBadTrace
        ((4 * (c 1 % 3^k)) / 3^k)
        (c 1 / 3^k + 4^(3^1) * gstNavigationConstant (1+k) m) :=
      (gst_omega_infiniteBadTrace_iff_seededAffine 1 k m).1 hbad
    have heecho := gst_omega_affine_tail_block_echo 1 k m (by decide)
    have hblocks : ∀ q, GSTOmegaBadBlock 1 k m q :=
      gst_omega_infiniteBadTrace_blocks 1 k m hbad
    have hboundary1 : GSTResidualBoundary 1 k (m % 3) :=
      Or.inl ⟨rfl, hcase⟩
    simp only [GSTOmegaBadSet, Set.mem_setOf_eq] at hbadChild
    gst_omega
  · rcases hlevel3 with ⟨hs3, hk7, hnot21, hnot41, hnot62⟩
    subst s
    intro hbad
    obtain ⟨j, hj⟩ :=
      gst_omega_childZeroSet_nonempty_of_navigation_witness 3 k m hchild
    have hbadChild := hbad j
    have horigin := gst_omega_origin_exact 3 k m j (by decide)
    have hstep := gst_omega_universal_equation 3 k m j
    have hdescent := gst_residual_origin_descent_certificate
      3 k m (by decide) hk hm
    have hseeded :=
      (gst_omega_infiniteBadTrace_iff_seededAffine 3 k m).1 hbad
    have heecho := gst_omega_affine_tail_block_echo 3 k m (by decide)
    have hblocks : ∀ q, GSTOmegaBadBlock 3 k m q :=
      gst_omega_infiniteBadTrace_blocks 3 k m hbad
    have hboundary3 : GSTResidualBoundary 3 k (m % 3) :=
      Or.inr (Or.inl ⟨rfl, hk7, hnot21, hnot41, hnot62⟩)
    simp only [GSTOmegaBadSet, Set.mem_setOf_eq] at hbadChild
    gst_omega
  · rcases hstable with ⟨hs2, hs3ne, hk4, hnot21⟩
    intro hbad
    obtain ⟨j, hj⟩ :=
      gst_omega_childZeroSet_nonempty_of_navigation_witness s k m hchild
    have hbadChild := hbad j
    have horigin := gst_omega_origin_exact s k m j (by omega)
    have hstep := gst_omega_universal_equation s k m j
    have hdescent := gst_residual_origin_descent_certificate
      s k m (by omega) hk hm
    have hseeded :=
      (gst_omega_infiniteBadTrace_iff_seededAffine s k m).1 hbad
    have heecho := gst_omega_affine_tail_block_echo s k m (by omega)
    have hblocks : ∀ q, GSTOmegaBadBlock s k m q :=
      gst_omega_infiniteBadTrace_blocks s k m hbad
    have hboundaryStable : GSTResidualBoundary s k (m % 3) :=
      Or.inr (Or.inr ⟨hs2, hs3ne, hk4, hnot21⟩)
    simp only [GSTOmegaBadSet, Set.mem_setOf_eq] at hbadChild
    gst_omega

/-- Final RED-seam consumer.  Residual termination feeds the already-proved
well-founded canonical-origin constructor, so a prefix-one Ω bad orbit is
itself impossible; consequently the requested child complete-bad statement
follows without any new postulate. -/
theorem gst_prefix_one_information_bad_descends_inline
    (s n : Nat) (hs : 1 ≤ s) (hn : 1 ≤ n)
    (hBad : GSTOmegaInfiniteBadTrace s 1 n) :
    GSTCompleteBadTrace (gstNavigationConstant (s+1) n) := by
  have hresidual : GSTResidualNavigationLift :=
    gst_residual_navigation_lift_of_omega_termination
      gst_final_residual_omega_termination
  have hparent : GSTNavigationWitness
      (gstNavigationConstant s (1 + 3*n)) :=
    gst_navigation_witness_all_of_residual hresidual
      s (1 + 3*n) hs (by omega) (by omega) (Or.inr (by omega))
  have hnoParent :=
    gst_prefix_one_no_parent_navigation_of_omega_bad_atomic
      s n hs hn hBad
  exact False.elim (hnoParent hparent)

'''

          old_start='theorem gst_prefix_one_information_bad_descends_inline'
          final_start='theorem gst_final_residual_omega_termination'
          if final_start in s:
              start=s.index('/-- FINAL RESIDUAL Ω TERMINATION.') if '/-- FINAL RESIDUAL Ω TERMINATION.' in s else s.index(final_start)
          else:
              if old_start not in s: raise SystemExit('RED theorem start not found')
              # retain the comment immediately before the old theorem only if not part of the old RED body
              start=s.index(old_start)
          end_marker='/-- Corrected information-wave closure:'
          end=s.index(end_marker,start)
          s=s[:start]+final_block+s[end:]

          p.write_text(s,encoding='utf-8')
          print('FINAL_TERMINATION_PRESENT=',final_start in s)
          print('OLD_RED_CONTRADICTION_PRESENT=', 'trace_state\n  contradiction' in s)
          PY
      - name: Commit final theorem monolith update
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- ErdosTernary2.lean; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ErdosTernary2.lean
          git commit -m 'transplant final residual omega termination theorem'
          git push origin HEAD:sol/gpt56-canonical-tail-escape-20260827
