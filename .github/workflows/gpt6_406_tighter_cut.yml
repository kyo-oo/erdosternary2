name: GST 406 Tighter 24-19 Physical Cut Kernel
on:
  push:
    branches: [gpt6/problem406-exact-origin-gate-research-20261030]
    paths:
      - GSTProblem406TightPhysicalCut.lean
      - .github/workflows/gpt6_406_tighter_cut.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Lean mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake update
          lake exe cache get
          lake build GSTProblem406BinaryOriginExponentScale GSTFourPowerDirectExistence
      - name: Kernel-check the 19-step exact origin squeeze and all-K cutoff iff
        shell: bash
        run: |
          set -euo pipefail
          lake env lean GSTProblem406TightPhysicalCut.lean 2>&1 | tee cut.log
          ! grep -E 'error:|sorryAx|unsolved goals|unknown identifier|declaration uses .sorry.' cut.log
          grep -F 'physical_source_lt_tighter_cut' cut.log
          grep -F 'original_commonTwo_iff_tighter_cut' cut.log
          echo GST_TIGHTER_PHYSICAL_CUT_KERNEL_PASS=1
