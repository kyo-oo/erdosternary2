name: SOL56 Universal Navigation Audit

on:
  push:
    branches:
      - sol/gpt56-canonical-tail-escape-20260827
    paths:
      - GSTInfiniteFourPowerNavigation.lean
      - GSTGraphV2PerfectPowerBlockProbe.lean
      - GSTGraphV2UnifiedVerticalTelescope.lean
      - GSTGraphV2SixAdicSynchronizedShadows.lean
      - GSTFinalPurePowerResidueTransplant.lean
      - GSTFinalResidualCollision.lean
      - .github/workflows/sol56-universal-navigation-audit.yml
  workflow_dispatch:

jobs:
  universal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
      - name: Compile universal navigation
        shell: bash
        run: |
          set -euo pipefail
          lake build GSTInfiniteFourPowerNavigation 2>&1 | tee universal.log
      - name: Audit universal navigation axioms
        shell: bash
        run: |
          set -euo pipefail
          cat > SOL56UniversalNavigationAudit.lean <<'EOF'
          import GSTInfiniteFourPowerNavigation
          #print axioms GSTInfiniteFourPowerNavigation.power_three_step_collision
          #print axioms GSTInfiniteFourPowerNavigation.four_power_happy_ge_three
          #print axioms GSTInfiniteFourPowerNavigation.gst_four_power_navigation_universal
          EOF
          lake env lean SOL56UniversalNavigationAudit.lean 2>&1 | tee universal-axioms.log
          if grep -E 'declaration uses .sorry.|sorryAx|unknown identifier|unknown module prefix|unsolved goals|error:' \
            universal.log universal-axioms.log; then
            echo 'Universal navigation audit failed.'
            exit 1
          fi
          echo 'Universal navigation audit clean.'
