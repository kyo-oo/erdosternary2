name: GPT56 Direct Row159 Verify

on:
  push:
    branches:
      - sol/gpt56-four-power-relocation-prod-20260903
    paths:
      - GSTFourPowerDirectOneHundredFiftyNinthRow.lean
      - .github/workflows/gpt56-direct-row159.yml
  workflow_dispatch:

jobs:
  direct-row159-kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
      - name: Compile exact fresh-production dependency closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean
          modules=(
            GSTCanonicalTailStateIso
            GSTFourPowerDirectResidue
            GSTFourPowerDirectResidue27
            GSTFourPowerDirectResidue81
            GSTFourPowerExponentTritObstruction
            GSTFourPowerExactExponentPeriod
            GSTFourPowerDirectExistence
            GSTFourPowerDirectAdditionCarry
            GSTFourPowerDirectHappyBridge
            GSTFourPowerAffineOrbit
            GSTFourPowerAffinePrefixIsometry
          )
          for module in "${modules[@]}"; do
            lake env lean -o ".lake/build/lib/lean/${module}.olean" "${module}.lean" 2>&1 | tee "${module}.log"
            ! grep -E 'declaration uses .sorry.|sorryAx|unknown identifier|unknown module prefix|unsolved goals|error:' "${module}.log"
          done
      - name: Compile direct row159 physical constructor
        shell: bash
        run: |
          set -euo pipefail
          ulimit -s 65536
          lake env lean -o .lake/build/lib/lean/GSTFourPowerDirectOneHundredFiftyNinthRow.olean GSTFourPowerDirectOneHundredFiftyNinthRow.lean 2>&1 | tee direct-row159.log
          ! grep -E 'declaration uses .sorry.|sorryAx|unknown identifier|unknown module prefix|unsolved goals|error:' direct-row159.log
      - name: Reject forbidden proof escapes
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE '\b(sorry|admit|axiom)\b|sorryAx|False\.elim' GSTFourPowerDirectOneHundredFiftyNinthRow.lean
      - name: Axiom audit direct row159 theorem
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/Audit.lean <<'EOF'
          import GSTFourPowerDirectOneHundredFiftyNinthRow
          #print axioms GSTFourPowerDirectOneHundredFiftyNinthRow.commonTwo_of_mod7282483350946404208076885500996745047522350034970917293604274649554310785067_160
          #print axioms GSTFourPowerDirectOneHundredFiftyNinthRow.physical_happy_of_mod7282483350946404208076885500996745047522350034970917293604274649554310785067_160
          #print axioms GSTFourPowerDirectOneHundredFiftyNinthRow.four_power_happy_propagates_of_next_mod7282483350946404208076885500996745047522350034970917293604274649554310785067_160
          EOF
          lake env lean /tmp/Audit.lean 2>&1 | tee audit.log
          ! grep -E 'sorryAx' audit.log
      - name: Direct physical-row marker
        run: echo DIRECT_ROW159_RELOCATED_HAPPY_KERNEL_GREEN
