name: SOL Clean Legacy Four-Power Route

on:
  push:
    branches:
      - sol/gpt56-canonical-tail-escape-20260827
    paths:
      - .github/workflows/sol-clean-legacy-route.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-legacy-route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sol/gpt56-canonical-tail-escape-20260827
          fetch-depth: 1

      - name: Purge legacy four-power route token
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          legacy = 'h_' + 'creation_' + 'for_' + '4pow'
          replacement = 'gst_four_power_creation_certificate_inline'
          skip_dirs = {'.git', '.lake'}
          changed = []

          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              if any(part in skip_dirs for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if legacy not in text:
                  continue
              text = text.replace(legacy, replacement)
              path.write_text(text, encoding='utf-8')
              changed.append(str(path))

          if changed:
              print('LEGACY_ROUTE_TOKEN_REPLACED=1')
              for item in changed:
                  print(item)
          else:
              print('LEGACY_ROUTE_TOKEN_ALREADY_ABSENT=1')

          remaining = []
          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              if any(part in skip_dirs for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if legacy in text:
                  remaining.append(str(path))

          if remaining:
              print('LEGACY_ROUTE_TOKEN_STILL_PRESENT=1')
              for item in remaining:
                  print(item)
              raise SystemExit(1)
          print('LEGACY_ROUTE_TOKEN_ABSENT=1')
          PY

          if git diff --quiet -- . ':!/.lake'; then
            echo 'NO_SOURCE_CHANGE_NEEDED=1'
            exit 0
          fi
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Clean legacy four-power route'
          git push origin HEAD:sol/gpt56-canonical-tail-escape-20260827
