name: GPT6 Universal Seven-Step Physical Pair Kernel
on:
  push:
    branches: [gpt6/problem406-seventh-trit-worldtrace-20261029]
    paths:
      - GSTProblem406SevenStepUniversalPair.lean
      - .github/workflows/gpt6_universal_seven_step_pair.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
          lake build GSTFourPowerThirdWave GSTFourPowerNo22Magnitude
      - name: Kernel check seven-step all-integer pair theorem
        shell: bash
        run: |
          set -euo pipefail
          lake env lean GSTProblem406SevenStepUniversalPair.lean 2>&1 | tee universal-seven-step.log
          ! grep -E 'error:|sorryAx|unknown identifier|unsolved goals|declaration uses .sorry.' universal-seven-step.log
          grep -F 'any_positive_source_pair_within_seven' universal-seven-step.log
          grep -F 'original_thirdWave_within_seven' universal-seven-step.log
          echo UNIVERSAL_SEVEN_STEP_PAIR_KERNEL_PASS=1
