name: GPT56 Production Multi-Nuke

on:
  push:
    branches:
      - sol/gpt56-canonical-tail-escape-20260827
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gpt56-production-multi-nuke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  surgery:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sol/gpt56-canonical-tail-escape-20260827
          fetch-depth: 0

      - name: Install exact Lean RC2
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve pinned Mathlib
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          rm -f lake-manifest.json
          lake update
          lake exe cache get

      - name: Reproduce toxic production seam before mutation
        id: red
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq 'GSTInfiniteFourPowerNavigation|GSTStep6Close' ErdosTernary2.lean; then
            echo 'RED_ROUTE_PRESENT=1'
            set +e
            bash scripts/comparator.sh > pre-nuke-comparator.log 2>&1
            rc=$?
            set -e
            tail -80 pre-nuke-comparator.log || true
            if [ "$rc" -eq 0 ]; then
              echo 'Comparator unexpectedly passed while toxic route is still wired.' >&2
              exit 1
            fi
            echo 'EXPECTED_RED_CONFIRMED=1'
          else
            echo 'RED_ROUTE_PRESENT=0'
            echo 'Production seam already mutated; proceeding to hard verification.'
          fi

      - name: Multi-nuke obsolete route and transplant direct creation chain
        id: mutate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('ErdosTernary2.lean')
          s = p.read_text(encoding='utf-8')
          original = s

          # 1) Excise the known-red modules from the live monolith.
          s = s.replace('import GSTStep6Close\n', '')
          s = s.replace('import GSTInfiniteFourPowerNavigation\n', '')

          # 2) Collapse duplicated import churn while preserving first occurrence/order.
          seen = set()
          out = []
          for line in s.splitlines(keepends=True):
              m = re.match(r'^(\s*import\s+)([^\s]+)(\s*)$', line.rstrip('\n'))
              if m:
                  module = m.group(2)
                  if module in seen:
                      continue
                  seen.add(module)
              out.append(line)
          s = ''.join(out)

          # 3) Replace the red universal-navigation producer with the already-live
          #    direct creation theorem. This is the exact adapter the clean probe targeted.
          old_master = '''theorem gst_four_power_creation_master_inline :
    GSTFourPowerOntologicalAdapter.FourPowerCreationMaster := by
  intro K hK5 hK7
  exact GSTInfiniteFourPowerNavigation.gst_four_power_navigation_universal
    K hK5 hK7
'''
          new_master = '''theorem gst_four_power_creation_master_inline :
    GSTFourPowerOntologicalAdapter.FourPowerCreationMaster := by
  intro K hK5 hK7
  simpa [GSTFourPowerOntologicalAdapter.CreationCertificate] using
    (h_creation_for_4pow K hK5 hK7)
'''
          if old_master in s:
              s = s.replace(old_master, new_master, 1)
          elif new_master not in s:
              raise SystemExit('MASTER_SEAM_NOT_FOUND')

          # 4) Rewire the large power-two consumer directly through the clean master.
          marker = 'theorem gst_power_two_wave_large\n'
          end_marker = '\n/-- The weaker two-wave theorem closes the even exponent directly. -/'
          replacement = '''theorem gst_power_two_wave_large
    (a : Nat) (ha : 500 < a) : GSTPowerTwoWave a := by
  unfold GSTPowerTwoWave
  have hnav0 : GSTCanonicalTailStateIso.Navigation (4^a) :=
    GSTFourPowerOntologicalAdapter.gst_four_power_ontological_navigation_of_master
      gst_four_power_creation_master_inline a (by omega) (by omega)
  have hnav : GSTNavigationWitness (4^a) :=
    gst_navigation_witness_of_standalone_navigation (4^a) hnav0
  obtain ⟨p, hd, _hspace⟩ := hnav
  exact Or.inl (hasTernaryTwo_of_digit (4^a) p hd)
'''
          if marker in s:
              start = s.index(marker)
              end = s.index(end_marker, start)
              current = s[start:end]
              if current != replacement:
                  s = s[:start] + replacement + s[end:]
          elif replacement not in s:
              raise SystemExit('POWER_TWO_WAVE_SEAM_NOT_FOUND')

          p.write_text(s, encoding='utf-8')

          # 5) Remove the obsolete red modules from the Lake build roots too.
          lake = Path('lakefile.toml')
          t = lake.read_text(encoding='utf-8')
          t = t.replace('  "GSTInfiniteFourPowerNavigation",\n', '')
          t = t.replace('  "GSTStep6Close",\n', '')
          lake.write_text(t, encoding='utf-8')

          changed = (s != original)
          print(f'MONOLITH_CHANGED={int(changed)}')
          PY

          echo '=== forbidden production references ==='
          if grep -nE 'GSTStep6Close|GSTInfiniteFourPowerNavigation|gst_step6_close|information_bad_descends' ErdosTernary2.lean; then
            echo 'Obsolete route still appears in production source.' >&2
            exit 1
          fi
          if grep -nE 'GSTStep6Close|GSTInfiniteFourPowerNavigation' lakefile.toml; then
            echo 'Obsolete route still appears in Lake roots.' >&2
            exit 1
          fi
          echo 'OBSOLETE_ROUTE_EXCISED=1'

      - name: Hard build of mutated production graph
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build 2>&1 | tee multi-nuke-build.log
          if grep -E 'sorryAx|declaration uses .sorry.|unknown identifier|unknown module prefix|unsolved goals|error:' multi-nuke-build.log; then
            echo 'Hard build contained forbidden Lean diagnostics.' >&2
            exit 1
          fi
          echo 'HARD_BUILD_PASS=1'

      - name: Kernel axiom audit of transplanted public seam
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat > MultiNukeAxiomAudit.lean <<'LEAN'
          import ErdosTernary2
          #print axioms gst_four_power_creation_master_inline
          #print axioms gst_prefix_one_navigation_lift
          #print axioms gst_power_two_wave_large
          #print axioms erdos_ternary_2_universal
          LEAN
          lake env lean MultiNukeAxiomAudit.lean 2>&1 | tee multi-nuke-axioms.log
          rm -f MultiNukeAxiomAudit.lean
          if grep -E 'sorryAx|declaration uses .sorry.|unknown identifier|unknown constant|error:' multi-nuke-axioms.log; then
            echo 'Axiom audit failed.' >&2
            exit 1
          fi
          echo 'AXIOM_AUDIT_PASS=1'

      - name: Exact V5 comparator
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          bash scripts/comparator.sh 2>&1 | tee multi-nuke-comparator.log
          grep -Fq 'Your solution is okay!' multi-nuke-comparator.log
          grep -Fq '=== COMPARATOR RESULT: PASS ===' multi-nuke-comparator.log
          echo 'V5_COMPARATOR_PASS=1'

      - name: Commit verified production surgery
        shell: bash
        run: |
          set -euo pipefail
          rm -f pre-nuke-comparator.log multi-nuke-build.log multi-nuke-axioms.log multi-nuke-comparator.log
          if git diff --quiet -- ErdosTernary2.lean lakefile.toml; then
            echo 'No source mutation to commit; this run verified the committed state.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ErdosTernary2.lean lakefile.toml
          git commit -m 'Multi-nuke obsolete navigation route and wire clean creation chain'
          git push origin HEAD:sol/gpt56-canonical-tail-escape-20260827
          echo 'VERIFIED_SURGERY_PUSHED=1'

      - name: Upload hard-verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpt56-production-multi-nuke-${{ github.run_id }}
          path: |
            pre-nuke-comparator.log
            multi-nuke-build.log
            multi-nuke-axioms.log
            multi-nuke-comparator.log
          if-no-files-found: ignore
