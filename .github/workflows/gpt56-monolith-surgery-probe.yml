name: GPT56 Monolith Surgery Probe

on:
  push:
    branches:
      - sol/gpt56-canonical-tail-escape-20260827
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Inventory exact surgery targets
        shell: bash
        run: |
          set -euo pipefail
          echo '=== TARGET COUNTS ==='
          for needle in \
            'theorem h_creation_for_4pow' \
            'theorem gst_full_power_navigation_descends_atomic' \
            'theorem gst_h_creation_full_power_navigation_atomic' \
            'theorem gst_prefix_one_information_bad_descends_inline' \
            'theorem gst_prefix_one_child_gate_contradicts_parent_bad_inline' \
            'theorem gst_prefix_one_navigation_lift'; do
            printf '%s -> ' "$needle"
            grep -Fc "$needle" ErdosTernary2.lean || true
          done
          echo '=== TARGET LINES ==='
          grep -nE 'theorem (h_creation_for_4pow|gst_full_power_navigation_descends_atomic|gst_h_creation_full_power_navigation_atomic|gst_prefix_one_information_bad_descends_inline|gst_prefix_one_child_gate_contradicts_parent_bad_inline|gst_prefix_one_navigation_lift)' ErdosTernary2.lean || true
          python3 - <<'PY'
          from pathlib import Path
          s=Path('ErdosTernary2.lean').read_text()
          needles=[
            'theorem h_creation_for_4pow',
            'theorem gst_full_power_navigation_descends_atomic',
            'theorem gst_h_creation_full_power_navigation_atomic',
            'theorem gst_prefix_one_information_bad_descends_inline',
            'theorem gst_prefix_one_navigation_lift',
          ]
          lines=s.splitlines()
          for needle in needles:
            hits=[i for i,x in enumerate(lines) if needle in x]
            for i in hits:
              lo=max(0,i-25); hi=min(len(lines),i+220)
              print(f'=== CONTEXT {needle} LINE {i+1} ===')
              for n in range(lo,hi):
                print(f'{n+1:06d}: {lines[n]}')
          PY
      - name: Install exact Lean toolchain
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          rm -f lake-manifest.json
          lake update
          lake exe cache get
      - name: Materialize local import closure and compile monolith
        id: compile
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          ROOT=Path('ErdosTernary2.lean')
          BUILD=Path('.lake/build/lib/lean')
          import_re=re.compile(r'^\s*import\s+(.+?)\s*$')
          def local_path(module): return Path(*module.split('.')).with_suffix('.lean')
          def imports_of(path):
            out=[]
            for raw in path.read_text(encoding='utf-8').splitlines():
              code=raw.split('--',1)[0].rstrip()
              m=import_re.match(code)
              if m: out.extend(m.group(1).split())
            return out
          order=[]; done=set(); stack=[]
          def visit(module):
            if module=='ErdosTernary2' or module in done: return
            path=local_path(module)
            if not path.exists(): return
            if module in stack: raise SystemExit('LOCAL_IMPORT_CYCLE='+' -> '.join(stack+[module]))
            stack.append(module)
            for dep in imports_of(path): visit(dep)
            stack.pop(); done.add(module); order.append((module,path))
          for m in imports_of(ROOT): visit(m)
          print('LOCAL_IMPORT_CLOSURE_COUNT=',len(order))
          BUILD.mkdir(parents=True,exist_ok=True)
          for module,path in order:
            out=BUILD.joinpath(*module.split('.')).with_suffix('.olean')
            out.parent.mkdir(parents=True,exist_ok=True)
            if out.exists(): continue
            print('COMPILE_DEP',module,flush=True)
            subprocess.run(['lake','env','lean','-o',str(out),str(path)],check=True)
          PY
          lake env lean ErdosTernary2.lean 2>&1 | tee monolith-baseline.log
      - name: Upload probe log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monolith-surgery-probe
          path: monolith-baseline.log
          if-no-files-found: warn
