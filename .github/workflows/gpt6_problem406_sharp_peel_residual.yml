name: GST exact sharp physical fixedpoint residual
on:
  push:
    branches: [gpt6/problem406-sharp-peel-residual-20261029]
    paths: [GSTProblem406SharpPeelResidual.lean, .github/workflows/gpt6_problem406_sharp_peel_residual.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sharp-residual:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Compile exact original GST nonlinear source machinery
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
          lake build GSTFourPowerAffineOrbit
          lake env lean -o .lake/build/lib/lean/GSTFourPowerAffineExponentPeel.olean GSTFourPowerAffineExponentPeel.lean
          lake env lean -o .lake/build/lib/lean/GSTProblem406GSTPeelFixedPoint.olean GSTProblem406GSTPeelFixedPoint.lean
          lake env lean -o .lake/build/lib/lean/GSTProblem406GSTPeelExtraPrecision.olean GSTProblem406GSTPeelExtraPrecision.lean
      - name: Strict Lean proof of all-scale exact 3-adic unit residual
        shell: bash
        run: |
          set -euo pipefail
          lake env lean GSTProblem406SharpPeelResidual.lean 2>&1 | tee gst406-sharp-peel.log
          ! grep -E 'error:|sorryAx|unknown identifier|unsolved goals|declaration uses .sorry.|gst_four_power_direct_existence_inline' gst406-sharp-peel.log
          echo GST406_SHARP_PHYSICAL_3ADIC_RESIDUAL_PASS=1
