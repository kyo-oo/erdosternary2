name: SOL56 Atomic Monolith Only

on:
  push:
    branches:
      - sol/sol56-final-residual-production-green-20260824
  pull_request:
  workflow_dispatch:

concurrency:
  group: sol56-atomic-monolith-only
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  monolith:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sol/sol56-final-residual-production-green-20260824
          fetch-depth: 1

      - name: Apply exactly one seam transplant
        shell: bash
        run: |
          mkdir -p .surgery
          python3 scripts/run_final_infinite_monolith_transplant.py 2>&1 | tee .surgery/final_transplant.log

      - name: Prepare Lean RC2 and Mathlib cache
        id: leanprep
        continue-on-error: true
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true

      - name: Direct monolith build and comparator
        id: verdict
        if: always()
        shell: bash
        run: |
          mkdir -p .surgery
          export PATH="$HOME/.elan/bin:$PATH"
          set +e
          lake build ErdosTernary2 > .surgery/final_build.log 2>&1
          BUILD_RC=$?
          CMP_RC=99
          if [ "$BUILD_RC" -eq 0 ]; then
            bash scripts/comparator.sh > .surgery/final_comparator.log 2>&1
            CMP_RC=$?
          else
            printf '%s\n' 'COMPARATOR_SKIPPED_BECAUSE_MONOLITH_BUILD_FAILED' > .surgery/final_comparator.log
          fi
          GREEN=0
          if [ "$CMP_RC" -eq 0 ] && grep -Fq 'Your solution is okay!' .surgery/final_comparator.log; then
            GREEN=1
          fi
          {
            echo "FINAL_RUN_HEAD=$(git rev-parse HEAD)"
            echo "LEAN_PREP_OUTCOME=${{ steps.leanprep.outcome }}"
            echo "MONOLITH_BUILD_RC=$BUILD_RC"
            echo "COMPARATOR_RC=$CMP_RC"
            echo "GREEN_COMPARATOR=$GREEN"
            echo '--- MONOLITH BUILD TAIL ---'
            tail -n 220 .surgery/final_build.log
            echo '--- COMPARATOR TAIL ---'
            tail -n 120 .surgery/final_comparator.log
          } > .surgery/FINAL_RUN_STATUS.txt
          cat .surgery/FINAL_RUN_STATUS.txt
          exit 0

      - name: Persist exact edited monolith and verdict
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ErdosTernary2.lean .surgery/final_transplant.log .surgery/final_build.log .surgery/final_comparator.log .surgery/FINAL_RUN_STATUS.txt
          if ! git diff --cached --quiet; then
            git commit -m "FINAL RUN: persist atomic monolith verdict [skip ci]"
            git push origin HEAD:sol/sol56-final-residual-production-green-20260824
          fi

      - name: Require literal green comparator
        if: always()
        shell: bash
        run: |
          grep -F 'MONOLITH_BUILD_RC=0' .surgery/FINAL_RUN_STATUS.txt
          grep -F 'COMPARATOR_RC=0' .surgery/FINAL_RUN_STATUS.txt
          grep -F 'GREEN_COMPARATOR=1' .surgery/FINAL_RUN_STATUS.txt
          grep -F 'Your solution is okay!' .surgery/final_comparator.log
