name: GST 406 Row Two First Hit Exact Kernel

on:
  push:
    branches: [gpt6/problem406-rowtwo-first-hit-exact-20261030]
    paths:
      - GSTProblem406RowTwoFirstHit.lean
      - lakefile.toml
      - .github/workflows/gst_406_rowtwo_first_hit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Lean and mathlib
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake update
          lake exe cache get
      - name: Type-check exact first-hit theorem and audit axioms
        run: |
          set -euo pipefail
          lake build GST406RowTwoFirstHit 2>&1 | tee first-hit-build.log
          lake env lean GSTProblem406RowTwoFirstHit.lean 2>&1 | tee first-hit-axioms.log
          ! grep -E 'error:|sorryAx|unsolved goals|unknown identifier|declaration uses .sorry.' first-hit-build.log first-hit-axioms.log
          grep -F 'physical_seven_shift_row_two_sharp' first-hit-axioms.log
          echo GST406_ROWTWO_FIRST_HIT_PASS=1
