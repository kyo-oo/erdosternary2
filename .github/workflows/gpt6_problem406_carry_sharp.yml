name: GST strengthened physical carry survivor exponent bound
on:
  push:
    branches: [gpt6/problem406-exponent-termination-20261029]
    paths:
      - GSTProblem406CarryEntropySharp.lean
      - .github/workflows/gpt6_problem406_carry_sharp.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  drift:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Prepare exact four-state physical carry count library
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
          mkdir -p .lake/build/lib/lean
          lake env lean -o .lake/build/lib/lean/GSTProblem406CarryEntropyBound.olean GSTProblem406CarryEntropyBound.lean
      - name: Kernel verify all-scale exact 5 over 2 weighted Perron drift
        shell: bash
        run: |
          set -euo pipefail
          lake env lean GSTProblem406CarryEntropySharp.lean 2>&1 | tee gst406-carry-sharp.log
          ! grep -E 'error:|sorryAx|unknown identifier|unsolved goals|declaration uses .sorry.|gst_four_power_direct_existence_inline' gst406-carry-sharp.log
          echo GST406_PHYSICAL_CARRY_WEIGHTED_DRIFT_PASS=1
