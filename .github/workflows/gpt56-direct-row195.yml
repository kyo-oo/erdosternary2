name: GPT56 Direct Row195 Verify

on:
  push:
    branches:
      - sol/gpt56-four-power-relocation-prod-20260903
    paths:
      - GSTFourPowerDirectOneHundredNinetyFifthRow.lean
      - .github/workflows/gpt56-direct-row195.yml
  workflow_dispatch:

jobs:
  direct-row195-kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
      - name: Compile exact fresh-production dependency closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean
          modules=(
            GSTCanonicalTailStateIso
            GSTFourPowerDirectResidue
            GSTFourPowerDirectResidue27
            GSTFourPowerDirectResidue81
            GSTFourPowerExponentTritObstruction
            GSTFourPowerExactExponentPeriod
            GSTFourPowerDirectExistence
            GSTFourPowerDirectAdditionCarry
            GSTFourPowerDirectHappyBridge
            GSTFourPowerAffineOrbit
            GSTFourPowerAffinePrefixIsometry
          )
          for module in "${modules[@]}"; do
            lake env lean -o ".lake/build/lib/lean/${module}.olean" "${module}.lean" 2>&1 | tee "${module}.log"
            ! grep -E 'declaration uses .sorry.|sorryAx|unknown identifier|unknown module prefix|unsolved goals|error:' "${module}.log"
          done
      - name: Compile direct row195 physical constructor
        shell: bash
        run: |
          set -euo pipefail
          ulimit -s 65536
          lake env lean -o .lake/build/lib/lean/GSTFourPowerDirectOneHundredNinetyFifthRow.olean GSTFourPowerDirectOneHundredNinetyFifthRow.lean 2>&1 | tee direct-row195.log
          ! grep -E 'declaration uses .sorry.|sorryAx|unknown identifier|unknown module prefix|unsolved goals|error:' direct-row195.log
      - name: Reject forbidden proof escapes
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE '\b(sorry|admit|axiom)\b|sorryAx|False\.elim' GSTFourPowerDirectOneHundredNinetyFifthRow.lean
      - name: Axiom audit direct row195 theorem
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/Audit.lean <<'EOF'
          import GSTFourPowerDirectOneHundredNinetyFifthRow
          #print axioms GSTFourPowerDirectOneHundredNinetyFifthRow.commonTwo_of_mod1093061682616768598101980749118434678309602685816438255039403134728775682721408160470718926107_196
          #print axioms GSTFourPowerDirectOneHundredNinetyFifthRow.physical_happy_of_mod1093061682616768598101980749118434678309602685816438255039403134728775682721408160470718926107_196
          #print axioms GSTFourPowerDirectOneHundredNinetyFifthRow.four_power_happy_propagates_of_next_mod1093061682616768598101980749118434678309602685816438255039403134728775682721408160470718926107_196
          EOF
          lake env lean /tmp/Audit.lean 2>&1 | tee audit.log
          ! grep -E 'sorryAx' audit.log
      - name: Direct physical-row marker
        run: echo DIRECT_ROW195_RELOCATED_HAPPY_KERNEL_GREEN
