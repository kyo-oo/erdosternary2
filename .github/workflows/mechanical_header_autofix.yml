name: Mechanical Header Autofix

on:
  push:
    branches:
      - sol/gpt56-infinite-control-production
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sol/gpt56-infinite-control-production
          fetch-depth: 1
      - name: Repair malformed chronological header and runner sanitizer
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('ker07-snapshot/branches/15_sol_new__physical-phase-crossing-surgery/InformationDescentScratch.lean')
          lines = p.read_text().splitlines(True)
          changed = 0
          import_idx = next((i for i, line in enumerate(lines) if line.startswith('import Mathlib')), len(lines))
          for i in range(import_idx):
              if lines[i].startswith('/-') and not lines[i].startswith('/-!'):
                  lines[i] = '--' + lines[i][2:]
                  changed += 1
          for i, line in enumerate(lines):
              if line.startswith('--!'):
                  lines[i] = '/-!' + line[3:]
                  changed += 1
                  break
          p.write_text(''.join(lines))
          print('SOURCE_HEADER_REPAIRS', changed)

          w = Path('.github/workflows/infinite_v2_production_surgery_smoke.yml')
          text = w.read_text()
          old = """          for i in range(min(40, len(lines))):
              if lines[i].startswith('/-'):
                  lines[i] = '--' + lines[i][2:]
                  changed += 1
"""
          new = """          import_idx = next((i for i, line in enumerate(lines) if line.startswith('import Mathlib')), len(lines))
          for i in range(import_idx):
              if lines[i].startswith('/-') and not lines[i].startswith('/-!'):
                  lines[i] = '--' + lines[i][2:]
                  changed += 1
          for i, line in enumerate(lines):
              if line.startswith('--!'):
                  lines[i] = '/-!' + line[3:]
                  changed += 1
                  break
"""
          if old in text:
              w.write_text(text.replace(old, new, 1))
              print('RUNNER_SANITIZER_REPAIRED 1')
          else:
              print('RUNNER_SANITIZER_REPAIRED 0')
          PY
          if git diff --quiet -- ker07-snapshot/branches/15_sol_new__physical-phase-crossing-surgery/InformationDescentScratch.lean .github/workflows/infinite_v2_production_surgery_smoke.yml; then
            echo MECHANICAL_STATE_ALREADY_CLEAN
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ker07-snapshot/branches/15_sol_new__physical-phase-crossing-surgery/InformationDescentScratch.lean .github/workflows/infinite_v2_production_surgery_smoke.yml
          git commit -m 'fix: finalize InformationDescent mechanical repair'
          git push origin HEAD:sol/gpt56-infinite-control-production
