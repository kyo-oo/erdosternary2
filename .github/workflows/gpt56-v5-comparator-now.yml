name: GPT56 V5 Comparator Now

on:
  push:
    branches:
      - sol/gpt56-canonical-tail-escape-20260827
  workflow_dispatch:

permissions:
  contents: write

jobs:
  comparator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Patch unterminated Erdos terminal comment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ErdosTernary2.lean')
          s = p.read_text(encoding='utf-8')
          bad = '''/-- The independently kernel-checked w/-
The former terminal closure beginning here was removed from the production
monolith. It depended on the quarantined legacy declaration
`h_creation_for_4pow`, while the attempted replacement module is explicitly
kept outside the production import closure. All preceding kernel-checked
infrastructure remains available for a future proved closure.
-/'''
          good = '''-- The independently kernel-checked terminal closure beginning here was removed from the production
-- monolith. It depended on the quarantined legacy declaration
-- `h_creation_for_4pow`, while the attempted replacement module is explicitly
-- kept outside the production import closure. All preceding kernel-checked
-- infrastructure remains available for a future proved closure.'''
          if bad in s:
              s = s.replace(bad, good, 1)
              p.write_text(s, encoding='utf-8')
              print('ERDOS_TERMINAL_COMMENT_PATCHED=1')
          elif '/-- The independently kernel-checked w/-' in s:
              raise SystemExit('malformed terminal comment still present but exact block changed')
          else:
              print('ERDOS_TERMINAL_COMMENT_ALREADY_CLEAN=1')
          PY
          git diff -- ErdosTernary2.lean
          git diff --check
          if ! git diff --quiet -- ErdosTernary2.lean; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ErdosTernary2.lean
            git commit -m "Fix ErdosTernary2 terminal comment syntax"
            git push origin HEAD:sol/gpt56-canonical-tail-escape-20260827
          fi

      - name: Install exact Lean RC2
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve pinned Mathlib
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get

      - name: Run exact repository V5 comparator on committed production proof
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          bash scripts/comparator.sh | tee v5-comparator.log
          grep -Fq 'Your solution is okay!' v5-comparator.log
          grep -Fq '=== COMPARATOR RESULT: PASS ===' v5-comparator.log
          echo V5_LITERAL_PASS_CONFIRMED=1
