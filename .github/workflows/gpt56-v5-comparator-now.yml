name: GPT56 V5 Comparator Now

on:
  push:
    branches:
      - sol/gpt56-canonical-tail-escape-20260827
  workflow_dispatch:

jobs:
  comparator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install exact Lean RC2
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve Mathlib
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Kernel-probe reactivated residual finale
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 - <<'PY'
          from pathlib import Path
          src = Path('ErdosTernary2.lean').read_text(encoding='utf-8')
          start = '/- QUARANTINED LEGACY RESIDUAL OMEGA START\n'
          end = 'QUARANTINED LEGACY RESIDUAL OMEGA END -/'
          if start not in src or end not in src:
              raise SystemExit('residual quarantine markers not found')
          prefix, rest = src.split(start, 1)
          body, _tail = rest.split(end, 1)
          probe = prefix + '-- SOL56 FINALE RESIDUAL PROBE START\n' + body + '\n-- SOL56 FINALE RESIDUAL PROBE END\n'
          Path('FinaleResidualProbe.lean').write_text(probe, encoding='utf-8')
          PY
          lake env lean FinaleResidualProbe.lean 2>&1 | tee finale-residual-probe.log
          echo 'FINALE_RESIDUAL_PROBE_GREEN=1'
      - name: Run exact repository V5 comparator
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          bash scripts/comparator.sh | tee v5-comparator.log
