name: GST 406 Centered Full Word U Budget Kernel
on:
  push:
    branches: [gpt6/problem406-u-flux-tail-closure-audit-20261030]
    paths:
      - GST406CenteredUConservation.lean
      - lakefile.toml
      - .github/workflows/gst_406_centered_u_full_budget.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  closed_budget:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Strict centered U full-physical-word conservation kernel audit
        shell: bash
        run: |
          set -euo pipefail
          lake build GST406CenteredUConservationAudit 2>&1 | tee /tmp/u-centered-build.log
          lake env lean GST406CenteredUConservation.lean 2>&1 | tee /tmp/u-centered-axioms.log
          ! grep -E 'error:|sorryAx|unsolved goals|unknown identifier|declaration uses .sorry.' /tmp/u-centered-build.log /tmp/u-centered-axioms.log
          grep -F 'physical_full_word_compensated_budget' /tmp/u-centered-axioms.log
          echo GST_406_CENTERED_U_FULL_WORD_KERNEL_PASS=1
