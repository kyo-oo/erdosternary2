name: GPT6 Worldtrace Whole Block Kernel
on:
  push:
    branches:
      - gpt6/erdos-worldtrace-block-lift-20261029
    paths:
      - GSTWorldtraceBlockLift.lean
      - .github/workflows/gpt6_worldtrace_block_kernel.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Lean RC2 and pinned Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
          lake build GSTCanonicalTailLTE
      - name: Build exact block-lift module
        shell: bash
        run: |
          set -euo pipefail
          lake env lean GSTWorldtraceBlockLift.lean 2>&1 | tee gst-block-kernel.log
          ! grep -E 'error:|unsolved goals|sorryAx|unknown identifier|declaration uses .sorry.' gst-block-kernel.log
          grep -Fq 'depends on axioms:' gst-block-kernel.log || grep -Fq "does not depend on any axioms" gst-block-kernel.log
          echo GST_WHOLE_BLOCK_KERNEL_GREEN=1
