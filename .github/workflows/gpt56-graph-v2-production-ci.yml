name: GPT56 Graph V2 Production

on:
  push:
    branches:
      - sol/gpt56-final-perfect-power-block-20260823
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install exact Lean toolchain
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve pinned Mathlib
        shell: bash
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          rm -f lake-manifest.json
          lake update
          lake exe cache get

      - name: Compile current Graph V2 dependency spine
        shell: bash
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p .lake/build/lib/lean
          for f in \
            GSTGraphV2CoupledUFlux \
            GSTGraphV2CoupledUPhysicalBridge \
            GST2DMixedEmergence \
            GSTU2DAtomicBridge \
            GSTU2DEventTransport \
            GSTU2DExactCrossingCharge \
            GSTU2DSharpCrossingBlock \
            GSTCanonicalSevenAxisBridge \
            GSTGraphV2InfiniteControl \
            GSTU2DPureDivergence83 \
            GSTU2DCanonicalPhaseDensity \
            GSTGraphV2UnifiedPowerRectangle \
            GSTGraphV2UnifiedVerticalTelescope \
            GSTGraphV2PerfectPowerAncestry \
            GSTGraphV2PerfectPowerBlockProbe \
            GSTGraphV2HandwrittenOmegaUBlock \
            GSTGraphV2HandwrittenExponentialCascade \
            GSTGraphV2HandwrittenExponentialLTE \
            GSTGraphV2HandwrittenAnchoredCocycle; do
              echo "=== compiling $f ==="
              lake env lean -o ".lake/build/lib/lean/$f.olean" "$f.lean"
          done

      - name: Compile GST Graph V2 production object
        shell: bash
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean -o .lake/build/lib/lean/GSTGraphV2Production.olean GSTGraphV2Production.lean

      - name: Enforce construction-only boundary
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('GSTGraphV2Production.lean')
          s = p.read_text(encoding='utf-8')
          # Remove block comments first, then line comments.  The audit is about
          # executable declarations, not explanatory prose.
          s = re.sub(r'/-.*?-/', '', s, flags=re.S)
          forbidden = []
          for i, line in enumerate(s.splitlines(), 1):
              code = line.split('--', 1)[0]
              if re.search(r'\btheorem\b|\blemma\b|\baxiom\b|\bsorry\b|\badmit\b|\bnative_decide\b', code):
                  forbidden.append(f'{i}:{line}')
          if forbidden:
              print('\n'.join(forbidden))
              raise SystemExit('Graph V2 production object must remain construction-only')
          print('Graph V2 construction boundary: clean')
          PY

      - name: Report production object
        shell: bash
        run: |
          echo 'GST Graph V2 production construction compiled GREEN.'
          echo 'No new theorem/lemma/axiom/sorry/admit/native_decide exists in executable GSTGraphV2Production code.'
