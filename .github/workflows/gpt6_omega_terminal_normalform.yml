name: GPT6 GST Omega Terminal Infinite Normal Form
on:
  push:
    branches:
      - gpt6/erdos-omega-terminal-normalform-20261029
    paths:
      - GSTOmegaTerminalNormalForm.lean
      - .github/workflows/gpt6_omega_terminal_normalform.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Lean and exact GST Omega dependencies
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
          lake build ErdosTernary2 GSTInfiniteGateTransport
          lake env lean -o .lake/build/lib/lean/GSTOmegaAbsorbingZero.olean GSTOmegaAbsorbingZero.lean 2>&1 | tee omega-absorbing.log
          ! grep -E 'error:|sorryAx|unknown identifier|unsolved goals|declaration uses .sorry.' omega-absorbing.log
      - name: Lean kernel prove Omega infinite-controller normal forms without axioms
        shell: bash
        run: |
          set -euo pipefail
          lake env lean GSTOmegaTerminalNormalForm.lean 2>&1 | tee omega-normalform.log
          ! grep -E 'error:|sorryAx|unknown identifier|unsolved goals|declaration uses .sorry.' omega-normalform.log
          echo GST_OMEGA_TERMINAL_NORMALFORM_GREEN=1
